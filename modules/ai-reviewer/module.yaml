name: ai-reviewer
description: "The AI reviewer: blocks only explicit malice and approves everything else (fail open), one schema-bound model call of another family than the requester's whose only tools read the request's own change (any size)."
license: MIT
kernel: { reviewer: 1 }
# reviewer@1 (kernel/sdk/src/reviewer.ts): the kernel sends each review to the service with ai_reviewer_key; the verdict goes
# back with that review's own token. Its policy (service/security/policy/ (one NN-<section>.md file per section)) is the product's, never an instance's. Its exit
# test is scripts/reviewer-eval.ts over test/reviewer-cases/<slug>.json (passes at >= 95% with no attack approved; a paid key).
privileged: [ reviewer ]
providers:
  reviewer:
    url: http://ai-reviewer:8095/aidenhq/v1/reviewer
    auth: ai_reviewer_key
services:
  run:
    ai-reviewer:
      build: ./service
      tmp: 16m
      port: 8095
      # The kernel's listener (verdicts) and the model gateway are host addresses, reached the way every module with no
      # legacy link reaches them; the reviewer holds no vendor key and its model's only tools read the request it was sent, so egress opens nothing new.
      egress: true
      env:
        REVIEWER_KEY_FILE: ${secrets.ai_reviewer_key}
        AIDENHQ_GATEWAY_URL: http://10.231.0.1:8201
# The reviewer eval as a check job (kernel/src/checkjobs.ts; the code host's merge gate asks for it): its layout. The kernel lays
# the subject commit out with the judging commit's `files` and the judged `cases`, runs `argv` in `cwd` read-only with a capped
# model token, and applies the pass rule itself (at least 95% of the base's cases, every added case, no attack approved).
check_jobs:
  eval:
    argv: [ node, scripts/reviewer-eval.ts ]
    timeout_min: 60
    title: the reviewer eval
    spec: { repo: slug, judge_commit: sha, subject_commit: sha, cases_from: sha, policy_hash: policy }
    judged:
      cwd: modules/ai-reviewer
      cases: test/reviewer-cases
      files: [ scripts/reviewer-eval.ts, test/case-pad.ts, service/src/aidenhq-sdk/pass-rule.ts, test/retired-cases.json ]
      expect: [ expect, expect_code ]
settings:
  # Whether the AI reviewer reviews code-host pushes and PRs: all (every one); none (no push or PR on any repo); or
  # unless_code_review_mandatory (none on a repo code review gates: a `mandatory: true` combo). A push or PR skipped is approved
  # by code (code_review_owns, on its card). Merges, closes, create_repo, sends, settings, deploys and tool calls are always
  # reviewed. Only the owner changes it: fewer reviews are less checking.
  ai_review_code:
    title: AI review of code changes
    default: all
    values: [ all, none, unless_code_review_mandatory ]
generated_secrets:
  - ai_reviewer_key
