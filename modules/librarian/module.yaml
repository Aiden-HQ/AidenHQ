name: librarian
description: "Knowledge Librarian: keeps the notes vault, the people directory and the agents' rules tidy, and reports weekly."
requires:
  - meetings
  - warehouse
agents:
  librarian:
    department: intake
    adapter: codex_local
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: medium
    timeout_sec: 1800
    connections:
      # Reads only, plus the vault's one existing correction tool. No knowledge-page edit tool exists (see the handbook).
      # person_identity_decide: confirm or reject a proposed identity link (role librarian). No web_view/app_view: it reads untrusted
      # notes and private data, so no outbound channel.
      apps: [ warehouse_query, person_identity_decide ]
      ops_mcp: [ obsidian_search, obsidian_read, obsidian_read_document_map, knowledge_list, knowledge_index, knowledge_search, knowledge_read, meeting_note_correct ]
      # task_create: its weekly report (it has no reports, so it cannot task_delegate). fleet_catalog: agents' descriptions, tools, routines.
      # handbook_list/handbook_read: the compiled handbook text, read-only. task_propose_rule: a task for the Platform Engineer only.
      # task_comments: its own daily findings, and the owner's "Not right" corrections it turns into rule proposals.
      paperclip_tasks: [ task_current, task_get, task_comments, task_search, task_list, task_create, task_comment, task_set_status, task_finish, fleet_catalog, handbook_list, handbook_read, task_propose_rule, fanout_map ]
    roles: [ librarian ]
routines:
  librarian-daily:
    title: Librarian daily pass
    agent: librarian
    description: |
      Today is {{date}}. Follow "Daily pass" in your instructions: review what is new since yesterday in the
      notes vault and the people proposals, fix what the tools allow, note the rest for the weekly report, then
      close this task with a short count summary.
    concurrency: coalesce_if_active
    schedules:
      - { cron: "30 6 * * *", timezone: "${settings.timezone}", label: "daily" }
  librarian-weekly:
    title: Librarian weekly lint
    agent: librarian
    description: |
      Today is {{date}}. Follow "Weekly lint" in your instructions: lint the whole notes vault, the people
      directory and the agents' rules, then file the one weekly report task. Then close this task with one line saying what you did.
    concurrency: coalesce_if_active
    schedules:
      - { cron: "0 7 * * 1", timezone: "${settings.timezone}", label: "Monday morning" }
