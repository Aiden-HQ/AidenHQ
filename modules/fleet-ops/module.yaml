name: fleet-ops
description: "Fleet Ops: watches the fleet (stuck or failing runs, sources and apps down), nudges, files fixes through the normal tiers and tells the owner."
roles:
  declares:
    - { id: product-issues, description: "Product bugs as issues on the product repo, as the GitHub App (github-mcp github_app_issue)." }
  requests: [ fleet-read ]
settings:
  # Minutes between the board's detector checks (lower while developing). The detector wakes Fleet Ops only when a
  # threshold trips or recovers, at most once per 30 minutes unless an app or apps-mcp is down or a critical alert fires
  # (services/board/src/fleet-ops.ts).
  fleet_ops_interval_minutes:
    default: 10
  # Health flags (missed fires, failing routines, silent runs, stuck grading) always show. "on" = the detector also pauses a
  # routine after 3 hard failures in a row (the owner resumes it); "off" = the kill switch: flags only.
  health_autopause:
    default: "on"
    values: ["on", "off"]
agents:
  fleet-ops:
    department: platform
    adapter: codex_local
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: high
    timeout_sec: 1200
    connections:
      # Reads only: apps, their logs, and the warehouse (src_meta.ingest_run).
      apps: [ app_list, app_status, app_logs, warehouse_query ]
      telegram: [ notify_owner ]
      # Metrics and dashboards (monitoring alerts' series), when the grafana module is on: reads only.
      grafana?: read
      # Product bugs go upstream as issues on the product repo, as the GitHub App (never the owner's account), with the
      # github module: report one (deduped by fingerprint) and read their state. No other GitHub reads.
      github?: [ github_app_issue, github_app_issue_status ]
      # fleet_status through the fleet-read role: no fleet_control, no relaying, no approvals decided.
      # task_delegate: runner Engineers only (they take tasks from any agent; it has no reports): security and instance fixes
      # through the Platform Engineer. task_create with assignee: app fixes to an app's owner, rule proposals and product
      # upgrades (a pin bump once a product-bug issue's fix merged) to the Platform Engineer.
      paperclip_tasks: [ task_current, task_get, task_comments, task_search, task_list, task_approvals, task_team, task_create, task_comment, task_delegate, task_handoff, task_set_status, task_finish, fleet_status, fleet_catalog, fanout_map ]
    roles: [ fleet-read, product-issues ]
routines:
  fleet-ops-check:
    title: "Fleet Ops: check"
    agent: fleet-ops
    description: |
      Now {{timestamp}}. The board's detector tripped or recovered. Follow "On a check" in your instructions: `fleet_status`
      → `detector` lists what is open and what recovered. Close this task with one line.
    concurrency: coalesce_if_active
    webhook: true # fired by the board's detector
    webhook_base: http://paperclip:3100 # the board calls it from inside the compose network
    secrets_prefix: fleet_ops_webhook # setup saves <prefix>_url / _secret; the module's compose mounts them into the board
    autonomy: full # fired by our own detector over fleet state, not outside text: its fixes stay the AI reviewer's
  fleet-ops-digest:
    title: "Fleet Ops: daily digest"
    agent: fleet-ops
    description: |
      Today is {{date}}. Follow "Daily digest" in your instructions, then close this task with one line.
    concurrency: skip_if_active
    # The day's second look: hard cases marked `deep-look` in the log are worked here. No routine `model:` for now:
    # it needs the codex-model launcher, which fails Paperclip 2026.1106's harness verification (the agent stays paused).
    schedules:
      - { cron: "45 20 * * *", timezone: "${settings.timezone}", label: "evening" }
  fleet-ops-weekly:
    title: "Fleet Ops: weekly review"
    agent: fleet-ops
    description: |
      Today is {{date}}. Follow "Weekly review" in your instructions, then close this task with one line.
    concurrency: skip_if_active
    schedules:
      - { cron: "0 9 * * 1", timezone: "${settings.timezone}", label: "Monday morning" }
# Switches on the board's detector (added to the root compose's board service).
board_env:
  FLEET_OPS_INTERVAL_MINUTES: "${settings.fleet_ops_interval_minutes}"
  FLEET_OPS_AUTOPAUSE: "${settings.health_autopause}"
  FLEET_OPS_WEBHOOK_URL_FILE: ${secrets.fleet_ops_webhook_url}
  FLEET_OPS_WEBHOOK_SECRET_FILE: ${secrets.fleet_ops_webhook_secret}
# Written by setup once the routine's webhook exists; empty until then (the detector stays off while they're empty).
optional_secrets:
  - fleet_ops_webhook_url
  - fleet_ops_webhook_secret
