name: engineering
description: The Engineer agent for coding jobs (code, apps, the fleet's own setup and the product), run by the kernel in an engineer computer (OpenRouter models on Codex through the model gateway).
requires:
  # The module that provides the engine (engine-codex): the runner names it per agent.
  - engine
  # Any code host (codehost-github, codehost-local): each repo is hosted by the provider that owns its org.
  - codehost
  # The one job dispatcher (kernel.jobs): the Engineer's jobs start through it.
  - dispatch
isolation: code-exec
roles:
  declares:
    - { id: platform-engineer, description: "The agent that makes fleet and product changes: settings changes, access proposals and Dependabot PRs are filed to it." }
agents:
  engineer:
    department: engineering
    # Its skills, every one listed (design-system, app UI, comes from the apps platform). The dependabot and forks skills are
    # the routines' and the Dependabot tasks' how-to.
    skills: [ apps-platform.design-system, engineering.aidenhq-product, engineering.build-app, engineering.dependabot, engineering.fleet-change, engineering.forks, engineering.publish, engineering.supply-chain, engineering.write-code ]
    # platform-engineer: settings changes, access proposals, Dependabot tasks and pin bumps are filed to the agent holding it,
    # and it may push any branch (the code host's "Platform line": the kernel's record of who asked, never the args).
    roles: [ platform-engineer ]
    # Briefed and graded: deliverables delegated to it are checked against their rubric before they close (the grader).
    brief: true
    graded: true
    engine: codex-openrouter
    reasoning_effort: high
    model: openrouter/~deepseek/deepseek-flash-latest
    # Offered in the board's model picker and known to the dispatcher ("use DeepSeek"). Any other
    # model id OpenRouter lists works when typed in full (the gateway prices it from OpenRouter's list).
    models:
      - openrouter/~deepseek/deepseek-flash-latest
      - openrouter/moonshotai/kimi-k3.1-pro
      - openrouter/z-ai/glm-5.3-flash
      - openrouter/z-ai/glm-5.3
      - openrouter/deepseek/deepseek-v4.1-flash
      - openrouter/deepseek/deepseek-v4-pro
      - openrouter/moonshotai/kimi-k3
      - openrouter/qwen/qwen3-coder-next
    # Engineer jobs: the task's repositories cloned into its workspace and the code host's writes, in an `engineer` agent
    # computer (gVisor) (owner, 2026-11-18).
    profile: engineer
    image: engineer
    isolation: code-exec
    max_parallel: 4 # independent changes run side by side, each in its own task workspace
    connections:
      apps: [ app_list, app_status, app_view, app_check, web_view ]
      # GitHub reads, a PR's review threads, and a reply on one: answering a code review finding (write-code skill, Checks).
      github?: [ github_whoami, github_project_read, github_issue_read, github_search_issues, github_job_log, github_pr_files, github_product_issue_status, github_pr_threads, github_pr_thread_reply ]
      # Closing a code review finding in code review's own store (write-code skill, Checks): no GitHub write.
      code_review?: [ code_review_findings, code_review_resolve ]
      # Its own task only, never another's text: a `file` deliverable's file goes on it, and task_finish closes it through the
      # kernel's finish gate (graded: held for the grader) once its work has landed; task_wait records what it waits on.
      paperclip_tasks: [ task_file_upload, task_finish, task_wait ]
    # Primer reads (optional: only with the primer module); in its computer through the kernel's proxy with its run token.
    jobcaps: [ primer-read? ]
labels:
  - { name: engineer, color: "#4f46e5" }
