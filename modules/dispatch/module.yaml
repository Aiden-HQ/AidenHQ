name: dispatch
description: "Turns the kernel's wakes into jobs for every agent: which inbox rows start work (the asker rules), the job's prompt, and its outcome posted once."
license: MIT
# Unprivileged: its own module token only (dispatch_token), never a Paperclip or GitHub credential. It claims wakes and starts,
# follows and feeds jobs (kernel.jobs), and reads tasks through the kernel (kernel.cp-read). The kernel owns admission,
# limits, identity and the job's lifecycle, and posts outcomes on the task as the agent.
roles:
  # kernel.jobs: the one job dispatcher (compile gives it every agent). kernel.wake, kernel.tasks, kernel.owner-notice: what an
  # agent's task needs reaches whoever asked (asker.ts).
  requests: [ kernel.jobs, kernel.cp-read, kernel.wake, kernel.tasks, kernel.owner-notice ]
# An Engineer job's workspace (kernel/src/boxes.ts): the kernel clones the repositories its task names, for this module as the
# agent's dispatcher, on its default branch: the fleet's own repos (the agents org's, the product's and the instance's) and the
# listed ones (the repos listed for the Maintainer or Ship), where ship's tasks fix PRs it adopted.
codehost:
  clone: { repos: [ "@agents/*", "@product", "@instance", "@listed" ] }
services:
  data: true
  run:
    dispatch:
      build: ./service
      tmp: 16m
      # The kernel's listener is a host address: reached the way every module with no legacy link reaches it.
      egress: true
      data: ["dispatch:/data"]
      env:
        DISPATCH_DB: /data/dispatch.sqlite
        AIDENHQ_KERNEL_URL: http://10.231.0.1:3130
        DISPATCH_TOKEN_FILE: ${secrets.dispatch_token}
        OWNER_NAME: "${settings.owner_name}"
generated_secrets:
  - dispatch_token
data_version: 0 # its data dir's format: bumped by each forward-only migration (docs/configuration.md)
