name: agent-builder
description: "The Agent Architect (designs, builds and improves agents; onboards each on its first work) and the agent templates it starts from."
requires: [ owner-channel, primer ] # the Architect tells the owner through its notify tool; its design reviews are Primer documents
roles:
  declares:
    - { id: architect, description: "The tasks it files may run on the product line (the kernel's admission reads it from the grants table)." }
    - { id: repo-checkout, description: "A commit of an agents-org repo placed in its computer (services/computer/launcher.ts POST /repo)." }
agents:
  architect:
    department: agents
    skills: [ agent-builder.design-doc, agent-builder.hiring, engineering.supply-chain, engineering.write-code, primer.primer-docs, tasks.delegate-work ]
    # Designs and onboards new agents. DeepSeek Flash at high effort (owner, 2026-11-26: high is enough; max reasoned 5-20k
    # tokens a step at ~86 tok/s, so one chat reply took an hour). Nothing in its path sets an output cap
    # (Codex and the gateway send none), and the longer timeout covers slow turns.
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: high
    timeout_sec: 3600
    # No fleet tools or other roles: it changes the fleet only by delegating to the Engineer, whose change waits for the
    # owner's tap (an approval record). It can't grant itself anything: its own grants live here, in the product.
    # Research (read access to every source, and the web): reads only, so it still changes nothing itself. Its one write
    # outside the chat is its design doc on Primer, which the AI reviewer checks before it publishes.
    connections:
      owner_channel: [ notify ]
      # Explicit lists (tool-budget slimming, 2026-11-13): the research reads, not the plumbing (source cursors, sprints, board config).
      apps: [ app_list, app_status, app_logs, app_view, web_view, warehouse_query ]
      glean?: read
      jira?: [ searchJiraIssuesUsingJql, getJiraIssue, listJiraIssueComments, listJiraProjects, listJiraBoards, lookupJiraAccountId, searchConfluence, getConfluenceContent ]
      slack?: [ slack_search_public_and_private, slack_search_channels, slack_search_users, slack_read_channel, slack_read_thread, slack_read_user_profile ]
      github?: read
      google_workspace?: [ calendar_list_events, calendar_search_events, calendar_get_event, drive_list_recent_files, drive_search_files, drive_read_file, gmail_search, gmail_read_thread, docs_read ]
      # The design review on Primer (skills design-doc, primer.primer-docs): reads, publishing the doc and its versions, and
      # thread replies. No live edits: people's edits and comments wake it, its own never do.
      primer?: [ primer_whoami, primer_resolve_url, primer_get_document, primer_get_version_content, primer_list_versions, primer_get_comments, primer_get_document_comments, primer_list_documents, primer_find_document, primer_get_doc, primer_create_document, primer_add_version, primer_reply_to_thread ]
      ops_mcp?: [ obsidian_search, obsidian_read, obsidian_read_document_map, voice_note_read, knowledge_list, knowledge_index, knowledge_search, knowledge_read ]
      paperclip_tasks: [ task_current, task_get, task_comments, task_files, task_file_read, task_search, task_list, task_approvals, task_team, fleet_catalog, task_delegate, task_amend_rubric, task_comment, task_handoff, task_block, task_cancel, task_finish ]
    heartbeat: true
    # architect: the tasks it files may run on the product line (kernel admission's platform filers).
    # repo-checkout: the instance repo's agents/ and handbooks, read-only, once the Architect has a computer (`image:`).
    roles: [ architect, repo-checkout ]
