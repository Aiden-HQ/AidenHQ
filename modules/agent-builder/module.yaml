name: agent-builder
description: "The Agent Architect (designs, builds and improves agents; reviews agents in trial) and the agent templates it starts from."
requires: [ owner-channel ] # the Architect tells the owner through its notify tool
roles:
  declares:
    - { id: architect, description: "Its Engineer tasks may use the trial exception (the runner reads it from the grants table)." }
    - { id: repo-checkout, description: "A commit of an agents-org repo placed in its computer (services/computer/launcher.mjs POST /repo)." }
agents:
  architect:
    department: agents
    skills: [ engineering.write-code, engineering.supply-chain ]
    # Designs and onboards new agents. DeepSeek Flash at max effort (the owner's pick after a blind bake-off, 2026-11-13): its
    # handbooks are what the other agents run on. Max can reason 60-90k tokens a turn: nothing in its path sets an output cap
    # (Codex and the gateway send none), and the longer timeout covers slow turns. A 90k-token turn costs about $0.05, so
    # the default $2 run cap allows about 40 of them.
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: max
    timeout_sec: 3600
    # No fleet tools or other roles: it changes the fleet only by delegating to the Engineer, whose change waits for the
    # owner's tap (an approval record). It can't grant itself anything: its own grants live here, in the product.
    # Research (read access to every source, and the web): reads only, so it still changes nothing itself.
    connections:
      owner_channel: [ notify ]
      # Explicit lists (tool-budget slimming, 2026-11-13): the research reads, not the plumbing (source cursors, sprints, board config).
      apps: [ app_list, app_status, app_logs, app_view, web_view, warehouse_query ]
      glean?: read
      jira?: [ searchJiraIssuesUsingJql, getJiraIssue, listJiraIssueComments, listJiraProjects, listJiraBoards, lookupJiraAccountId, searchConfluence, getConfluenceContent ]
      slack?: [ slack_search_public_and_private, slack_search_channels, slack_search_users, slack_read_channel, slack_read_thread, slack_read_user_profile ]
      github?: read
      google_workspace?: [ calendar_list_events, calendar_search_events, calendar_get_event, drive_list_recent_files, drive_search_files, drive_read_file, gmail_search, gmail_read_thread, docs_read ]
      primer?: [ primer_whoami, primer_resolve_url, primer_get_document, primer_get_version_content, primer_list_versions, primer_get_comments, primer_get_document_comments, primer_list_documents, primer_find_document, primer_get_all_comments, primer_get_events, primer_get_digest, primer_get_doc, primer_list_collaborators, primer_list_decisions, primer_list_runs, primer_list_suggestions, primer_list_tasks, primer_lookup_user, primer_read_records, primer_record_changes, primer_widget_get, primer_create_document, primer_add_version, primer_reply_to_thread, primer_resolve_thread, primer_send_events, primer_apply_ops, primer_create_thread, primer_reanchor_thread, primer_update_run, primer_withdraw_suggestion, primer_propose_pick, primer_fork_document, primer_promote_conversation, primer_widget_draft, primer_widget_publish, primer_write_records, primer_revert_record_change, primer_add_collaborator ]
      ops_mcp?: [ obsidian_search, obsidian_read, obsidian_read_document_map, voice_note_read, knowledge_list, knowledge_index, knowledge_search, knowledge_read ]
      paperclip_tasks: [ task_current, task_get, task_comments, task_files, task_file_read, task_search, task_list, task_approvals, task_team, fleet_catalog, task_delegate, task_comment, task_handoff, task_block, task_cancel, task_finish ]
    heartbeat: true
    # architect: handbook-only edits to agents in trial on its Engineer tasks land without a tap (the runner checks).
    # repo-checkout: the instance repo's agents/ and handbooks, read-only, once the Architect has a computer (`image:`).
    roles: [ architect, repo-checkout ]
routines:
  trial-review:
    title: Review agents in trial
    agent: architect
    description: |
      Today is {{date}}. Follow "Daily review" in your instructions: review each finished task of the agents in trial
      that report to you. If none are in trial, close this task at once with "nothing to review".
    concurrency: skip_if_active
    schedules:
      - { cron: "0 17 * * 1-5", timezone: "${settings.timezone}", label: "weekday evening" }
