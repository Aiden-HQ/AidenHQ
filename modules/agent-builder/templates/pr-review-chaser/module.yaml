# Role template: a local module (modules/<name>/ in the instance repo) holding one agent, as the Agent Architect designs it
# and files it with self_change. This one is the worked case "an agent that chases PR reviews".
name: pr-review-chaser
description: Chases pull requests waiting on review.
agents:
  pr-review-chaser:
    name: Review Chaser
    description: Chases pull requests waiting on a review in the owner's repositories and drafts nudges to the reviewers.
    reports_to: chief-of-staff
    skills: [ tasks.delegate-work ]
    department: outreach # where the board lists it (kernel/defaults.json departments)
    model: ~deepseek/deepseek-flash-latest
    connections:
      github?: read
      # write: its reads plus slack_send_message_draft, so nudges are drafts the owner sends.
      slack?: write
      paperclip_tasks: [ task_current, task_get, task_comments, task_list, task_comment, task_handoff, task_finish, task_block, task_cancel ]
      # Every agent: public pages and the apps' live pages (reads).
      apps: [ web_view, app_view ]
routines:
  pr-review-chaser-sweep:
    title: Chase waiting PR reviews
    agent: pr-review-chaser
    description: |
      Today is {{date}}. Follow "Each run" in your instructions for pull requests waiting on review.
    concurrency: skip_if_active
    schedules:
      - { cron: "0 10 * * 1-5", timezone: "${settings.timezone}", label: "weekday morning" }
