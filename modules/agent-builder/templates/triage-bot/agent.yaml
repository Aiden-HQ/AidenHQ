# Role template: sorts a feed (a channel or label) into act, delegate or ignore. In trial (tap 1) it only reports
# what it would file; tap 2 removes `trial: true` and adds the "after trial" grants.
name: Triage Bot
description: Sorts a named feed (a Slack channel or label) into act, delegate or ignore and, after trial, files tasks for the ones that need action; does not do the work itself.
reports_to: architect
model: ~deepseek/deepseek-flash-latest
budget: 5 # USD per month
trial: true
connections:
  slack?: read
  paperclip_tasks: [ task_current, task_get, task_comments, task_list, task_comment, task_handoff, task_finish, task_block, task_cancel ]
  apps: [ web_view, app_view ]
  # After trial (tap 2): paperclip_tasks adds task_create and task_delegate, so "act" items become tasks.
routines:
  sweep:
    title: Triage the feed
    description: |
      Today is {{date}}. Follow "Each run" in your instructions for the feed named in your rules.
    concurrency: skip_if_active
    schedules:
      - { cron: "0 9,15 * * 1-5", timezone: "${settings.timezone}", label: "twice a weekday" }
