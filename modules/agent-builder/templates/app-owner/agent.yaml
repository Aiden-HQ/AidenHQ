# Role template: the owner of one app's backlog (not its health: that is the core DevOps Engineer). In trial (tap 1) it
# reports what it would file; tap 2 removes `trial: true` and adds the "after trial" grants.
name: App Owner
description: Owns one named app's backlog, reads its requests and usage and files improvements to the Engineer; does not run, deploy or fix the app's health (the DevOps Engineer does).
reports_to: architect
model: ~deepseek/deepseek-flash-latest
budget: 8 # USD per month
trial: true
graded: true
connections:
  # app_requests: the app's open in-app requests; the rest are read-only views of the app.
  apps: [ app_list, app_status, app_view, web_view, app_requests ]
  paperclip_tasks: [ task_current, task_get, task_comments, task_list, task_comment, task_handoff, task_finish, task_set_status ]
  # After trial (tap 2): paperclip_tasks adds task_delegate (code changes to the Engineer, who takes them from any agent).
routines:
  backlog:
    title: Review the app backlog
    description: |
      Today is {{date}}. Follow "Each run" in your instructions for the app named in your rules.
    concurrency: skip_if_active
    schedules:
      - { cron: "0 10 * * 1", timezone: "${settings.timezone}", label: "Monday morning" }
