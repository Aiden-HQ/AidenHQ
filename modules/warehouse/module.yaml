name: warehouse
description: The shared Postgres warehouse (an app) every source ingests into, and the warehouse.sources point each source module contributes its schema and views to.
# Each source module (requires: [warehouse]) declares its schema and views here; apps-mcp serves the read tools over them.
points:
  sources: { schema: schemas/sources.json }
settings:
  # owner/repo of the AidenHQ product this instance runs; the warehouse app is built from it at the pinned product commit.
  # Its org must be in github_orgs (or be the agents org).
  product_repo:
    required: true
apps:
  - name: warehouse
    description: Shared Postgres warehouse for all sources and apps
    owner: app-maintainer
    stateful: true
    port: 5433
    expose: false
    caps:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    secrets:
      - POSTGRES_PASSWORD
      - READONLY_PASSWORD
    repo: ${settings.product_repo}
    path: apps/warehouse
    # The shared-sources network (compose.yaml `sources`): source writers and apps-mcp reach Postgres there, on a network
    # no app shares with them.
    connects: [sources]
