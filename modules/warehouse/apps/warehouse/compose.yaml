# Shared Postgres warehouse. Roles and schema convention: init/01-roles.sql, AGENTS.md.
# Secrets (POSTGRES_PASSWORD, READONLY_PASSWORD) are files from the secret vault, mounted at /run/secrets/<KEY> by
# apps-mcp; never values in env or git.
services:
  postgres:
    image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    restart: unless-stopped
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_DB: warehouse
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Nightly logical dump at 02:00 UTC, keeps about 7 days. Restore: AGENTS.md.
  backup:
    image: postgres:17@sha256:ff87138949ad9a46f32ff23bd6852b52ce024a13dffe9b4087be98292cdd3b4f
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_started
    volumes:
      - backups:/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]

# Named volumes only: apps get no writable host paths (app-warehouse_pgdata, app-warehouse_backups).
volumes:
  pgdata:
  backups:
