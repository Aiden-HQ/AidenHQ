# CI: tests and an automated code review, on the org's self-hosted runners (one fresh container per job), plus an image
# build-and-scan on a GitHub-hosted runner when a PR could change the image (the self-hosted containers have no Docker).
# The job names `tests`, `code-review` and `image-scan` are the check names graders and rubrics cite: don't rename them,
# don't add a matrix.
# Secret OPENROUTER_API_KEY (code-review only); optional variable CODEGENIE_MODEL (default below).
name: ci

on:
  pull_request:
    # labeled: adding `deep-review` re-runs the review at depth deep.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Runs the PR's code, so it gets no secrets.
  tests:
    runs-on: [self-hosted, aidenhq]
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      # The 7-day rule: everything is pinned, and what this PR adds or bumps (lockfile entries, images, actions, global
      # installs) is 7+ days old or a security exception in .github/supply-chain-exceptions.yaml. Before any install.
      # The checks and the exceptions come from the base commit, so a PR can't loosen its own check (the PR that adds
      # them runs its own copies).
      - name: Supply chain
        run: |
          d="$RUNNER_TEMP/supply-chain"; mkdir -p "$d"
          for f in best-version pins npm-age; do
            git show "$BASE_SHA:.github/supply-chain/$f.mjs" > "$d/$f.mjs" 2>/dev/null || cp ".github/supply-chain/$f.mjs" "$d/$f.mjs"
          done
          status=0
          node "$d/npm-age.mjs" "$BASE_SHA" "$HEAD_SHA" || status=1
          node "$d/pins.mjs" "$BASE_SHA" "$HEAD_SHA" || status=1
          exit $status
      - name: Test
        run: npm ci && npm test

  # Secret scan over the PR's new commits: the pinned, checksummed scanner binary (no licence key, no secrets used).
  # Fake test values go in a .gitleaks.toml by exact value; it is read from the base commit, so land it in its own PR.
  secrets:
    runs-on: [self-hosted, aidenhq]
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1 # released 2026-03-21
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          # The config comes from the base, so a PR cannot allowlist its own findings (defaults if the base has none).
          git show "${BASE_SHA}:.gitleaks.toml" > "$RUNNER_TEMP/gl.toml" 2>/dev/null || printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gl.toml"
          ./gitleaks git --redact --exit-code 1 --config "$RUNNER_TEMP/gl.toml" --log-opts "${BASE_SHA}..${HEAD_SHA}" .

  # Which images the PR could change: each Dockerfile it changes, or whose directory gets a changed dependency manifest or
  # lockfile. Every one is listed, whatever its FROM: a FROM that can't be resolved fails the scan, never skips it. No build
  # here, so self-hosted.
  image-changes:
    runs-on: [self-hosted, aidenhq]
    timeout-minutes: 5
    outputs:
      dockerfiles: ${{ steps.find.outputs.dockerfiles }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: find
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          found=""
          for df in $(git ls-files | grep -iE '(^|/)(Dockerfile|Containerfile)[^/]*$|\.dockerfile$'); do
            d=$(dirname "$df"); prefix=""; [ "$d" = . ] || prefix="$d/"
            while IFS= read -r f; do
              case "$f" in "$prefix"*) ;; *) continue ;; esac
              case "${f##*/}" in
                [Dd]ockerfile*|[Cc]ontainerfile*|*.dockerfile|.dockerignore|package.json|package-lock.json|npm-shrinkwrap.json|yarn.lock|pnpm-lock.yaml|requirements*.txt|poetry.lock|Pipfile.lock|uv.lock|go.mod|go.sum|Cargo.lock|Gemfile.lock)
                  found="$found $df"; break ;;
              esac
            done <<< "$changed"
          done
          echo "Images to scan:${found:- none}"
          echo "dockerfiles=${found# }" >> "$GITHUB_OUTPUT"

  # The `image-scan` check: builds each image the PR could change and fails on a high or critical vulnerability that has
  # a fix. It is the evidence for image and CVE work (Engineers have no Docker); skipped when no image could change.
  # Runs the PR's code (the build), so it gets no secrets. GitHub-hosted, because it needs a Docker daemon.
  # The scanner is AidenHQ's security scanner's grype pin, by digest.
  image-scan:
    needs: image-changes
    if: needs.image-changes.outputs.dockerfiles != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERFILES: ${{ needs.image-changes.outputs.dockerfiles }}
      GRYPE_IMAGE: anchore/grype:v0.121.3@sha256:13113eeceab017260370cf540e1d25442c59665fd07d1b09b66d63bb0c282887 # released 2026-11-09 (a security fix, GHSA-c9gr-gmg4-2vqv)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and scan
        run: |
          mkdir -p "$RUNNER_TEMP/grype-db" && chmod 777 "$RUNNER_TEMP/grype-db"
          status=0; n=0
          for df in $DOCKERFILES; do
            n=$((n + 1)); tag="image-scan:$n"
            echo "::group::$df"
            if docker build -f "$df" -t "$tag" "$(dirname "$df")" && docker save "$tag" -o "$RUNNER_TEMP/image.tar"; then
              # The scanner reads the saved image: no Docker socket inside it.
              docker run --rm -v "$RUNNER_TEMP/grype-db:/db" -e GRYPE_DB_CACHE_DIR=/db -v "$RUNNER_TEMP/image.tar:/image.tar:ro" \
                "$GRYPE_IMAGE" docker-archive:/image.tar --only-fixed --fail-on high || { echo "::error file=$df::fixable high or critical vulnerabilities"; status=1; }
            else
              echo "::error file=$df::the image did not build"; status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  # Never runs the PR's code: codegenie only reads it from git objects. Its config and rules come from the base commit
  # (reviewed code), so a PR can't loosen its own review; the gate comes from the default branch's current tip, so a
  # gate update protects every open PR at once. Only the PR that first adds CI (no gate on the default branch yet)
  # passes unreviewed; changes under .github/ get a human review anyway.
  code-review:
    runs-on: [self-hosted, aidenhq]
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - name: Review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ vars.CODEGENIE_MODEL || 'openrouter/~deepseek/deepseek-flash-latest' }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        # fetch-depth 0 fetched every branch, the PR's head included (app PRs come from branches of the same repo).
        run: |
          set +e
          # Mostly light: these are small, fast-moving apps. Normal when the diff touches dependencies, CI, Dockerfiles or
          # auth/security code, has binary files, is very large, or can't be read. Deep only when asked: the PR's
          # `deep-review` label.
          stat=$(git diff --numstat "$BASE_SHA...$HEAD_SHA") || stat=""
          lines=$(printf '%s\n' "$stat" | awk '$1 == "-" {n += 1000} {n += $1 + $2} END {print n + 0}')
          depth=light
          if [ -z "$stat" ] || [ "$lines" -gt 800 ] || printf '%s\n' "$stat" | grep -qiE 'package(-lock)?\.json|lock|\.github/|dockerfile|auth|secur|token|session|permission'; then depth=normal; fi
          case ",$PR_LABELS," in *,deep-review,*) depth=deep ;; esac
          # Tiny changes in non-sensitive files (still light: no sensitive path, no deep-review label) skip the review.
          if [ "$depth" = light ] && [ "$lines" -lt 20 ]; then
            echo "::notice::$lines changed lines, no sensitive files: no code review needed."
            echo "CODE_REVIEW_SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Changed lines: $lines, review depth: $depth"
          npx -y @0xsequence/codegenie@0.7.0 review --base "$BASE_SHA" --head "$HEAD_SHA" --model "$MODEL" --depth "$depth" \
            --format json --ci --no-progress --max-time 40 > "$RUNNER_TEMP/review.json"
          echo "CODEGENIE_EXIT=$?" >> "$GITHUB_ENV"
      - name: Verdict
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${CODE_REVIEW_SKIPPED:-}" = 1 ]; then
            echo "::notice::A tiny change: not reviewed, and it passes."; exit 0
          fi
          # The gate is the default branch's current tip, not this PR's recorded base: a merged gate update applies to
          # every open PR without a rebase, and a PR still can't weaken the gate it is checked against. Checkout removed
          # its credentials, so this fetch carries the read-only token itself.
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" \
            fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git cat-file -e "origin/$DEFAULT_BRANCH:.github/codegenie-gate.mjs" 2>/dev/null; then
            echo "::notice::No code-review gate on the default branch yet: this PR adds CI, so it is not reviewed."; exit 0
          fi
          git show "origin/$DEFAULT_BRANCH:.github/codegenie-gate.mjs" > "$RUNNER_TEMP/codegenie-gate.mjs"
          node "$RUNNER_TEMP/codegenie-gate.mjs" "$RUNNER_TEMP/review.json" "${CODEGENIE_EXIT:-1}"
