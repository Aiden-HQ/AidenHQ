# CI: tests and an automated code review, on the org's self-hosted runners (one fresh container per job), plus an image
# build-and-scan on a GitHub-hosted runner when a PR could change the image (the self-hosted containers have no Docker).
# The job names `tests`, `code-review` and `image-scan` are the check names graders and rubrics cite: don't rename them,
# don't add a matrix.
# Secret OPENROUTER_API_KEY (code-review only); optional variable CODEGENIE_MODEL (default below).
# Code-review depth: light by default, whatever the size; normal when the PR touches a critical path; deep with the PR's
# `deep-review` label. Critical paths are built in (dependency manifests and lock files, .github/, Dockerfiles, and paths
# naming auth, security, tokens, sessions or permissions) plus the app's own `.github/code-review-critical`: one glob per
# line (bash pattern: `*` also matches `/`, so `src/server/db/*` covers everything under it), `#` comments allowed. That
# file is read from the default branch, never the PR, so a PR can't drop its own critical paths (and editing it is itself
# critical: it is under .github/).
name: ci

on:
  pull_request:
    # labeled: adding `deep-review` re-runs the review at depth deep.
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Runs the PR's code, so it gets no secrets.
  tests:
    runs-on: [self-hosted, aidenhq]
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      # The 7-day rule: everything is pinned, and what this PR adds or bumps (lockfile entries, images, actions, global
      # installs) is 7+ days old or a security exception in .github/supply-chain-exceptions.yaml. Before any install.
      # The checks and the exceptions come from the base commit, so a PR can't loosen its own check (the PR that adds
      # them runs its own copies).
      - name: Supply chain
        run: |
          d="$RUNNER_TEMP/supply-chain"; mkdir -p "$d"
          for f in best-version pins npm-age; do
            git show "$BASE_SHA:.github/supply-chain/$f.mjs" > "$d/$f.mjs" 2>/dev/null || cp ".github/supply-chain/$f.mjs" "$d/$f.mjs"
          done
          status=0
          node "$d/npm-age.mjs" "$BASE_SHA" "$HEAD_SHA" || status=1
          node "$d/pins.mjs" "$BASE_SHA" "$HEAD_SHA" || status=1
          exit $status
      - name: Test
        run: npm ci && npm test

  # Secret scan over the PR's new commits: the pinned, checksummed scanner binary (no licence key, no secrets used).
  # Fake test values go in a .gitleaks.toml by exact value; it is read from the base commit, so land it in its own PR.
  secrets:
    runs-on: [self-hosted, aidenhq]
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1 # released 2026-03-21
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          # The config comes from the base, so a PR cannot allowlist its own findings (defaults if the base has none).
          git show "${BASE_SHA}:.gitleaks.toml" > "$RUNNER_TEMP/gl.toml" 2>/dev/null || printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gl.toml"
          ./gitleaks git --redact --exit-code 1 --config "$RUNNER_TEMP/gl.toml" --log-opts "${BASE_SHA}..${HEAD_SHA}" .

  # Which images the PR could change: each Dockerfile it changes, or whose directory gets a changed dependency manifest or
  # lockfile. Every one is listed, whatever its FROM: a FROM that can't be resolved fails the scan, never skips it. No build
  # here, so self-hosted.
  image-changes:
    runs-on: [self-hosted, aidenhq]
    timeout-minutes: 5
    outputs:
      dockerfiles: ${{ steps.find.outputs.dockerfiles }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: find
        run: |
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          found=""
          for df in $(git ls-files | grep -iE '(^|/)(Dockerfile|Containerfile)[^/]*$|\.dockerfile$'); do
            d=$(dirname "$df"); prefix=""; [ "$d" = . ] || prefix="$d/"
            while IFS= read -r f; do
              case "$f" in "$prefix"*) ;; *) continue ;; esac
              case "${f##*/}" in
                [Dd]ockerfile*|[Cc]ontainerfile*|*.dockerfile|.dockerignore|package.json|package-lock.json|npm-shrinkwrap.json|yarn.lock|pnpm-lock.yaml|requirements*.txt|poetry.lock|Pipfile.lock|uv.lock|go.mod|go.sum|Cargo.lock|Gemfile.lock)
                  found="$found $df"; break ;;
              esac
            done <<< "$changed"
          done
          echo "Images to scan:${found:- none}"
          echo "dockerfiles=${found# }" >> "$GITHUB_OUTPUT"

  # The `image-scan` check: builds each image the PR could change and fails on a high or critical vulnerability that has
  # a fix. It is the evidence for image and CVE work (Engineers have no Docker); skipped when no image could change.
  # Runs the PR's code (the build), so it gets no secrets. GitHub-hosted, because it needs a Docker daemon.
  # The scanner is AidenHQ's security scanner's grype pin, by digest.
  image-scan:
    needs: image-changes
    if: needs.image-changes.outputs.dockerfiles != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERFILES: ${{ needs.image-changes.outputs.dockerfiles }}
      GRYPE_IMAGE: anchore/grype:v0.121.3@sha256:13113eeceab017260370cf540e1d25442c59665fd07d1b09b66d63bb0c282887 # released 2026-11-09 (a security fix, GHSA-c9gr-gmg4-2vqv)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and scan
        run: |
          mkdir -p "$RUNNER_TEMP/grype-db" && chmod 777 "$RUNNER_TEMP/grype-db"
          status=0; n=0
          for df in $DOCKERFILES; do
            n=$((n + 1)); tag="image-scan:$n"
            echo "::group::$df"
            if docker build -f "$df" -t "$tag" "$(dirname "$df")" && docker save "$tag" -o "$RUNNER_TEMP/image.tar"; then
              # The scanner reads the saved image: no Docker socket inside it.
              docker run --rm -v "$RUNNER_TEMP/grype-db:/db" -e GRYPE_DB_CACHE_DIR=/db -v "$RUNNER_TEMP/image.tar:/image.tar:ro" \
                "$GRYPE_IMAGE" docker-archive:/image.tar --only-fixed --fail-on high || { echo "::error file=$df::fixable high or critical vulnerabilities"; status=1; }
            else
              echo "::error file=$df::the image did not build"; status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  # Never runs the PR's code: codegenie only reads it from git objects. Its config and rules come from the base commit
  # (reviewed code), so a PR can't loosen its own review; the gate comes from the default branch's current tip, so a
  # gate update protects every open PR at once. Only the PR that first adds CI (no gate on the default branch yet)
  # passes unreviewed; changes under .github/ get a human review anyway.
  code-review:
    runs-on: [self-hosted, aidenhq]
    timeout-minutes: 90 # a first review (up to ~45 min) and a retry; the Review step stops retrying at 85
    permissions:
      contents: read
      pull-requests: write
      actions: read # Prior review: this workflow's earlier runs on the PR
      statuses: write # Record: the code-review/state status on a head that passed
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      # Review only what changed since this PR's last green code review (codegenie-prior.mjs, from the base commit; full
      # when it isn't there yet, or on any doubt): delta, reuse after a rebase with the same patch, or full. Its own step,
      # so codegenie never gets the token.
      - name: Prior review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          out=""
          [ -f .github/codegenie-prior.mjs ] && { out=$(node .github/codegenie-prior.mjs) || out=""; }
          read -r mode from n lines mb <<< "${out:-full - 0 0 -}"
          [[ "$mode $from" =~ ^((delta|reuse)\ [0-9a-f]{40}|full\ -)$ && "$n $lines" =~ ^[0-9]+\ [0-9]+$ ]] || { mode=full; from=-; n=0; lines=0; }
          [[ "$mb" =~ ^[0-9a-f]{40}$ ]] || mb=-
          echo "Review mode: $mode (from $from; $n deltas, $lines delta lines since the last full review)"
          printf 'REVIEW_MODE=%s\nREVIEW_FROM=%s\nREVIEW_N=%s\nREVIEW_LINES=%s\nREVIEW_MB=%s\n' "$mode" "$from" "$n" "$lines" "$mb" >> "$GITHUB_ENV"
      - name: Review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: ${{ vars.CODEGENIE_MODEL || 'openrouter/~deepseek/deepseek-flash-latest' }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        # fetch-depth 0 fetched every branch, the PR's head included (app PRs come from branches of the same repo).
        run: |
          set +e
          if [ "${REVIEW_MODE:-}" = reuse ]; then
            echo "::notice::The PR's patch is the same as at its green review of $REVIEW_FROM: that verdict stands, no new review."
            echo "CODE_REVIEW_DONE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # A delta reviews only the commits since the last green review. codegenie takes one diff (no option to add the
          # rest of the PR as read-only context); its tools still read any file at the head.
          from="$BASE_SHA"
          [ "${REVIEW_MODE:-}" = delta ] && from="$REVIEW_FROM"
          # Depth: light by default, whatever the size (a big diff gets more calls through --budget-boost below). Normal
          # when the diff touches a critical path (see the header) or can't be read. Deep only when asked: the PR's
          # `deep-review` label.
          stat=$(git diff --numstat "$from...$HEAD_SHA") || stat=""
          lines=$(printf '%s\n' "$stat" | awk '$1 == "-" {n += 1000} {n += $1 + $2} END {print n + 0}')
          # The app's own list comes from the default branch (as fetched at checkout), never the PR's head.
          globs=$(git show "origin/$DEFAULT_BRANCH:.github/code-review-critical" 2>/dev/null | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | grep -v -e '^#' -e '^$')
          critical=""
          # Paths raw and NUL-separated (no quoting of odd names, so a tab or non-ASCII name still matches its glob); a
          # list that fails is critical. Each glob is only a [[ == ]] pattern (set -f: never expanded against files).
          if git -c core.quotePath=false diff --name-only -z --no-renames "$from...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths"; then
            set -f
            while IFS= read -r -d '' p; do
              if printf '%s' "$p" | grep -qiE 'package(-lock)?\.json|lock|\.github/|dockerfile|auth|secur|token|session|permission'; then critical=$p; break; fi
              while IFS= read -r g; do
                case "$g" in ''|'#'*) continue ;; esac
                if [[ "$p" == $g ]]; then critical=$p; break 2; fi
              done <<< "$globs"
            done < "$RUNNER_TEMP/changed-paths"
            set +f
          else
            critical="(a diff that can't be listed)"
          fi
          [ -z "$stat" ] && critical="(a diff that can't be read)"
          depth=light
          [ -n "$critical" ] && depth=normal
          case ",$PR_LABELS," in *,deep-review,*) depth=deep ;; esac
          printf 'REVIEW_DEPTH=%s\nREVIEW_CRITICAL=%s\n' "$depth" "$(printf '%s' "$critical" | tr -d '\r\n')" >> "$GITHUB_ENV"
          # A large diff spends codegenie's per-packet call budget before it finishes ("LLM provider call budget
          # exhausted"), which fails the check without a single finding: scale the budget with the diff's size.
          boost=1
          if [ "$lines" -gt 6000 ]; then boost=4; elif [ "$lines" -gt 2000 ]; then boost=2; fi
          # Tiny PRs in non-sensitive files (still light: no sensitive path, no deep-review label) skip the review. Only a
          # whole PR: a delta is always reviewed, or a big PR could skip its review through small follow-up pushes.
          if [ "${REVIEW_MODE:-full}" = full ] && [ "$depth" = light ] && [ "$lines" -lt 20 ]; then
            echo "::notice::$lines changed lines, no sensitive files: no code review needed."
            echo "CODE_REVIEW_SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Changed lines: $lines, review depth: $depth${critical:+ (touches $critical)}"
          # codegenie's own telemetry (events.jsonl) is where a failed run's cause is: its review JSON can carry only "The
          # underlying cause was not captured" (roadmap-keeper#131, #134). On only for this job, outside the checkout.
          export CODEGENIE_HOME="$RUNNER_TEMP/codegenie"
          mkdir -p "$CODEGENIE_HOME"
          printf '[telemetry]\nenabled = true\nlogLevel = "warn"\nrunDir = "%s"\n' "$RUNNER_TEMP/codegenie-runs" > "$CODEGENIE_HOME/config.toml"
          review() { # $1: --max-time in minutes. Sets $code; stderr is kept for failure() and still shown in the log.
            rm -rf "$RUNNER_TEMP/codegenie-runs"
            npx -y @0xsequence/codegenie@0.7.0 review --base "$from" --head "$HEAD_SHA" --model "$MODEL" --depth "$depth" \
              --format json --ci --no-progress --max-time "$1" --budget-boost "$boost" > "$RUNNER_TEMP/review.json" 2> "$RUNNER_TEMP/review.err"
            code=$?
            cat "$RUNNER_TEMP/review.err" >&2
          }
          # Reads a run: prints "<kind>\t<cause>". kind: ok (it has a verdict), permanent (exit 2: arguments, config or git
          # refs; a bad key; the provider's usage limit), budget (its call budget ran out; an unexplained failure on an
          # already boosted diff counts too: #131, #134 at 13-17k lines) or transient (no review output, a provider error or
          # timeout, anything else). cause goes into a PR comment, so it is only a fixed class (config, auth, usage-limit,
          # no-review-output, budget, rate-limit, provider-5xx, timeout, unknown) and codegenie's own error codes, masked;
          # the detail (stderr, telemetry errors) goes to the job log only, where GitHub masks secrets.
          # Output with stray lines around codegenie's JSON is cut back to the JSON (#141: exit 0, yet no readable review).
          failure() {
            node -e '
              const fs = require("fs");
              const [code, file, errFile, runs, boost] = process.argv.slice(1);
              const read = (f) => { try { return fs.readFileSync(f, "utf8"); } catch { return ""; } };
              const out = read(file), err = read(errFile);
              const parse = (s) => { try { return JSON.parse(s); } catch { return undefined; } };
              let r = parse(out);
              if (!r) { const json = out.match(/^\{$[\s\S]*^\}$/m)?.[0]; if ((r = json && parse(json))) fs.writeFileSync(file, json); }
              const ok = code === "0" && Array.isArray(r?.findings) && r.health?.status !== "failed" && !r.coverage?.unavailable;
              let events = [];
              try { for (const d of fs.readdirSync(runs)) events.push(...read(`${runs}/${d}/events.jsonl`).split("\n").map(parse).filter(Boolean)); } catch {}
              events = events.filter((e) => e.level === "error" || e.level === "warn");
              const said = (e) => [e.data?.errorCode, e.data?.error || e.message, e.data?.context?.providerMessage].filter(Boolean).join(": ");
              if (!ok) for (const s of new Set(events.map(said))) console.error(`codegenie ${s}`);
              // Signals: codegenie error codes (fixed words), and the fatal error text (its rendered error, the review
              // diagnostics, error-level events) for the few headlines it has no code for.
              const diags = r?.health?.diagnostics ?? [];
              const codes = [...diags.map((d) => d.code), ...events.flatMap((e) => [e.data?.errorCode, e.data?.context?.reason]), r?.coverage?.budgetStop?.reason]
                .filter((c) => /^[a-z_]{2,40}$/.test(c ?? ""));
              const has = (...c) => c.some((x) => codes.includes(x));
              const fatal = [...err.split("\n").filter((l) => /^[a-z_]+: /.test(l)), ...diags.map((d) => d.reason),
                ...events.filter((e) => e.level === "error").map(said)].join("\n");
              const [kind, cls] = ok ? ["ok", ""] : code === "2" || has("invalid_args", "config_error", "not_git_worktree", "git_ref_missing", "diff_parse_failed") ? ["permanent", "config"]
                : has("auth") || /authentication failed/i.test(fatal) ? ["permanent", "auth"]
                : has("usage_limit") || /usage limit reached/i.test(fatal) ? ["permanent", "usage-limit"]
                : r?.coverage?.budgetStopped || has("budget_exhausted", "max_model_calls", "max_budget_tokens") || /budget exhausted/i.test(fatal) ? ["budget", "budget"]
                : !Array.isArray(r?.findings) ? ["transient", "no-review-output"]
                : /\b429\b|rate.?limit/i.test(fatal) ? ["transient", "rate-limit"]
                : /HTTP 5\d\d|overloaded|bad gateway|service unavailable/i.test(fatal) ? ["transient", "provider-5xx"]
                : has("timeout", "hard_timeout", "runtime_reserved_tail") || /timed out/i.test(fatal) ? ["transient", "timeout"]
                : Number(boost) > 1 ? ["budget", "unknown"] : ["transient", "unknown"];
              const http = fatal.match(/HTTP [1-5]\d\d/)?.[0];
              const why = [...new Set([...codes, ...(http ? [http] : [])])].slice(0, 4).join(", ");
              console.log(ok ? "ok\t" : `${kind}\t${cls}${why ? ` (${why})` : ""}`);
            ' "$code" "$RUNNER_TEMP/review.json" "$RUNNER_TEMP/review.err" "$RUNNER_TEMP/codegenie-runs" "$boost"
          }
          # No verdict is never a pass: the gate fails it. But one retry here, inside the job, recovers most of them: with
          # double the budget after a budget stop, else after a short wait. The retry gets a --max-time whose hard stop
          # (twice it) still ends before the job's timeout, and none when under 10 minutes are left.
          review 40
          attempts=1
          IFS=$'\t' read -r kind cause < <(failure)
          if [ "$kind" = budget ] || [ "$kind" = transient ]; then
            if [ "$kind" = budget ]; then
              boost=$((boost * 2))
              echo "::warning::codegenie ran out of its review budget (${cause:-no cause given}): retrying with --budget-boost $boost."
            else
              echo "::warning::codegenie ended without a review (${cause:-no cause given}): retrying in 60 seconds."
              sleep 60
            fi
            left=$(( (85 * 60 - SECONDS) / 120 ))
            if [ "$left" -ge 5 ]; then
              review $(( left < 40 ? left : 40 ))
              attempts=2
              IFS=$'\t' read -r kind cause < <(failure)
            else
              echo "::warning::Not enough of the job's time is left for a retry."
            fi
          fi
          echo "CODEGENIE_EXIT=$code" >> "$GITHUB_ENV"
          echo "CODEGENIE_ATTEMPTS=$attempts" >> "$GITHUB_ENV"
          echo "CODEGENIE_FAILURE=$kind" >> "$GITHUB_ENV"
          [ "$kind" = ok ] || echo "CODEGENIE_CAUSE=$cause" >> "$GITHUB_ENV"
          # Record marks a head reviewed only when a review actually came out (or a reuse): never a skip.
          if [ "$kind" = ok ]; then echo "CODE_REVIEW_DONE=1" >> "$GITHUB_ENV"; fi
      - name: Verdict
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${CODE_REVIEW_SKIPPED:-}" = 1 ]; then
            echo "::notice::A tiny change: not reviewed, and it passes."; exit 0
          fi
          # The gate is the default branch's current tip, not this PR's recorded base: a merged gate update applies to
          # every open PR without a rebase, and a PR still can't weaken the gate it is checked against. Checkout removed
          # its credentials, so this fetch carries the read-only token itself.
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" \
            fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git cat-file -e "origin/$DEFAULT_BRANCH:.github/codegenie-gate.mjs" 2>/dev/null; then
            echo "::notice::No code-review gate on the default branch yet: this PR adds CI, so it is not reviewed."; exit 0
          fi
          git show "origin/$DEFAULT_BRANCH:.github/codegenie-gate.mjs" > "$RUNNER_TEMP/codegenie-gate.mjs"
          node "$RUNNER_TEMP/codegenie-gate.mjs" "$RUNNER_TEMP/review.json" "${CODEGENIE_EXIT:-1}"
      # Only once the job has passed: what this head's review covered, for the next push's Prior review step. A commit
      # status, not a comment: only this workflow's token sets it, and it points at this run, which that step checks.
      # None after a partial review (its uncovered hunks must be reviewed again). Failing to set it costs only a full
      # review next time, never this verdict.
      - name: Record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${CODE_REVIEW_DONE:-}" != 1 ] || [ "${CODE_REVIEW_PARTIAL:-}" = 1 ] || [ "${REVIEW_MB:--}" = - ]; then exit 0; fi
          curl -sSf -o /dev/null -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -d "{\"state\":\"success\",\"context\":\"code-review/state\",\"description\":\"$REVIEW_MODE n=$REVIEW_N lines=$REVIEW_LINES mb=$REVIEW_MB\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            || echo "::warning::Couldn't record this review for the next push: it will review the whole PR."
