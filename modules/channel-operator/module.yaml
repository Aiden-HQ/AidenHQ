name: channel-operator
description: "The owner's Claude watcher as a channel: `modules/channel-operator/bin/decide <card> approve|reject [--stale]` on the host decides a card with this channel's own decision token, stamped `watcher`."
# A host CLI channel (channel@1, no service): it asks the kernel for the pending cards and their tokens with its own token
# (channel_operator_token, in the vault) and decides one by id. A stale reject (a duplicate, a dead card) is stamped
# stale:watcher and never counts as the owner's veto. operator_decide is how the owner limits what it may decide.
privileged: [ speaks-as-owner ]
providers:
  channel:
    stamp: watcher
    stale: true
settings:
  # Which cards the watcher may decide: all; standard (all but Tier 2 panel cards and applies); or none.
  operator_decide:
    default: all
    values: [ all, standard, none ]
generated_secrets:
  - channel_operator_token
