# primer module: its compose services. Paths are relative to this module; scripts/compile.mjs makes them absolute.

services:
  primer-mcp:
    extends: { file: ../../compose.base.yaml, service: hardened }
    build: ./connections/primer-mcp
    image: aidenhq/primer-mcp:local
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      PRIMER_MCP_URL: "${PRIMER_MCP_URL:-}"
      PRIMER_TOKEN_FILE: /state/token.json
      MCP_TOKEN_FILE: /run/secrets/primer_mcp_token
      MCP_READ_TOKEN_FILE: /run/secrets/primer_mcp_read_token
      MCP_PUBLISH_TOKEN_FILE: /run/secrets/primer_mcp_publish_token
    volumes:
      # Read-write: Primer rotates the refresh token on every refresh.
      - ${AIDENHQ_SECRETS_DIR}/primer:/state
    secrets:
      - primer_mcp_token
      - primer_mcp_read_token
      - primer_mcp_publish_token
    dns: [ 1.1.1.1, 8.8.8.8 ] # see paperclip
    ports:
      # Loopback only, for the host runner: /mcp/read for Engineer jobs, /mcp/publish for the runner itself.
      - "127.0.0.1:3123:8084"
    networks:
      - backplane
      - egress
secrets:
  primer_mcp_token:
    file: ${AIDENHQ_SECRETS_DIR}/primer_mcp_token
  primer_mcp_read_token:
    file: ${AIDENHQ_SECRETS_DIR}/primer_mcp_read_token
  primer_mcp_publish_token:
    file: ${AIDENHQ_SECRETS_DIR}/primer_mcp_publish_token
