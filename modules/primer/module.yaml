name: primer
description: "Primer: read, and publish documents when asked."
requires:
  - board # its sign-in
  - open-loops # Intake sends the digest and files asks of the owner
# Its sign-in on the board (the board's point, modules/board/schemas/signins.json).
contributes:
  board.signins:
    - { id: primer, label: Primer, status_url: "http://primer-mcp:8084/auth/status", connect_url: /primer/connect, callback: /primer/callback,
        missing: "The agents can't read or publish documents until it is.", stopped: "The agents can't read or publish documents.",
        # self-host is connected from the start (the connector's token is generated); connect asks for the hosted Primer's address.
        secrets: [ { secret: primer_mcp_url, when: { primer_mode: connect } } ] }
  # Which Primer (primer_mode): this server's own, running with nothing to set up, or the switch to an organization's.
  board.setup_flows:
    - order: 125
      title: Primer
      why: Agents publish design docs and write-ups to Primer and read the comments people leave on them.
      effort: nothing to do; switching to your organization's takes about 3 minutes
      steps: |
        Primer keeps documents with their versions and comments. This server runs its own Primer, ready from the start: open
        the links agents share and sign in as you do on the board. To use your organization's Primer instead, pick it here;
        Connect comes next.
      signin: primer
      choose:
        setting: primer_mode
        options:
          - value: self-host
            label: This server's own Primer
            detail: Already running. The documents agents share open from this board's address, for you and the admins you add.
          - value: connect
            label: Connect your organization's Primer instead
            detail: Paste its MCP address, then sign in. Agents act as you in your Primer.
settings:
  # self-host (default): this module runs Primer (primer-server, built from source at the commit its Dockerfile pins, and its
  # own Postgres, primer-db) behind the gate: the module door (AidenHQ admins at the board's host on 8447, or localhost:3130
  # through a local install's tunnel) or, with edge, https://<primer_host>, where people sign in as app users. The connector signs in as the agent user server/start.ts seeds,
  # with the generated primer_connector_token: no setup. connect: an organization's hosted Primer (its MCP address from
  # Connect), signed in as the owner. Either way a comment on a document an agent published wakes that agent
  # (connections/primer-mcp/src/subscriber.ts).
  primer_mode:
    default: self-host
    values: [self-host, connect]
  # self-host with settings.edge: the gate's host that shares Primer with people beyond the admins (instance-only, like an
  # app's share.host); it replaces the module door. Empty: the module door.
  primer_host:
    default: ""
    pattern: '^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$'
    when: { primer_mode: self-host }
  # self-host with app_login access or header-jwt: the sign-in audience of the access application that covers primer_host.
  primer_host_aud:
    default: ""
    pattern: '^[A-Za-z0-9:._-]{1,200}$'
    when: { primer_mode: self-host }
connections:
  primer:
    setup: "Press Connect on the board (Settings, Connections), give your Primer MCP address and allow access."
    guide: "Primer documents (design docs and write-ups) with their versions and comments."
    url: http://primer-mcp:8084/mcp
    auth: primer_service_key
    # Every tool Primer's server lists (probed 2026-11-18; the live-document tools added 2026-11-20). Reads added since the
    # first nine are `named`: only a grant naming them reaches them. Primer decides what an agent may do on each document
    # (its role there), so every write on a document runs as granted. Giving someone access to a document
    # (primer_add_collaborator) and deleting a person's records are `destructive`: only a grant naming one reaches it, and
    # every call is a record the AI reviewer decides first (owner, 2026-11-20).
    tools:
      read: [ primer_whoami, primer_resolve_url, primer_get_document, primer_get_version_content, primer_list_versions, primer_get_comments, primer_get_document_comments, primer_list_documents, primer_find_document, primer_get_all_comments, primer_get_events, primer_get_digest,
        primer_get_doc, primer_list_collaborators, primer_list_decisions, primer_list_runs, primer_list_suggestions, primer_list_tasks, primer_lookup_user, primer_read_records, primer_record_changes, primer_widget_get ]
      named: [ primer_get_all_comments, primer_get_events, primer_get_digest,
        primer_get_doc, primer_list_collaborators, primer_list_decisions, primer_list_runs, primer_list_suggestions, primer_list_tasks, primer_lookup_user, primer_read_records, primer_record_changes, primer_widget_get ]
      write: [ primer_create_document, primer_add_version, primer_reply_to_thread, primer_resolve_thread, primer_send_events,
        primer_apply_ops, primer_create_thread, primer_reanchor_thread, primer_update_run, primer_withdraw_suggestion,
        primer_propose_pick, primer_fork_document, primer_promote_conversation, primer_widget_draft, primer_widget_publish,
        primer_write_records, primer_revert_record_change ]
      destructive: [ primer_add_collaborator, primer_purge_personal_records ]
# The owner's Primer digest (skills/primer-digest): one notify a day of what others did on their documents. Quiet by
# default: a scheduled module routine, so quiet start pauses it until the owner resumes it (the board's fleet controls).
routines:
  primer-digest:
    title: Primer digest
    agent: inbox-agent
    description: |
      Today is {{date}}. Follow your primer-digest skill: read Primer's digest of the last day and, when there is
      something in it, send the owner one notify (kind digest). Then close this task with one line.
    concurrency: skip_if_active
    schedules:
      - { cron: "0 8 * * *", timezone: "${settings.timezone}", label: "every morning" }
# Runner jobs read Primer through the model gateway with their own token (scripts/modules.ts jobcapEntries); read_url and
# read_secret are today's loopback read endpoint and its token, which only the gateway holds.
jobcaps:
  - { id: primer-read, connection: primer, tools: read, read_url: "http://primer-mcp:8084/mcp/read", read_secret: primer_mcp_read_token }
secrets:
  state: true # its own vault dir, read-write at /state: the registered client and the token pair; Primer rotates the refresh token on every refresh
  provided:
    # Your organization's Primer MCP endpoint, asked for on Connect; empty: Primer is off.
    - name: primer_mcp_url
      setup:
        label: Primer MCP address
        pattern: '^https://[a-z0-9.-]+(:[0-9]{2,5})?/[A-Za-z0-9._/-]*$'
        help: "From your Primer admin or Primer's settings, for example https://primer.example.com/mcp"
optional_secrets:
  - primer_mcp_url
# The comment wake loop: a notice on the publishing task (kernel.wake), or one Revisions task when it is closed (kernel.tasks).
roles:
  requests: [ kernel.wake, kernel.tasks ]
services:
  data: true
  run:
    # self-host only. Its documents live in the module's data dir (blobs), its rows in primer-db.
    primer-server:
      when: { primer_mode: self-host }
      build: ./server
      tmp: 64m
      port: 3000
      ui_port: 3141 # loopback only: the gate's host for it (share)
      egress: true # Docker publishes no port from an internal network; also Primer's own outbound (email, if set)
      # No host: the module door (admins only). A host (with edge): people other than AidenHQ admins get a role from the
      # app's admins on its Access page (no default: blocked). Compile passes the address as AIDENHQ_APP_URL.
      share: { host: "${settings.primer_host}", aud: "${settings.primer_host_aud}" }
      data: ["blobs:/data/blobs"]
      env:
        ADMIN_EMAILS: "${settings.owner_email}"
        # start.ts seeds the owner (as the gate names them) and the connector's agent user and token.
        OWNER_EMAIL: "${settings.owner_email}"
        OWNER_NAME: "${settings.owner_name}"
        PRIMER_CONNECTOR_TOKEN_FILE: ${secrets.primer_connector_token}
        PRIMER_DB_PASSWORD_FILE: ${secrets.primer_db_password}
    primer-db:
      when: { primer_mode: self-host }
      image: postgres:17.12@sha256:dbb9623d5121b5d2c2c9e2fba56e40193cbb3510d4af7f035b1ab1823aff3205
      read_only: false # the image's entrypoint writes its run dir; as the owner's uid (nss_wrapper), no capabilities
      tmp: 64m
      data: ["db:/var/lib/postgresql/data"]
      env:
        POSTGRES_USER: primer
        POSTGRES_DB: primer
        POSTGRES_PASSWORD_FILE: ${secrets.primer_db_password}
        PGDATA: /var/lib/postgresql/data/pgdata
      healthcheck: { test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U primer -d primer"], interval: 10s, timeout: 5s, retries: 10 }
    primer-mcp:
      build: ./connections/primer-mcp
      tmp: 16m
      port: 8084
      egress: true
      links: [board] # the board's connection health check
      state: /state
      env:
        PRIMER_MCP_URL_FILE: ${secrets.primer_mcp_url}
        PRIMER_MODE: "${settings.primer_mode}"
        PRIMER_LOCAL_URL: http://primer-server:3000
        PRIMER_CONNECTOR_TOKEN_FILE: ${secrets.primer_connector_token} # self-host: its token there (server/start.ts seeds it)
        PRIMER_KERNEL_KEY_FILE: ${secrets.primer_token} # the module's own token: kernel.wake, kernel.tasks
        PRIMER_STATE_DIR: /state
        # The board's https address: Connect's one-click link returns there (the default is loopback).
        BOARD_URL: "${BOARD_LAN_URL:-}"
        # The board's sign-in endpoints: state, and starting or finishing a sign-in.
        PRIMER_AUTH_TOKEN_FILE: ${secrets.primer_auth_token}
        MCP_TOKEN_FILE: ${secrets.primer_service_key}
        MCP_READ_TOKEN_FILE: ${secrets.primer_mcp_read_token}
        # The read endpoint serves only these: the connection's read tags (CI checks they match).
        READ_TOOLS: "primer_whoami,primer_resolve_url,primer_get_document,primer_get_version_content,primer_list_versions,primer_get_comments,primer_get_document_comments,primer_list_documents,primer_find_document,primer_get_all_comments,primer_get_events,primer_get_digest,primer_get_doc,primer_list_collaborators,primer_list_decisions,primer_list_runs,primer_list_suggestions,primer_list_tasks,primer_lookup_user,primer_read_records,primer_record_changes,primer_widget_get"
# The kernel calls primer.publish's plan, execute and status on primer-mcp, with the connection's key (executor@1).
providers:
  executor:
    url: http://primer-mcp:8084/aidenhq/v1/executor
    auth: primer_service_key
# Every publish is a kernel record: an agent's primer_create_document or primer_add_version call, and an Engineer's
# document the runner files after its run (`aidenhq primer`). The AI reviewer reads the whole document and the request
# chain before anything is published; the args carry the content, so what is published is exactly what was reviewed.
# A new version of a document the agent itself published on this task stays with the AI reviewer (Tier 1); a version of any
# other document is the owner's (Tier 2). primer.reply is a thread reply or resolve, tiered the same way.
writes:
  publish:
    args: schemas/publish.json
    floor: 1
    # Code review files its repo reports here (private: true, a new document each, only the owner can read it): its
    # container can't reach primer-mcp, and the record is still read by the AI reviewer.
    filed_by: [ code-review ]
    tools: [ primer_create_document, primer_add_version ]
    card:
      sentence: "Publish {{what}} on Primer."
      changes: "{{changes}}"
      reads: "Nothing new: the document below ({{format}}, {{size}} characters, sha256 {{short}}){{from}}."
      cost: "No model cost."
      details: "{{content}}"
  reply:
    args: schemas/reply.json
    floor: 1
    tools: [ primer_reply_to_thread, primer_resolve_thread ]
    card:
      sentence: "Primer: {{what}}."
      changes: "{{changes}}"
      reads: "Nothing new."
      cost: "No model cost."
      details: "{{body}}"
# The board's Connect/Reconnect for Primer: its sign-in token, only while this module is on.
board_env:
  PRIMER_AUTH_TOKEN_FILE: ${secrets.primer_auth_token}
generated_secrets:
  # self-host: the connector's Primer token (primer_pat_<this>), seeded by server/start.ts for the agent user "AidenHQ agents"
  # with no scope limit (owner, 2026-11-19), so tools added later need no new token; the connector's write kinds gate its writes.
  - primer_connector_token
  - primer_service_key
  - primer_auth_token
  - primer_token
  - primer_db_password
