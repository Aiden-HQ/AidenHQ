name: primer
description: "Primer: read, and publish documents when asked."
requires:
  - board # its sign-in
# Its sign-in on the board (the board's point, modules/board/schemas/signins.json).
contributes:
  board.signins:
    - { id: primer, label: Primer, status_url: "http://primer-mcp:8084/auth/status", connect_url: /primer/connect, callback: /primer/callback,
        missing: "The agents can't read or publish documents until it is.", stopped: "The agents can't read or publish documents.",
        secrets: [primer_mcp_url] }
settings:
  # Superseded by the primer_mcp_url secret Connect asks for; a value here is read only while that secret is empty.
  primer_mcp_url:
    default: ""
    type: url
connections:
  primer:
    setup: "Press Connect on the board (Settings, Connections), give your Primer MCP address and allow access."
    guide: "Primer documents (design docs and write-ups) with their versions and comments."
    url: http://primer-mcp:8084/mcp
    auth: primer_service_key
    # Every tool Primer's server lists (probed 2026-11-18). Reads added since the first nine are `named`: only a grant
    # naming them reaches them. primer_send_events sends structured events to other people's open pages, as the owner:
    # `destructive`, so only a grant naming it reaches it and every call is a record the AI reviewer decides first.
    tools:
      read: [ primer_whoami, primer_resolve_url, primer_get_document, primer_get_version_content, primer_list_versions, primer_get_comments, primer_get_document_comments, primer_list_documents, primer_find_document, primer_get_all_comments, primer_get_events ]
      named: [ primer_get_all_comments, primer_get_events ]
      # primer_reply_to_thread and primer_resolve_thread are on Primer's server once it has them (self-hosted build).
      write: [ primer_create_document, primer_add_version, primer_reply_to_thread, primer_resolve_thread ]
      destructive: [ primer_send_events ]
# Runner jobs read Primer through the model gateway with their own token (scripts/modules.mjs jobcapEntries); read_url and
# read_secret are today's loopback read endpoint and its token, which only the gateway holds.
jobcaps:
  - { id: primer-read, connection: primer, tools: read, read_url: "http://primer-mcp:8084/mcp/read", read_secret: primer_mcp_read_token }
secrets:
  state: true # its own vault dir, read-write at /state: the registered client and the token pair; Primer rotates the refresh token on every refresh
  provided:
    # Your organization's Primer MCP endpoint, asked for on Connect; empty: Primer is off.
    - name: primer_mcp_url
      setup:
        label: Primer MCP address
        pattern: '^https://[a-z0-9.-]+(:[0-9]{2,5})?/[A-Za-z0-9._/-]*$'
        help: "From your Primer admin or Primer's settings, for example https://primer.example.com/mcp"
optional_secrets:
  - primer_mcp_url
services:
  run:
    primer-mcp:
      build: ./connections/primer-mcp
      tmp: 16m
      port: 8084
      egress: true
      links: [board] # the board's connection health check
      state: /state
      env:
        PRIMER_MCP_URL_FILE: ${secrets.primer_mcp_url}
        PRIMER_MCP_URL: "${settings.primer_mcp_url}"
        PRIMER_STATE_DIR: /state
        # The board's https address: Connect's one-click link returns there (the default is loopback).
        BOARD_URL: "${BOARD_LAN_URL:-}"
        # The board's sign-in endpoints: state, and starting or finishing a sign-in.
        PRIMER_AUTH_TOKEN_FILE: ${secrets.primer_auth_token}
        MCP_TOKEN_FILE: ${secrets.primer_service_key}
        MCP_READ_TOKEN_FILE: ${secrets.primer_mcp_read_token}
        # The read endpoint serves only these: the connection's read tags (CI checks they match).
        READ_TOOLS: "primer_whoami,primer_resolve_url,primer_get_document,primer_get_version_content,primer_list_versions,primer_get_comments,primer_get_document_comments,primer_list_documents,primer_find_document,primer_get_all_comments,primer_get_events"
# The kernel calls primer.publish's plan, execute and status on primer-mcp, with the connection's key (executor@1).
providers:
  executor:
    url: http://primer-mcp:8084/aidenhq/v1/executor
    auth: primer_service_key
# Every publish is a kernel record: an agent's primer_create_document or primer_add_version call, and an Engineer's
# document the runner files after its run (`aidenhq primer`). The AI reviewer reads the whole document and the request
# chain before anything is published; the args carry the content, so what is published is exactly what was reviewed.
# A new version of a document the agent itself published on this task stays with the AI reviewer (Tier 1); a version of any
# other document is the owner's (Tier 2). primer.reply is a thread reply or resolve, tiered the same way.
writes:
  publish:
    args: schemas/publish.json
    floor: 1
    tools: [ primer_create_document, primer_add_version ]
    card:
      sentence: "Publish {{what}} on Primer."
      changes: "{{changes}}"
      reads: "Nothing new: the document below ({{format}}, {{size}} characters, sha256 {{short}}){{from}}."
      cost: "No model cost."
      details: "{{content}}"
  reply:
    args: schemas/reply.json
    floor: 1
    tools: [ primer_reply_to_thread, primer_resolve_thread ]
    card:
      sentence: "Primer: {{what}}."
      changes: "{{changes}}"
      reads: "Nothing new."
      cost: "No model cost."
      details: "{{body}}"
# The board's Connect/Reconnect for Primer: its sign-in token, only while this module is on.
board_env:
  PRIMER_AUTH_TOKEN_FILE: ${secrets.primer_auth_token}
generated_secrets:
  - primer_service_key
  - primer_auth_token
