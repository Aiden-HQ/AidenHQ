name: primer
description: "Primer: read, and publish documents when asked."
connections:
  primer:
    setup: "Set PRIMER_MCP_URL in .env, run `docker compose up -d --force-recreate primer-mcp`, then run `scripts/primer-auth.sh` on the host."
    guide: "Primer documents (design docs and write-ups) with their versions and comments."
    url: http://primer-mcp:8084/mcp
    bearer_token_env_var: AIDENHQ_PRIMER_MCP_TOKEN
    tools:
      read: [ primer_whoami, primer_resolve_url, primer_get_document, primer_get_version_content, primer_list_versions, primer_get_comments, primer_get_document_comments, primer_list_documents, primer_find_document ]
      write: [ primer_create_document, primer_add_version ]
compose: compose.yaml
# The runner's publish token: compile creates it (random) when missing, so the apply needs no extra step.
generated_secrets:
  - primer_mcp_publish_token
