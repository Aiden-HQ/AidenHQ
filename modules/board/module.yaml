name: board
description: "The owner's board (still the root compose's board service): the points other modules extend it through. board.signins: a vendor sign-in the board shows as a banner and connects on the laptop."
# A sign-in through a module's MCP proxy (OAuth): the board asks <status_url> and starts and finishes the sign-in beside it
# (…/auth/start, …/auth/finish) with the module's `<id>_auth_token`, mounted on the board.
points:
  signins: { schema: schemas/signins.json }
# The board's buckets and markers.
labels:
  - { name: needs-review, color: "#d97706" }
  - { name: daily-brief, color: "#059669" }
  - { name: todo, color: "#0891b2" }
  - { name: needs-response, color: "#e11d48" }
  - { name: recurring, color: "#0d9488" }
