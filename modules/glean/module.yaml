name: glean
description: "The organization's Glean: search and documents (reads)."
requires:
  - board # its sign-in banner
# Its sign-in on the board (the board's point, modules/board/schemas/signins.json). Glean permits only this loopback callback shape.
contributes:
  board.signins:
    - { id: glean, label: Glean, status_url: "http://glean-mcp:8085/auth/status", connect_url: /glean/connect, callback: /callback,
        missing: "The Researcher can't search company knowledge until it is.", stopped: "The Researcher's company search is paused." }
settings:
  # Your Glean MCP server URL, from Glean's MCP Configurator (admin settings, "Custom" host), e.g.
  # https://acme-be.glean.com/mcp/default. Set it on the board (Settings, Connections); empty: Glean is off.
  glean_mcp_url:
    default: ""
    type: url
    host: "*.glean.com"
connections:
  glean:
    setup: "Set its URL on the board (Settings, Connections: your Glean MCP server URL, from Glean admin's MCP Configurator) and approve the change, then press Connect on the board from the host's loopback address (http://127.0.0.1:3121)."
    guide: "Start here for anything about the company. One search covers Slack, Google Drive, Confluence, Jira, GitHub, meeting transcripts and people, ranked by relevance and permissions. `search` finds documents and threads (then `read_document` for the full text), `chat` gives a summarized, cited answer across all of them, `employee_search` finds who owns or works on something, `meeting_lookup` finds meetings and their notes, `code_search` finds code. Go to the single-system tools only for what Glean can't give (exact Jira history, a full Slack thread, a live PR state)."
    url: http://glean-mcp:8085/mcp
    auth: glean_service_key
    tools:
      read: [ search, read_document, employee_search, meeting_lookup, code_search, chat ]
      write: []
# Runner jobs of an Engineer with private reads, through the model gateway with their own token (scripts/modules.mjs jobcapEntries).
jobcaps:
  - { id: glean-read, connection: glean, tools: read, private: true, read_url: "http://glean-mcp:8085/mcp/read", read_secret: glean_mcp_read_token }
secrets:
  state: true # its own vault dir, read-write at /state: the registered client and the token pair, refreshed here
services:
  run:
    glean-mcp:
      build: ./connections/glean-mcp
      tmp: 16m
      port: 8085
      egress: true
      links: [board] # the board's sign-in endpoints
      state: /state
      env:
        GLEAN_MCP_URL: "${settings.glean_mcp_url}"
        GLEAN_STATE_DIR: /state
        MCP_TOKEN_FILE: ${secrets.glean_service_key}
        MCP_READ_TOKEN_FILE: ${secrets.glean_mcp_read_token}
        # The board's sign-in endpoints: state, and starting or finishing a sign-in.
        GLEAN_AUTH_TOKEN_FILE: ${secrets.glean_auth_token}
generated_secrets:
  - glean_service_key
