# glean module: its compose services. Paths are relative to this module; scripts/compile.mjs makes them absolute.

services:
  glean-mcp:
    extends: { file: ../../compose.base.yaml, service: hardened }
    build: ./connections/glean-mcp
    image: aidenhq/glean-mcp:local
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      GLEAN_MCP_URL: "${GLEAN_MCP_URL:-}"
      GLEAN_STATE_DIR: /state
      MCP_TOKEN_FILE: /run/secrets/glean_mcp_token
      MCP_READ_TOKEN_FILE: /run/secrets/glean_mcp_read_token
      # The board's sign-in endpoints: state, and starting or finishing a sign-in.
      GLEAN_AUTH_TOKEN_FILE: /run/secrets/glean_auth_token
    volumes:
      # Read-write: the registered client and the token pair, refreshed here.
      - ${AIDENHQ_SECRETS_DIR}/glean:/state
    secrets:
      - glean_mcp_token
      - glean_auth_token
      - glean_mcp_read_token
    dns: [ 1.1.1.1, 8.8.8.8 ] # see paperclip
    ports:
      # Loopback only, for the runner's Engineer jobs on the host: /mcp/read with its own token.
      - "127.0.0.1:3126:8085"
    networks:
      - backplane
      - egress
secrets:
  glean_mcp_token:
    file: ${AIDENHQ_SECRETS_DIR}/glean_mcp_token
  glean_mcp_read_token:
    file: ${AIDENHQ_SECRETS_DIR}/glean_mcp_read_token
