# ci module: the self-hosted Actions runner. Profile `ci` keeps `docker compose up` from starting it: each
# aidenhq-ci-runner@[<org>-]<n> unit runs `docker compose run --rm ci-runner` (ops/ci-runner.sh), so every job gets a new container
# (nothing shared between jobs: no tool cache, no npm cache), which registers ephemerally, runs one job, exits and is removed.
# It gets only a one-hour registration token (RUNNER_TOKEN, minted on the host from the GitHub App): no host mounts, no
# docker socket, none of the instance's secrets, and a network that reaches the public Internet and, on the host, only the
# model gateway's CI listener (aidenhq-ci; 10.231.4.1:8201: CI tokens only, which a code-review job gets for its GitHub OIDC
# token: services/gateway/ci.mjs).

services:
  ci-runner:
    profiles: [ ci ]
    extends: { file: ../../compose.base.yaml, service: hardened }
    # The official runner image (actions/runner images/Dockerfile: git, curl, jq; setup-node fetches Node per job), less
    # what our jobs never run and what carries known vulnerabilities (runner/Dockerfile).
    build: ./runner
    image: aidenhq/ci-runner:local
    restart: "no"
    environment:
      RUNNER_URL: https://github.com/${settings.agents_org} # ops/ci-runner.sh sets another org's URL for @<org>-<n> units
      # Not a secret: where the template's code-review job trades its OIDC token for a CI token (unset = the repo secret).
      AIDENHQ_GATEWAY_URL: http://10.231.4.1:8201
    # $$: compose leaves $ to the shell. The token is dropped from the environment before any job runs.
    entrypoint:
      - bash
      - -c
      - |
        set -euo pipefail
        : "$${RUNNER_TOKEN:?no registration token (ops/ci-runner.sh mints it)}"
        ./config.sh --unattended --ephemeral --disableupdate --url "$$RUNNER_URL" --token "$$RUNNER_TOKEN" --name "aidenhq-$$(hostname)" --labels aidenhq --work _work
        unset RUNNER_TOKEN
        exec ./run.sh
    cpus: 2
    mem_limit: 4g
    pids_limit: 2048
    dns: [ 1.1.1.1, 8.8.8.8 ] # the host's resolver is off limits on aidenhq-ci
    networks:
      - ci

networks:
  ci:
    external: true
    name: aidenhq-ci
