# CI: tests, an automated code review and, when a PR could change the image, an image scan without a build, all on the
# org's self-hosted runners (one fresh container per job, no Docker).
# The job names `tests`, `code-review` and `image-scan` are the check names rubrics and reviews cite: don't rename them,
# don't add a matrix.
# code-review's model key: on AidenHQ's runners none (it spends through the instance's model gateway, below, which also
# names the review model and effort: settings.ci_review_model); elsewhere the secret OPENROUTER_API_KEY and the optional
# variable CI_REVIEW_MODEL (`<OpenRouter id>:<effort>`, default below).
# The review: codex with codex review's guidelines (.github/code-review.ts) from an empty directory with its shell off and
# read-only repo tools as its only tools. How hard it looks is the PR's risk tier (.github/tiers.ts, the classifier code review
# runs too): the whole PR (merge base to head) is classified by the repo's tier rules before anything else. The rules come from
# the instance's code review settings through the gateway's CI token answer (the repo's own, or the default rules when it has no
# entry); without the gateway (a repo on its own OpenRouter secret) the template's copy of the default rules applies. skip and
# trivial PRs are not reviewed (a delta still runs), standard ones at the model's effort, sensitive ones one effort higher; so
# does text addressed to a reviewer. By default a sensitive PR touches .github/, manifests, lockfiles, Dockerfiles, AGENTS.md or
# paths naming auth, security, tokens, sessions or permissions, has no substantive line, is large, or comes from an outsider.
# A repo's house rules for the reviewer are its REVIEW.md (read from the base commit).
name: ci

on:
  pull_request:
    # edited: a retarget (the base is a fact of the tier) re-classifies; an edit that changes nothing reuses the review.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Runs the PR's code, so it gets no secrets.
  tests:
    runs-on: [self-hosted, aidenhq]
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      # Bun, the package manager (bun.lock), pinned; no cache of its binary.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.5
          no-cache: true
      # The 7-day rule: everything is pinned, and what this PR adds or bumps (lockfile entries, images, actions, global
      # installs) is 7+ days old or a security exception in .github/supply-chain-exceptions.yaml. Before any install.
      # The checks come from the base commit, so a PR can't loosen its own check (the PR that adds them runs its
      # own copies); the exceptions file is the head's, so a fix and its exception land in one PR.
      - name: Supply chain
        run: |
          d="$RUNNER_TEMP/supply-chain"; mkdir -p "$d"
          for f in best-version pins npm-age; do
            git show "$BASE_SHA:.github/supply-chain/$f.ts" > "$d/$f.ts" 2>/dev/null || cp ".github/supply-chain/$f.ts" "$d/$f.ts"
          done
          status=0
          node "$d/npm-age.ts" "$BASE_SHA" "$HEAD_SHA" || status=1
          node "$d/pins.ts" "$BASE_SHA" "$HEAD_SHA" || status=1
          exit $status
      # .aidenhq/out/ holds an agent's evidence: screenshots and reports only, so nothing that runs can hide there. Its images
      # are left out of the code review (code-review.ts OUT_TYPES); its reports (json, txt) are reviewed like any file. No
      # app code may read from it: a tracked file outside .aidenhq/ that names it fails, except docs and the screenshot
      # tooling that writes there (e2e/, playwright.config.*). Changing this is a .github/ change, so sensitive. Read from the
      # PR's own ci.yml: a PR that edits it is reviewed at the higher effort anyway.
      - name: Evidence
        run: |
          bad=$(git diff --name-only --diff-filter=AMR "$BASE_SHA...$HEAD_SHA" -- .aidenhq/out | grep -viE '\.(png|jpe?g|webp|gif|json|txt)$' || true)
          [ -z "$bad" ] || { echo "::error::.aidenhq/out/ takes only screenshots and reports (png, jpg, webp, gif, json, txt): $(printf '%s' "$bad" | head -5 | tr '\n' ' ')"; exit 1; }
          refs=$(git grep -l -F '.aidenhq/out' "$HEAD_SHA" -- . ':(exclude).aidenhq/**' ':(exclude).github/**' ':(exclude,glob)**/*.md' ':(exclude)e2e/**' ':(exclude,glob)playwright.config.*' ':(exclude).gitignore' ':(exclude).dockerignore' | sed "s/^$HEAD_SHA://" || true)
          [ -z "$refs" ] || { echo "::error::app code may not read an agent's evidence in .aidenhq/out/ (it is not reviewed as code): $(printf '%s' "$refs" | head -5 | tr '\n' ' ')"; exit 1; }
      - name: Test
        run: bun install --frozen-lockfile --ignore-scripts && bun run --if-present lint && bun run test

  # Secret scan over the PR's new commits: the pinned, checksummed scanner binary (no licence key, no secrets used).
  # Fake test values go in a .gitleaks.toml by exact value; it is read from the base commit, so land it in its own PR.
  secrets:
    runs-on: [self-hosted, aidenhq]
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1 # released 2026-03-21
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb # gitleaks_8.30.1_linux_x64.tar.gz
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan
        run: |
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks
          # The config comes from the base, so a PR cannot allowlist its own findings (defaults if the base has none).
          git show "${BASE_SHA}:.gitleaks.toml" > "$RUNNER_TEMP/gl.toml" 2>/dev/null || printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gl.toml"
          ./gitleaks git --redact --exit-code 1 --config "$RUNNER_TEMP/gl.toml" --log-opts "${BASE_SHA}..${HEAD_SHA}" .

  # Which images the PR could change: each Dockerfile it changes, or whose directory gets a changed dependency manifest or
  # lockfile. Every one is listed, whatever its FROM: a FROM that can't be resolved fails the scan, never skips it. No build
  # here, so self-hosted.
  image-changes:
    runs-on: [self-hosted, aidenhq]
    timeout-minutes: 5
    outputs:
      dockerfiles: ${{ steps.find.outputs.dockerfiles }}
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: find
        run: |
          set -f # DOCKERFILES is split on spaces below, never globbed
          changed=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          found=""
          while IFS= read -r -d '' df; do
            # A path with whitespace would split in DOCKERFILES, one starting with - could pass for an option: refuse both.
            case "$df" in *[[:space:]]*|-*) echo "::error::Dockerfile path $(printf '%q' "$df") has whitespace or starts with -"; exit 1 ;; esac
            d=$(dirname "$df"); prefix=""; [ "$d" = . ] || prefix="$d/"
            while IFS= read -r f; do
              case "$f" in "$prefix"*) ;; *) continue ;; esac
              case "${f##*/}" in
                [Dd]ockerfile*|[Cc]ontainerfile*|*.dockerfile|.dockerignore|package.json|bun.lock|bunfig.toml|package-lock.json|npm-shrinkwrap.json|yarn.lock|pnpm-lock.yaml|requirements*.txt|poetry.lock|Pipfile.lock|uv.lock|go.mod|go.sum|Cargo.lock|Gemfile.lock)
                  found="$found $df"; break ;;
              esac
            done <<< "$changed"
          done < <(git ls-files -z | grep -izE '(^|/)(Dockerfile|Containerfile)[^/]*$|\.dockerfile$')
          echo "Images to scan:${found:- none}"
          echo "dockerfiles=${found# }" >> "$GITHUB_OUTPUT"

  # The `image-scan` check: for each image this change could alter, grype scans its directory (lock files, manifests) and
  # every base image its FROM and COPY --from lines name, pulled from the registry, and fails on a high or critical
  # vulnerability that has a fix. Nothing is built and no PR code runs (a build would run the PR's RUN steps on our
  # runner): .github/supply-chain/image-scan.ts reads each Dockerfile as text and passes grype only digest-pinned
  # references. Not covered: packages RUN steps install, so only base-image and lock-file changes are proven here. It is
  # the evidence for image and CVE work (Engineers have no Docker); skipped when no image could change. grype is baked
  # into AidenHQ's runner image, the security scanner's pin.
  image-scan:
    needs: image-changes
    if: needs.image-changes.outputs.dockerfiles != ''
    runs-on: [self-hosted, aidenhq]
    timeout-minutes: 30
    env:
      DOCKERFILES: ${{ needs.image-changes.outputs.dockerfiles }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Node 24 is in our runner image's tool cache (modules/ci/runner): found there, nothing is downloaded.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Scan (no build)
        run: |
          # The scanner and its exceptions come from the base commit, so a PR can't run its own code here or loosen its own
          # scan; a base without the scanner fails closed (image-scan.mjs: a base from before the scripts moved to TypeScript).
          { git show "$BASE_SHA:.github/supply-chain/image-scan.ts" || git show "$BASE_SHA:.github/supply-chain/image-scan.mjs"; } > "$RUNNER_TEMP/image-scan.ts" \
            || { echo "::error::the base commit has no .github/supply-chain/image-scan.ts: the PR that adds the scanner can't run it"; exit 1; }
          git show "$BASE_SHA:.github/image-scan-exceptions.yaml" > "$RUNNER_TEMP/exceptions.yaml" 2>/dev/null || : > "$RUNNER_TEMP/exceptions.yaml"
          mkdir -p "$RUNNER_TEMP/grype-db"
          # DOCKERFILES is split on spaces, never globbed (set -f); the find step refused any path with whitespace or a leading -, and
          # -- ends the options.
          set -f
          GRYPE_DB_CACHE_DIR="$RUNNER_TEMP/grype-db" node "$RUNNER_TEMP/image-scan.ts" --exceptions "$RUNNER_TEMP/exceptions.yaml" -- $DOCKERFILES

  # Never runs the PR's code: the reviewer only reads it (code-review.ts, review-tools.ts). Its scripts and rules come from
  # the base commit (reviewed code), so a PR can't loosen its own review; the gate comes from the default branch's current
  # tip, so a gate update protects every open PR at once. Only the PR that first adds CI (no gate on the default branch yet)
  # passes unreviewed; changes under .github/ get a human review anyway.
  code-review:
    runs-on: [self-hosted, aidenhq]
    timeout-minutes: 90 # a first review (up to 40 min) and a retry; the Review step stops retrying at 85
    permissions:
      contents: read
      pull-requests: write
      actions: read # Prior review: this workflow's earlier runs on the PR
      statuses: write # Record: the code-review/state status on a head that passed
      id-token: write # Review: GitHub's OIDC token for this job, traded at the model gateway for a CI token
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      # The PR's risk tier, before anything else: the reviewer's scripts (the base commit's), the codex-config refusal, the model
      # gateway's CI token with the tier rules, and the whole PR classified (codegenie-tier.ts). Its own step: the model key
      # goes to a file only the Review step reads, and the reviewer never gets GitHub's token.
      - name: Tier
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Off AidenHQ's runners: the model and effort (on them the gateway names both, settings.ci_review_model).
          CI_REVIEW_MODEL: ${{ vars.CI_REVIEW_MODEL || '~deepseek/deepseek-flash-latest:high' }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set +e
          # A step that ends before it records an outcome (its setup failed) is a run without a verdict: neutral, with its cause.
          trap 'grep -qE "^(CODEGENIE_EXIT|CODE_REVIEW_SKIPPED|REVIEW_TIER)=" "$GITHUB_ENV" || printf "REVIEW_STOP=1\nCODEGENIE_EXIT=3\nCODEGENIE_ATTEMPTS=0\nCODEGENIE_FAILURE=no-verdict\nCODEGENIE_CAUSE=the Tier step ended before it recorded a result\n" >> "$GITHUB_ENV"' EXIT
          gave_up() { # $1: cause. No review, permanent: the gate passes it as no verdict, naming the cause.
            echo "::error::$1"
            printf 'REVIEW_STOP=1\nCODEGENIE_EXIT=1\nCODEGENIE_ATTEMPTS=0\nCODEGENIE_FAILURE=permanent\nCODEGENIE_CAUSE=%s\n' "$1" >> "$GITHUB_ENV"
            exit 0
          }
          # A policy refusal, not a missing verdict: the gate blocks it (a prompt-injection guard). First of all, before any tier
          # shortcut, reuse, bootstrap or token failure, on the whole PR's paths: codex's own config, hooks, skills and instruction
          # overrides never belong in an app repo (the reviewer runs from an empty directory and loads none of them, but nothing
          # else should either). The path is a PR's text: one line only.
          git diff --name-only -z --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/changed-paths" || gave_up "Couldn't read the PR's changes."
          codexcfg=$(tr '\0' '\n' < "$RUNNER_TEMP/changed-paths" | grep -m1 -E '(^|/)\.codex/|(^|/)codex\.toml$|(^|/)AGENTS\.override\.md$' | tr -d '\r' | head -c 200)
          if [ -n "$codexcfg" ]; then
            echo "::error::The PR changes codex config ($codexcfg)"
            printf 'REVIEW_STOP=1\nCODEGENIE_EXIT=1\nCODEGENIE_ATTEMPTS=0\nCODEGENIE_FAILURE=policy\nCODEGENIE_CAUSE=%s\n' "The PR changes codex config ($codexcfg): .codex/, codex.toml and AGENTS.override.md don't belong in an app repo. Remove it." >> "$GITHUB_ENV"
            exit 0
          fi
          # The reviewer's scripts and the house rules (REVIEW.md): the base commit's. A base without them (an old or stacked base)
          # gets the default branch's, never a skip; only when the default branch has none either (the one PR that brings the
          # reviewer in) is the PR not reviewed, like the PR that first adds CI.
          scripts="code-review.ts review-tools.ts review-checklist.ts code-review-checklist.json tiers.ts codegenie-tier.ts codegenie-prior.ts"
          have() { for f in code-review.ts tiers.ts codegenie-tier.ts codegenie-prior.ts; do git cat-file -e "$1:.github/$f" 2>/dev/null || return 1; done; }
          rv=.github; ref="$BASE_SHA"
          if ! have "$BASE_SHA"; then
            if ! have "origin/$DEFAULT_BRANCH"; then
              printf 'REVIEW_STOP=1\nCODE_REVIEW_SKIPPED=1\n' >> "$GITHUB_ENV"
              # A repo that already has a reviewer is being upgraded to risk tiers: no trusted tier scripts exist to review this PR,
              # so the check fails loudly and a human reviews it (it edits .github/, which needs one anyway). A repo with none is
              # getting CI for the first time: nothing to fail.
              if git cat-file -e "$BASE_SHA:.github/code-review.ts" 2>/dev/null || git cat-file -e "origin/$DEFAULT_BRANCH:.github/code-review.ts" 2>/dev/null; then
                echo "::error::This PR upgrades the code review to risk tiers, so no trusted reviewer can review it: a human reviews it, then it merges past this check."
                exit 1
              fi
              echo "::notice::The default branch has no reviewer yet: this PR brings it in, so it is not reviewed."
              exit 0
            fi
            rv="$RUNNER_TEMP/reviewer"; ref="origin/$DEFAULT_BRANCH"; mkdir -p "$rv"
            for f in $scripts; do git show "$ref:.github/$f" > "$rv/$f" 2>/dev/null || rm -f "${rv:?}/${f:?}"; done
            echo "::notice::The base commit has no reviewer with risk tiers: the default branch's reviews it."
          fi
          : > "$RUNNER_TEMP/REVIEW.md"; git show "$ref:REVIEW.md" > "$RUNNER_TEMP/REVIEW.md" 2>/dev/null
          # The model key. On AidenHQ's runners (AIDENHQ_GATEWAY_URL, set on the runner container) the review spends through
          # the instance's model gateway: this job's GitHub OIDC token is traded there for a CI token bound to this repo and
          # PR, which may call only the review models, under the gateway's CI caps, into its cost ledger, with zero data
          # retention forced; the gateway holds the OpenRouter key and names the model and effort, and the repo's tier rules.
          # Without the gateway: the repo secret (its OpenRouter account must have zero data retention on) and the default
          # rules. A gateway refusal never falls back to it.
          model="${CI_REVIEW_MODEL%:*}"; effort="${CI_REVIEW_MODEL##*:}"
          [ "$effort" = "$CI_REVIEW_MODEL" ] && effort=high
          url=https://openrouter.ai/api/v1; key="${OPENROUTER_API_KEY:-}"
          unset OPENROUTER_API_KEY
          tiers=""
          if [ -n "${AIDENHQ_GATEWAY_URL:-}" ]; then
            oidc=$(curl -sSf -m 30 --retry 2 -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" "${ACTIONS_ID_TOKEN_REQUEST_URL:-}&audience=aidenhq-gateway" | jq -r '.value // empty') || oidc=""
            [ -n "$oidc" ] || gave_up "The model gateway gave no CI token: no GitHub OIDC token (the job needs id-token: write)."
            echo "::add-mask::$oidc"
            answer=$(curl -sS -m 30 --retry 2 --retry-connrefused -X POST -H "Authorization: Bearer $oidc" -H 'content-type: application/json' \
              -d "{\"head\":\"$HEAD_SHA\"}" "$AIDENHQ_GATEWAY_URL/ci/token") || answer=""
            key=$(printf '%s' "$answer" | jq -r '.token // empty' 2>/dev/null) || key=""
            [ -n "$key" ] || gave_up "The model gateway gave no CI token: $(printf '%s' "$answer" | jq -r '.error.message // empty' 2>/dev/null | head -c 300)"
            echo "::add-mask::$key"
            url="$AIDENHQ_GATEWAY_URL/api/v1"
            m=$(printf '%s' "$answer" | jq -r '.review.model // empty'); e=$(printf '%s' "$answer" | jq -r '.review.effort // empty')
            [[ "$m" =~ ^[A-Za-z0-9~._/-]{1,120}$ ]] && model="$m"
            [[ "$e" =~ ^(minimal|low|medium|high|xhigh)$ ]] && effort="$e"
            tiers="$RUNNER_TEMP/tiers.json"
            printf '%s' "$answer" | jq -c '.tiers // {}' > "$tiers" || gave_up "The model gateway's answer has no readable tier rules."
          fi
          # The tier: the whole PR (merge base to head) by the rules, the same function and facts code review uses.
          r=$(EFFORT="$effort" TIERS="$tiers" node "$rv/codegenie-tier.ts" 2> "$RUNNER_TEMP/tier.err") || gave_up "Couldn't classify the PR: $(head -c 300 "$RUNNER_TEMP/tier.err" | tr -d '\r\n')"
          tier=$(jq -r '.tier' <<< "$r"); why=$(jq -r '.why' <<< "$r" | tr -d '\r\n'); rule=$(jq -r '.rule' <<< "$r"); effort=$(jq -r '.effort' <<< "$r"); lines=$(jq -r '.lines' <<< "$r")
          [[ "$tier" =~ ^(skip|trivial|standard|sensitive)$ && "$rule" =~ ^-?[0-9]+$ && "$lines" =~ ^[0-9]+$ ]] || gave_up "Couldn't classify the PR: no tier."
          echo "Risk tier: $tier ($why); effort: $effort"
          # The key is needed only by a review: a PR the tier skips never asks for one.
          (umask 077; printf '%s' "$key" > "$RUNNER_TEMP/ci-key")
          printf 'RV=%s\nREVIEW_TIER=%s\nREVIEW_TIER_RULE=%s\nREVIEW_WHY=%s\nREVIEW_EFFORT=%s\nREVIEW_MODEL=%s\nREVIEW_URL=%s\nREVIEW_COUNTED_LINES=%s\n' \
            "$rv" "$tier" "$rule" "$why" "$effort" "$(printf '%s' "$model" | tr -d '\r\n')" "$url" "$lines" >> "$GITHUB_ENV"
      # Review only what changed since this PR's last green code review (codegenie-prior.ts, from the base commit; full
      # when it isn't there yet, or on any doubt): delta, reuse when the patch is the same (a stacked rebase onto a base that only moved forward, or the branch reopened as a new PR), or full.
      # A green review carries forward only at the same tier, model and an effort at least as high. Its own step, so the reviewer never gets the token.
      - name: Prior review
        if: ${{ env.REVIEW_STOP != '1' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          out=$(node "$RV/codegenie-prior.ts") || out=""
          read -r mode from n lines mb <<< "${out:-full - 0 0 -}"
          [[ "$mode $from" =~ ^((delta|reuse)\ [0-9a-f]{40}|full\ -)$ && "$n $lines" =~ ^[0-9]+\ [0-9]+$ ]] || { mode=full; from=-; n=0; lines=0; }
          [[ "$mb" =~ ^[0-9a-f]{40}$ ]] || mb=-
          echo "Review mode: $mode (from $from; $n deltas, $lines delta lines since the last full review)"
          printf 'REVIEW_MODE=%s\nREVIEW_FROM=%s\nREVIEW_N=%s\nREVIEW_LINES=%s\nREVIEW_MB=%s\n' "$mode" "$from" "$n" "$lines" "$mb" >> "$GITHUB_ENV"
      - name: Review
        if: ${{ env.REVIEW_STOP != '1' }}
        env:
          # The PR's request, given to the reviewer fenced as data (code-review.ts): through env, never the script text.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        # fetch-depth 0 fetched every branch, the PR's head included (app PRs come from branches of the same repo).
        run: |
          set +e
          # A step that ends before it records an outcome (its setup failed) is a run without a verdict: neutral, with its cause.
          trap 'grep -qE "^(CODEGENIE_EXIT|CODE_REVIEW_SKIPPED|CODE_REVIEW_DONE)=" "$GITHUB_ENV" || printf "CODEGENIE_EXIT=3\nCODEGENIE_ATTEMPTS=0\nCODEGENIE_FAILURE=no-verdict\nCODEGENIE_CAUSE=the Review step ended before it recorded a result\n" >> "$GITHUB_ENV"' EXIT
          if [ "${REVIEW_MODE:-}" = reuse ]; then
            echo "::notice::The PR's patch is the same as at its green review of $REVIEW_FROM: that verdict stands, no new review."
            echo "CODE_REVIEW_DONE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # skip and trivial PRs are not reviewed. Only a whole PR: a delta is always reviewed, or a big PR could skip its review
          # through small follow-up pushes.
          if [ "${REVIEW_MODE:-full}" = full ] && { [ "$REVIEW_TIER" = skip ] || [ "$REVIEW_TIER" = trivial ]; }; then
            echo "::notice::A $REVIEW_TIER change ($REVIEW_WHY): no code review needed."
            echo "CODE_REVIEW_SKIPPED=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # A delta reviews only the commits since the last green review; the reviewer's tools still read any file at the head.
          from="$BASE_SHA"
          [ "${REVIEW_MODE:-}" = delta ] && from="$REVIEW_FROM"
          key=$(cat "$RUNNER_TEMP/ci-key")
          gave_up() { # $1: cause. No review, permanent: the gate passes it as no verdict, naming the cause.
            echo "::error::$1"
            printf 'CODEGENIE_EXIT=1\nCODEGENIE_ATTEMPTS=0\nCODEGENIE_FAILURE=permanent\nCODEGENIE_CAUSE=%s\n' "$1" >> "$GITHUB_ENV"
            exit 0
          }
          # The reviewer and its TypeScript navigation, pinned (it reads the PR through review-tools.ts only: no shell, nothing
          # of the PR runs or is installed). Its scripts and the house rules (REVIEW.md) are the base commit's, like everything here.
          # The job's OIDC request credentials were spent in the Tier step: nothing after this point gets them. The packages run no
          # install scripts (none of these three has one; --ignore-scripts keeps it so).
          unset ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          [ -n "$key" ] || gave_up "No model key: neither AidenHQ's model gateway nor the OPENROUTER_API_KEY secret."
          npm i -g --ignore-scripts --no-audit --no-fund --loglevel=error @openai/codex@0.167.0 typescript-language-server@6.0.3 typescript@6.0.3 || gave_up "Couldn't install the reviewer (npm)."
          review() { # $1: minutes. Sets $code.
            CI_REVIEW_KEY="$key" CI_REVIEW_URL="$REVIEW_URL" MODEL="$REVIEW_MODEL" EFFORT="$REVIEW_EFFORT" TIER="$REVIEW_TIER" TIER_RULE="$REVIEW_TIER_RULE" \
              TRUSTED_BASE="$BASE_SHA" RULES="$RUNNER_TEMP/REVIEW.md" REVIEW_LSP="$(npm prefix -g)/bin/typescript-language-server" \
              REVIEW_MINUTES="$1" node "$RV/code-review.ts" "$from" "$HEAD_SHA" > "$RUNNER_TEMP/review.json"
            code=$?
          }
          # No verdict is neutral: the gate passes it with a comment (fail open, whatever the size). One retry after a provider
          # error (exit 1: HTTP 429 or 5xx, a provider quota 402, a dropped connection) or a run without a verdict (exit 3: a
          # timeout, an answer that isn't a review), when time is left; never after a refusal (exit 2: the gateway's 401-403 or
          # our own spend cap, which a retry can't fix).
          review 40
          attempts=1
          if [ "$code" = 1 ] || [ "$code" = 3 ]; then
            left=$(( (85 * 60 - SECONDS) / 60 - 1 ))
            if [ "$left" -ge 10 ]; then
              echo "::warning::The review gave no verdict: retrying in 60 seconds."
              # Findings the first attempt published still decide, whatever the retry did: merged into a retry that left a
              # readable result (its completion and coverage stand), else the first result is restored.
              cp "$RUNNER_TEMP/review.json" "$RUNNER_TEMP/review.1.json"; code1=$code
              sleep 60
              review $(( left < 40 ? left : 40 ))
              attempts=2
              pub='((.findings // []) + (.summaryOnlyFindings // [])) | length > 0'
              if jq -e "$pub" "$RUNNER_TEMP/review.1.json" >/dev/null 2>&1; then
                if jq -e '.findings | type == "array"' "$RUNNER_TEMP/review.json" >/dev/null 2>&1; then
                  jq -s '.[1] + { findings: (.[1].findings + (.[0].findings // [])), summaryOnlyFindings: ((.[1].summaryOnlyFindings // []) + (.[0].summaryOnlyFindings // [])) }' \
                    "$RUNNER_TEMP/review.1.json" "$RUNNER_TEMP/review.json" > "$RUNNER_TEMP/review.m.json" && mv "$RUNNER_TEMP/review.m.json" "$RUNNER_TEMP/review.json"
                else
                  cp "$RUNNER_TEMP/review.1.json" "$RUNNER_TEMP/review.json"; code=$code1
                fi
              fi
            fi
          fi
          printf 'CODEGENIE_EXIT=%s\nCODEGENIE_ATTEMPTS=%s\n' "$code" "$attempts" >> "$GITHUB_ENV"
          case "$code" in
            0) echo "CODE_REVIEW_DONE=1" >> "$GITHUB_ENV" ;;
            2) printf 'CODEGENIE_FAILURE=permanent\nCODEGENIE_CAUSE=the model gateway refused the review\n' >> "$GITHUB_ENV" ;;
            # The cause goes into a PR comment: a fixed class only; the detail is in this log (code-review.ts's stderr). The
            # gate prefers the review's own cause (a quota's rate-limit reason, our spend cap) when the run left one.
            1) printf 'CODEGENIE_FAILURE=transient\nCODEGENIE_CAUSE=a provider error\n' >> "$GITHUB_ENV" ;;
            *) printf "CODEGENIE_FAILURE=no-verdict\nCODEGENIE_CAUSE=no verdict (a timeout or an answer that isn't a review)\n" >> "$GITHUB_ENV" ;;
          esac
      - name: Verdict
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${CODE_REVIEW_SKIPPED:-}" = 1 ]; then
            echo "::notice::Not reviewed (${REVIEW_TIER:-no risk tier}), and it passes."; exit 0
          fi
          # The gate is the default branch's current tip, not this PR's recorded base: a merged gate update applies to
          # every open PR without a rebase, and a PR still can't weaken the gate it is checked against. Checkout removed
          # its credentials, so this fetch carries the read-only token itself.
          git -c http.extraHeader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" \
            fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git cat-file -e "origin/$DEFAULT_BRANCH:.github/codegenie-gate.ts" 2>/dev/null; then
            # The refusal holds without a gate to post it: nothing else here would fail the check.
            [ "${CODEGENIE_FAILURE:-}" = policy ] && { echo "::error::$CODEGENIE_CAUSE"; exit 1; }
            echo "::notice::No code-review gate on the default branch yet: this PR adds CI, so it is not reviewed."; exit 0
          fi
          git show "origin/$DEFAULT_BRANCH:.github/codegenie-gate.ts" > "$RUNNER_TEMP/codegenie-gate.ts"
          node "$RUNNER_TEMP/codegenie-gate.ts" "$RUNNER_TEMP/review.json" "${CODEGENIE_EXIT:-1}"
      # Only once the job has passed: what this head's review covered, for the next push's Prior review step. A commit
      # status, not a comment: only this workflow's token sets it, and it points at this run, which that step checks.
      # None after a partial review or a run without a verdict (its uncovered hunks must be reviewed again). Failing to set it costs only a full
      # review next time, never this verdict.
      - name: Record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "${CODE_REVIEW_DONE:-}" != 1 ] || [ "${CODE_REVIEW_PARTIAL:-}" = 1 ] || [ "${REVIEW_MB:--}" = - ]; then exit 0; fi
          curl -sSf -o /dev/null -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" \
            -d "{\"state\":\"success\",\"context\":\"code-review/state\",\"description\":\"$REVIEW_MODE n=$REVIEW_N lines=$REVIEW_LINES mb=$REVIEW_MB tier=$REVIEW_TIER model=$(printf '%s' "$REVIEW_MODEL" | sha256sum | cut -c1-8) effort=$REVIEW_EFFORT\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}" \
            || echo "::warning::Couldn't record this review for the next push: it will review the whole PR."
