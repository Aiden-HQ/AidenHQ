name: ci
description: "Self-hosted GitHub Actions runners (labels self-hosted, aidenhq) for the fleet org's app repos and any other org the owner's GitHub sign-in registers runners in (the product repo's): one fresh container per job."
# No agents and no connections: the runner service (compose.yaml) is started per job by the host's
# aidenhq-ci-runner@[<org>-]<n> units (ops/ci-runner.sh), never by `docker compose up`. modules/ci/README.md, "How it runs".
# The self-hosted Actions runner. on_demand: `docker compose up` never starts it; each aidenhq-ci-runner@[<org>-]<n> unit runs
# `docker compose run --rm ci-runner` (ops/ci-runner.sh), so every job gets a new container (nothing shared between jobs),
# which registers ephemerally, runs one job, exits and is removed. It gets only a one-hour registration token (RUNNER_TOKEN,
# minted on the host through the kernel's runner_token op): no host mounts, no docker socket, none of the instance's secrets, and the ops
# shell's network (aidenhq-ci: the public Internet and, on the host, only the model gateway's CI listener 10.231.4.1:8201).
services:
  run:
    ci-runner:
      # The official runner image, less what our jobs never run and what carries known vulnerabilities (runner/Dockerfile).
      build: ./runner
      on_demand: true
      user: image
      read_only: false
      egress: true
      env:
        # Who the job-started hook (runner/job-started.sh) serves: any repo of the fleet org, plus ci_runner_repos.
        AIDENHQ_FLEET_ORG: ${settings.github_fleet_org}
        AIDENHQ_CI_REPOS: ${settings.ci_runner_repos}
        # The runner group another org's runners (@<org>-<n> units) join; the fleet org's join its Default group.
        AIDENHQ_ORG_RUNNER_GROUP: ${settings.ci_org_runner_group}
        RUNNER_URL: https://github.com/${settings.github_fleet_org} # ops/ci-runner.sh sets another org's URL for @<org>-<n> units
        # Not a secret: where the template's code-review job trades its OIDC token for a CI token (unset = the repo secret).
        AIDENHQ_GATEWAY_URL: http://10.231.4.1:8201
        # The image prints the runner's own debug log to stdout, which the unit sends to the journal and syslog: ~2 million
        # lines a week filled /var/log (2026-11-18). The job's own output still reaches GitHub.
        ACTIONS_RUNNER_PRINT_LOG_TO_STDOUT: "0"
      # $$: compose leaves $ to the shell. The token is dropped from the environment before any job runs.
      entrypoint:
        - bash
        - -c
        - |
          set -euo pipefail
          : "$${RUNNER_TOKEN:?no registration token (ops/ci-runner.sh mints it)}"
          # Another org's runners join its runner group (only the repos it lists), never that org's Default (all repos).
          group=()
          if [ "$${RUNNER_URL,,}" != "https://github.com/$${AIDENHQ_FLEET_ORG,,}" ]; then
            group=(--runnergroup "$${AIDENHQ_ORG_RUNNER_GROUP:?set settings.ci_org_runner_group for $$RUNNER_URL (modules/ci/README.md, How it runs)}")
          fi
          ./config.sh --unattended --ephemeral --disableupdate --url "$$RUNNER_URL" --token "$$RUNNER_TOKEN" --name "aidenhq-$$(hostname)" --labels aidenhq --work _work "$${group[@]}"
          unset RUNNER_TOKEN
          # The job-started hook's allow list (runner/job-started.ts), from settings, then read-only and out of the env.
          printf '%s/*\n' "$$AIDENHQ_FLEET_ORG" > /opt/aidenhq/allowed
          # Only owner/name entries are written (quoted: a setting's value is never shell syntax).
          printf '%s\n' "$$AIDENHQ_CI_REPOS" | tr ' ' '\n' | grep -E '^[A-Za-z0-9._-]+/[A-Za-z0-9._-]+$' >> /opt/aidenhq/allowed || true
          chmod 0444 /opt/aidenhq/allowed
          unset AIDENHQ_FLEET_ORG AIDENHQ_CI_REPOS AIDENHQ_ORG_RUNNER_GROUP
          exec ./run.sh
      # No `tmp:` tmpfs: Docker mounts it noexec, and the product's tests write executable fakes (gh, codex, bwrap wrappers)
      # into /tmp and run them (every runner-unit failed on a self-hosted runner: the wrappers exited 126/127, `ip` EACCES).
      cpus: 4
      memory: 8g
      pids: 2048
# The runner registration token's source (ops/ci-runner.sh → ops/ci-runner-token.ts on the host): the kernel's
# POST /v1/codehost/runner_token with this module's own ci_token, run as the owner inside the github module (the owner's
# sign-in needs admin:org while this module is on). The fleet org's runners and the product repo's org's or another listed
# org's (@<org>-<n> units: a runner for any other org needs it in github_orgs, the owner's call); the runner gets only the
# one-hour registration token.
codehost:
  runner: { orgs: ["@agents", "@product", "@orgs"] }
settings:
  # Repositories outside the fleet org whose jobs the runners take (space-separated owner/name), from a push to the
  # default branch or a same-repo PR only (runner/job-started.ts). That org's runner group
  # (ci_org_runner_group) must also serve them (modules/ci/README.md, "How it runs").
  ci_runner_repos:
    title: Repos with CI runners
    default: "Aiden-HQ/AidenHQ Aiden-HQ/aidenhq-distro"
    pattern: '^[\w.-]+/[\w.-]+( [\w.-]+/[\w.-]+)*$'
  # The runner group (by name) that runners serving another org join, e.g. the product repo's org: create it there limited
  # to the repos above. Required for those units (they refuse to register without it); unused for the agents org.
  ci_org_runner_group:
    title: Runner group
    default: ""
  # The model and reasoning effort of the template's code review (codex review), `<OpenRouter id>:<effort>`: the gateway
  # hands it to the job with its CI token. Sensitive PRs (the repo's code review tier rules) and reviewer-addressed diffs run one effort higher (xhigh).
  ci_review_model:
    title: CI review model
    default: "~deepseek/deepseek-flash-latest:high"
    pattern: '^(openrouter/)?[~\w./-]+(:(minimal|low|medium|high|xhigh|max))?$'
  # Models a CI token may call besides ci_review_model: repos still on the older template (codegenie).
  ci_review_models:
    title: Other CI review models
    default: ["~deepseek/deepseek-flash-latest"] # codegenie's (roadmap-keeper until its codex copy PR lands)
# The host's runner registration (ops/ci-runner-token.ts) asks the kernel with it.
generated_secrets:
  - ci_token
