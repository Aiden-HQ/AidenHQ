name: ci
description: "Self-hosted GitHub Actions runners (labels self-hosted, aidenhq) for the agents org's app repos and any other org the App serves runners for (the product repo's): one fresh container per job."
# No agents and no connections: the runner service (compose.yaml) is started per job by the host's
# aidenhq-ci-runner@[<org>-]<n> units (ops/ci-runner.sh), never by `docker compose up`. docs/operations.md, "CI runners".
compose: compose.yaml
