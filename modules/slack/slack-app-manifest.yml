# The one source of the Slack app manifest. slack-live sends it to Slack (apps.manifest.create / update) from a pasted App
# Configuration Token on the board's Slack setup page (connections/slack-live/src/apps.ts):
#   basic     = everything here except `advanced`: the sign-in app (user scopes for search and history);
#   advanced  = basic with `advanced` merged on top (lists add): the same app plus the bot, Socket Mode and events.
# After editing, run `node scripts/slack-manifest.ts --write`: it writes connections/slack-live/src/manifests.json (a test fails
# while they differ). The bot is installed on the app's own Install page in Slack, never by an OAuth redirect: Slack refuses bot
# scopes on a PKCE app's localhost redirect (a desktop redirect) and takes server redirects only over https, which not every
# exposure mode has.
#
# The scopes are the live app's audit (2026-11-19): what the code calls, nothing else.
#   - basic, user token: Slack's MCP server reads for the person (search, history, names) plus the optional MCP reads
#     (emoji, files, canvases, lists, profiles, user groups, reactions), and slack-live's src_slack gap sync through slack-mcp
#     (users.list, users.conversations, conversations.history, .replies, .info). Acting as the person (chat:write, reactions:write, ...)
#     is opt-in: add those User Token Scopes by hand only when you want it (the module page says how).
#   - advanced, bot: DMs and posts (chat:write, chat:write.public), emoji acknowledgements (reactions:write), mentions and the
#     /aiden command, DMs to the bot (im:history, im:read) and opening the owner's DM with it (im:write: conversations.open
#     in slack-live main.ts), a bound channel's history for its agent (channels:history, groups:history, read by
#     slack_channel_context), and the channel membership events channel binding uses (channels:read, groups:read: Slack
#     requires them for member_joined_channel and channel_left; mpim:read too, which Slack marks required by the event
#     subscriptions).
#   - advanced, user token: summoning's reply and 👀 as the owner (chat:write, reactions:write; slack-live src/summon.ts). An
#     app connected before needs Connect again to hold them.
#   - advanced, events: the bot's mentions, DMs and channel membership; the person's own messages, live, for src_slack and triage, and their reactions (reaction_added, reaction_removed: the task emoji, for triage).
# Sign-in is PKCE with the board's loopback redirect (http://localhost:3121/slack/callback, the board's sign-in address:
# Slack accepts a localhost redirect when PKCE is on). The code exchanges with the client id and the code_verifier alone, so
# the app has no client secret to paste or protect; refresh needs none either.
# MCP access is on from the manifest (settings.is_mcp_enabled): no step in the app's Agents page.
# Token rotation stays off: the bot token (xoxb-) the listener holds must not rotate. Slack may still issue the person's user
# token as an expiring one; the oauth helper refreshes it (also without a secret).
display_information:
  name: AidenHQ
  description: Your AI chief of staff. Reads the Slack you can see; posts only as a labelled bot, or as you when you allow it.
  background_color: "#1a1a2e"

oauth_config:
  redirect_urls:
    - "http://localhost:3121/slack/callback" # the board's loopback sign-in callback (pasted back when the board is remote)
  pkce_enabled: true
  scopes:
    user:
      - search:read.public
      - search:read.private
      - search:read.im
      - search:read.mpim
      - search:read.users
      - search:read.files
      - channels:history
      - groups:history
      - im:history
      - mpim:history
      - channels:read
      - groups:read
      - im:read
      - mpim:read
      - users:read
      - users:read.email
      - users.profile:read
      - usergroups:read
      - emoji:read
      - files:read
      - canvases:read
      - lists:read
      - reactions:read

settings:
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
  is_mcp_enabled: true

advanced:
  features:
    bot_user:
      display_name: AidenHQ (AI)
      always_online: true
    slash_commands:
      - command: /aiden
        description: Assign this channel to an agent (owner only)
        usage_hint: assign-channel <agent-key> | unassign-channel | channels
        should_escape: false
    app_home:
      home_tab_enabled: false
      messages_tab_enabled: true
      messages_tab_read_only_enabled: false
  oauth_config:
    scopes:
      # Summoning acts as the owner: the reply (chat:write) and the 👀 acknowledgement (reactions:write), through slack-mcp's relay.
      user:
        - chat:write
        - reactions:write
      bot:
        - chat:write
        - chat:write.public
        - reactions:write
        - app_mentions:read
        - commands
        - im:history
        - im:read
        - im:write
        - channels:history
        - groups:history
        - channels:read
        - groups:read
        - mpim:read
  settings:
    socket_mode_enabled: true
    interactivity:
      is_enabled: true
    event_subscriptions:
      bot_events:
        - app_mention
        - message.im
        - member_joined_channel
        - channel_left
      user_events:
        - message.channels
        - message.groups
        - message.im
        - message.mpim
        - reaction_added
        - reaction_removed
