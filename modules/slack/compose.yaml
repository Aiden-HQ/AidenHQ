# slack module: its compose services. Paths are relative to this module; scripts/compile.mjs makes them absolute.

services:
  slack-mcp:
    extends: { file: ../../compose.base.yaml, service: hardened }
    build: ./connections/slack-mcp
    image: aidenhq/slack-mcp:local
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      SLACK_CLIENT_ID: "${SLACK_CLIENT_ID:-}"
      SLACK_TOKEN_FILE: /state/token.json
      MCP_TOKEN_FILE: /run/secrets/slack_service_key
      MCP_READ_TOKEN_FILE: /run/secrets/slack_mcp_read_token
    volumes:
      # Read-write: Slack rotates refresh tokens, so the newest pair must be persisted.
      - ${AIDENHQ_SECRETS_DIR}/slack:/state
    secrets:
      - slack_service_key
      - slack_mcp_read_token
    dns: [ 1.1.1.1, 8.8.8.8 ] # see paperclip
    ports:
      # Loopback only, for the runner's Engineer jobs on the host: /mcp/read with its own token, reads only.
      - "127.0.0.1:3125:8082"
    networks:
      - backplane
      - egress
secrets:
  slack_service_key:
    file: ${AIDENHQ_SECRETS_DIR}/slack_service_key
  slack_mcp_read_token:
    file: ${AIDENHQ_SECRETS_DIR}/slack_mcp_read_token
