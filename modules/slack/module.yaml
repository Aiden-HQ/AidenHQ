name: slack
description: "Slack, basic and advanced. Basic: sign in and agents read Slack as you through Slack's MCP server (search, read, drafts, reviewed sends). Advanced, with your own Slack app: the instance's bot and live listener (Socket Mode) that feeds triage and src_slack, the owner's Slack command channel as chat with Aiden, a transport for owner-channel's notify (Slack DMs to the owner), slack_post (the slack.post write kind) and channel binding (/aiden assign-channel: @mentions in a bound channel become the agent's tasks)."
replaces: [ channel-slack ] # an instance written for the two modules runs on this one: its tokens, data and grants carry over
requires:
  - warehouse # src_slack lives in the shared warehouse
  - board # its sign-in and setup flows
# Its sign-in on the board (the board's point, modules/board/schemas/signins.json), and its setup flow (setup_flows.json): two
# options side by side, the sign-in alone (basic) or with the bot (advanced). The Slack app is made or updated by slack-live from
# a pasted App Configuration Token (`app:`), from the one manifest in slack-app-manifest.yml.
contributes:
  board.signins:
    - { id: slack, label: Slack, status_url: "http://slack-mcp:8082/auth/status", connect_url: /slack/connect, callback: /slack/callback,
        missing: "The agents can't read Slack until it is.", stopped: "The agents can't read Slack." }
  board.setup_flows:
    - order: 30
      title: Slack
      label: Read Slack as you
      why: Agents search and read the Slack you can see, save drafts for you, and (if you allow it) post as you, each post reviewed first.
      effort: about 1 minute
      admin: a Slack workspace admin may need to approve the app
      capabilities:
        - search and read the Slack you can see
        - drafts, and reviewed posts as you when you allow it
      secrets: [ slack_client_id ]
      signin: slack
      app:
        url: http://slack-live:8089/setup/app
        label: App Configuration Token
        pattern: '^xoxe\.xoxp-[A-Za-z0-9-]{20,400}$'
        console_url: https://api.slack.com/apps
        help: "Open [Your Apps](https://api.slack.com/apps) in Slack. Under **Your App Configuration Tokens**, press **Generate Token**, pick your workspace and copy the **Access Token** (it starts xoxe.xoxp-). It lasts 12 hours; AidenHQ uses it once to make your app and keeps nothing."
      steps: |
        On Connect you pick which permissions to grant: the reads are pre-selected. Agents act as you, so they see only what you can see. To let them act as you too (every post, reaction or change is reviewed first), add the **User Token Scopes** you want under **OAuth & Permissions** in your app (`chat:write`, `reactions:write`, `channels:write`, `groups:write`, `im:write`, `mpim:write`, `files:write`, `canvases:write`, `lists:write`) and Connect again.
    - order: 31
      mode: advanced
      title: Slack with Aiden's bot
      why: Everything on the left, plus a bot of your own app's that you DM, and live Slack events. The bot is always your own app's.
      effort: about 5 minutes
      admin: a Slack workspace admin may need to approve the app
      capabilities:
        - DM Aiden; approvals and alerts as Slack messages
        - Slack triage and 📌 tasks (Intake)
        - live events for the src_slack warehouse
        - "/aiden assign-channel: a channel's @mentions become an agent's tasks"
      secrets: [ slack_live_bot_token, slack_live_app_token ]
      pair_url: http://slack-live:8089/pair
      steps: |
        1. [Open your app's Install page]({app_url}/install-on-team), press **Install to Workspace** (or **Reinstall**), then **Allow**. A workspace admin may need to approve it.
        2. [Open OAuth & Permissions]({app_url}/oauth), copy the **Bot User OAuth Token** (it starts xoxb-) and paste it here.
        3. [Open Basic Information]({app_url}/general), scroll to **App-Level Tokens**, press **Generate Token and Scopes**, add the scope `connections:write`, press **Generate** and paste the token (it starts xapp-) here. Slack has no API that makes this token, so it is the one copy by hand.
        4. The bot's `@handle` is fixed when the app is first installed: this app is named after this instance, so it won't collide with another AidenHQ bot in the same workspace. Renaming it later changes only the label, not the handle.
  # Its schema and the views agents read with source_new (the warehouse's point, modules/warehouse/schemas/sources.json).
  warehouse.sources:
    - schema: src_slack
      about: "src_slack.messages / threads / changes / users"
      identity: users
      views:
        - { name: messages, time: ingested_at, channel: channel_id, tsv: true }
        - { name: threads, time: ingested_at, channel: channel_id }
        - { name: changes, time: observed_at, channel: channel_id }
# A channel (channel@1): what the owner writes in their command channel is posted as theirs (stamped [slack]). As a transport,
# the kernel sends it owner-channel's messages one at a time (transport: below), with this module's own token.
privileged: [ speaks-as-owner ]
# kernel.events: slack-live sends each kept Slack event to the kernel's event router (POST /v1/events) with this module's own token.
# kernel.attest-owner: it marks which of those messages the owner wrote (from_owner), so the owner's `cc <teammate>` summons one.
roles:
  requests: [ kernel.events, kernel.attest-owner ]
# The kernel's calls for a summoned conversation (kernel/src/summon.ts): its recent messages, a reply as the owner, the 👀 reaction.
summon:
  connection: slack
  url: http://slack-live:8089/summon
  auth: slack_live_service_key
providers:
  channel:
    transport: http://slack-live:8089/transport/send
  # The kernel calls slack.post's plan, execute and status here, with the connection's key (executor@1).
  executor:
    url: http://slack-live:8089/aidenhq/v1/executor
    auth: slack_live_service_key
connections:
  slack:
    setup: "Open its setup on the board (#/setup/slack): choose your organisation's app or paste an App Configuration Token to make yours, then press Connect."
    guide: "Slack directly: a full thread or channel history, exact messages and their timestamps, the newest messages Glean hasn't indexed yet. Search Glean first to find where to look."
    url: http://slack-mcp:8082/mcp
    auth: slack_service_key
    # Every tool Slack's server lists (probed 2026-11-18). Reads added since the first eight are `named`: only a grant naming
    # them reaches them. The draft tool is the one plain write. Everything else acts in Slack as the owner (posting,
    # scheduling, reacting, opening conversations, canvases, lists, file uploads): `destructive`, so only a grant naming one
    # reaches it and every call is a record the AI reviewer decides first. Slack refuses whatever the sign-in's scopes lack.
    tools:
      read: [ slack_search_public, slack_search_public_and_private, slack_search_channels, slack_search_users, slack_read_channel, slack_read_thread, slack_read_user_profile, slack_list_user_channels,
              slack_read_canvas, slack_list_channel_members, slack_read_file, slack_read_list, slack_search_emojis, slack_get_reactions ]
      named: [ slack_read_canvas, slack_list_channel_members, slack_read_file, slack_read_list, slack_search_emojis, slack_get_reactions ]
      write: [ slack_send_message_draft ]
      destructive: [ slack_send_message, slack_schedule_message, slack_add_reaction, slack_create_conversation, slack_create_list, slack_update_list, slack_add_list_record, slack_update_list_record, slack_create_canvas, slack_update_canvas, slack_get_file_upload_url, slack_complete_file_upload ]
    # Routines' events (kernel events.ts), from the live listener (advanced mode): a routine subscribes to a channel its agent's
    # slack_read_channel reaches.
    events: { resource: "channel id", kinds: [ message, app_mention, reaction_added, reaction_removed ], filter: [ kind, author, contains, bot ], reads: [ slack_read_channel ] }
  slack_live:
    setup: "Set it up on the board (#/setup/slack, Slack with Aiden's bot): make or update the app from an App Configuration Token, install it, paste its two tokens, then DM the bot the pairing code. The app's manifest: slack-app-manifest.yml."
    url: http://slack-live:8089/mcp
    auth: slack_live_service_key
    tools:
      # slack_channel_context: a bound channel's history and threads, for the agent it is bound to only (bind.ts).
      read: [ slack_owner, slack_channel_context ]
      # slack_post: filed as slack.post; granted per agent.
      write: [ slack_post, channel_memory ]
# Every agent post is a kernel record the AI reviewer reads first; a channel outside slack_post_channels is the owner's too.
writes:
  post:
    args: schemas/post.json
    floor: 1
    tools: [ slack_post ]
    card:
      sentence: "Post as {{agent}} (AI agent) in {{where}}."
      changes: "A new Slack message from the instance's bot in {{where}}, which everyone in that channel sees."
      reads: "Nothing new: the message below."
      cost: "No model cost."
      details: "{{text}}"
  # channel_memory: the bound agent's note about its channel (memory.ts). Tier 1: the AI reviewer reads it for private or secret
  # content; the module's plan allows it only from a thread task of that same channel.
  memory:
    args: schemas/memory.json
    floor: 1
    tools: [ channel_memory ]
    card:
      sentence: "Update the note {{agent}} keeps about {{channel}}."
      changes: "Replaces the short note the agent reads whenever it works on that channel."
      reads: "Nothing new: the note below."
      cost: "No model cost."
      details: "{{note}}"
  # /aiden assign-channel and unassign-channel (the owner's own command, checked against the paired owner): the module files it
  # itself, Tier 0 (a record, nothing to approve); no agent tool maps to it, so no agent can bind a channel.
  bind:
    args: schemas/bind.json
    floor: 0
    tools: []
    card:
      sentence: "{{summary}}."
      changes: "Sets which agent the channel's @mentions wake."
      reads: "Nothing."
      cost: "No model cost."
# One Slack thread is one task for the bound agent; its text is fenced data. Grant the agent `slack_live: [slack_channel_context, slack_post, channel_memory]`.
prompts:
  - { id: slack-threads, file: prompts/slack-threads.md, when: { tools: [ slack_live.slack_channel_context ] } }
settings:
  # Slack channel ids agents may post to at the AI reviewer's word (an agent still needs slack_post granted); any other
  # channel needs the owner's approval too.
  slack_post_channels:
    title: Channels agents may post in
    default: []
    pattern: '^[CG][A-Z0-9]+$'
# Runner jobs of an Engineer, through the model gateway with their own token (scripts/modules.ts jobcapEntries).
jobcaps:
  - { id: slack-read, connection: slack, tools: read, read_url: "http://slack-mcp:8082/mcp/read", read_secret: slack_mcp_read_token }
secrets:
  state: true # its own vault dir, read-write at /state: Slack rotates refresh tokens, so the newest pair is kept
  provided:
    # The Slack app's client id (public), saved by the setup flow; empty: Slack is off. The sign-in is PKCE: no client secret exists.
    - name: slack_client_id
      setup:
        label: Slack app Client ID
        pattern: '^[0-9]{6,20}\.[0-9]{6,20}$'
        help: "From the app's Basic Information page: two numbers with a dot between them."
        public_client: true # a client ID is public: an organisation may list its internal app's (PKCE, no secret exists)
    # The advanced part's tokens: asked for on its flow above.
    - name: slack_live_app_token
      setup:
        label: Slack app-level token
        pattern: '^xapp-[A-Za-z0-9-]{20,300}$'
        help: "Basic Information, App-Level Tokens, scope connections:write (starts xapp-)."
    - name: slack_live_bot_token
      setup:
        label: Slack bot token
        pattern: '^xoxb-[A-Za-z0-9-]{20,300}$'
        help: "OAuth & Permissions, Bot User OAuth Token (starts xoxb-)."
optional_secrets:
  - slack_client_id
  - slack_live_app_token
  - slack_live_bot_token
services:
  data: true
  run:
    slack-mcp:
      build: ./connections/slack-mcp
      tmp: 16m
      port: 8082
      egress: true
      links: [board] # the board's connection health check
      state: /state
      env:
        SLACK_CLIENT_ID_FILE: ${secrets.slack_client_id}
        SLACK_CLIENT_ID: "${SLACK_CLIENT_ID:-}"
        BOARD_URL: "${BOARD_LAN_URL:-}"
        # The board's sign-in endpoints: state, and starting or finishing a sign-in.
        SLACK_AUTH_TOKEN_FILE: ${secrets.slack_auth_token}
        MCP_TOKEN_FILE: ${secrets.slack_service_key}
        MCP_READ_TOKEN_FILE: ${secrets.slack_mcp_read_token}
        # The read endpoint serves only these: the connection's read tags (CI checks they match).
        # slack-live's key to the sign-in's relay (src/relay.ts): whose sign-in it is, and the gap sync's reads as the owner.
        RELAY_KEY_FILE: ${secrets.slack_relay_key}
        READ_TOOLS: "slack_search_public,slack_search_public_and_private,slack_search_channels,slack_search_users,slack_read_channel,slack_read_thread,slack_read_user_profile,slack_list_user_channels,slack_read_canvas,slack_list_channel_members,slack_read_file,slack_read_list,slack_search_emojis,slack_get_reactions"
    # The advanced part: the one Socket Mode consumer of the instance's Slack app. It idles until its tokens are saved.
    slack-live:
      build: ./connections/slack-live
      tmp: 16m
      egress: true
      # src_slack: the warehouse (the shared-sources network). Until 3g.
      links: [ sources ]
      data: ["slack-live:/data"]
      env:
        SLACK_LIVE_DB: /data/slack-live.sqlite
        # Whose Slack words count and who gets paged is the paired owner (state in /data).
        SLACK_POST_CHANNELS: "${settings.slack_post_channels}"
        INSTANCE_NAME: "${settings.instance_name}"
        OWNER_NAME: "${settings.owner_name}"
        # The board's https address (this module's setup flows send the owner here): in-app `#/route` links in a message
        # resolve against it, since Slack cannot open a bare `#/` route.
        BOARD_LAN_URL: "${BOARD_LAN_URL:-}"
        MCP_BEARER_TOKEN_FILE: ${secrets.slack_live_service_key}
        # The kernel's bearer on /transport/send: this module's own token.
        CHANNEL_TOKEN_FILE: ${secrets.slack_token}
        PAIR_TOKEN_FILE: ${secrets.slack_pair_token}
        SLACK_APP_TOKEN_FILE: ${secrets.slack_live_app_token}
        SLACK_BOT_TOKEN_FILE: ${secrets.slack_live_bot_token}
        # Shared sources (src_slack): its warehouse login; the gap sync reads as the owner through slack-mcp's relay.
        WAREHOUSE_PASSWORD_FILE: ${secrets.warehouse_src_slack_password}
        RELAY_KEY_FILE: ${secrets.slack_relay_key}
# The board's Connect/Reconnect for Slack: its sign-in token, only while this module is on.
board_env:
  SLACK_AUTH_TOKEN_FILE: ${secrets.slack_auth_token}
generated_secrets:
  - slack_service_key
  - slack_auth_token
  - slack_live_service_key
  - slack_token
  # slack-live's key to slack-mcp's relay of the owner's sign-in (whose it is; the gap sync's reads).
  - slack_relay_key
  # src_slack's warehouse login (ops/warehouse-sources.sh gives the role this password).
  - warehouse_src_slack_password
data_version: 0 # its data dir's format: bumped by each forward-only migration (docs/configuration.md)
