name: code-review
description: "Code Review: reviews pull requests on the repos you list, or one PR on request. Each moment (a PR opens, each push) runs a list of combos (engine: Codex, Claude Code or Codegenie; model; effort) in a credential-free box; each combo posts its own GitHub review, a write the AI reviewer approves, and its cost and findings are kept for later analysis. Idle until a repo is added: nothing runs or spends by itself."
license: MIT
# Design: docs/design/code-review.md. The state service (service/) watches the listed repos' PRs and comments through github-mcp's
# internal read (as this module, never /mcp), decides which head gets which combos (triggers, `@aiden review …` from someone with
# write access now, debounce, supersede, a run starts only while the day's real spend is under its caps), runs each review as the kernel's
# check job `code-review` (kernel.checks: no credentials in the box, a model token capped at the run's run_usd), hands the
# finished review to the github module's poster (a kernel write record) and records each run as flow facts on its PR.
requires:
  - github # PR reads (github-mcp) and the poster
roles:
  # kernel.tasks: one task per reviewed PR for the Reviewer Manager (role reviewer-manager), where its posts' approvals land.
  requests: [ kernel.checks, kernel.facts, kernel.tasks, kernel.settings ]
  declares:
    - { id: reviewer-manager, description: "Holds each reviewed PR's task (fixed text: repo and number), where code review's posts are approved; the Reviewer Manager agent." }
# A review run's snapshot of repo@head (and its base), read under this grant: any repo the owner's GitHub sign-in reaches.
codehost:
  snapshot: { repos: [ "*/*" ] }
# The review run: a credential-free check job per PR head (kernel/src/checkjobs.ts), the recipe in recipe/. The state service asks
# POST /v1/checks {repo, head, run: code-review, spec} (service/src/adapters.ts checkSpec): base is the merge base (a full review's
# incremental_from is that base too), the combo (engine, model, effort) with the repo's ignore globs and max_nits in combo, budget_usd
# is the run's run_usd less earlier attempts' spend (its model token's cap), previous the PR's still-open findings to recheck. It reads back GET /v1/checks/:id
# with `result` (the Review JSON, bound into the receipt, stamped with the ledger's cost_usd and tokens) and `billed_usd` (a running check's spend so far too).
check_jobs:
  code-review:
    dir: recipe
    argv: [ node, /aidenhq-out/recipe/review.ts ]
    timeout_min: 45
    title: the code review
    spec: { base: sha, incremental_from: sha, pr: int, combo: json, focus: text, budget_usd: usd, previous: json }
    model: { max_usd: 25 }
    result: true
# Flow (docs/design/flow.md): one started and one ended fact per review run (version: the run id) on its PR.
facts:
  review.started: { subject: pr }
  review.ended: { subject: pr }
stages:
  - { name: review, label: Code review, from: review.started, to: review.ended }
settings:
  # repos: [{ repo: owner/name, on_open: [combo], on_push: [combo], drafts: false, forks: manual|auto, day_usd: 200, ignore: [globs],
  # max_nits: 5, mandatory: false }]. mandatory: code review is a required merge step for this repo (nothing enforces it as a
  # merge gate yet: a later change does; today it is read by ai_review_code's unless_code_review_mandatory). A combo is { engine: codex|claude-code|codegenie|codex-native, model (an OpenRouter
  # id), effort (the engine's: codex and codex-native minimal-xhigh, the others low-max), run_usd (what one run may spend: its model token's hard
  # cap, not a reservation; default $5 for each engine) }; each moment runs every combo it lists (at most 4, each its
  # own review), [] none. on_push reviews only the new changes. day_usd: the instance-wide cap across repos, a UTC day's real spend (a run starts while spent is under it; runs in flight may overshoot by their run_usd each, bounded by the launcher's computers_max; a run whose spend can't be read counts at its whole run_usd). Read by the service
  # (service/src/config.ts).
  code_review:
    type: object
    writers: [ reviewer-manager ]
    # What the Reviewer Manager's change may not do without the owner (Tier 2; it reads strangers' review threads): more spend,
    # outside PRs or drafts reviewed by themselves, a repo in an org not watched before, any change to a moment's combos (another
    # engine or model, more run cap, one more combo: what changes what a review costs or how it judges), or a repo's ignore globs
    # (what would quietly weaken reviews).
    owner:
      - { path: day_usd, raise: true }
      - { path: "repos.*.day_usd", raise: true, default: 200 }
      - { path: "repos.*.forks", to: auto, default: manual }
      - { path: "repos.*.drafts", to: true, default: false }
      - { path: "repos.*.repo", new: true, before: "/" }
      - { path: "repos.*.on_open", change: true, default: [ { engine: codex, model: "~deepseek/deepseek-flash-latest", effort: medium, run_usd: 5 } ] }
      - { path: "repos.*.on_push", change: true, default: [ { engine: codex, model: "~deepseek/deepseek-flash-latest", effort: low, run_usd: 5 } ] }
      - { path: "repos.*.ignore", change: true, default: [] }
      - { path: "repos.*.mandatory", to: true, default: false }
    default:
      repos: []
      day_usd: 200
  # Seconds between the service's looks at the watched repos.
  code_review_poll_seconds: { default: 60 }
# The Reviewer Manager (agents/reviewer-manager/AGENTS.md): conversation only. It reads strangers' review threads, so it holds no
# code tools and no delegation, and what its settings changes may do alone is bounded by settings.code_review.owner above. Aiden
# (the chief of staff) delegates code review asks to it; no heartbeat, no schedule: it runs only when a task asks.
agents:
  reviewer-manager:
    department: engineering
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: high
    timeout_sec: 900
    caps: { run_usd: 1, task_usd: 3, day_usd: 10 }
    # Strangers' text in (review threads), so no web out.
    web_search: disabled
    connections:
      apps: [ app_view ]
      code_review: [ code_review_config, code_review_runs, code_review_run, code_review_configure ]
      # A PR's review threads (replies to its findings) and one comment answering an `@aiden` question, as the posting identity's
      # write: a kernel record the AI reviewer decides.
      github: [ github_pr_threads, github_issue_comment ]
      paperclip_tasks: [ task_current, task_get, task_comments, task_comment, task_block, task_cancel, task_finish ]
    roles: [ reviewer-manager ]
# Its tools (service/src/config-tool.ts), served by the state service; each call's assertion gates it to the reviewer-manager role.
connections:
  code_review:
    setup: "Built in: nothing to connect."
    url: http://code-review:8098/mcp
    auth: code_review_service_key
    returns: untrusted
    tools:
      read: [ code_review_config, code_review_runs ]
      write: [ code_review_run, code_review_configure ]
# Posting: this service files a record per post and per acknowledgement and executes it (executor@1) through github-mcp's
# /internal/review routes (the github module's poster: App where installed with PR write, else the owner's sign-in). A post is
# Tier 1 (the AI reviewer reads the whole rendered review first); a notice is Tier 0 (fixed words: phase and reason only). Plan
# refuses a record this service didn't file for one of its runs.
providers:
  board: { url: "http://code-review:8098", auth: code_review_api_token }
  executor:
    url: http://code-review:8098/aidenhq/v1/executor
    auth: code_review_service_key
writes:
  post:
    args: schemas/post.json
    floor: 1
    tools: []
    card: { target: "{{target}}", sentence: "{{sentence}}", changes: "{{changes}}", details: "{{details}}" }
  notice:
    args: schemas/notice.json
    floor: 0
    tools: []
    card: { target: "{{target}}", sentence: "{{sentence}}", changes: "{{changes}}", details: "{{details}}" }
services:
  data: true
  run:
    code-review:
      build: ./service
      tmp: 16m
      port: 8098
      egress: true # the kernel's listener is a host address
      join: [github] # github-mcp's internal PR read
      data: ["reviews:/data"]
      env:
        CODE_REVIEW_DB: /data/code-review.sqlite
        CODE_REVIEW_SETTINGS: "${settings.code_review}"
        CODE_REVIEW_POLL_SECONDS: "${settings.code_review_poll_seconds}"
        CODE_REVIEW_TOKEN_FILE: ${secrets.code_review_token}
        CODE_REVIEW_API_TOKEN_FILE: ${secrets.code_review_api_token}
        CODE_REVIEW_SERVICE_KEY_FILE: ${secrets.code_review_service_key}
        AIDENHQ_KERNEL_URL: http://10.231.0.1:3130
generated_secrets:
  - code_review_token
  - code_review_api_token
  - code_review_service_key
data_version: 1 # its data dir's format: bumped by each forward-only migration (docs/configuration.md)
