name: code-review
description: "Code Review: reviews pull requests on the repos you list, or one PR on request, and reviews a whole repository at a commit on request. Each moment (a PR opens, each push) runs a list of combos (engine: Codex, Claude Code or Codegenie; model; effort) in a credential-free box; each combo posts its own GitHub review, a write the AI reviewer approves, and its cost and findings are kept for later analysis. A repo review runs the ready-made options you pick (tools, upstream skills, deepsec) and publishes a report to Primer, private to you. Idle until a repo is added or a review is asked for: nothing runs or spends by itself."
license: MIT
# Design: docs/design/code-review.md. The state service (service/) watches the listed repos' PRs and comments through github-mcp's
# internal read (as this module, never /mcp), decides which head gets which combos (triggers, `aiden review …` from someone with
# write access now, debounce, supersede), runs each review as the kernel's
# check job `code-review` (kernel.checks: no credentials in the box, a model token, bounded only by the install's spend limit), hands the
# finished review to the github module's poster (a kernel write record) and records each run as flow facts on its PR.
requires:
  - github # PR reads (github-mcp) and the poster
roles:
  # kernel.tasks: one task per reviewed PR for the Reviewer Manager (role reviewer-manager), where its posts' approvals land.
  # kernel.wake, kernel.owner-notice: a one-off ask's one summary, as a wake notice on the task that asked for it (its agent
  # hears it) or, for an ask from the board with no task, as one alert to the owner.
  requests: [ kernel.checks, kernel.facts, kernel.tasks, kernel.settings, kernel.wake, kernel.owner-notice ]
  declares:
    - { id: reviewer-manager, description: "Holds each reviewed PR's task (fixed text: repo and number), where code review's posts are approved; the Reviewer Manager agent." }
# A review run's snapshot of repo@head (and its base), read under this grant: any repo the owner's GitHub sign-in reaches.
codehost:
  snapshot: { repos: [ "*/*" ] }
  # A repo review's deepsec setup PR (POST /v1/codehost/setup): deepsec's own set-up files on a new aidenhq/setup-<sha> branch, off
  # the default branch's head; github files and reviews its own Tier 1 write for it. Only these paths.
  setup:
    repos: [ "*/*" ]
    paths: [ .deepsec/deepsec.config.ts, .deepsec/generated-matchers.ts, .deepsec/package.json, .deepsec/package-lock.json, .deepsec/pnpm-lock.yaml, .deepsec/yarn.lock, ".deepsec/data/*/INFO.md" ]
# The review run: a credential-free check job per PR head (kernel/src/checkjobs.ts), the recipe in recipe/. The state service asks
# POST /v1/checks {repo, head, run: code-review, spec} (service/src/adapters.ts checkSpec): base is the merge base (a full review's
# incremental_from is that base too), the combo (engine, model, effort) with the repo's ignore globs and max_nits in combo, previous
# the PR's still-open findings to recheck (shared over previous, previous_b … previous_f, 16 KB each) (and that the finders take as already reported, and the answered ones whose claim it
# checks for an unsafe fix). It reads back GET /v1/checks/:id
# with `result` (the Review JSON, bound into the receipt, stamped with the ledger's cost_usd
# and tokens) and `billed_usd` (a running check's spend so far too).
check_jobs:
  code-review:
    dir: recipe
    argv: [ node, /aidenhq-out/recipe/review.ts ]
    timeout_min: 180
    title: the code review
    # target: pr, or tree (a whole repo at head: pr is empty and base is the head); option and lens: a catalog option's (empty
    # for a combo); setup_files: a pending deepsec setup branch's files ({} for none).
    spec: { base: sha, run: text, incremental_from: sha, pr: text, target: text, option: text, lens: text, setup_files: json, combo: json, focus: text, previous: json, previous_b: json, previous_c: json, previous_d: json, previous_e: json, previous_f: json, intent: text }
    model: true
    result: true
  # The selected tool options of the option catalog (catalog.json), run token-free over one commit (recipe/tools.ts): `options` is
  # the JSON object recipe/catalog.ts toolSpec builds, `base` the commit itself (a whole tree only, for now). No model.
  code-review-tools:
    dir: recipe
    argv: [ node, /aidenhq-out/recipe/tools.ts ]
    timeout_min: 180
    title: the code review tools
    spec: { base: sha, options: json, run: text }
    result: true
# Flow (docs/design/flow.md): one started and one ended fact per review run (version: the run id) on its PR.
facts:
  review.started: { subject: pr }
  review.ended: { subject: pr }
stages:
  - { name: review, label: Code review, from: review.started, to: review.ended }
settings:
  # repos: [{ repo: owner/name, on_open: [combo], on_push: [combo], push_rounds: 1, drafts: false, forks: manual|auto,
  # ignore: [globs], max_nits: 5 }]. A combo is { engine: codex|claude-code|codegenie|codex-native, model (an OpenRouter
  # id), effort (the engine's: codex and codex-native minimal-xhigh, the others low-max), mandatory (default false) }; each moment runs every combo it lists (at most 4, each its
  # own review), [] none. A mandatory combo's review gates the repo's merges: the github module's merge queue merges a PR only
  # once the mandatory combos reviewed its head and none of their important findings is open (fixed, answered on its thread by the
  # PR's author or a writer, or by an agent's code_review_resolve call: fixed, disputed, by design or won't fix with a reason, each closing it at once, or dismissed by the owner on the board); a gated repo has one in on_open, and on_push's is optional (without one, the PR's opening review stands for every later head: the findings still open decide); its mandatory runs are never
  # skipped and review forks by themselves. push_rounds (default 1; null: every push) is how many pushes of a PR get an on_push
  # review; once a PR has had them, later heads get none and are gated as without a mandatory on_push. ai_review_code's unless_code_review_mandatory reads the same repos. on_push reviews only the new changes. Read by the service
  # (service/src/config.ts).
  code_review:
    type: object
    writers: [ reviewer-manager ]
    # What the Reviewer Manager's change may not do without the owner (Tier 2; it reads strangers' review threads): outside PRs
    # or drafts reviewed by themselves, a repo in an org not watched before, a combo's engine, model or effort changed or one more
    # combo (what changes what a review costs or how it judges), a mandatory reviewer turned off or removed (its combo, or its
    # repo, gone), a repo's push_rounds changed (fewer push reviews weakens reviews like a removed mandatory reviewer), or a repo's
    # ignore globs (what would quietly weaken reviews). Turning a combo mandatory is its to do: it only
    # adds a gate.
    owner:
      - { path: "repos.*.forks", to: auto, default: manual }
      - { path: "repos.*.drafts", to: true, default: false }
      - { path: "repos.*.repo", new: true, before: "/" }
      # Each combo's fields, an absent one read as the moment's default combo (a combo added past them differs in one of them).
      - { path: "repos.*.on_open.*.engine", change: true, default: codex }
      - { path: "repos.*.on_open.*.model", change: true, default: "~deepseek/deepseek-flash-latest" }
      - { path: "repos.*.on_open.*.effort", change: true, default: medium }
      - { path: "repos.*.on_open.*.mandatory", to: false, default: false }
      - { path: "repos.*.on_push.*.engine", change: true, default: codex-native }
      - { path: "repos.*.on_push.*.model", change: true, default: "openai/gpt-6.2-sol" }
      - { path: "repos.*.on_push.*.effort", change: true, default: low }
      - { path: "repos.*.on_push.*.mandatory", to: false, default: false }
      - { path: "repos.*.push_rounds", change: true, default: 1 }
      - { path: "repos.*.ignore", change: true, default: [] }
    default:
      repos: []
  # Seconds between the service's looks at the watched repos.
  code_review_poll_seconds: { default: 60 }
# The Reviewer Manager (agents/reviewer-manager/AGENTS.md): conversation only. It reads strangers' review threads, so it holds no
# code tools and no delegation, and what its settings changes may do alone is bounded by settings.code_review.owner above. Aiden
# (the chief of staff) delegates code review asks to it; no heartbeat, no schedule: it runs only when a task asks.
agents:
  reviewer-manager:
    department: engineering
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: high
    timeout_sec: 900
    # Strangers' text in (review threads), so no web out.
    web_search: disabled
    connections:
      apps: [ app_view ]
      code_review: [ code_review_config, code_review_runs, code_review_run, code_review_configure ]
      # A PR's review threads (replies to its findings) and one comment answering an `aiden` question, as the posting identity's
      # write: a kernel record the AI reviewer decides.
      github: [ github_pr_threads, github_issue_comment ]
      paperclip_tasks: [ task_current, task_get, task_comments, task_comment, task_block, task_cancel, task_finish ]
    roles: [ reviewer-manager ]
# Its tools (service/src/config-tool.ts), served by the state service; each call's assertion gates it to the reviewer-manager role.
connections:
  code_review:
    setup: "Built in: nothing to connect."
    url: http://code-review:8098/mcp
    auth: code_review_service_key
    returns: untrusted
    tools:
      read: [ code_review_config, code_review_runs, code_review_findings ]
      write: [ code_review_run, code_review_configure, code_review_resolve ]
# Posting: this service files a record per post, per acknowledgement and per status and executes it (executor@1) through
# github-mcp's /internal/review routes (the github module's poster, as the owner's sign-in). A post and a reply are Tier 0: no
# AI reviewer reads them (the instance-details check below refuses a host, home path or address in either, before it runs); a
# notice is Tier 0 (fixed words: phase and reason only), and so is a status (the commit status aidenhq/review on a gated repo's PR
# head, mirroring the merge verdict in fixed words). Plan refuses a record this service didn't file for one of its runs.
providers:
  board: { url: "http://code-review:8098", auth: code_review_api_token }
  executor:
    url: http://code-review:8098/aidenhq/v1/executor
    auth: code_review_service_key
# kernel/src/instance-details-check.ts: a GitHub thread is outside the instance, so a post or reply naming its hosts, home paths or
# addresses is refused at filing (a write.filed check always enforces).
checks:
  - id: instance-details
    at: write.filed
    kinds: [ code-review.post, code-review.reply ]
writes:
  post:
    args: schemas/post.json
    floor: 0
    # Head-bound: a post is of one pull request at one commit, so only those decide whether it may still run. Redeploying this
    # module (its code revision) or the pull request's base moving never stales a review of a head that still stands.
    binds: [ repo, ref, commit ]
    tools: []
    card: { target: "{{target}}", sentence: "{{sentence}}", changes: "{{changes}}", details: "{{details}}" }
  # An agent's recorded answer to an important finding, replied on that finding's thread so it shows closed: the text is the
  # agent's own (Tier 0). It never holds the outcome, which is already in the store.
  reply:
    args: schemas/reply.json
    floor: 0
    tools: []
    card: { target: "{{target}}", sentence: "{{sentence}}", changes: "{{changes}}", details: "{{details}}" }
  notice:
    args: schemas/notice.json
    floor: 0
    tools: []
    card: { target: "{{target}}", sentence: "{{sentence}}", changes: "{{changes}}", details: "{{details}}" }
  status:
    args: schemas/status.json
    floor: 0
    tools: []
    card: { target: "{{target}}", sentence: "{{sentence}}", changes: "{{changes}}", details: "{{details}}" }
services:
  data: true
  run:
    code-review:
      build: ./service
      tmp: 16m
      port: 8098
      egress: true # the kernel's listener is a host address
      join: [github] # github-mcp's internal PR read
      data: ["reviews:/data"]
      env:
        CODE_REVIEW_DB: /data/code-review.sqlite
        CODE_REVIEW_SETTINGS: "${settings.code_review}"
        CODE_REVIEW_POLL_SECONDS: "${settings.code_review_poll_seconds}"
        CODE_REVIEW_TOKEN_FILE: ${secrets.code_review_token}
        CODE_REVIEW_API_TOKEN_FILE: ${secrets.code_review_api_token}
        CODE_REVIEW_SERVICE_KEY_FILE: ${secrets.code_review_service_key}
        AIDENHQ_KERNEL_URL: http://10.231.0.1:3130
generated_secrets:
  - code_review_token
  - code_review_api_token
  - code_review_service_key
data_version: 3 # its data dir's format: bumped by each forward-only migration (docs/configuration.md)
