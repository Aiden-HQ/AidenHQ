<!doctype html>
<!-- Code review's Reviews page: an MCP Apps view (text/html;profile=mcp-app) the code_review connection serves as ui://code-review/page.
     Its own parts only: the shared kit (services/shared/page-kit.css and .js: the bridge, helpers and common styles) is inlined where the
     markers sit (mcp.ts pageHtml). Calls only the code_review_* tools declared on the page (module.yaml board.pages) through the host; as the
     owner, code_review_configure only proposes: the board shows the change and files it on his Save. PR titles, findings and reports are
     strangers' or a model's words: set as text only, and links open through the host (kit link()), reports and findings through the kit's safe markdown.
     docs/design/board-ui.md "Modules". -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/*kit:css*/
  :root { --bad: #d4493f; --warn: #c98a1b; --good: #2f9e6f; }
  body { gap: 12px; grid-template-columns: minmax(0, 1fr); }
  .card, .bar, .pad, .row > * { min-width: 0; }
  .pad, .mono, .soft, .row .repo { overflow-wrap: anywhere; }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); flex: 1 1 auto; min-width: 0; }
  .tabs button { height: 32px; border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--soft); padding: 0 12px; margin-bottom: -1px; }
  .tabs button[aria-selected=true] { color: inherit; border-bottom-color: var(--accent); font-weight: 560; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--soft); margin-right: 6px; vertical-align: 1px; }
  .dot.busy { background: var(--accent); } .dot.done { background: var(--good); } .dot.failed { background: var(--bad); }
  .clk { cursor: pointer; }
  .clk:hover, .clk:focus-visible { background: color-mix(in srgb, var(--line) 14%, transparent); outline: none; }
  .run { grid-template-columns: 104px minmax(0, 2fr) minmax(0, 1.3fr) 150px 56px 64px; }
  .run .ttl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run .ttl small { display: block; color: var(--soft); overflow: hidden; text-overflow: ellipsis; }
  .num { text-align: right; color: var(--soft); font-variant-numeric: tabular-nums; }
  .sev { display: inline-flex; gap: 10px; }
  .sev span { display: inline-flex; align-items: center; gap: 4px; font-variant-numeric: tabular-nums; }
  .sev i { width: 6px; height: 6px; border-radius: 2px; background: var(--soft); }
  .sev .important i { background: var(--bad); } .sev .nit i { background: var(--warn); }
  .sev .zero { opacity: .4; }
  .head { flex-wrap: wrap; }
  .filters { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; min-width: 0; }
  .filters select { width: auto; }
  .banner { padding: 8px 14px; border-radius: var(--r); border: 1px solid var(--line); background: var(--color-background-secondary, Canvas); }
  .banner.warn { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); } .banner.bad { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); color: var(--color-text-danger, var(--bad)); }
  .split { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 12px; align-items: start; }
  .stack { display: grid; gap: 12px; min-width: 0; }
  .pad { padding: 12px 14px; display: grid; gap: 8px; }
  .finding { padding: 10px 14px; border-top: 1px solid var(--line); display: grid; gap: 4px; box-shadow: inset 2px 0 0 var(--soft); }
  .finding:first-of-type { border-top: 0; }
  .finding.important { box-shadow: inset 2px 0 0 var(--bad); } .finding.nit { box-shadow: inset 2px 0 0 var(--warn); }
  .finding h4 { margin: 0; font-size: 13.5px; font-weight: 600; }
  .finding p { overflow-wrap: anywhere; }
  .finding textarea { width: 100%; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--color-background-primary, Canvas); color: inherit; resize: vertical; }
  .finding pre, .report { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .finding summary { color: var(--soft); cursor: pointer; }
  .facts { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; }
  .facts dt { color: var(--soft); } .facts dd { margin: 0; overflow-wrap: anywhere; }
  .open { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
  .open form { grid-column: 1 / -1; display: flex; gap: 8px; }
  .gate { display: grid; gap: 6px; }
  .rep { grid-template-columns: minmax(150px, 1.4fr) minmax(0, 2.4fr) 90px 120px; }
  .rep .sum { color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .edit { padding: 10px 14px 14px; border-top: 1px solid var(--line); display: grid; gap: 12px; background: color-mix(in srgb, var(--line) 6%, transparent); }
  .edit .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 10px 14px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px 14px; }
  .field { display: grid; gap: 3px; align-content: start; } .field > span { color: var(--soft); font-size: 12px; }
  .field textarea { font: inherit; min-height: 60px; padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--color-background-primary, Canvas); color: inherit; resize: vertical; }
  .combos { display: grid; gap: 6px; }
  .combo { display: grid; grid-template-columns: minmax(96px, 1fr) minmax(0, 2fr) 90px auto auto; gap: 6px; align-items: center; }
  .combo label { display: inline-flex; align-items: center; gap: 6px; color: var(--soft); white-space: nowrap; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .lens { padding: 10px 14px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
  .lens h4 { margin: 0; font-size: 12px; color: var(--soft); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .opt { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 8px; align-items: start; }
  .opt.off { opacity: .5; } .opt small { color: var(--soft); display: block; }
  .days { display: flex; align-items: flex-end; gap: 2px; height: 56px; padding: 8px 14px 0; }
  .days i { flex: 1; min-width: 2px; background: var(--accent); opacity: .75; border-radius: 2px 2px 0 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; padding: 12px 14px; }
  .tiles b { display: block; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; } .tiles small { color: var(--soft); }
  .two { grid-template-columns: minmax(0, 1fr) 90px 80px 80px; }
  /* Risk tiers: one colour per tier, carried by the rules, the tier cards and each PR's tag. */
  :root { --t-skip: #7b8597; --t-trivial: #13a08e; --t-standard: #5b6cff; --t-sensitive: #e2456d; }
  .t-skip { --tc: var(--t-skip); } .t-trivial { --tc: var(--t-trivial); } .t-standard { --tc: var(--t-standard); } .t-sensitive { --tc: var(--t-sensitive); }
  .tt { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; font-size: 12px; color: var(--tc); white-space: nowrap; }
  .tt i { width: 8px; height: 8px; border-radius: 2px; background: var(--tc); flex: none; }
  .tt.pend { --tc: var(--soft); font-weight: 500; }
  .rep .sum { white-space: normal; }
  .mix { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
  .cnt { display: inline-flex; gap: 5px; align-items: center; font-variant-numeric: tabular-nums; }
  .sec { display: grid; gap: 8px; min-width: 0; }
  .sh { display: flex; align-items: center; justify-content: space-between; gap: 8px 12px; flex-wrap: wrap; }
  .sh b { font-size: 13px; font-weight: 600; }
  .rules, .prs { border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--color-background-primary, Canvas); }
  .rule { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto 124px auto; gap: 8px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--line); box-shadow: inset 3px 0 0 var(--tc); }
  .rules > :first-child { border-top: 0; }
  .rn { color: var(--soft); font-variant-numeric: tabular-nums; font-size: 12px; text-align: right; }
  .conds { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 2px 0 8px; border: 1px solid var(--line); border-radius: 6px; background: color-mix(in srgb, var(--line) 12%, transparent); font-size: 12.5px; max-width: 100%; min-width: 0; }
  .chip input[type=text] { width: auto; height: 22px; padding: 0 6px; font-variant-numeric: tabular-nums; }
  .chip select { width: auto; height: 22px; padding: 0 4px; }
  .chip .gl { height: 22px; padding: 0 6px; max-width: 280px; overflow: hidden; text-overflow: ellipsis; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .chip .x { height: 22px; width: 22px; padding: 0; border: 0; background: none; color: var(--soft); font-size: 15px; }
  .chip .x:hover { color: var(--color-text-primary, CanvasText); }
  select.addc { width: 118px; height: 28px; color: var(--soft); border-style: dashed; background: transparent; }
  .else { color: var(--soft); }
  .arrow { color: var(--soft); font-size: 12px; }
  select.tsel { font-weight: 600; color: var(--tc); border-color: color-mix(in srgb, var(--tc) 60%, var(--line)); background: color-mix(in srgb, var(--tc) 8%, var(--color-background-primary, Canvas)); }
  .rt { display: contents; }
  .ra { display: flex; gap: 4px; justify-content: flex-end; min-width: 128px; }
  .top .acts { display: flex; gap: 8px; }
  button.ic { height: 26px; padding: 0 8px; font-size: 12px; }
  .globs { display: grid; gap: 4px; padding: 6px 10px 10px 40px; border-top: 1px dashed var(--line); }
  .globs textarea { width: 100%; font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line); background: var(--color-background-primary, Canvas); color: inherit; resize: vertical; }
  .tiers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 255px), 1fr)); gap: 10px; }
  /* A combo in a tier card: engine and effort, the model below them, then mandatory and remove. */
  .tier .combo { grid-template-columns: minmax(0, 1fr) 92px; gap: 6px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .tier .combos > .combo:first-child { border-top: 0; padding-top: 0; }
  .tier .combo > :nth-child(1) { grid-area: 1 / 1; } .tier .combo > :nth-child(2) { grid-area: 2 / 1 / 3 / 3; } .tier .combo > :nth-child(3) { grid-area: 1 / 2; }
  .tier .combo > :nth-child(4) { grid-area: 3 / 1; } .tier .combo > :nth-child(5) { grid-area: 3 / 2; }
  .tier { display: grid; gap: 10px; align-content: start; padding: 10px 12px 12px; border: 1px solid var(--line); border-top: 3px solid var(--tc); border-radius: var(--r); background: var(--color-background-primary, Canvas); min-width: 0; }
  .tier p { margin: 0; }
  .th { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .th .tt { font-size: 13.5px; }
  .gm { color: var(--tc); font-weight: 600; }
  .ovr { color: var(--accent); font-weight: 560; }
  .note2 { display: grid; gap: 2px; padding: 9px 12px; border-radius: var(--r); border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); background: color-mix(in srgb, var(--accent) 7%, transparent); }
  .note2 p { margin: 0; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; justify-self: start; }
  .seg button { border: 0; border-left: 1px solid var(--line); border-radius: 0; height: 26px; }
  .seg button:first-child { border-left: 0; }
  .seg button[aria-checked=true] { background: var(--accent); color: var(--color-text-inverse, HighlightText); font-weight: 560; }
  .pr { display: grid; grid-template-columns: 96px 52px minmax(0, 1.1fr) minmax(0, 1.6fr); gap: 10px; align-items: center; padding: 7px 12px; border-top: 1px solid var(--line); }
  .prs > :first-child { border-top: 0; }
  .ptl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .why { color: var(--soft); font-size: 12.5px; overflow-wrap: anywhere; }
  .tierline { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  @media (max-width: 860px) {
    .rule { grid-template-columns: 22px minmax(0, 1fr); align-items: start; } .rn { padding-top: 6px; } .rule > :not(.rn) { grid-column: 2; }
    .rt { display: flex; align-items: center; gap: 6px; } .rt select.tsel { width: auto; flex: 0 1 132px; } .rt .ra { min-width: 0; margin-left: auto; }
    .top .tabs { flex: 1 1 100%; } .top .acts { flex: 1 1 100%; } .top .acts button { flex: 1 1 0; min-width: 0; padding: 0 6px; overflow: hidden; text-overflow: ellipsis; }
    .pr { grid-template-columns: auto 1fr; gap: 4px 10px; } .pr .ptl, .pr .why { grid-column: 1 / -1; }
    .globs { padding-left: 10px; }
    .run { grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 14px; }
    .run .ttl { grid-column: 1 / -1; grid-row: 2; white-space: normal; } .run .who { grid-column: 1 / -1; grid-row: 3; } .run .sevc { grid-column: 1; }
    .split { grid-template-columns: 1fr; }
    .rep { grid-template-columns: 1fr auto; } .rep .sum { grid-column: 1 / -1; white-space: normal; }
    .combo { grid-template-columns: 1fr 1fr; } .combo .model { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div id="app"></div>
<div class="note" id="note" role="status"></div>
<div id="lists"></div>
<script>
/*kit:js*/
  let ov = null;                       // the overview: runs, batches, repos, engines, setting
  let tab = "reviews", route = { page: "list" }, detail = null, report = null, catalog = null, form = null;
  let filter = "all", repoFilter = "", days = 30, open = new Set();
  // The edits the owner hasn't saved yet, one proposal for the page: field changes per repo, and repos to stop watching. Each edit merges into it.
  let pending = { watch: {}, unwatch: [] };
  let accepted = { watch: {}, unwatch: [] };  // the last draft the host accepted: what the bar's Save applies, so a refused edit goes back to it

  const SKIPS = { draft: "Draft PR", fork: "Fork PR, waiting for someone with write access to ask", closed: "PR closed", stopped: "Reviews stopped on this PR", superseded: "A newer push replaced it" };
  const STATUS = { queued: ["", "Queued"], waiting: ["busy", "Waiting"], running: ["busy", "Reviewing"], done: ["done", "Reviewed"], skipped: ["", "Skipped"], failed: ["failed", "Failed"] };
  const VERDICTS = { blocked: "Blocked", concerns: "Concerns", incomplete: "Incomplete", clean: "Clean" };
  const SEV = [["important", "Important"], ["nit", "Nit"], ["pre_existing", "Pre-existing"]];
  const OUTCOMES = { fixed: "Fixed", dismissed: "Dismissed", open_at_merge: "Open at merge", open_at_close: "Open at close" };
  const LENSES = { correctness: "Correctness", security: "Security", maintainability: "Maintainability", performance: "Performance", ui: "UI" };
  const live = (r) => r.status === "queued" || r.status === "waiting" || r.status === "running";
  const skipWords = (why) => { if (!why) return "Skipped"; const k = why.split(":")[0].trim().toLowerCase(); return SKIPS[k] ?? why.replace(/^./, (c) => c.toUpperCase()); };
  const costText = (u) => (u < 0.005 ? "<$0.01" : u < 10 ? `$${u.toFixed(2)}` : `$${Math.round(u)}`);
  const usd = (n) => (n == null ? "—" : `$${Number(n).toFixed(2)}`);
  const short = (s) => String(s ?? "").slice(0, 7);
  const when = (r) => r.started ?? r.ended ?? new Date().toISOString();
  const agoShort = (t) => { const s = (Date.now() - Date.parse(t)) / 1000; if (!(s >= 90)) return "now"; const m = s / 60; if (m < 90) return `${Math.round(m)}m`; const hr = m / 60; return hr < 36 ? `${Math.round(hr)}h` : `${Math.round(hr / 24)}d`; };
  const took = (r) => (r.duration_ms != null ? (r.duration_ms >= 60000 ? `${Math.floor(r.duration_ms / 60000)}m ${Math.round((r.duration_ms % 60000) / 1000)}s` : `${Math.max(1, Math.round(r.duration_ms / 1000))}s`) : null);
  const tokens = (n) => (n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k` : String(n));
  const engineLabel = (k) => ov?.engines?.[k]?.label ?? k;
  const comboLabel = (c) => `${engineLabel(c.engine)} · ${String(c.model).replace(/^~/, "").split("/").pop()} · ${c.effort}`;
  const fail = (e) => say(e.message, true);
  const gh = (url, text) => (/^https:\/\/github\.com\//.test(String(url ?? "")) ? link(url, text) : h("span", { textContent: text ?? "" }));

  const t = (tag, cls, text, props) => h(tag, { className: cls ?? "", ...(text !== undefined ? { textContent: text } : {}), ...(props ?? {}) });
  const btn = (text, fn, cls, props) => { const b = h("button", { type: "button", textContent: text, className: cls ?? "", ...(props ?? {}) }); b.addEventListener("click", fn); return b; };
  const clickable = (el, fn) => { el.classList.add("clk"); el.tabIndex = 0; el.setAttribute("role", "button"); el.addEventListener("click", fn); el.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } }); return el; };
  const select = (options, value, fn, label) => { const s = h("select", { ariaLabel: label }); for (const [v, text] of options) s.append(h("option", { value: v, textContent: text, selected: v === value })); s.addEventListener("change", () => fn(s.value)); return s; };
  const check = (on, label, fn) => { const b = h("input", { type: "checkbox", checked: !!on, ariaLabel: label }); b.addEventListener("change", () => fn(b.checked)); return b; };
  const field = (label, control, text, more) => h("div", { className: "field" }, h("span", {}, text ? help(label, text, more) : label), control);
  const sevMarks = (v, words) => h("span", { className: "sev", ariaLabel: SEV.map(([k, n]) => `${v[k]} ${n.toLowerCase()}`).join(", ") }, ...SEV.map(([k, n]) => h("span", { className: `${k}${v[k] ? "" : " zero"}`, title: `${v[k]} ${n.toLowerCase()}` }, h("i"), `${v[k]}${words ? " " + n.toLowerCase() : ""}`)));
  const status = (s) => { const [tone, word] = STATUS[s] ?? ["", s]; return h("span", {}, h("span", { className: `dot ${tone}` }), word); };
  const card = (title, aside, ...kids) => h("div", { className: "card" }, title ? h("div", { className: "head" }, h("b", { textContent: title }), aside ?? h("span")) : null, ...kids);
  const go = (r) => { route = r; detail = null; report = null; render(); window.scrollTo?.(0, 0); if (r.page === "run") loadDetail(); if (r.page === "batch" && ov.batches.find((b) => b.id === r.id)?.status === "done") loadReport(); };
  const back = () => h("div", { className: "bar" }, btn("← Reviews", () => go({ page: "list" })));

  /* -------------------------------------------------------------------------------- reads */
  async function loadOverview(ctx) {
    try {
      ov = await tool("code_review_overview", {});
      $("lists").replaceChildren(...Object.entries(ov.engines).map(([k, e]) => h("datalist", { id: `models-${k}` }, ...e.models.map((m) => h("option", { value: m })))));
      render();
      // Opened at an address (#/reviews/r/<run>, #/reviews/b/<batch>, #/reviews/<tab>): the host says which, once.
      const at = String(ctx?.route ?? "").split("/");
      if (at[0] === "r" && /^cr-[0-9a-f]{12}$/.test(at[1] ?? "")) go({ page: "run", id: at[1] });
      else if (at[0] === "b" && /^b-[0-9a-f]{12}$/.test(at[1] ?? "")) go({ page: "batch", id: at[1] });
      else if (["reviews", "repos", "insights"].includes(at[0])) (tab = at[0], render());
    } catch (e) { fail(e); }
  }
  async function loadDetail() { const id = route.id; try { const d = await tool("code_review_run_detail", { id }); if (route.id === id) { detail = d; render(); } } catch (e) { fail(e); } }
  async function loadReport() { const id = route.id; try { const r = await tool("code_review_report", { batch: id }); if (route.id === id) { report = r.markdown; render(); } } catch (e) { if (route.id === id) fail(e); } }
  // Runs under way are followed.
  setInterval(async () => {
    if (!ov) return;
    if (route.page === "run" && detail && live(detail.run)) loadDetail();
    else if (route.page === "batch") {
      const id = route.id, b = ov.batches.find((x) => x.id === id);
      if (!b || b.status === "running" || (b.status === "done" && !b.published)) await loadOverview();
      // The report is fetched once the batch is done, judged on the fresh overview (the poll that sees it finish is not the one that fetches it).
      if (route.page === "batch" && route.id === id && report === null && ov.batches.find((x) => x.id === id)?.status === "done") loadReport();
    }
    else if (route.page === "list" && !(tab === "repos" && (open.size || Object.keys(pending.watch).length)) && (ov.runs.some(live) || ov.batches.some(live))) loadOverview();
  }, 6000);

  /* -------------------------------------------------------------------------------- the owner's settings proposal */
  async function propose() {
    const watch = Object.entries(pending.watch).map(([repo, f]) => ({ repo, ...f })), unwatch = [...pending.unwatch], draft = structuredClone(pending);
    render();
    if (!watch.length && !unwatch.length) return say("Nothing is proposed now. If the bar above still shows an earlier proposal, press its Discard.");
    await inOrder(async () => { try { const r = await tool("code_review_configure", { ...(watch.length ? { watch } : {}), ...(unwatch.length ? { unwatch } : {}) }); accepted = draft; proposed(r); } catch (e) { pending = structuredClone(accepted); render(); say(`${e.message} The editor is back to the last accepted proposal, the one Save applies.`, true); } });
  }
  /* -------------------------------------------------------------------------------- combos */
  /** A list of combos (engine, model, effort, and for a gated repo whether it is mandatory); at most 4. */
  function combos(label, list, onChange, gates) {
    const box = h("div", { className: "combos", role: "group", ariaLabel: label });
    if (!list.length) box.append(t("span", "soft", gates ? "None" : "The repo's own default"));

    return [h("div", { className: "bar" }, t("span", "soft", "The last"), select([["7", "7 days"], ["30", "30 days"], ["90", "90 days"]], String(days), (v) => { days = Number(v); render(); }, "Period"), t("span", "soft", `of the ${ov.runs.length} most recent PR runs`)),
      card(null, null, h("div", { className: "tiles" }, ...[["Reviews", total.reviews], ["Pull requests", total.prs], ["Spend", usd(total.cost)], ["Failed", total.failed],
        ["Resolved as fixed", found && done.some((r) => r.resolved != null) ? `${Math.round(Math.min(1, resolved / found) * 100)}%` : "—"]].map(([k, v]) => h("div", {}, h("b", { textContent: String(v) }), h("small", { textContent: k })))),
        h("div", { className: "days", ariaLabel: "Spend per day" }, ...[...byDay].map(([d, v]) => h("i", { title: `${d}: ${usd(v)}`, style: `height:${Math.max(2, (v / peak) * 100)}%` })))),
      card("Findings", null, h("div", { className: "pad" }, sevMarks(sev, true))),
      card("By repo", null, ...(repos.size ? [...repos].sort((a, b) => b[1].cost - a[1].cost).map(([n, v]) => h("div", { className: "row two" }, h("span", { className: "repo", textContent: n }), t("span", "num", `${v.reviews} reviews`), t("span", "num", `${v.prs} PRs`), t("span", "num", usd(v.cost)))) : [t("div", "empty", "No runs in this period. Reviews appear here once a watched repo has had a pull request, or after you start one.")])),
      ...(skips.size ? [card("Why reviews were skipped", null, ...[...skips].sort((a, b) => b[1] - a[1]).map(([w, n]) => h("div", { className: "row two" }, h("span", { textContent: skipWords(w) }), t("span", "num", String(n)), h("span"), h("span"))))] : [])];
  }

  /* -------------------------------------------------------------------------------- the page */
  function render() {
    closeHelp();
    const app = $("app");
    if (!ov) return app.replaceChildren(t("div", "empty", "Loading…"));
    const parts = route.page === "run" ? runPage() : route.page === "batch" ? batchPage() : route.page === "pr" ? prForm() : route.page === "tree" ? treeForm() : [
      h("div", { className: "bar top" }, h("div", { className: "tabs", role: "tablist" }, ...[["reviews", "Reviews"], ["repos", "Repos"], ["insights", "Insights"]].map(([k, name]) => { const b = btn(name, () => { tab = k; render(); }, "", { role: "tab" }); b.setAttribute("aria-selected", String(tab === k)); return b; })),
        h("div", { className: "acts" }, btn("Review a PR", () => { form = null; go({ page: "pr" }); }), btn("Review a repo", () => { form = null; catalog = null; go({ page: "tree" }); }), btn("Refresh", () => { const had = Object.keys(pending.watch).length || pending.unwatch.length; pending = { watch: {}, unwatch: [] }; accepted = { watch: {}, unwatch: [] }; say(had ? "Edits dropped here. If the bar above still shows a proposal, press its Discard." : ""); loadOverview(); }))),
      ...(tab === "repos" ? reposTab() : tab === "insights" ? insights() : reviewsTab())];
    app.replaceChildren(...(route.page === "list" ? [t("div", "card pad soft", "Code review reads each pull request on the repos you watch. Each PR is first sorted into a risk tier (skip, trivial, standard or sensitive) by what it changes; that tier's reviewers (an AI engine with a model) then read it when it opens, and again when it is pushed to, and post their findings on the PR: important ones that should be fixed, and smaller nits. Watch a repo and set its tiers under Repos, or review any PR or whole repository by hand with the buttons here. Nothing runs until you do.")] : []), ...parts);
    if (!$("lists").querySelector("#repos")) $("lists").append(h("datalist", { id: "repos" }));
  }
  start("code-review", (ctx) => loadOverview(ctx));
</script>
