<!-- Code review's Reviews page (results first): an MCP Apps view (text/html;profile=mcp-app) the code_review connection serves as ui://code-review/page.
     Its own parts only: the shared kit (services/shared/page-kit.css and .js: the bridge, helpers and common styles) is inlined where the
     markers sit (mcp.ts pageHtml). Calls only the code_review_* tools declared on the page (module.yaml board.pages) through the host; as the
     owner, code_review_configure only proposes: the board shows the change and files it on his Save. PR titles, findings and reports are

<script>
/*kit:js*/
  let ov = null;                       // the overview: runs, batches, repos, engines, setting
  let route = { page: "list" }, detail = null, report = null, catalog = null, form = null;
  let filter = "all", repoFilter = "", days = 7, showAll = false, showBatches = false, advOpen = false, advRepo = "";
  let expanded = new Set(), details = new Map(), ruleOpen = new Set(), tierOpen = new Set();   // open PR rows, their findings (read on open), rules and levels being edited
  // The edits the owner hasn't saved yet, one proposal for the page: field changes per repo, and repos to stop watching. Each edit merges into it.
  let pending = { watch: {}, unwatch: [] };
  let accepted = { watch: {}, unwatch: [] };  // the last draft the host accepted: what the bar's Save applies, so a refused edit goes back to it

  const SKIPS = { draft: "Draft PR", fork: "Fork PR, waiting for someone with write access to ask", closed: "PR closed", stopped: "Reviews stopped on this PR", superseded: "A newer push replaced it" };
  const STATUS = { queued: ["", "Queued"], waiting: ["busy", "Waiting"], running: ["busy", "Reviewing"], done: ["done", "Reviewed"], skipped: ["", "Skipped"], failed: ["failed", "Failed"] };
  const VERDICTS = { blocked: "Blocked", concerns: "Concerns", incomplete: "Incomplete", clean: "Clean" };
  const SEV = [["important", "Important"], ["nit", "Nit"], ["pre_existing", "Pre-existing"]];
  const OUTCOMES = { fixed: "Fixed", dismissed: "Dismissed", open_at_merge: "Open at merge", open_at_close: "Open at close" };

      else { const key = `${repo}|${i}|${k}`; ctl = btn(v.length <= 2 ? v.join(", ") : `${v.slice(0, 2).join(", ")} +${v.length - 2}`, () => { globsOpen.has(key) ? globsOpen.delete(key) : globsOpen.add(key); render(); }, "gl", { title: v.join("\n"), ariaExpanded: String(globsOpen.has(key)) }); }
      return h("span", { className: "chip" }, help(name, about), ctl, del);
    }
  }

  function tiersSection(repo, e) {
    const rows = TIERS.map(([tier, name]) => {
      const c = e.tiers[tier], own = e.own(tier), key = `${repo}|${tier}`, editing = tierOpen.has(key);
      // Only the fields changed here become this tier's own; the others keep following the preset.
      const put = (patch) => edit(repo, { by_tier: { [tier]: { ...(own ?? {}), ...patch } } });
      const head = h("div", { className: "lh" }, tierTag(tier), help(name, TIER_HELP[tier], { bare: true }), h("span", { className: "sp" }),
        own ? t("small", "ovr", `Changed from the ${e.preset} preset`) : null, gates(c) ? t("small", "gm", "Gates merges") : t("small", "soft", tier === "skip" ? "No review" : "Advice only"),
        tier === "skip" ? null : btn(editing ? "Done" : "Edit", () => { editing ? tierOpen.delete(key) : tierOpen.add(key); render(); }, "ic", { ariaLabel: `${editing ? "Close" : "Edit"} the ${name} reviewers` }));
      if (tier === "skip") return h("div", { className: `lvl t-${tier}` }, head, t("p", "soft", "PRs a rule sends here get no review and pass the merge gate (findings still open from an earlier review still hold it)."));
      const said = `When a PR opens: ${comboList(c.on_open)}. On each push: ${comboList(c.on_push)}${c.push_rounds != null && c.on_push.length ? `, for the first ${plural(c.push_rounds, "push", "pushes")}` : ""}.`;
      if (!editing) return h("div", { className: `lvl t-${tier}` }, head, t("p", "", said));
      const rounds = h("input", { type: "text", value: c.push_rounds == null ? "" : String(c.push_rounds), placeholder: "Every push", ariaLabel: `${name} pushes reviewed`, inputMode: "numeric" });
      rounds.addEventListener("change", () => { const v = rounds.value.trim(); if (v !== "" && !/^\d{1,3}$/.test(v)) return say("Pushes reviewed is a number, or empty for every push.", true); soon(() => put({ push_rounds: v === "" ? null : Number(v) })); });
      return h("div", { className: `lvl t-${tier}` }, head, h("div", { className: `tier t-${tier}` },
        field("When a PR opens", combos(`${name} on open`, c.on_open, (v) => put({ on_open: v }), true), "The reviewers that read the whole PR when it opens, leaves draft, or moves into this tier. Each posts its own review."),
        field("On each push", combos(`${name} on push`, c.on_push, (v) => put({ on_push: v }), true), "The reviewers that read only what changed when more commits are pushed."),
        field("Pushes reviewed per PR", rounds, "How many pushes in this tier get an on-push review. After that, pushes are not reviewed again, but findings still open keep holding a mandatory merge. Empty means every push."),
        own ? h("div", { className: "actions" }, t("small", "ovr", `Changed from the ${e.preset} preset`), linkBtn("Use the preset", () => edit(repo, { by_tier: { [tier]: null } }))) : t("small", "soft", `As the ${e.preset} preset`)));
    });
    return section("Who reviews at each level", "What runs for a PR in each tier. A reviewer marked mandatory gates the merge: the PR merges only once it has reviewed the latest version and every important finding is fixed, answered or dismissed.", null, ...rows);
  }


  function gateNote(e) {
    const reach = TIERS.map(([t]) => t).filter((t) => e.rules.some((x) => x.tier === t));
    const gated = reach.filter((t) => gates(e.tiers[t])), open = reach.filter((t) => !gates(e.tiers[t]));
    const names = (ts) => ts.map((t) => TIER_NAME[t]).join(", ").replace(/, ([^,]*)$/, " and $1");
    return h("div", { className: "note2" },
      t("p", "", gated.length ? `Merges wait for code review on ${names(gated)} PRs.${open.length ? ` ${names(open)} PRs merge without one.` : ""}` : "No tier the rules can reach has a mandatory reviewer: reviews here are advice and never hold a merge."),
      t("p", "soft", open.length ? `The AI reviewer still checks agents' pushes and PRs here, because ${names(open)} PRs get no mandatory review.` : "The AI reviewer leaves agents' pushes and PRs here to code review: every tier the rules can reach has a mandatory reviewer."),
      ...(TIERS.some(([t]) => !reach.includes(t)) ? [t("p", "soft", `No rule sends PRs to ${names(TIERS.map(([t]) => t).filter((t) => !reach.includes(t)))}.`)] : []));
  }

  /* -- Advanced: the settings as sentences, each directly editable */
  const RULE_PHRASE = {
    lines_min: (v) => `has at least ${v} lines changed`, lines_max: (v) => (v === 0 ? "changes only generated files, lockfiles, binaries or renames" : `has ${v} lines or fewer changed`),
    files_min: (v) => `changes at least ${plural(v, "file")}`, files_max: (v) => `changes ${plural(v, "file")} or fewer`,
    paths: (v) => `touches ${globWords(v)}`, only_paths: (v) => `only touches ${globWords(v)}`, base: (v) => `merges into ${globWords(v)}`,
    author: (v) => ({ member: "comes from a member", bot: "comes from a bot", outsider: "comes from outside the team" })[v] ?? `comes from ${v}`,
    repo_class: (v) => `is in a ${v} repo`,
  };
  const globWords = (g) => (g.length <= 2 ? g.join(" and ") : `${g.slice(0, 2).join(", ")} and ${g.length - 2} more`);
  const ruleSentence = (when) => `A PR that ${Object.entries(when).map(([k, v]) => (RULE_PHRASE[k] ? RULE_PHRASE[k](v) : k)).join(" and ")}`;
  const comboList = (list) => (list.length ? list.map((c) => `${comboLabel(c)}${c.mandatory ? " (mandatory)" : ""}`).join(" + ") : "no review");
  function advancedSection() {
    const rows = ov.repos.repos.map((r) => ({ ...r, gone: pending.unwatch.includes(r.repo) }));
    for (const repo of Object.keys(pending.watch)) if (!rows.some((r) => r.repo.toLowerCase() === repo.toLowerCase())) rows.push({ repo, prs: [], isNew: true });
    const live1 = rows.filter((r) => !r.gone);
    if (!live1.length) return h("section", { className: "advs", id: "adv" }, h("h2", { textContent: "Advanced" }), t("div", "card empty", "Watch a repo first: its risk rules, reviewers and limits are set here."));
    const raw = live1.find((r) => r.repo === advRepo) ?? live1[0];
    advRepo = raw.repo;
    const r = shown(raw), e = eff(r.repo);
    const head = h("div", { className: "adv-head" }, h("h2", { textContent: "Advanced" }), live1.length > 1 ? pick(live1.map((x) => [x.repo, x.repo]), raw.repo, (v) => { advRepo = v; render(); }, "Repo") : h("b", { textContent: raw.repo }),
      h("span", { style: "flex:1" }), raw.isNew ? btn("Don't watch", () => { delete pending.watch[r.repo]; propose(); }, "quiet") : btn("Stop watching", () => { delete pending.watch[r.repo]; pending.unwatch.push(r.repo); propose(); }, "quiet"));
    const nits = h("input", { type: "text", value: String(r.max_nits ?? 5), ariaLabel: "Max nits", inputMode: "numeric" });
    nits.addEventListener("change", () => { const v = nits.value.trim(); if (!/^\d{1,2}$/.test(v)) return say("Max nits is a number.", true); soon(() => edit(r.repo, { max_nits: Number(v) })); });
    const ignore = h("textarea", { value: (r.ignore ?? []).join("\n"), ariaLabel: "Ignore globs", spellcheck: false, rows: 2 });
    ignore.addEventListener("change", () => { const v = lines(ignore.value); soon(() => edit(r.repo, { ignore: v })); });
    const seg = h("div", { className: "seg", role: "radiogroup", ariaLabel: "Preset" }, ...Object.keys(ov.presets).map((k) => { const b = btn(k[0].toUpperCase() + k.slice(1), () => edit(r.repo, { preset: k }), "", { role: "radio", title: PRESET_HELP[k] ?? "" }); b.setAttribute("aria-checked", String(e.preset === k)); return b; }));
    const sentences = h("div", { className: "sentbox" },
      h("p", { className: "sent" }, "Start from the ", seg, " preset", help("Preset", "What each tier runs to start with. Changing one tier above keeps the rest on the preset.", { options: PRESET_HELP, current: e.preset, bare: true }), ". This is a ",
        select([["critical", "critical"], ["standard", "standard"], ["sandbox", "sandbox"]], e.repo_class, (v) => edit(r.repo, { repo_class: v }), "Repo class"), " repo", help("Repo class", "An input to the tier rules above.", { options: CLASS_HELP, current: e.repo_class, bare: true }),
        ". Draft PRs are ", select([["false", "skipped"], ["true", "reviewed"]], String(!!r.drafts), (v) => edit(r.repo, { drafts: v === "true" }), "Draft PRs"), ". PRs from forks are reviewed ",
        select([["manual", "when someone with write access asks"], ["auto", "automatically"]], r.forks ?? "manual", (v) => edit(r.repo, { forks: v }), "Fork PRs"), help("Fork PRs", "A fork PR comes from someone outside the repo and is run on your budget. On request: it is reviewed only when someone with write access comments `aiden review` (mandatory reviewers still run). Automatically: every fork PR is reviewed.", { bare: true }),
        ". A review posts at most ", nits, " nits", help("Nits", "A nit is a small point, not a bug. This caps how many one review posts, so a PR is not buried in them.", { bare: true }), "."),
      field("Files left out of every review (one glob per line, like **/*.lock)", ignore));
    const rulesCol = h("section", {}, rulesSection(r.repo, e), gateNote(e));
    const lvlCol = h("section", {}, tiersSection(r.repo, e));
    return h("section", { className: "advs", id: "adv" }, head, h("div", { className: "card" }, h("div", { className: "advcols" }, rulesCol, lvlCol), sentences));
  }

  /* -------------------------------------------------------------------------------- the page */
  function render() {
    closeHelp();
    const app = $("app");
    if (!ov) return app.replaceChildren(t("div", "empty", "Loading…"));
    if (route.page === "list") {
      groups = groupPrs();
      app.replaceChildren(header(groups), headline(groups), h("div", { className: "grid" }, h("div", { className: "col" }, needsCard(), prsCard()), h("aside", { className: "col rail" }, coverCard(), askCard(), wholeCard(), advCard())), ...(advOpen ? [advancedSection()] : []));
    } else app.replaceChildren(...(route.page === "run" ? runPage() : route.page === "batch" ? batchPage() : route.page === "pr" ? prForm() : treeForm()));
    if (!$("lists").querySelector("#repos")) $("lists").append(h("datalist", { id: "repos" }));
  }
  start("code-review", (ctx) => { WHO = ctx?.teammates?.[REVIEWER] ?? WHO; return loadOverview(ctx); });
</script>
</body>
</html>
