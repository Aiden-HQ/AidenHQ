name: design
description: "The UI/UX Designer (mockups the Engineer builds from, the design system, design advice, an audit when an app moves to the starter) and the UI Reviewer (a designer's review of a PR or an app, on request: ranked design improvements with rendered fixes, and verified bugs)."
roles:
  # kernel.tasks: one task per UI review pass for the holder of ui-login (passes.ts). app-tester (apps-platform's) and
  # kernel.test-session: an AidenHQ app's pass gets a read-only test-user session through the job tool app-session
  # (kernel/src/test-session.ts; docs/design/access.md). kernel.work-read: the scheduler reads what an app's passes billed today
  # (GET /v1/work?spend_tasks=, its day cap) and whether a closed pass's job has ended (GET /v1/work?task=; schedule.ts).
  requests: [ repo-checkout, kernel.tasks, app-tester, kernel.test-session, kernel.work-read ]
  declares:
    - { id: ui-login, description: "Runs the design module's UI review passes: its pass's job tools release the app's supplied login or a read-only test-user session to the box's ui-review process, never to the model." }
requires:
  # Any code host: UI changes are reviewed on GitHub PRs and on local change requests alike.
  - codehost
  - board # the UI testing page (contributes.board.pages)
# When a pass starts by itself (service/src/schedule.ts): an `after-deploy` app's healthy AidenHQ deploy (apps-platform's
# app.deployed, by the app's name) or a push to its repo's default branch (the github change feed; optional, so the module
# compiles on an install without GitHub).
subscribes:
  apps:
    kinds: [ app.deployed ]
    resources: { setting: ui_testing, path: "apps[].name" }
  github?:
    kinds: [ push ]
    resources: { setting: ui_testing, path: "apps[].repo" }
contributes:
  # The UI testing page: a module view served by the design connection, on the owner's own calls (docs/design/board-ui.md
  # "Modules"): the apps under test, their settings (its write proposes settings.ui_testing, filed on the owner's Save), Run now and
  # Stop, runs with their images and recordings.
  board.pages:
    - id: ui-testing
      title: UI testing
      icon: palette
      order: 6
      connection: design
      view: "ui://design/page"
      tools: [ design_overview, design_runs, design_run, design_image, design_configure, design_pass_start, design_pass_stop ]
      settings: [ ui_testing ] # edited on this page alone: the generic settings screens leave it off
      # The board's own Sign-ins panel under the page: each app's test login, typed outside the frame and never shown back (a
      # blank field is left out, so the TOTP seed is optional).
      secret_maps:
        - secret: ui_logins
          keys_from: ui_testing.apps[].name
          fields:
            - { name: login_url, label: Login URL, kind: text }
            - { name: username, label: Username, kind: text }
            - { name: password, label: Password, kind: password }
            - { name: totp_secret, label: TOTP seed (optional), kind: totp }
agents:
  ui-designer:
    department: engineering
    skills: [ apps-platform.design-system, engineering.supply-chain, engineering.write-code, tasks.delegate-work ]
    max_parallel: 2 # mockups are independent; each run gets its own box
    # Graded done: mockups and design work delegated to it are checked against their rubric before they close.
    graded: true
    # Looks at screenshots: DeepSeek Flash takes images on OpenRouter (input_modalities text, image). The owner's blind UI
    # bake-off (2026-11-13) ranked it first at high effort, and every objective check agreed; Kimi was dropped ("lacked taste").
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: high
    timeout_sec: 4800 # a full mockup (data, three screens built from the starter, screenshots) ran past 40 minutes
    # Its own computer (services/computer): Chrome + agent-browser to build a mockup and screenshot it, and repo-checkout for an app's code.
    image: agent-base
    connections:
      owner_channel: [ notify ]
      apps: [ app_list, app_status, app_view, app_check, web_view ]
      github?: [ github_whoami, github_issue_read, github_search_issues ]
      # fleet_catalog: which agent owns an app, so a redesign or a review brings that agent in.
      paperclip_tasks: [ task_current, task_get, task_comments, task_files, task_file_read, task_search, task_list, task_approvals, task_team, task_delegate, task_amend_rubric, task_comment, task_handoff, task_block, task_cancel, task_file_upload, task_finish, fleet_catalog ]
    heartbeat: true
    # repo-checkout: a commit of an agents-org repo in its computer.
    roles: [ repo-checkout ]
  ui-reviewer:
    department: engineering
    skills: [ design.ui-review, apps-platform.design-system, engineering.write-code, tasks.delegate-work ]
    max_parallel: 2 # reviews are independent; each run gets its own box
    # Judges each changed page's before|after pictures. Default GPT Sol (2026-11-26 spike: 7 of 10 planted UI bugs, Luna 4);
    # users pick their own per agent (instance.yaml overrides.agents.ui-reviewer.model). Takes images on OpenRouter.
    model: ~openai/gpt-sol-latest
    reasoning_effort: medium
    timeout_sec: 2400
    image: agent-base
    connections:
      owner_channel: [ notify ]
      apps: [ app_list, app_status, app_view, app_check, web_view ]
      # Its runs and their evidence (the design service below); the engine's own model calls are made per call by `ui-review`.
      # design_image: a pass restores the previous pass's coverage queue (`ui-review get`); design_issue_note: the issue it filed per marker.
      design: [ design_run_start, design_evidence_put, design_run_finish, design_runs, design_run, design_image, design_apps, design_pass_start, design_issue_note ]
      # Reads the PR it is asked to review and posts its one comment; it sets no status. A pass files or refreshes its app's one
      # design issue and an issue per verified bug (AI-reviewed writes).
      github?: [ github_whoami, github_issue_read, github_search_issues, github_issue_comment, github_issue_create, github_issue_update ]
      # fleet_catalog: which agent owns an app, so a redesign or a review brings that agent in.
      paperclip_tasks: [ task_current, task_get, task_comments, task_files, task_file_read, task_search, task_list, task_approvals, task_team, task_delegate, task_amend_rubric, task_comment, task_handoff, task_block, task_cancel, task_file_upload, task_finish, fleet_catalog ]
    # Woken only by a request, never by a schedule or a PR event.
    # repo-checkout: a PR's head and base in its computer. ui-login: its passes' job tools (the supplied login). app-tester: a
    # read-only test-user session of an AidenHQ app for its own pass (never test-write or any; the kernel refuses them).
    roles: [ repo-checkout, ui-login, app-tester ]
# The design service (service/): the UI Reviewer's runs and their evidence (reports and the captures they cite), kept 30 days
# except each app's latest finished run. Each call's signed assertion names the calling agent; a run takes writes only from the
# agent that started it.
connections:
  design:
    setup: "Built in: nothing to connect."
    url: http://design:8099/mcp
    auth: design_service_key
    returns: untrusted
    tools:
      # design_evidence_put, design_run_finish and design_issue_note write only into this module's own store (no outside
      # effect): reads, so the images and the report never enter the kernel's permanent write records or an approval's arguments,
      # and an issue's number is kept the moment GitHub confirms it, never waiting on an approval of its own.
      read: [ design_runs, design_run, design_image, design_evidence_put, design_run_finish, design_apps, design_issue_note, design_overview ]
      # design_configure only proposes (the owner's Save files it); design_pass_stop closes a pass's task.
      write: [ design_run_start, design_pass_start, design_configure, design_pass_stop ]
# The job tools a pass's box calls (the kernel's POST /v1/jobtools/module/design/<op> forwards { op, body, caller } here with the
# service key): login releases the app's supplied login to the pass's own ui-review process; app-session gets an AidenHQ app's
# read-only test-user session from the kernel for it (service/src/jobtools.ts).
providers:
  jobtools:
    url: http://design:8099/jobtools
    auth: design_service_key
    ops: [ login, app-session ]
# The module's own check of a ui_testing change or a pasted ui_logins (service/src/passes.ts validate): errors under the field.
validate:
  post: http://design:8099/validate
  auth: design_service_key
  mode: observe
settings:
  # The apps the UI Reviewer tests: { apps: [{ name (lowercase, 2-31: a-z 0-9 -), url (where a pass opens it), repo? (owner/name:
  # a local build uses its default branch, never a PR head), aidenhq_app? (true: an app on this AidenHQ, named as it is there; it signs
  # in through the test-user session, so settings.edge.test_user.apps must list it, and is always read-only, whatever live_mode says), live_mode: read | test-write | any,
  # schedule: on-request (the default) | after-deploy (its healthy AidenHQ deploy or a push to its repo's default branch) | always
  # (back to back), day_cap_usd (default 5, at most 100: no pass starts once its passes billed that much in the UTC day; a running
  # one ends on its own), spend: scan | standard (the default) | thorough (passes.ts SPEND), models: { design?, fixes?, clicking? }
  # (OpenRouter ids), recording (default false) }] }. One pass runs per app at a time. live_mode is the
  # most a pass may do: read (the default) loads pages only, no write of any kind; test-write lets the test account change its own
  # data (deletes and paths like delete, pay, send, invite or publish are still blocked, a best-effort extra): choose it only for
  # an app whose test account holds test data alone; any allows everything. A pass may only narrow it. Logins: the secret ui_logins.
  ui_testing:
    type: object
    default:
      apps: []
secrets:
  provided:
    - name: ui_logins
      setup:
        label: UI test logins
        pattern: '^\{[\s\S]*\}$'
        help: 'A JSON map of app name to its test account: { "acme": { "login_url": "https://acme.example.com/login", "username": "...", "password": "...", "totp_secret": "optional base32 seed" } }. Used only by UI review passes of that app, never on a PR or a fork; it never reaches the model, a log or a report.'

services:
  data: true
  run:
    design:
      build: ./service
      tmp: 16m
      port: 8099
      egress: true # the kernel's listener (its keys, for the caller assertion) is a host address
      data: ["evidence:/data"]
      env:
        DESIGN_DATA: /data
        DESIGN_SERVICE_KEY_FILE: ${secrets.design_service_key}
        DESIGN_TOKEN_FILE: ${secrets.design_token}
        DESIGN_UI_LOGINS_FILE: ${secrets.ui_logins}
        DESIGN_UI_TESTING: "${settings.ui_testing}"
        AIDENHQ_KERNEL_URL: http://10.231.0.1:3130
generated_secrets:
  - design_service_key
  - design_token
data_version: 3 # its data dir's format: 1 adds a pass's depth, mode and source to runs; 2 its trigger, why it failed, its stop, and one running pass per app; 3 the issues table (store.ts)
