# Optional: shows a repo's UI PRs as waiting for design review from the moment they open. Copy to
# .github/workflows/design-review.yml (a .github change: the owner's tap, once per repo). On every pull request head that
# touches UI files it sets the `design-review` commit status to pending; the UI Reviewer posts its verdict with
# commit_status_set. Without it the runner still treats a UI PR's missing verdict as pending: a Tier 0 merge of a UI PR
# waits for `success` (and asks the UI Reviewer itself), asks once more after 2 hours without one, then parks the merge
# with a note. Never make it a required check in branch protection (a reviewer-approved card must be able to merge). Adjust `paths` to the repo's UI.
name: design-review
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.css"
      - "**/*.scss"
      - "**/*.html"
      - "**/*.tsx"
      - "**/*.jsx"
      - "**/*.vue"
      - "**/*.svelte"
      - "web/**"
      - "public/**"
permissions:
  statuses: write
  pull-requests: read  # the PR's own file list
jobs:
  request:
    # [self-hosted, aidenhq] once self-hosted CI is live on the agents org.
    runs-on: [self-hosted, aidenhq]
    steps:
      - name: Mark this head as waiting for design review (unless a verdict is already there)
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # Only a PR whose own diff touches UI files waits (the code host's rule, modules/github/service/src/merge-gate.mjs isUiFile): the
          # `paths` filter above can match a stale branch's history, and a CI-only PR must never wait for a design review.
          files=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$API/pulls/$PR/files?per_page=100" | jq -r '.[].filename' || echo "unreadable")
          if [ "$files" != unreadable ] && [ "$(printf '%s\n' "$files" | wc -l)" -lt 100 ] && ! printf '%s\n' "$files" | grep -qiE '\.(css|scss|sass|less|html?|tsx|jsx|vue|svelte|astro|hbs|handlebars|ejs|njk|pug|erb|liquid|mustache)$|(^|/)(web|public|templates|views|static|pages|components|layouts|design-system)/|(^|/)([^/]*[-_.])?(render|styles?|layouts?|views?|pages?|templates?)\.(m?[jt]s|cjs)$'; then
            echo "No UI files in this PR: no design review needed."; exit 0
          fi
          have=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$API/commits/$SHA/statuses" | jq -r '[.[] | select(.context == "design-review")] | length' || true)
          [ "${have:-0}" = 0 ] || exit 0  # a failed lookup still marks it pending (fail closed)
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" "$API/statuses/$SHA" \
            -d '{"state":"pending","context":"design-review","description":"Waiting for the UI Reviewer"}' >/dev/null
