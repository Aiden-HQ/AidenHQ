# Opt a repo with UI into design review: copy to .github/workflows/design-review.yml (a .github change: the owner's tap,
# once per repo). On every pull request head that touches UI files it sets the `design-review` commit status to pending,
# which asks the UI/UX Engineer for a review; it posts its verdict with commit_status_set. The status is advisory: the
# merge queue ignores it (never make it a required check), and findings come back as follow-up fixes.
# Adjust `paths` to where the repo keeps its UI.
name: design-review
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.css"
      - "**/*.scss"
      - "**/*.html"
      - "**/*.tsx"
      - "**/*.jsx"
      - "**/*.vue"
      - "**/*.svelte"
      - "web/**"
      - "public/**"
permissions:
  statuses: write
jobs:
  request:
    # [self-hosted, aidenhq] once self-hosted CI is live on the agents org.
    runs-on: [self-hosted, aidenhq]
    steps:
      - name: Mark this head as waiting for design review (unless a verdict is already there)
        env:
          TOKEN: ${{ github.token }}
          API: ${{ github.api_url }}/repos/${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          have=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$API/commits/$SHA/statuses" | jq -r '[.[] | select(.context == "design-review")] | length' || true)
          [ "${have:-0}" = 0 ] || exit 0  # a failed lookup still marks it pending (fail closed)
          curl -fsS -X POST -H "Authorization: Bearer $TOKEN" "$API/statuses/$SHA" \
            -d '{"state":"pending","context":"design-review","description":"Waiting for the UI/UX Engineer"}' >/dev/null
