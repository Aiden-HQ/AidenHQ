name: fleet-steward
description: "Fleet Steward, the fleet's operator: answers agents' questions from the owner's decisions, settles stuck work, owns each incident until it is resolved live (pause, stop, restart, roll back, the repair seen to production), routes every fix to its source, reviews other agents' outcomes, and keeps the notes, the people directory and agents' memory tidy."
# One agent for fleet upkeep (roster merge 5.3: Fleet Ops, the Agent Coach and the Knowledge Librarian), one skill per
# routine. It reads every agent's evidence, so it holds no public write: product bugs go to the Maintainer, which files
# them upstream (owner, 2026-11-18: no single agent both reads every agent's private data and writes public GitHub issues).
# Internal task actions are a different matter: it settles stuck work itself with the delegator's and the chief of staff's
# authority (role fleet-settle, owner 2026-11-22: "its only job is to keep the system running without issues and blockers"), and
# it owns every fleet operation (owner 2026-11-23): agents' questions the kernel routes to fleet-settle (escalate.ts) and its
# typed operations (fleet_operate, kernel.fleet_op).
replaces: [ fleet-ops, coach, librarian ] # the updater lists this module for an instance that ran any of them (kernel/src/updates.ts)
roles:
  # kernel.cp-read, kernel.work-read: the control plane's tasks and agents and the kernel's jobs, records and cost, read for the detector and
  # the Coach (and the Steward's own pauses and the owner's recent cards); kernel.tasks: the Steward's check tasks (a detector trip, a component down, a critical alert, a jammed gate); kernel.owner-notice: the owner's lines for a lost Steward or a stalled dispatch;
  # apps.read: apps-mcp's status, quality, sources and open PRs; kernel.routing: the routing learning loop's reads and its typed
  # routing changes, each a reviewed kernel.apply filed as the calling agent (routing-tuner role only); kernel.flow-read: Flow's idle work
  # for the detector's stuck rule and its week-over-week stage check, and the flow_report tool; product-issues (the chief of staff's):
  # the product-bug issues' status, which the digest's live-fix check reads.
  requests: [ kernel.cp-read, kernel.work-read, kernel.tasks, kernel.owner-notice, kernel.routing, kernel.flow-read, apps.read, product-issues ]
  declares:
    - { id: fleet-read, description: "The board's fleet status and the detector's incidents only (never fleet_control or relaying the owner's words)." }
    - { id: fleet-settle, description: "The fleet's operator: settle stuck work on any agent-made task (kernel cp.ts SETTLE: answer a wait, close finished work, cancel stale tasks, task_route), answer the questions the kernel routes to it (escalate.ts), and file its typed operations (fleet_operate: kernel.fleet_op)." }
    - { id: fleet-audit, description: "Read any agent's evidence (the fleet_steward connection's coach_* reads) and keep a review log (tasks bridge coach_record)." }
    - { id: librarian, description: "Read every handbook and decide proposed identity links (tasks bridge, apps-mcp)." }
    - { id: routing-tuner, description: "Read team routing decisions and their outcomes, and propose one change a day to members' repos or routing weights as a reviewed experiment (routing_*)." }
settings:
  # Minutes between the detector's checks (lower while developing). The detector files a check task for the Steward only when a
  # threshold trips or recovers, at most once per 30 minutes unless an app or apps-mcp is down or a critical alert fires
  # (service/src/detector.ts).
  fleet_ops_interval_minutes:
    default: 10
agents:
  fleet-steward:
    skills: [ fleet-steward.agent-review, fleet-steward.fleet-check, fleet-steward.fleet-digest, fleet-steward.fleet-review, fleet-steward.handbook-prune, fleet-steward.knowledge-daily, fleet-steward.knowledge-lint, fleet-steward.review-digest, fleet-steward.route-security-fix, fleet-steward.routing-review, tasks.delegate-work ]
    department: platform
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: high
    timeout_sec: 1800
    # It reads every agent's private data and untrusted text (notes, task text, handbooks) and needs nothing from the web.
    web_search: disabled
    connections:
      # Reads, plus one write: person_identity_decide (role librarian) confirms or rejects a proposed identity link.
      apps: [ app_list, app_status, app_logs, app_view, warehouse_query, person_identity_decide ]
      # The notes vault, read-only, plus its one correction tool (meeting notes), when the meetings module is on.
      ops_mcp?: [ obsidian_search, obsidian_read, obsidian_read_document_map, knowledge_list, knowledge_index, knowledge_search, knowledge_read, meeting_note_correct ]
      owner_channel: [ notify, notify_recent ]
      # Metrics and dashboards (monitoring alerts' series), when the grafana module is on: reads only.
      grafana?: read
      # Where the product-bug issues the Maintainer filed for it stand: a read. Filing is the Maintainer's; github_issue_link is
      # the report as the owner's prefilled link, for an install where GitHub isn't connected (prompt product-bugs).
      github?: [ github_product_issue_status, github_issue_link, github_issue_list ]
      # Ship's status (a read): the weekly review's Dependabot step reads the product repo's `dependabot` from it.
      ship?: [ ship_status ]
      # fleet_status through fleet-read (no fleet_control, no relaying, no approvals decided); coach_record through fleet-audit;
      # handbook_list/handbook_read through librarian; task_route, and task_finish/task_cancel on any agent's
      # task, through fleet-settle. task_create/task_delegate only to delegate_to below. task_handoff only on its own part of the
      # owner's task: a todo plus a recorded wait, nothing sent to the owner; any other task is settled with task_route/task_finish/task_cancel.
      paperclip_tasks: [ task_current, task_get, task_comments, task_search, task_list, task_approvals, task_team,
                         task_create, task_comment, task_delegate, task_route, task_handoff, task_block,
                         task_cancel, task_finish,
                         fleet_status, fleet_catalog, fanout_map,
                         coach_record, handbook_list, handbook_read ]
      # The detector's open and recovered incidents (fleet-read), the Coach's reads (fleet-audit) and the apply generations.
      # routing_* through routing-tuner: the routing learning loop.
      # fleet_operate: pause/resume, stop a run, restart a module's service, roll back (kernel.fleet_op, AI-reviewed); fleet_owner_cards:
      # what reached the owner, for the daily interruption pass.
      fleet_steward: [ fleet_detector, coach_due, coach_evidence, fleet_generation_status, routing_evidence, routing_replay, routing_tune, routing_judge, fleet_operate, fleet_owner_cards ]
    # It reads untrusted content broadly: the tasks module lets it assign work only to these. Fixes are theirs, under tiers:
    # the Engineer (product and module changes), an app's owner (app-owners; the app builder (`app-maintainer`) for an app with none), the
    # Agent Architect (an agent's definition), the Maintainer (product bugs upstream), the chief of staff (another agent's rule
    # fix, handed to that agent, and the owner's profile).
    delegate_to: [ engineer, app-maintainer?, app-owners, architect?, maintainer?, chief-of-staff? ]
    roles: [ fleet-read, fleet-settle, fleet-audit, librarian, routing-tuner, product-issues ]
# Routine titles stay as they were: setup matches routines by title. The check task itself is filed by the service (kernel.tasks).
routines:
  fleet-ops-digest:
    title: "Fleet Ops: daily digest"
    agent: fleet-steward
    description: |
      Today is {{date}}. Follow your fleet-digest skill: work the day's deep-look lines, then send one notify (kind digest)
      of the day and log it. Then close this task with one line.
    concurrency: skip_if_active
    schedules:
      - { cron: "45 20 * * *", timezone: "${settings.timezone}", label: "evening" }
  fleet-ops-weekly:
    title: "Fleet Ops: weekly review"
    agent: fleet-steward
    description: |
      Today is {{date}}. Follow your fleet-review skill: group the week's recurring failures and file at most 3 rule
      proposals, plus a Dependabot backstop delegation. Then close this task with one line.
    concurrency: skip_if_active
    schedules:
      - { cron: "0 9 * * 1", timezone: "${settings.timezone}", label: "Monday morning" }
  coach-review:
    title: "Agent Coach: review"
    agent: fleet-steward
    description: |
      Now {{timestamp}}. Follow your agent-review skill: `coach_due` lists the agents to review (at most 3). Review each,
      file at most 2 new fixes in total, record each review with `coach_record`, then close this task with one line.
    concurrency: skip_if_active
    schedules:
      - { cron: "20 */6 * * *", timezone: "${settings.timezone}", label: "every 6 hours" }
  coach-digest:
    title: "Agent Coach: weekly digest"
    agent: fleet-steward
    description: |
      Today is {{date}}. Follow your review-digest skill: file one digest task for the owner (task_create) and, only when
      it is new, send one notify (kind digest) about it. Then close this task with one line.
    concurrency: skip_if_active
    schedules:
      - { cron: "30 9 * * 1", timezone: "${settings.timezone}", label: "Monday morning" }
  coach-prune:
    title: "Agent Coach: weekly prune"
    agent: fleet-steward
    description: |
      Today is {{date}}. Follow your handbook-prune skill: one task for the Engineer listing dead handbook text
      to delete, or a "nothing to prune" note. Then close this task with one line.
    concurrency: skip_if_active
    schedules:
      - { cron: "0 10 * * 0", timezone: "${settings.timezone}", label: "Sunday morning" }
  librarian-daily:
    title: Librarian daily pass
    agent: fleet-steward
    description: |
      Today is {{date}}. Follow your knowledge-daily skill: review what is new since yesterday in the notes vault, the
      people proposals, fix what the tools allow, note the rest for the weekly report, then
      close this task with a short count summary.
    concurrency: coalesce_if_active
    schedules:
      - { cron: "30 6 * * *", timezone: "${settings.timezone}", label: "daily" }
  routing-review:
    title: "Routing: daily review"
    agent: fleet-steward
    description: |
      Today is {{date}}. Follow your routing-review skill: settle the open experiment with `routing_judge`, review
      yesterday's team routing decisions with `routing_evidence`, and file at most one routing change. Then close this
      task with one line.
    concurrency: skip_if_active
    schedules:
      - { cron: "15 0 * * *", timezone: "UTC", label: "after each UTC day" }
  librarian-weekly:
    title: Librarian weekly lint
    agent: fleet-steward
    description: |
      Today is {{date}}. Follow your knowledge-lint skill: lint the whole notes vault, the people directory, the
      agents' rules and the agents' memory files, then file the one weekly report task. Then close this task with one line saying what you did.
    concurrency: coalesce_if_active
    schedules:
      - { cron: "0 7 * * 1", timezone: "${settings.timezone}", label: "Monday morning" }
# The service (service/src): the detector on a timer, Alertmanager's webhook (POST /alerts) and Prometheus's scrape (/metrics), which
# take the monitoring module's own token (checked with the kernel) on the network only they share with it, and the MCP connection the kernel's proxy calls (the Steward's detector, Coach and generation
# tools). It reads the fleet through the kernel with its own module token and apps-mcp with the same token (apps.read), and files a
# check task for the Steward (kernel.tasks). The connection's answers are fenced by the proxy; an alert's text carries its own fence.
connections:
  fleet_steward:
    setup: "Built in: nothing to connect."
    url: http://fleet-steward:8097/mcp
    auth: fleet_steward_service_key
    returns: untrusted
    tools:
      read: [ fleet_detector, coach_due, coach_evidence, fleet_generation_status, fleet_stale_followups, flow_report, routing_evidence, routing_replay, fleet_owner_cards ]
      # fleet_generation_status: the apply generations; fleet_stale_followups: the owner's stale todos for the daily brief. Tagged named,
      # so the read shorthand keeps them to the agents that name them (the Fleet Steward, the Maintainer and the chief of staff).
      # fleet_owner_cards: the cards that went to the owner, for the Steward's daily interruption pass (role fleet-settle).
      named: [ fleet_generation_status, fleet_stale_followups, flow_report, routing_evidence, routing_replay, fleet_owner_cards ]
      # fleet_followup_snooze: the owner's snooze of a brief line, a note in the steward's own record (role fleet-admin).
      # routing_tune, routing_judge: a routing change or its rollback, each filed as a reviewed kernel.apply (role routing-tuner).
      # fleet_operate: the Steward's fleet operations, the kernel's kernel.fleet_op write (kernel/src/fleet-ops.ts, role fleet-settle).
      write: [ fleet_followup_snooze, routing_tune, routing_judge, fleet_operate ]
services:
  data: true
  run:
    fleet-steward:
      build: ./service
      tmp: 16m
      port: 8097
      egress: true # the kernel's listener is a host address
      links: [ apps-mcp ] # apps-mcp's reads (role apps.read), until 4c moves it into apps-platform
      data: ["steward:/data"]
      env:
        FLEET_STEWARD_STATE_FILE: /data/state.json
        AIDENHQ_KERNEL_URL: http://10.231.0.1:3130
        FLEET_STEWARD_TOKEN_FILE: ${secrets.fleet_steward_token}
        FLEET_STEWARD_SERVICE_KEY_FILE: ${secrets.fleet_steward_service_key}
        FLEET_OPS_INTERVAL_MINUTES: "${settings.fleet_ops_interval_minutes}"
        # Under quiet start the detector keeps checking but files no check task until the owner turns the Steward on
        # (resuming its "Fleet Ops: daily digest" routine; service/src/detector.ts stewardOn).
        FLEET_STEWARD_QUIET_START: "${settings.quiet_start}"
generated_secrets:
  - fleet_steward_token
  - fleet_steward_service_key
data_version: 0 # its data dir's format: bumped by each forward-only migration (docs/configuration.md)
