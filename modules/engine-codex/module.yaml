name: engine-codex
description: Codex as the engine for runner jobs, on OpenRouter models through the model gateway, in an agent computer (codex-openrouter).
license: MIT
kernel: { engine: 1 }
# The engine `engineering` requires (spec §5.7.1).
provides: [ engine ]
providers:
  engine:
    # Primary engine for the Engineers (docs/design/codex-openrouter-engine.md): a Codex home per task with its agent's
    # instructions and skills, rebuilt before every run so no run leaves instructions, config, hooks or skills for a later one.
    - kind: codex-openrouter
      bin: bin/engine
      label: Codex on OpenRouter
      effort_key: modelReasoningEffort
      model_prefix: openrouter/
      gateway: true
      box: true
      # The engine an agent without `engine:` takes (another box engine, such as opencode, is used only by an agent that names it).
      default: true
      state: task
      reset: [AGENTS.md, AGENTS.override.md, skills, config.toml, auth.json, hooks.json, rules, plugins, .agents]
      # The job's skills (skills/) are its agent's module skills and AGENTS.md its compiled handbook, both placed by the kernel.
