name: security
description: "Security Watch (CVE scans of everything we run, verified with the web, fix tasks) and the Red Teamer (attacks our own apps and agents, reports with a proof of concept, never patches)."
roles:
  declares:
    - { id: security-verdict, description: "finding_verdict: apps-mcp records a verdict on a src_security finding." }
requires:
  - warehouse
# Its schema and the views agents read with source_new (the warehouse's point, modules/warehouse/schemas/sources.json).
# A reviewed false positive (verdict not-affected, current until the finding changes) isn't new work.
contributes:
  warehouse.sources:
    - schema: src_security
      about: "src_security.findings (CVE and App Auditor findings in what we run, by target) / changes / zerowire (Cloudflare Zero Wire briefings on critical CVEs)"
      views:
        - { name: findings, time: ingested_at, project: target, tsv: true, exclude: { column: verdict, value: not-affected } }
        - { name: changes, time: observed_at, project: scope }
        - { name: zerowire, time: ingested_at, tsv: true }
settings:
  # An App Auditor MCP server behind Cloudflare Access (optional). Used only when this URL is set and its Access service
  # token is in the vault (app_auditor_cf_client_id / _secret); empty = off.
  app_auditor_url:
    default: ""
    type: url
agents:
  security-watch:
    skills: [ tasks.delegate-work ]
    department: security
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: high
    timeout_sec: 1800
    connections:
      # src_security (findings) through the warehouse tools; web reads (web search is on for every agent).
      apps: [ app_list, app_status, app_view, web_view, warehouse_query, source_new, source_ack, finding_verdict ]
      owner_channel: [ notify ]
      paperclip_tasks: [ task_current, task_get, task_comments, task_search, task_list, task_create, task_comment, task_block, task_cancel, task_finish, fleet_catalog ]
    # Its fix tasks go to the Fleet Steward, which routes them to the owner's chosen engineer (`?`: only when it is installed).
    delegate_to: [ fleet-steward? ]
    roles: [ security-verdict ]
  red-teamer:
    skills: [ tasks.delegate-work ]
    department: security
    # GLM: a lower refusal rate for offensive security work (owner, 2026-11-11). GLM Flash at high since 2026-11-13 (the
    # owner's pick after a blind bake-off).
    model: ~z-ai/glm-flash-latest
    reasoning_effort: high
    timeout_sec: 2400
    # No computer in v1: it attacks through apps-mcp's existing paths (app_view, app_api), so it adds no new network
    # exposure. A computer would need an explicit nft allowlist from the box to the apps (operator step). No source reads:
    # github-mcp has no file tools and app repos are private; white-box review is App Auditor's.
    connections:
      apps: [ app_list, app_status, app_view, app_api, web_view, warehouse_query ]
      owner_channel: [ notify ]
      paperclip_tasks: [ task_current, task_get, task_comments, task_search, task_list, task_create, task_comment, task_block, task_cancel, task_finish, fleet_catalog ]
    # Its fix tasks go to the Fleet Steward, which routes them to the owner's chosen engineer (`?`: only when it is installed).
    delegate_to: [ fleet-steward? ]
routines:
  security-scan:
    title: Security scan triage
    agent: security-watch
    description: |
      Today is {{date}}. The scanner finished a pass (or this is the daily check). Follow "Each run" in your handbook:
      triage the new src_security rows since your cursor, verify each new high or critical finding, file fix tasks
      (deduplicated by finding), alert the owner on confirmed high or critical, then close this task with counts.
    concurrency: coalesce_if_active
    webhook: true # fired by security-scanner after a pass that wrote anything
    webhook_base: http://paperclip:3100 # the scanner calls it from inside the compose network
    secrets_prefix: security_scan_webhook # setup saves <prefix>_url / _secret for the scanner
    schedules:
      - { cron: "0 10 * * *", timezone: "${settings.timezone}", label: "daily" }
  security-weekly:
    title: Security weekly summary
    agent: security-watch
    description: |
      Today is {{date}}. Follow "Weekly summary" in your handbook: news and advisories for our stack, the week's
      medium and low findings, open fix tasks; one summary task for the owner, then close this task.
    concurrency: skip_if_active
    schedules:
      - { cron: "0 9 * * 1", timezone: "${settings.timezone}", label: "Monday morning" }
  red-team-new:
    title: Red team new apps and agents
    agent: red-teamer
    description: |
      Today is {{date}}. Follow "Daily pass" in your handbook: diff each app and agent against its last Red team log line
      and test at the depth the change calls for, under the rules of engagement. Post one log comment with the exact tested
      shas, then close this task with one line (or "nothing new").
    concurrency: skip_if_active
    schedules:
      - { cron: "0 11 * * *", timezone: "${settings.timezone}", label: "daily" }
  red-team-weekly:
    title: Red team weekly pass
    agent: red-teamer
    description: |
      Today is {{date}}. Follow "Weekly rolling pass" in your handbook: the next targets in rotation, under the rules
      of engagement; findings with a proof of concept, each filed as a finding task (task_create), with notify (kind alert) for a high or
      critical one. Then close this task with counts.
    concurrency: skip_if_active
    schedules:
      - { cron: "0 14 * * 3", timezone: "${settings.timezone}", label: "Wednesday" }
labels:
  - { name: security, color: "#b91c1c" }
  - { name: red-team, color: "#7f1d1d" }
services:
  data: true
  run:
    # src_security writer: matches the host's SBOMs (ops/security-sbom.sh, a user timer) with grype. No Docker socket, no
    # host filesystem, no inbound port: it reads the SBOM folder read-only and writes the warehouse.
    security-scanner:
      build: ./scanner
      tmp: 64m
      egress: true # grype's vulnerability database, Cloudflare's Zero Wire feed, App Auditor
      links: [paperclip, sources] # Paperclip's webhook; the warehouse (shared sources)
      data:
        - sbom:/sbom:ro # written by the host timer
        - cache:/cache
        - registry:/registry:ro # the instance's apps.yaml, copied by scripts/compile.ts on every compile
      env:
        WAREHOUSE_PASSWORD_FILE: ${secrets.warehouse_src_security_password}
        SBOM_DIR: /sbom
        GRYPE_DB_CACHE_DIR: /cache/grype-db
        TMPDIR: /cache/tmp
        # The Security Watch routine's signed webhook (read at fire time; setup writes the files).
        SCAN_WEBHOOK_URL_FILE: ${secrets.security_scan_webhook_url}
        SCAN_WEBHOOK_SECRET_FILE: ${secrets.security_scan_webhook_secret}
        # App Auditor (optional): vibe audits of app repos, off while the token files are empty.
        AUDITOR_URL: "${settings.app_auditor_url}"
        AGENTS_ORG: "${settings.agents_org}"
        AUDITOR_CF_ID_FILE: ${secrets.app_auditor_cf_client_id}
        AUDITOR_CF_SECRET_FILE: ${secrets.app_auditor_cf_client_secret}
        # The instance's apps (agent-built, in the agents org); module apps such as the warehouse are product code.
        APPS_REGISTRY_FILES: /registry/apps.yaml
# Webhook files setup writes after compose is up (created empty first so compose starts), and App Auditor's Cloudflare
# Access service token (from AppSec; empty = the App Auditor pass is off).
optional_secrets:
  - security_scan_webhook_url
  - security_scan_webhook_secret
  - app_auditor_cf_client_id
  - app_auditor_cf_client_secret
generated_secrets:
  # src_security's warehouse login (ops/warehouse-sources.sh gives the role this password).
  - warehouse_src_security_password
data_version: 0 # its data dir's format: bumped by each forward-only migration (docs/configuration.md)
