# security module: its compose services. Paths are relative to this module; scripts/compile.mjs makes them absolute.

services:
  # src_security writer: matches the host's SBOMs (ops/security-sbom.sh, a user timer) with grype. No Docker socket, no
  # host filesystem, no inbound port: it reads the SBOM directory read-only and writes the warehouse.
  security-scanner:
    extends: { file: ../../compose.base.yaml, service: hardened }
    build: ./scanner
    image: aidenhq/security-scanner:local
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    environment:
      WAREHOUSE_PASSWORD_FILE: /run/secrets/warehouse_src_security_password
      SBOM_DIR: /sbom
      GRYPE_DB_CACHE_DIR: /cache/grype-db
      TMPDIR: /cache/tmp
      # The Security Watch routine's signed webhook (read at fire time; setup writes the files).
      SCAN_WEBHOOK_URL_FILE: /run/secrets/security_scan_webhook_url
      SCAN_WEBHOOK_SECRET_FILE: /run/secrets/security_scan_webhook_secret
      # App Auditor (optional): vibe audits of app repos, off while the token files are empty.
      AUDITOR_URL: "${settings.app_auditor_url}"
      AGENTS_ORG: "${settings.agents_org}"
      AUDITOR_CF_ID_FILE: /run/secrets/app_auditor_cf_client_id
      AUDITOR_CF_SECRET_FILE: /run/secrets/app_auditor_cf_client_secret
      # The instance's apps (agent-built, in the agents org); module apps such as the warehouse are product code.
      APPS_REGISTRY_FILES: /instance/apps.yaml
    volumes:
      # Written by the host timer (create it by running the timer once before enabling this module).
      - ${AIDENHQ_DATA_DIR:-./data}/security/sbom:/sbom:ro
      - security-cache:/cache
      # The app registry (names and repos) for App Auditor: the instance checkout's apps.yaml.
      - ${AIDENHQ_INSTANCE_DIR}:/instance:ro
    secrets:
      - warehouse_src_security_password
      - security_scan_webhook_url
      - security_scan_webhook_secret
      - app_auditor_cf_client_id
      - app_auditor_cf_client_secret
    dns: [ 1.1.1.1, 8.8.8.8 ] # see paperclip
    networks:
      - backplane # Paperclip's webhook
      - egress # grype's vulnerability database, App Auditor
      - sources # the warehouse (shared sources)
volumes:
  security-cache: {}
secrets:
  warehouse_src_security_password:
    file: ${AIDENHQ_SECRETS_DIR}/warehouse_src_security_password
  security_scan_webhook_url:
    file: ${AIDENHQ_SECRETS_DIR}/security_scan_webhook_url
  security_scan_webhook_secret:
    file: ${AIDENHQ_SECRETS_DIR}/security_scan_webhook_secret
  app_auditor_cf_client_id:
    file: ${AIDENHQ_SECRETS_DIR}/app_auditor_cf_client_id
  app_auditor_cf_client_secret:
    file: ${AIDENHQ_SECRETS_DIR}/app_auditor_cf_client_secret
