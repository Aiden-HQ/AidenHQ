name: google
description: "Google Workspace: Gmail, Calendar, Drive and Docs (reads), plus calendar changes and Gmail drafts, sends and labels as you, each reviewed first."
requires:
  - warehouse # its source schema lives in the shared warehouse
  - board # its guided setup
# Its schema and the views agents read with source_new (the warehouse's point, modules/warehouse/schemas/sources.json).
contributes:
  # AidenHQ needs one Google app (a Desktop-app OAuth client) per Workspace, pasted on the board (#/setup/google): the owner uses
  # their organisation's (modules/marketplace.json organisations: its client ID and secret fill the two fields), takes a colleague's,
  # or creates one (Workspace, or a personal Gmail with its own steps). Connect Google is the board's own route (/google/connect),
  # not a board.signins entry, so the flow names it as `connect_url`; the board shows its button and marks the flow done once an
  # account is connected. A Desktop client takes a loopback redirect only: Connect runs on the board's loopback address, or the
  # person pastes the redirected address back. The board's address never matters, so this works on a bare-IP board too.
  # `console_scopes` is the one place the scopes the steps ask for are listed (keep it equal to SCOPES in
  # connections/google-workspace-mcp/src/google.ts).
  board.setup_flows:
    - order: 40
      title: Google
      why: "Aiden reads your calendar, Drive and Gmail to brief you and follow up, and agents can change your calendar and send email as you, each change reviewed first."
      effort: "about 5 minutes, in the Google Cloud console"
      secrets: [google_client_id, google_client_secret]
      connect_url: /google/connect
      console_scopes:
        - https://www.googleapis.com/auth/calendar.events
        - https://www.googleapis.com/auth/drive.readonly
        - https://www.googleapis.com/auth/gmail.modify
      steps: |
        AidenHQ needs **one Google app per Workspace**: the app is what Google shows when you approve access. Pick the way that fits you; only its steps show.
      ways:
        - id: organisation
          title: Use your organisation's app
          detail: "Your organisation already runs one. Pick it from the list and there is nothing to make."
          effort: about a minute
          organisation: true
        - id: colleague
          title: A colleague already made one
          detail: "Ask them for the Client ID and Client secret, then enter them here."
          effort: about a minute
          paste: true
          steps: |
            1. Ask your colleague (or your Workspace admin) for the Google app's **Client ID** and **Client secret**. They find both in the [Google Cloud console, Clients](https://console.cloud.google.com/auth/clients): open the client and copy them.
            2. The client's type must be **Desktop app**.
            3. Enter both under **Paste the details**, then press **Connect**.
        - id: create
          title: Create one
          detail: "A Google Workspace address (you@company.com). About 5 minutes in the Google Cloud console."
          paste: true
          steps: |
            1. [Create a project](https://console.cloud.google.com/projectcreate) named `AidenHQ`, then **Create**.
            2. Turn on three APIs, pressing **Enable** on each: [Calendar](https://console.cloud.google.com/apis/library/calendar-json.googleapis.com), [Drive](https://console.cloud.google.com/apis/library/drive.googleapis.com), [Gmail](https://console.cloud.google.com/apis/library/gmail.googleapis.com).
            3. Open [Google Auth Platform](https://console.cloud.google.com/auth/overview) and press **Get started**. App name `AidenHQ`, your email as the support email. Audience: **Internal** (only your organisation can sign in, Google needs no review, sign-ins never expire; your Workspace admin may need to allow it). Your email again as the contact, accept the policy, **Create**.
            4. On [Data access](https://console.cloud.google.com/auth/scopes) press **Add or remove scopes**, paste these into *Manually add scopes* (one per line), then **Add to table**, **Update**, **Save**:
               {scopes}
            5. Open [Clients](https://console.cloud.google.com/auth/clients/create): type **Desktop app**, name `AidenHQ`, **Create**.
            6. Copy the **Client ID** and **Client secret** it shows and enter them under **Paste the details**, then press **Connect**.
        - id: personal
          title: Personal Gmail
          detail: "A gmail.com address. One extra step so sign-in does not expire every 7 days."
          paste: true
          domains: [gmail.com, googlemail.com]
          steps: |
            1. [Create a project](https://console.cloud.google.com/projectcreate) named `AidenHQ`, then **Create**.
            2. Turn on three APIs, pressing **Enable** on each: [Calendar](https://console.cloud.google.com/apis/library/calendar-json.googleapis.com), [Drive](https://console.cloud.google.com/apis/library/drive.googleapis.com), [Gmail](https://console.cloud.google.com/apis/library/gmail.googleapis.com).
            3. Open [Google Auth Platform](https://console.cloud.google.com/auth/overview) and press **Get started**. App name `AidenHQ`, your Gmail address as the support email. Audience: **External**. Your address again as the contact, accept the policy, **Create**.
            4. On [Data access](https://console.cloud.google.com/auth/scopes) press **Add or remove scopes**, paste these into *Manually add scopes* (one per line), then **Add to table**, **Update**, **Save**:
               {scopes}
            5. On [Audience](https://console.cloud.google.com/auth/audience) add your Gmail address under **Test users**, then press **Publish app** and confirm. Publishing keeps your sign-in from expiring every 7 days. You do not need to submit the app for verification.
            6. Open [Clients](https://console.cloud.google.com/auth/clients/create): type **Desktop app**, name `AidenHQ`, **Create**.
            7. Copy the **Client ID** and **Client secret** it shows and enter them under **Paste the details**, then press **Connect**.
            8. Google then shows **Google hasn't verified this app**. That is expected for your own app: press **Advanced**, then **Go to AidenHQ (unsafe)**, and allow access. You see this once.
  # The owner's day on Home (the board's own read, by id).
  board.reads:
    - { id: calendar_today, connection: google_workspace, tool: calendar_today }
  warehouse.sources:
    - schema: src_docs
      about: "src_docs.docs (Drive metadata + a cheap summary: a pointer, never evidence; read the doc live before acting) / changes"
      views:
        - { name: docs, time: ingested_at, project: container, tsv: true }
        - { name: changes, time: observed_at, project: scope }
connections:
  google_workspace:
    setup: "Follow the steps at #/setup/google on the board (one Desktop-app client per Workspace), then press Connect Google (from the board's loopback address, http://127.0.0.1:3121, or paste the redirected address back). By hand: `scripts/google-auth.sh <client.json>` once per account (`--email`, `--primary`)."
    guide: "Google Drive, Docs, Calendar and Gmail directly: a document's full current text, events, threads; and, when granted, calendar changes and Gmail drafts, sends and labels as the owner. Glean finds Drive documents faster; read them here when you need the exact current text."
    url: http://google-workspace-mcp:8081/mcp
    auth: google_service_key
    tools:
      read: [ calendar_list_events, calendar_today, calendar_search_events, calendar_get_event, drive_list_recent_files, drive_list_meeting_documents, drive_search_files, drive_read_file, gmail_search, gmail_inbox_new, gmail_read_thread, docs_read ]
      # gmail_inbox_ack moves only the caller's own inbox cursor (like source_ack).
      write: [ gmail_inbox_ack ]
      # Writes act as the owner on one account (`account`, default the primary): destructive, so only a grant naming one reaches
      # it and every call is a record the AI reviewer decides first (floor 1), except gmail_label: upkeep of the owner's own
      # labels (never system ones, never a new one; checked in code), which runs at once (Tier 0) like GitHub issue labels.
      # Rules for agents: skills calendar-changes and gmail-writes.
      destructive: [ calendar_create_event, calendar_update_event, calendar_delete_event, calendar_respond, gmail_draft, gmail_send, gmail_label ]
      unreviewed: [ gmail_label ]
    # The host's health probes (kernel/src/health.ts): one read each, as the narrowest agent granted the tool.
    health_probes:
      gmail: { tool: gmail_search, args: { query: "in:inbox", max_results: 1 } }
      calendar: { tool: calendar_list_events, args: { start: "2000-01-01T00:00:00Z", end: "2000-01-01T00:00:01Z", max_results: 1 } }
# Empty until pasted: with them empty, the client already in google_oauth.json (set up before the guided flow) stands.
optional_secrets:
  - google_client_id
  - google_client_secret
secrets:
  provided:
    - name: google_client_id
      setup:
        label: Google client ID
        public_client: true # a client ID is public: an organisation may list its Internal client's (modules/marketplace.json organisations)
        pattern: '^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$'
        help: "Ends in .apps.googleusercontent.com."
    - name: google_client_secret
      setup:
        label: Google client secret
        public_client: true # a Desktop client's secret is not confidential (Google's definition), so the catalog may carry it
        pattern: '^GOCSPX-[A-Za-z0-9_-]{20,60}$'
        help: "Starts with GOCSPX-."
  # Its own vault dir, read-write at /state: google_oauth.json, which a reconnect from the board (or google-auth.sh on the
  # host) rewrites with the new refresh token; the service reloads on change.
  state: true
services:
  run:
    google-workspace-mcp:
      build: ./connections/google-workspace-mcp
      tmp: 16m
      egress: true
      links: [board, sources] # the board's sign-in endpoints; the warehouse (shared sources)
      state: /state
      env:
        GOOGLE_CREDENTIALS_FILE: /state/google_oauth.json
        # The client pasted on the board; over the one in google_oauth.json when set.
        GOOGLE_CLIENT_ID_FILE: ${secrets.google_client_id}
        GOOGLE_CLIENT_SECRET_FILE: ${secrets.google_client_secret}
        MCP_TOKEN_FILE: ${secrets.google_service_key}
        # The board's sign-in endpoints: state per account, and reconnecting an expired one.
        GOOGLE_AUTH_TOKEN_FILE: ${secrets.google_auth_token}
        CALENDAR_ID: "${GOOGLE_CALENDAR_ID:-primary}"
        # calendar_today's day is the owner's.
        OWNER_TIMEZONE: "${settings.timezone}"
        # Shared sources (src_docs): its warehouse login, and the model credential for doc summaries.
        WAREHOUSE_PASSWORD_FILE: ${secrets.warehouse_src_docs_password}
        # Summaries go through the model gateway with the source writers' key, never OpenRouter's.
        OPENROUTER_KEY_FILE: ${secrets.gateway_source_key}
        OPENROUTER_BASE_URL: "${AIDENHQ_GATEWAY_URL:-http://10.231.0.1:8201}/api/v1"
# src_docs' warehouse login (ops/warehouse-sources.sh gives the role this password); compile creates it when missing.
generated_secrets:
  - google_service_key
  - warehouse_src_docs_password
