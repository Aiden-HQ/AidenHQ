name: google
description: "Google Workspace: Gmail, Calendar, Drive and Docs (reads), plus calendar changes and Gmail drafts, sends and labels as you, each reviewed first."
requires:
  - warehouse # its source schema lives in the shared warehouse
  - board # its guided setup
# Its schema and the views agents read with source_new (the warehouse's point, modules/warehouse/schemas/sources.json).
contributes:
  # Your own Google client (a Desktop app), pasted on the board (#/setup/google). Connect Google is the board's own route
  # (/google/connect), not a board.signins entry, so the flow names it as `connect_url`; the board shows its button and marks
  # the flow done once an account is connected. A Desktop client takes a loopback redirect only: Connect runs on the board's
  # loopback address, or the person pastes the redirected address back. The board's address never matters, so this works
  # on a bare-IP board too. An organisation that runs an Internal client lists it in the catalog instead
  # (modules/marketplace.json organisations): its client ID and secret fill the two fields, and these steps are skipped.
  board.setup_flows:
    - order: 40
      wizard: false
      title: Google
      why: "Aiden reads your calendar, Drive and Gmail to brief you and follow up, and agents can change your calendar and send email as you, each change reviewed first."
      effort: "about 5 minutes, in the Google Cloud console"
      secrets: [google_client_id, google_client_secret]
      console_url: https://console.cloud.google.com/auth/clients/create
      connect_url: /google/connect
      steps: |
        **Before you start: which kind of Google account?**
        - **Google Workspace (a company address): choose Internal.** Only people in your organisation can sign in, Google needs no review and sign-ins never expire. Your Workspace admin may need to allow it.
        - **Personal Gmail: choose External.** The app stays in *Testing*: only the test users you add can sign in, and **Google ends each sign-in after 7 days**, so you would reconnect weekly. Press **Publish app** on the Audience page to move it to *In production* and stop that. Google then shows an "unverified app" warning, which you accept once (Advanced, Go to app); you do not need to submit it for verification for your own use.

        1. [Create a project](https://console.cloud.google.com/projectcreate) (any name, for example `AidenHQ`).
        2. Turn on three APIs, pressing Enable on each: [Calendar](https://console.cloud.google.com/apis/library/calendar-json.googleapis.com), [Drive](https://console.cloud.google.com/apis/library/drive.googleapis.com), [Gmail](https://console.cloud.google.com/apis/library/gmail.googleapis.com).
        3. Open [Google Auth Platform](https://console.cloud.google.com/auth/overview) and press **Get started**. App name `AidenHQ`, your email as support email. Audience: **Internal** or **External** (above). Your email again as contact, accept the policy, **Create**.
        4. On [Data access](https://console.cloud.google.com/auth/scopes) press **Add or remove scopes**, paste these three (one per line) into *Manually add scopes*, **Add to table**, **Update**, **Save**:
        `https://www.googleapis.com/auth/calendar.events`
        `https://www.googleapis.com/auth/drive.readonly`
        `https://www.googleapis.com/auth/gmail.modify`
        5. External only: on [Audience](https://console.cloud.google.com/auth/audience) add your own address under **Test users**, then press **Publish app** to avoid the 7-day expiry.
        6. Open [Clients](https://console.cloud.google.com/auth/clients/create) and create a client of type **Desktop app** (not Web application; it needs no redirect address).
        7. Copy the **Client ID** and **Client secret** it shows, paste them below and save.
        8. Press **Connect** and approve access. If the browser then shows a page that does not load, that is expected: copy its address and paste it back on the board.
  warehouse.sources:
    - schema: src_docs
      about: "src_docs.docs (Drive metadata + a cheap summary: a pointer, never evidence; read the doc live before acting) / changes"
      views:
        - { name: docs, time: ingested_at, project: container, tsv: true }
        - { name: changes, time: observed_at, project: scope }
connections:
  google_workspace:
    setup: "Follow the steps at #/setup/google on the board (a Desktop-app client), then press Connect Google (from the board's loopback address, http://127.0.0.1:3121, or paste the redirected address back). By hand: `scripts/google-auth.sh <client.json>` once per account (`--email`, `--primary`)."
    guide: "Google Drive, Docs, Calendar and Gmail directly: a document's full current text, events, threads; and, when granted, calendar changes and Gmail drafts, sends and labels as the owner. Glean finds Drive documents faster; read them here when you need the exact current text."
    url: http://google-workspace-mcp:8081/mcp
    auth: google_service_key
    tools:
      read: [ calendar_list_events, calendar_search_events, calendar_get_event, drive_list_recent_files, drive_list_meeting_documents, drive_search_files, drive_read_file, gmail_search, gmail_read_thread, docs_read ]
      write: []
      # Writes act as the owner on one account (`account`, default the primary): destructive, so only a grant naming one reaches
      # it and every call is a record the AI reviewer decides first (floor 1), except gmail_label: upkeep of the owner's own
      # labels (never system ones, never a new one; checked in code), which runs at once (Tier 0) like GitHub issue labels.
      # Rules for agents: skills calendar-changes and gmail-writes.
      destructive: [ calendar_create_event, calendar_update_event, calendar_delete_event, calendar_respond, gmail_draft, gmail_send, gmail_label ]
      unreviewed: [ gmail_label ]
    # The host's health probes (kernel/src/health.ts): one read each, as the narrowest agent granted the tool.
    health_probes:
      gmail: { tool: gmail_search, args: { query: "in:inbox", max_results: 1 } }
      calendar: { tool: calendar_list_events, args: { start: "2000-01-01T00:00:00Z", end: "2000-01-01T00:00:01Z", max_results: 1 } }
# Empty until pasted: with them empty, the client already in google_oauth.json (set up before the guided flow) stands.
optional_secrets:
  - google_client_id
  - google_client_secret
secrets:
  provided:
    - name: google_client_id
      setup:
        label: Google client ID
        public_client: true # a client ID is public: an organisation may list its Internal client's (modules/marketplace.json organisations)
        pattern: '^[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com$'
        help: "Ends in .apps.googleusercontent.com."
    - name: google_client_secret
      setup:
        label: Google client secret
        public_client: true # a Desktop client's secret is not confidential (Google's definition), so the catalog may carry it
        pattern: '^GOCSPX-[A-Za-z0-9_-]{20,60}$'
        help: "Starts with GOCSPX-."
  # Its own vault dir, read-write at /state: google_oauth.json, which a reconnect from the board (or google-auth.sh on the
  # host) rewrites with the new refresh token; the service reloads on change.
  state: true
services:
  run:
    google-workspace-mcp:
      build: ./connections/google-workspace-mcp
      tmp: 16m
      egress: true
      links: [board, sources] # the board's sign-in endpoints; the warehouse (shared sources)
      state: /state
      env:
        GOOGLE_CREDENTIALS_FILE: /state/google_oauth.json
        # The client pasted on the board; over the one in google_oauth.json when set.
        GOOGLE_CLIENT_ID_FILE: ${secrets.google_client_id}
        GOOGLE_CLIENT_SECRET_FILE: ${secrets.google_client_secret}
        MCP_TOKEN_FILE: ${secrets.google_service_key}
        # The board's sign-in endpoints: state per account, and reconnecting an expired one.
        GOOGLE_AUTH_TOKEN_FILE: ${secrets.google_auth_token}
        # The board's https address: Connect there returns there (ops/setup.sh sets BOARD_LAN_URL).
        BOARD_URL: "${BOARD_LAN_URL:-}"
        CALENDAR_ID: "${GOOGLE_CALENDAR_ID:-primary}"
        # Shared sources (src_docs): its warehouse login, and the model credential for doc summaries.
        WAREHOUSE_PASSWORD_FILE: ${secrets.warehouse_src_docs_password}
        # Summaries go through the model gateway with the source writers' key, never OpenRouter's.
        OPENROUTER_KEY_FILE: ${secrets.gateway_source_key}
        OPENROUTER_BASE_URL: "${AIDENHQ_GATEWAY_URL:-http://10.231.0.1:8201}/api/v1"
# src_docs' warehouse login (ops/warehouse-sources.sh gives the role this password); compile creates it when missing.
generated_secrets:
  - google_service_key
  - warehouse_src_docs_password
