name: google
description: "Google Workspace: Gmail, Calendar, Drive and Docs (reads)."
connections:
  google_workspace:
    setup: "Press Connect Google on the board (on an ops/setup.sh host, from its https address; otherwise from http://127.0.0.1:3121). By hand: `scripts/google-auth.sh <client.json>` once per account (`--email`, `--primary`)."
    guide: "Google Drive, Docs, Calendar and Gmail directly: a document's full current text, events, threads. Glean finds Drive documents faster; read them here when you need the exact current text."
    url: http://google-workspace-mcp:8081/mcp
    auth: google_service_key
    tools:
      read: [ calendar_list_events, calendar_search_events, calendar_get_event, drive_list_recent_files, drive_list_meeting_documents, drive_search_files, drive_read_file, gmail_search, gmail_read_thread, docs_read ]
      write: []
secrets:
  # Its own vault dir, read-write at /state: google_oauth.json, which a reconnect from the board (or google-auth.sh on the
  # host) rewrites with the new refresh token; the service reloads on change.
  state: true
services:
  run:
    google-workspace-mcp:
      build: ./connections/google-workspace-mcp
      tmp: 16m
      egress: true
      links: [board, sources] # the board's sign-in endpoints; the warehouse (shared sources)
      state: /state
      env:
        GOOGLE_CREDENTIALS_FILE: /state/google_oauth.json
        MCP_TOKEN_FILE: ${secrets.google_service_key}
        # The board's sign-in endpoints: state per account, and reconnecting an expired one.
        GOOGLE_AUTH_TOKEN_FILE: ${secrets.google_auth_token}
        # The board's https address: Connect there returns there (ops/setup.sh sets BOARD_LAN_URL).
        BOARD_URL: "${BOARD_LAN_URL:-}"
        CALENDAR_ID: "${GOOGLE_CALENDAR_ID:-primary}"
        # Shared sources (src_docs): its warehouse login, and the model credential for doc summaries.
        WAREHOUSE_PASSWORD_FILE: ${secrets.warehouse_src_docs_password}
        # Summaries go through the model gateway with the source writers' key, never OpenRouter's.
        OPENROUTER_KEY_FILE: ${secrets.gateway_source_key}
        OPENROUTER_BASE_URL: "${AIDENHQ_GATEWAY_URL:-http://10.231.0.1:8201}/api/v1"
# src_docs' warehouse login (ops/warehouse-sources.sh gives the role this password); compile creates it when missing.
generated_secrets:
  - google_service_key
  - warehouse_src_docs_password
