# github module: its compose services. Paths are relative to this module; scripts/compile.mjs makes them absolute.

services:
  github-mcp:
    extends: { file: ../../compose.base.yaml, service: hardened }
    build: ./connections/github-mcp
    image: aidenhq/github-mcp:local
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      GITHUB_TOKEN_FILE: /run/secrets/github_token
      GITHUB_COMMENT_ORGS: "${GITHUB_COMMENT_ORGS:-}"
      # commit_status_set (the design-review check) writes only here, as the GitHub App.
      GITHUB_AGENTS_ORG: "${settings.agents_org}"
      MCP_TOKEN_FILE: /run/secrets/github_mcp_token
      # Shared sources (src_github): the orgs it syncs (github_orgs plus the agents org) and its warehouse login.
      GITHUB_SYNC_ORGS: "${settings.github_sync_orgs}"
      WAREHOUSE_PASSWORD_FILE: /run/secrets/warehouse_src_github_password
    volumes:
      # The instance's GitHub App: app_id + key.pem, for read-only repo reads and org Projects boards.
      - ${AIDENHQ_SECRETS_DIR}/github-app:/secrets/github-app:ro
    secrets:
      - github_token
      - github_mcp_token
      - warehouse_src_github_password
    dns: [ 1.1.1.1, 8.8.8.8 ] # see paperclip
    networks:
      - backplane
      - egress
      - sources # the warehouse (shared sources)
secrets:
  github_mcp_token:
    file: ${AIDENHQ_SECRETS_DIR}/github_mcp_token
  warehouse_src_github_password:
    file: ${AIDENHQ_SECRETS_DIR}/warehouse_src_github_password
