name: github
description: "One GitHub sign-in (a code typed at github.com). Agents read and write GitHub as you, labelled as AidenHQ: issues, pull requests, reviews, checks, Projects boards and code (GitHub's own MCP server, read-only, and AidenHQ's GitHub tools). The code host runs on your account too: task workspaces and cache clones, push, PR, merge at the reviewed head once green, create_repo, land, and the git rules that tier those writes."
license: MIT
# It absorbed the codehost-github module (connections-simple §1): an instance listing codehost-github runs this one. `runner` is the
# code host's name before modules existed: records filed as runner.<action> read as github.<action> (kernel/src/kind-rename.ts).
replaces: [ codehost-github, runner ]
requires:
  - warehouse # its source schema lives in the shared warehouse
  - board # its sign-in and setup flow
# The GitHub process (service `github`) is the only holder of the owner's GitHub token and the GitHub App's key (its /state; every write's identity: docs/design/github-identity.md) and the owner of all git
# state. Its write kinds github.{push,pr,merge,close,create_repo} go through the kernel's /v1/writes, with service/src/plan.ts as
# their executor@1 plan. Outside the fleet org, the product repo and the listed repos (listed_repos) it is PR-only (no merge; create_repo is
# Tier 0 in any github_orgs org). It talks to the kernel with its own token (codehost_github_token): the module's roles below go
# with that token alone, never with the connections' service key (kernel/src/identity.ts), so a call on the connections' key
# holds no kernel role and can't report a write's outcome.
privileged: [ git-credential ]
# The code host role (docs/design/codehost-local.md §2): it hosts every org codehost-local doesn't own, once GitHub is connected.
provides: [ codehost ]
# Its sign-in and setup flow on the board (modules/board/schemas/), and its schema and the views agents read with source_new
# (the warehouse's point, modules/warehouse/schemas/sources.json).
contributes:
  # The device sign-in (a code typed at github.com, no redirect): github-mcp holds the token and uses it for both connections.
  board.signins:
    - { id: github, label: GitHub, mode: device, status_url: "http://github:8087/auth/status", connect_url: /github/connect, callback: /github/callback,
        missing: "The agents can't read GitHub until it is.", stopped: "The agents can't read GitHub." }
  board.setup_flows:
    - order: 130
      title: GitHub
      why: "Agents work on GitHub as you: read, comment, open and merge pull requests, create repos, each write reviewed first and labelled as AidenHQ."
      effort: about a minute, needs your GitHub login
      signin: github
      steps: |
        1. Press **Connect GitHub**. A short code appears.
        2. Open [github.com/login/device](https://github.com/login/device), sign in, and type the code.
        3. Allow **AidenHQ**. An organization may ask an owner to approve it first.

        Agents act as you on GitHub. Everything they write says so: commits carry `Co-authored-by: AidenHQ <agent name>`, text ends with a link to [AidenHQ](https://aidenhq.ai). Nothing an agent does on GitHub counts as your approval; your word reaches them only through AidenHQ. To keep agent-built repos on GitHub, set **Fleet repos** to an organization you can create repositories in (`github_fleet_org`).

        With the CI module on, GitHub asks for one more permission (`admin:org`, to register the org's self-hosted runners): press **Reconnect** on the GitHub card when it says so.

        A change under `.github/workflows/` needs GitHub's `workflow` permission too; a sign-in made before AidenHQ asked for it keeps its old grant, so press **Reconnect** when the card's **Workflow files** row says it needs permission.
  warehouse.sources:
    - schema: src_github
      about: "src_github.issues / projects / project_items / changes / users"
      identity: users
      views:
        - { name: issues, time: ingested_at, repo: repo, tsv: true }
        - { name: project_items, time: ingested_at, repo: repo, project: project, tsv: true }
        - { name: changes, time: observed_at, repo: scope, project: scope }
settings:
  # The AidenHQ OAuth App's client ID: the device sign-in's client (public, no secret, like `gh`'s). Set it only to sign in
  # through your own OAuth App (device flow enabled); empty: the sign-in says it isn't configured.
  github_oauth_client_id:
    title: GitHub OAuth client id
    default: Ov23liJ0rnoi7nCmm4FZ
    pattern: '^[A-Za-z0-9._-]{8,40}$'
  # GitHub's own MCP server: the sign-in's token is its bearer.
  github_mcp_url:
    title: GitHub MCP address
    default: https://api.githubcopilot.com/mcp/
    type: url
    host: api.githubcopilot.com
  # The repos the Maintainer watches, triages and fixes (issues only: pull requests are Ship's), each reachable by the owner's GitHub sign-in: a bare "owner/name"
  # (every default) or { repo, ... } with any of these fields (kernel/sdk/src/maintained-repos.ts parses and defaults them;
  # the Maintainer page edits them). Duties: `fixes` (default true: validate `fix_label` issues and see fixes through), `triage`
  # (off, new, new+backlog; default new), `features` (default false: label feature requests feature-request and build those
  # a trusted collaborator labels agent-build). `actions` ({ duplicate, invalid, fixed }, each comment, label or close; default label): what a verdict
  # does, always with a comment saying why; label adds the verdict's label (duplicate, invalid, fixed) and leaves the issue
  # open. `no_reply_days` (null): close an issue that many days after asking its reporter for details with no reply.
  # `inactive_issue_days` (null): one notice after that many quiet days, the close 14 days later. `fix_label` (default
  # agent-fix). `trusted`: who may vouch for a label (the owner's login is an admin): admin, maintain or write (default admin
  # and maintain; github-mcp refuses any other role); it lists every role that counts: [write] alone trusts no admin.
  # `protected_labels` (default roadmap, wip, blocked): skipped by every automatic close. The Maintainer's own list: Ship and
  # code review keep theirs. While the maintainer module is on, its repos are also listed repos (compile's listed_repos), where
  # the fleet's work may merge and close. Read by github-mcp (maintainer.ts), which the Maintainer's tools and watcher go
  # through. Dependabot and quiet contributor PRs are fields of a repo's ship entry (the ship module's `ship` setting); an
  # entry still carrying `dependabot` or `quiet_pr_days` fails the compile, naming that new home.
  maintainer_repos:
    title: Maintained repos
    default: []
    entry: repo
    pattern: '^[\w.-]+/[\w.-]+$'
  # The org the fleet's repositories live in: bare create_repo names and `@agents` grants resolve to it. Chosen once from the
  # orgs the owner can create repos in; unset, the fleet's repos live in `local`. It survives a disconnect (create_repo then
  # refuses "GitHub isn't connected" rather than switching to `local`).
  github_fleet_org:
    title: Fleet GitHub org
    pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$'
  # GitHub orgs/users (besides the fleet org) the owner allows: the apps platform builds trusted apps from their repos, and
  # create_repo may create in them.
  github_orgs:
    title: Allowed GitHub orgs
    default: []
    pattern: '^[A-Za-z0-9][A-Za-z0-9-]{0,38}$'
    # An org added here is trusted for apps, and create_repo may write there.
connections:
  github:
    setup: "Open its setup on the board (#/setup/github) and press Connect GitHub."
    guide: "AidenHQ's GitHub tools: live issue and PR state, reviews, checks, a failed job's log, organization Projects (v2) boards (roadmaps, status, iterations: `github_project_read`). For code, commits, releases and search use github_official; Glean's `code_search` finds code across repos."
    url: http://github:8086/mcp
    auth: github_service_key
    tools:
      # github_product_issue_status: a status lookup of product-bug issues (number, state, fixing commit; no issue text), so a
      # read: tagged destructive it filed a Tier 2 owner card on every check.
      read: [ github_whoami, github_project_read, github_issue_read, github_search_issues, github_job_log, github_pr_files, github_pr_threads, github_product_issue_status, github_issue_link, github_issue_list, github_label_events, github_repo_tree, github_repo_file ]
      write: []
      # github_issue_link: the same report as an owner's prefilled "new issue" link, for an install where GitHub isn't connected (no
      # write, no role): named, so only the agents that report product bugs hold it.
      # github_product_issue: product bugs on settings.product_repo only, as the chosen GitHub actor, and only for the product-issues role
      # (the Maintainer, for the Fleet Steward). Tagged destructive so neither `github: read` nor `github: write` includes it: an agent gets it only by
      # naming it.
      # The Maintainer's writes (github_issue_label, github_issue_state; github_issue_comment scrubs on the product repo and
      # the maintained repos) act on the maintained repos only (setting maintainer_repos), refuse an untrusted label and scrub outgoing text. Tagged destructive for the same
      # reason: no shorthand grants them, and the Maintainer names them when it graduates.
      # The Maintainer's reads (github_issue_list, github_label_events, github_repo_tree,
      # github_repo_file) are reads tagged `named`: `read` would hand them to every agent with `github: read`, so only a
      # grant that names one reaches it. The Maintainer's module names them when it graduates. github_pr_threads (a pull request's review
      # threads, replies included: code review's reads) is named the same way.
      named: [ github_issue_link, github_issue_list, github_label_events, github_repo_tree, github_repo_file, github_pr_threads ]
      # github_release_graduate: a maintained repo's stalled pre-release made a full release, only when code verifies the stall
      # wasn't the candidate's (connections/github-mcp/src/graduate.ts); the Maintainer's, by name.
      # The writes an agent makes through the github connection (a comment, an issue, its state, a review, a failed job's re-run) post as the chosen GitHub actor (the App where installed, else the owner):
      # destructive, so only a grant naming one reaches it and every call is a record the AI reviewer decides first (floor 1),
      # except the `unreviewed` ones (an issue's labels and state, a thread reply: owner, 2026-11-23), which run at once (Tier 0)
      # after code's refusals (instance details).
      destructive: [ github_issue_comment, github_issue_create, github_issue_update, github_pr_review, github_pr_thread_reply, github_pr_thread_resolve, github_rerun_failed, github_product_issue, github_issue_label, github_issue_state, github_release_graduate ]
      unreviewed: [ github_issue_label, github_issue_state, github_pr_thread_reply ]
    # The host's health probe (kernel/src/health.ts): the owner's sign-in answers a read.
    health_probes:
      github: { tool: github_whoami }
    # The change feed's events (service/src/feed.ts, kernel events.ts; GitHub's webhook names): routines subscribe to a repo their
    # agent's github_issue_read reaches, code services through `subscribes:`. Seen within a minute of the change.
    events:
      resource: "owner/repo"
      kinds: [ pull_request.opened, pull_request.synchronize, pull_request.ready_for_review, pull_request.converted_to_draft, pull_request.edited, pull_request.closed, pull_request.reopened, pull_request.labeled, pull_request.unlabeled, issues.opened, issues.labeled, issues.unlabeled, issues.closed, issues.reopened, issue_comment.created, pull_request_review_comment.created, pull_request_review.submitted, check_run.completed, status, push, github.resync ]
      filter: [ kind, author, contains ]
      reads: [ github_issue_read ]
  # GitHub's own MCP server (its default toolsets), passed through as the signed-in owner (src/vendor/proxy.ts), read-only
  # (spec §4): every tool not tagged `read` here is refused in github-mcp (official.ts denyExcept, from GITHUB_OFFICIAL_READ).
  # Mutations go only through AidenHQ's typed tools, which sign them and file their write records.
  github_official:
    setup: "Open its setup on the board (#/setup/github) and press Connect GitHub."
    guide: "GitHub's own MCP server, as you: file contents, commits, branches, tags, releases, code, commit, issue, PR, repository and user search, issue and PR details. Use github for CI logs, Projects boards and the Maintainer's tools."
    url: http://github:8087/mcp
    auth: github_service_key
    tools:
      read: [ get_me, get_file_contents, get_commit, list_commits, list_branches, list_tags, get_tag, list_releases, get_latest_release, get_release_by_tag, get_label, get_teams, get_team_members,
              list_repository_collaborators, list_issue_types, list_issue_fields, issue_read, list_issues, search_issues, pull_request_read, list_pull_requests, search_pull_requests, search_code,
              search_commits, search_repositories, search_users ]
      write: []
      destructive: []
# Check jobs read the repos the code host lands through the kernel's snapshot.
codehost:
  snapshot: { repos: [ "*/*" ] }
# The PR watch is the ship module's (modules/ship/service/src/loop.ts): it reaches GitHub, code review's verdict and
# pr-tasks.json through this service's /internal/ship/* routes (service/src/ship-routes.ts), with ship's own token.
# A cancelled task's PR is left open and intact for a successor; a done task's unmerged PR is closed.
# The release train (service/src/train.ts, W3) files the instance's pin bump as a kernel.apply, which the
# kernel plans and tiers like any apply (kernel.apply), on a task for the Platform Engineer's role (kernel.tasks).
# It reads that task's records (kernel.work-read) to adopt a bump whose own state was lost and follow it to its end, and lists
# the open tasks of its own `release:instance:` source family (GET /v1/tasks?source=, role kernel.tasks) to settle a bump
# whose process is gone. That listing reads no other source and closes no other family (kernel/src/modtasks.ts).
# All of them go with the code host's own token (codehost_github_token), never with github-mcp's service key.
roles:
  # kernel.checks: ship's repair check job (the `repair` write).
  requests: [ kernel.tasks, kernel.apply, kernel.work-read, kernel.facts, kernel.owner-notice, kernel.events, kernel.checks ]
# Flow (docs/design/flow.md): the facts the code host emits through the kernel (service/src/flow.ts), each carrying the task that opened
# the PR (pr-tasks.json). pr.opened and issue.opened carry the author (author_kind: agent, owner or outside, from GitHub's author_association); pr.pushed is a head
# change after opening (version = the head); pr.closed is a close without a merge. CI is one interval per head (subject pr:<repo>#<n>@<head>); a merge-queue wait and its end are
# work.waiting and work.resumed with the reason. `code.*` come from the churn pass and the owner's backfill (service/src/churn.ts).
facts:
  pr.opened: { subject: pr }
  pr.pushed: { subject: pr }
  pr.closed: { subject: pr }
  pr.checks_started: { subject: pr }
  pr.checks_completed: { subject: pr }
  pr.merged: { subject: pr }
  pr.reverted: { subject: pr }
  work.waiting: { subject: pr, reasons: [ checks, code_review, retry, conflict, github ] }
  work.resumed: { subject: pr, reasons: [ checks, code_review, retry, conflict, github ] }
  code.added: { subject: pr }
  code.rewritten: { subject: pr }
  issue.opened: { subject: issue }
  issue.labeled: { subject: issue }
stages:
  - { name: ci, label: CI, from: pr.checks_started, to: pr.checks_completed }
  - { name: merge_queue, label: Merge queue, from: work.waiting, to: work.resumed }
# The PR's journey (docs/design/flow-insights.md §2): from its issue to its deploy. Each phase starts at the first of its facts; every
# further one is a round. The review phase is the AI reviewer's look at a pr or push filing, merge review at the merge filing (the
# kinds are the record kinds `where` matches; records filed under a replaced module's name are renamed at start, kind-rename.ts).
# One declaration, identical in every code host (the compiler checks): a phase a host never records is simply absent.
journeys:
  - name: pr
    label: Pull requests
    subject: pr
    phases:
      - { name: triage, label: Triage, from: [ issue.opened ] }
      - { name: pickup, label: Pickup, from: [ issue.labeled, task.created ] }
      - { name: coding, label: Coding, from: [ job.started ] }
      - { name: review, label: AI review, from: [ record.filed ], where: { kind: [ github.pr, github.push, codehost-local.pr, codehost-local.push ] } }
      - { name: open, label: PR open, from: [ pr.opened ] }
      - { name: ci, label: CI, from: [ pr.checks_started, pr.pushed ] }
      - { name: merge, label: Merge review, from: [ record.filed ], where: { kind: [ github.merge, codehost-local.merge ] } }
      - { name: deploy, label: Deploy, from: [ pr.merged ] }
    end: [ pr.deployed, pr.closed ]
# The code host's check job recipes (kernel/src/checkjobs.ts), whose signed receipts it verifies before it lands: a repo's fast
# check and its tests (secret scan, supply chain, lint, tests, build), run in a credential-free box from checks/. The kernel
# reads whether a fast check is due from the base (`declares`), never from the change.
check_jobs:
  fast:
    dir: checks
    argv: [ bash, /aidenhq-out/recipe/fast.sh ]
    timeout_min: 10
    title: "the fast check (`aidenhq:fast-check`)"
    spec: { base: sha }
    declares: "aidenhq:fast-check"
  tests:
    dir: checks
    argv: [ bash, /aidenhq-out/recipe/tests.sh ]
    timeout_min: 30
    title: "the secret scan, supply-chain checks, lint, tests and build"
    spec: { base: sha }
# github_bot_token: the owner's GitHub bot account (spec §6.9, decision 25): a fine-grained token that forks our repos and
# files issues and pull requests upstream from that fork, nothing more. Asked for on the first-run page (/setup); empty =
# nothing goes upstream.
secrets:
  state: true # its own vault dir, read-write at /state: the sign-in's token, and the instance's optional GitHub App (github-app/{app_id,key.pem}, written by the kernel's /setup/github-app; its identity is read from GitHub)
  provided:
    - name: github_bot_token
      setup:
        label: GitHub bot token
        pattern: '^(github_pat_[A-Za-z0-9_]{20,250}|gh[pousr]_[A-Za-z0-9]{30,250})$'
        help: "A fine-grained token of a GitHub account you made for this AidenHQ: it files issues and pull requests to AidenHQ from its own fork. Without it, nothing is sent upstream."
services:
  data: true # the code host's cache clones, merge queue, held writes, PR-task map and release train
  run:
    # The GitHub process (spec 2026-11-20-github-owner-identity §1): both connections (8086 AidenHQ's tools, 8087 GitHub's own
    # MCP and the board's sign-in at /auth/*) and the code host (8100: the executor of the write kinds below, the merge queue,
    # the release train and tidying, ship's GitHub calls (/internal/ship/*), and the typed GitHub operations other modules get through the
    # kernel, /v1/codehost/:op), in one Node process on the owner's one sign-in. Its token stays in this container's /state; it
    # mounts the job workspaces. It starts with the module and answers "GitHub isn't connected" until the owner connects.
    github:
      build: .
      tmp: 64m
      port: 8100
      egress: true # GitHub, and the kernel's listener (a host address)
      links: [board, sources] # the board's sign-in and health check; the warehouse (shared sources)
      state: /state
      data: ["cache:/cache"]
      workspaces: /tasks
      env:
        AIDENHQ_KERNEL_URL: http://10.231.0.1:3130
        GITHUB_STATE_DIR: /state
        GITHUB_OAUTH_CLIENT_ID: "${settings.github_oauth_client_id}"
        GITHUB_MCP_URL: "${settings.github_mcp_url}"
        # The board's sign-in endpoints: state, and starting a device sign-in.
        GITHUB_AUTH_TOKEN_FILE: ${secrets.github_auth_token}
        # github_fleet_org: where the fleet's repos live on GitHub; create_repo's bare names land here (compile
        # derives it).
        GITHUB_FLEET_ORG: "${settings.github_fleet_org}"
        # `1` while the ci module is on (the sign-in then asks for admin:org), and the official MCP's read tools (everything else is denied).
        GITHUB_CI: "${settings.github_ci}"
        GITHUB_OFFICIAL_READ: "${settings.github_official_read}"
        # Product bugs (github_product_issue) go only to this repo.
        GITHUB_PRODUCT_REPO: "${settings.product_repo}"
        # The owner-data scrub refuses this instance's own names and hosts (compiled from its settings) in anything filed
        # upstream.
        GITHUB_OWNER_TERMS: "${settings.owner_terms}"
        # The key of a product issue's opaque origin ids (scrub.ts originIds); without it nothing is filed upstream.
        GITHUB_ORIGIN_KEY_FILE: ${secrets.github_origin_key}
        # The kernel's bearer for both connections.
        MCP_TOKEN_FILE: ${secrets.github_service_key}
        # The module's own token: the kernel calls the executor and ops with it, and the process reports outcomes and files facts
        # with it.
        CODEHOST_KEY_FILE: ${secrets.codehost_github_token}
        # The maintained repos (setting maintainer_repos, as JSON): github-mcp's Maintainer tools act on these only.
        GITHUB_MAINTAINER_REPOS: "${settings.maintainer_repos}"
        # The listed repos (compile derives them: the Maintainer's and Ship's lists, while each module is on; comma-separated): the
        # code host merges and closes there as in the fleet org (plan.ts, merges.ts) and the change feed watches them.
        GITHUB_LISTED_REPOS: "${settings.listed_repos}"
        # Shared sources (src_github): the orgs it syncs (github_orgs plus the fleet org) and its warehouse login.
        GITHUB_SYNC_ORGS: "${settings.github_sync_orgs}"
        WAREHOUSE_PASSWORD_FILE: ${secrets.warehouse_src_github_password}
        CACHE_DIR: /cache
        ALLOWED_ORGS: "${settings.github_sync_orgs}" # the orgs create_repo may create in: github_orgs plus the fleet org (compile derives it)
        TASKS_DIR: /tasks
        PRODUCT_REPO: "${AIDENHQ_PRODUCT_REPO:-}"
        INSTANCE_REPO: "${AIDENHQ_INSTANCE_REPO:-}"
        # The repos code review gates (a mandatory combo; compile derives it): the merge queue merges a PR there only on code
        # review's pass for its head, asked at code-review:8098 (whose service joins this module's network) with this module's
        # own token, which code review checks with the kernel.
        GITHUB_REVIEW_GATED: "${settings.code_review_gated}"
        # `1` while the ship module is on (compile derives it): writes for an adopted PR (a leased push, approve, enqueue, an
        # adoption's merge) are checked against ship's GET /v1/generation at ship:8101 with this module's own token. Empty:
        # every such write is refused.
        GITHUB_SHIP: "${settings.ship_enabled}"
# The board's Connect/Reconnect for GitHub: its sign-in token, only while this module is on.
board_env:
  GITHUB_AUTH_TOKEN_FILE: ${secrets.github_auth_token}
# The kernel calls the kinds' plan, execute and status here with the code host's own token (executor@1); plan is service/src/plan.ts's
# rules on the state the service reads itself (the workspace, its cache clone, GitHub), never the args.
providers:
  executor:
    url: http://github:8100/aidenhq/v1/executor
    auth: codehost_github_token
# Each card is plan.ts's facts, read from git by the service: what it acts on, one sentence, and the diff the reviewer reads.
# How the fleet reports a product bug, for the agents that hold the link tool (the Fleet Steward and the chief of staff).
prompts:
  - { id: product-bugs, file: prompts/product-bugs.md, when: { tools: [ github.github_issue_link ] } }
writes:
  # push, pr and merge are repository writes: plan.ts returns the files each changes, read from git, and the kernel runs the
  # platform check on them (writes.ts).
  push: { args: schemas/push.json, floor: 0, card: &card { target: "{{target}}", sentence: "{{sentence}}", details: "{{diff}}" } }
  pr: { args: schemas/pr.json, floor: 0, card: *card }
  merge: { args: schemas/merge.json, floor: 0, filed_by: [ ship ], card: *card }
  close: { args: schemas/close.json, floor: 0, card: *card }
  create_repo: { args: schemas/create_repo.json, floor: 0, card: *card }
  # approve and enqueue: the ship module's effects on one adopted PR, each bound to its head, target and generation (plan.ts
  # refuses any other filer and any mismatch). An adoption's records carry `generation` (and `attempt` for enqueue and merge) in
  # their args, so a new try at the same head is a new record.
  approve: { args: schemas/approve.json, floor: 0, filed_by: [ ship ], card: *card }
  enqueue: { args: schemas/enqueue.json, floor: 0, filed_by: [ ship ], card: *card }
  # retarget: a stacked adopted PR whose base PR merged, onto the default branch (GitHub retargets it only when that branch is deleted).
  retarget: { args: schemas/retarget.json, floor: 0, filed_by: [ ship ], card: *card }
  # retitle: an adopted PR whose only red check is the PR title (the `policy` job's Conventional Commit check): the title alone, at
  # the bound head and generation, filed by the PR's own task Engineer with `aidenhq ship title`. A title is a judgement, so ship's
  # loop never files one itself (only its module is named here); plan.ts refuses any PR that isn't that adoption's, at its head.
  retitle: { args: schemas/retitle.json, floor: 0, filed_by: [ ship ], card: *card }
  # repair: ship's deterministic repair of one adopted PR (its `ship-repair` check job, no model), written as the chosen GitHub actor (the App as one merge commit GitHub signs where installed).
  repair: { args: schemas/repair.json, floor: 0, filed_by: [ ship ], card: *card }
  # setup: the code host files this itself for another module's `setup` op (kernel/src/codehost.ts): the files to add on a new aidenhq/setup-<sha>
  # branch and its PR (an earlier setup PR is closed), which the AI reviewer reads whole (service/src/setup.ts).
  setup: { args: schemas/setup.json, floor: 1, card: *card }
  # publish_module: the owner's share of a local module (docs/design/sharing.md). Only his own board save files it, bound to
  # the preview's digest, source, repo, ref and base; a branch that moved since fails it, and he previews again.
  publish_module: { args: schemas/publish_module.json, floor: 2, filer: owner, stale: fail, card: *card }
# github_service_key: the kernel's bearer for github-mcp (both connections). github_auth_token: the board's, for its sign-in.
# codehost_github_token: the code host's own token (the kernel knows the module by it; the name it had as codehost-github).
# src_github's warehouse login (ops/warehouse-sources.sh gives the role this password); compile creates them when missing.
generated_secrets:
  - github_service_key
  - github_auth_token
  - github_origin_key
  - warehouse_src_github_password
  - codehost_github_token
