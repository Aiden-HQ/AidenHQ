name: github
description: "GitHub issues and pull requests: read, and comment when asked."
requires:
  - warehouse # its source schema lives in the shared warehouse
  - board # its setup flow
# Its schema and the views agents read with source_new (the warehouse's point, modules/warehouse/schemas/sources.json).
contributes:
  warehouse.sources:
    - schema: src_github
      about: "src_github.issues / projects / project_items / changes / users"
      identity: users
      views:
        - { name: issues, time: ingested_at, repo: repo, tsv: true }
        - { name: project_items, time: ingested_at, repo: repo, project: project, tsv: true }
        - { name: changes, time: observed_at, repo: scope, project: scope }
  board.setup_flows:
    - order: 130
      title: GitHub issues and pull requests
      why: Agents can read your issues, pull requests, reviews and checks.
      effort: about 3 minutes, needs your GitHub login
      secrets: [github_token]
      steps: |
        1. Open [GitHub's new token page](https://github.com/settings/personal-access-tokens/new?name=AidenHQ&description=Read+issues+and+pull+requests&expires_in=365&contents=read&issues=read&pull_requests=read&metadata=read) and sign in.
        2. Under **Resource owner**, pick the organization whose repositories Aiden should read (or yourself). If it asks for an owner's approval, ask an organization owner.
        3. Under **Repository access**, choose **All repositories**.
        4. Check the permissions say Contents, Issues and Pull requests: **Read-only**, then press **Generate token**.
        5. Copy the token (it starts with `github_pat_`) and paste it below.

        The token is stored in your private vault and is only used to read.
settings:
  # owner/repo of the AidenHQ product this instance runs (the warehouse module requires it): where the Maintainer reports product
  # bugs. Unset (null) leaves github_app_issue refusing.
  product_repo:
    default: null
  # Contributing to the product upstream (spec §6.9a; a platform setting, here until the platform module lands): "issues"
  # grants the connection's upstream tools (github_app_issue and its status read) to the agents that name them; "off" grants
  # none. "prs" is accepted and acts as "issues" until upstream PRs from a bot account's fork exist.
  upstream:
    default: issues
    values: ["off", "issues", "prs"]
  # The repos the Maintainer watches, triages and fixes, each with the GitHub App installed on it:
  # [{ repo: owner/name, label: agent-fix, trusted: [admin, maintain], after_merge: done }]. `label` is the label that asks
  # for a fix (default agent-fix). `trusted` is who may vouch for it besides the App: admin, maintain or write (default
  # admin and maintain; github-mcp refuses any other role). It lists every role that counts: [write] alone trusts no admin. `after_merge` is what follows a fix's merge: done (default: the
  # merged PR is the fix) or product-pin (this instance's product pin bump, its apply and the generation's health, for the
  # AidenHQ product repo this instance runs). Read by github-mcp (maintainer.ts), which the Maintainer's App tools and the
  # Maintainer's watcher go through.
  maintainer_repos:
    default: []
connections:
  github:
    setup: "Run `gh auth login`, then `scripts/github-auth.sh` on the host. The App's reads and writes go through codehost-github (`node ops/github-app-setup.mjs` sets the App up)."
    guide: "GitHub issues and pull requests directly: live state, reviews, checks. Organization Projects (v2) boards (roadmaps, status, iterations): `github_project_read`. Use Glean's `code_search` for code."
    url: http://github-mcp:8086/mcp
    auth: github_service_key
    tools:
      # github_app_issue_status: a status lookup of product-bug issues (number, state, fixing commit; no issue text), so a
      # read: tagged destructive it filed a Tier 2 owner card on every check.
      read: [ github_whoami, github_project_read, github_issue_read, github_search_issues, github_job_log, github_pr_files, github_app_issue_status, github_app_issue_list, github_app_label_events, github_app_repo_tree, github_app_repo_file ]
      # commit_status_set: the design-review check on agents-org PRs, as the GitHub App; it also needs the design-review role.
      write: [ commit_status_set ]
      # github_app_issue: product bugs on settings.product_repo only, as the GitHub App, and only for the product-issues role
      # (the Maintainer, for the Fleet Steward). Tagged destructive so neither `github: read` nor `github: write` includes it: an agent gets it only by
      # naming it.
      # The Maintainer's App writes (github_app_issue_comment, github_app_issue_label, github_app_issue_state) act on the
      # maintained repos only (setting maintainer_repos), refuse an untrusted label and scrub outgoing text. Tagged destructive for the same
      # reason: no shorthand grants them, and the Maintainer names them when it graduates.
      # The Maintainer's App reads (github_app_issue_list, github_app_label_events, github_app_repo_tree,
      # github_app_repo_file) are reads tagged `named`: `read` would hand them to every agent with `github: read`, so only a
      # grant that names one reaches it. The Maintainer's module names them when it graduates.
      named: [ github_app_issue_list, github_app_label_events, github_app_repo_tree, github_app_repo_file ]
      # The writes with the owner's token (a comment, an issue, its state, a review, a failed job's re-run) post as the owner:
      # destructive, so only a grant naming one reaches it and every call is a record the AI reviewer decides first (floor 1).
      destructive: [ github_issue_comment, github_issue_create, github_issue_update, github_pr_review, github_rerun_failed, github_app_issue, github_app_issue_comment, github_app_issue_label, github_app_issue_state ]
    # Granted only while the upstream setting allows issues.
    upstream: [ github_app_issue, github_app_issue_status ]
# The App tokens github-mcp asks the kernel for (POST /v1/codehost/token, owner authority): read-only on any repo or org the
# App covers (issues, pull requests, checks, Actions, contents for the Maintainer's file reads, org Projects boards and search),
# plus the two writes it makes as the App: issues (product bugs on settings.product_repo, the Maintainer's comments, labels and
# states on settings.maintainer_repos) and commit statuses (the design-review check, in the agents org only). github-mcp
# checks those targets itself; a grant can't name settings, so it covers whatever the App does.
codehost:
  token:
    repos: ["*/*"]
    perms: { contents: read, metadata: read, issues: write, pull_requests: read, checks: read, statuses: write, actions: read, organization_projects: read }
# The token github-mcp reads on every call (the root compose's github_token file), asked for by the setup flow above.
secrets:
  provided:
    - name: github_token
      setup:
        label: GitHub token
        pattern: '^(github_pat_[A-Za-z0-9_]{20,250}|gh[pousr]_[A-Za-z0-9]{30,250})$'
        help: "A fine-grained token with read-only access to the repositories Aiden should see."
services:
  run:
    github-mcp:
      build: ./connections/github-mcp
      tmp: 16m
      egress: true
      links: [board, sources] # the board's connection health check; the warehouse (shared sources)
      env:
        GITHUB_TOKEN_FILE: ${secrets.github_token}
        GITHUB_COMMENT_ORGS: "${GITHUB_COMMENT_ORGS:-}"
        # commit_status_set (the design-review check) writes only here, as the GitHub App.
        GITHUB_AGENTS_ORG: "${settings.agents_org}"
        # Product bugs (github_app_issue) go only to this repo.
        GITHUB_PRODUCT_REPO: "${settings.product_repo}"
        # The owner-data scrub refuses this instance's own names and hosts (compiled from its settings) in anything filed
        # upstream.
        GITHUB_OWNER_TERMS: "${settings.owner_terms}"
        # The key of a product issue's opaque origin ids (scrub.ts originIds); without it nothing is filed upstream.
        GITHUB_ORIGIN_KEY_FILE: ${secrets.github_origin_key}
        MCP_TOKEN_FILE: ${secrets.github_service_key}
        # The Maintainer's repos (setting maintainer_repos, as JSON): its App tools and the Maintainer's watcher act on these only.
        GITHUB_MAINTAINER_REPOS: "${settings.maintainer_repos}"
        # Shared sources (src_github): the orgs it syncs (github_orgs plus the agents org) and its warehouse login.
        GITHUB_SYNC_ORGS: "${settings.github_sync_orgs}"
        WAREHOUSE_PASSWORD_FILE: ${secrets.warehouse_src_github_password}
        # The GitHub App's tokens (repo reads, org Projects boards, the sync, its writes): the kernel's /v1/codehost/token, asked
        # for with MCP_TOKEN_FILE's token.
        AIDENHQ_KERNEL_URL: http://10.231.0.1:3130
# src_github's warehouse login (ops/warehouse-sources.sh gives the role this password); compile creates it when missing.
generated_secrets:
  - github_service_key
  - github_origin_key
  - warehouse_src_github_password
