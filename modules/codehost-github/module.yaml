name: codehost-github
description: "GitHub as the code host: task workspaces and the cache clones, repo-narrowed GitHub App tokens minted per write, git with the hardened arguments, push, PR, merge at the reviewed head once green, create_repo, deploy keys, land, and the git rules that tier those writes."
license: MIT
# The only holder of the GitHub App key (vault github-app/) and the owner of all git state. Its write kinds
# codehost-github.{push,pr,merge,create_repo,deploy_key} go through the kernel's /v1/writes, with service/src/plan.mjs as their
# executor@1 plan. Outside the agents org it is PR-only (no merge, no creation, no workflows), except product-repo merges the
# reviewer or the owner approved.
privileged: [ git-credential ]
# The merge queue, its gate rules and the reviewer-eval gate are the gate's own core: read by the reviewer and a second one on
# another model family (the path inventory, paths.yaml; the rest of this privileged module is the reviewer's).
paths:
  - sensitivity: panel
    owner_role: platform-engineer
    patterns: [ service/src/merges.ts, service/src/merge-gate.mjs, service/src/evalgate.ts ]
# The code host role (docs/design/codehost-local.md §2): it hosts every org codehost-local doesn't own (src/host.mjs).
provides: [ codehost ]
settings:
  # The agents org (where create_repo creates repos by default; any org the App is installed on and the runner's allowed_orgs lists works too): aidenhq-<instance_name> unless this names another.
  github_agents_org:
  # GitHub orgs/users (besides the agents org) whose repos the apps platform may build trusted apps from.
  github_orgs:
    default: []
# The owner's GitHub bot account (spec §6.9, decision 25): a fine-grained token that forks our repos and files issues and pull
# requests upstream from that fork, nothing more. Asked for on the first-run page (/setup); empty = nothing goes upstream.
secrets:
  provided:
    - name: github_bot_token
      setup:
        label: GitHub bot token
        pattern: '^(github_pat_[A-Za-z0-9_]{20,250}|gh[pousr]_[A-Za-z0-9]{30,250})$'
        help: "A fine-grained token of a GitHub account you made for this AidenHQ: it files issues and pull requests to AidenHQ from its own fork. Without it, nothing is sent upstream."
# The PR watch (service/src/pr-watch.ts, W5) files the Platform Engineer's Dependabot tasks and closes them
# (kernel.tasks), and wakes the task that opened a PR now conflicting with main (kernel.wake). It holds only its module token.
# The design review's tasks (service/src/design-review.ts, W6) are filed for the UI Reviewer's role and cancelled when
# superseded (kernel.tasks).
# The merge queue's reviewer eval (service/src/evalgate.ts) is a kernel check job (kernel.checks) whose signed receipt it
# verifies before a product or official modules PR merges.
# The release train (service/src/train.ts, W3) files the instance's pin bump as a kernel.apply, which the
# kernel plans and tiers like any apply (kernel.apply), on a task for the Platform Engineer's role (kernel.tasks).
roles:
  requests: [ kernel.tasks, kernel.wake, kernel.checks, kernel.apply ]
# The service (service/): the executor of the write kinds below, the merge queue, the release train, the PR watch, design
# reviews and tidying, and narrow GitHub operations other modules get through the kernel (/v1/codehost/:op). It alone mounts
# the App key (read-only), and the job workspaces.
services:
  data: true
  run:
    codehost-github:
      build: ./service
      tmp: 64m
      port: 8100
      egress: true # GitHub, and the kernel's listener (a host address)
      data: ["cache:/cache"]
      github_app: /github-app
      workspaces: /tasks
      env:
        AIDENHQ_KERNEL_URL: http://10.231.0.1:3130
        CODEHOST_KEY_FILE: ${secrets.codehost_github_token}
        CACHE_DIR: /cache
        AGENTS_ORG: "${settings.agents_org}" # github_agents_org, else aidenhq-<instance_name> (compile derives it)
        GITHUB_APP_DIR: /github-app
        TASKS_DIR: /tasks
        PRODUCT_REPO: "${AIDENHQ_PRODUCT_REPO:-}"
        INSTANCE_REPO: "${AIDENHQ_INSTANCE_REPO:-}"
        OWNER_NAME: "${settings.owner_name}"
# The kernel calls the kinds' plan, execute and status here with the module's own token (executor@1); plan is service/src/plan.mjs's
# rules on the state the service reads itself (the workspace, its cache clone, GitHub), never the args.
providers:
  executor:
    url: http://codehost-github:8100/aidenhq/v1/executor
    auth: codehost_github_token
writes:
  push: { args: schemas/push.json, floor: 0 }
  pr: { args: schemas/pr.json, floor: 0 }
  merge: { args: schemas/merge.json, floor: 0 }
  close: { args: schemas/close.json, floor: 0 }
  create_repo: { args: schemas/create_repo.json, floor: 0 }
# Other modules' GitHub access without the key: a module declares `codehost: { token: { repos, perms }, snapshot: { repos },
# clone: { repos } }` in its own module.yaml (owner authority) and asks the kernel's POST /v1/codehost/:op with its own token.
# The kernel checks that grant and calls /ops/token, /ops/snapshot or /ops/clone here with this module's key: only the kernel
# calls them (kernel/src/codehost.ts).
# Its own checks (the merge queue's reviewer eval: kernel.checks) read the repos it lands, through the kernel's broker.
codehost:
  snapshot: { repos: [ "*/*" ] }
generated_secrets:
  - codehost_github_token
