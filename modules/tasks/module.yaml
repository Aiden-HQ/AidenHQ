name: tasks
requires: [ grading ] # task_delegate files rubrics with it (its network)
description: "Task tools for every agent: read, create, delegate, comment on and close Paperclip tasks, as the calling agent."
connections:
  paperclip_tasks:
    setup: "Built in (tasks-mcp). If it is down, run `docker compose up -d tasks-mcp` on the host, then read `docker compose logs tasks-mcp`."
    url: http://tasks-mcp:8080/mcp
    auth: tasks_service_key
    returns: untrusted
    # advisor_ask and fanout_map bill the caller's run through the gateway.
    model_as_caller: true
    tools:
      # advisor_ask, fanout_map (models.mjs): model calls billed to the caller's run through the gateway; they change nothing.
      # memory_note: a comment on the caller's own memory inbox task (a note for the Librarian), so trial agents have it too.
      # coach_due, coach_evidence, coach_record: the Agent Coach's (fleet-audit role; services/board/src/coach.ts).
      read: [ task_current, task_get, task_search, task_list, task_team, task_comments, task_files, task_file_read, task_approvals, fleet_status, fleet_costs, fleet_catalog, handbook_list, handbook_read, handbook_section, advisor_ask, fanout_map, memory_note, coach_due, coach_evidence, fleet_generation_status ]
      # fleet_generation_status: the host's apply generations. Tagged named, so the read shorthand keeps it to the agents that
      # name it (the Maintainer's grants table does).
      named: [ fleet_generation_status ]
      write: [ coach_record, task_create, task_delegate, task_propose_rule, task_join, task_schedule, task_recurring, task_merge, task_update, task_pass_on, task_handoff, task_comment, task_finish, task_set_status, task_relay_owner_words, app_request_from_owner, fleet_control ]
services:
  data: true
  run:
    tasks-mcp:
      build: ./connections/tasks-mcp
      tmp: 16m
      links: [backplane] # no egress: the kernel's listener, the board's internal API and apps-mcp
      join: [grading] # rubrics, filed as the caller
      data: ["catalog:/catalog:ro"] # fleet_catalog's static half (scripts/paperclip-setup.mjs writes it)
      env:
        MCP_TOKEN_FILE: ${secrets.tasks_service_key}
        # The board's internal API (schedules, fleet tools), as the caller (X-AidenHQ-Caller).
        AIDENHQ_BOARD_URL: http://board:3122
        BOARD_INTERNAL_TOKEN_FILE: ${secrets.board_internal_token}
        APPS_MCP_URL: http://apps-mcp:8090
        GRADING_URL: http://grading:8096
        # advisor_ask, fanout_map: billed to the caller's run.
        AIDENHQ_GATEWAY_URL: "${AIDENHQ_GATEWAY_URL:-http://10.231.0.1:8201}"
        AIDENHQ_CATALOG_FILE: /catalog/catalog.static.json
generated_secrets:
  - tasks_service_key
data_version: 0 # its data dir's format: bumped by each forward-only migration (docs/configuration.md)
# With model-tools, every crew agent can consult the advisor; with memory, note a fact for the Librarian. Not from a computer,
# which can't reach the model gateway yet.
default_grants:
  - { tools: [ paperclip_tasks.advisor_ask ], when: { fields: { adapter: codex_local }, modules: [ model-tools ] }, unless: { fields: { image: true } } }
  - { tools: [ paperclip_tasks.memory_note ], when: { fields: { adapter: codex_local }, modules: [ memory ] }, unless: { fields: { image: true } } }
  # handbook_section: each crew agent reads its own on-demand handbook sections (setup writes them to catalog/sections).
  - { tools: [ paperclip_tasks.handbook_section ], when: { fields: { adapter: codex_local } } }
  # task_get, task_search: what the in-box `aidenhq task|tasks` call as the job. Task text is private data, so a crew agent holds
  # them, and an Engineer (dispatch: runner, profile: engineer) only with private_reads (its jobs get no web search); never a
  # check job, a trial agent or an agent of an untrusted module. (Compile reads an agent without `profile:` as crew.)
  - { tools: [ paperclip_tasks.task_get, paperclip_tasks.task_search ], when: { fields: { profile: crew } }, unless: { fields: { dispatch: runner, trial: true, isolation: untrusted } } }
  - { tools: [ paperclip_tasks.task_get, paperclip_tasks.task_search ], when: { fields: { private_reads: true } }, unless: { fields: { profile: check, trial: true, isolation: untrusted } } }
