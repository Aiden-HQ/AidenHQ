name: channel-telegram
description: "The owner's Telegram: their chat with Aiden (typed, and voice notes with the voice module), approval cards decided with single-use decision tokens, and a transport for owner-channel's notify. In the default bundle; Telegram itself is optional."
# A channel (channel@1): the kernel hands it each pending card with a single-use approve and reject token bound to the card's
# digest and this channel, and posts what the owner writes here as theirs (stamped [telegram]). It can approve every card it
# is sent: telegram_decide is how the owner limits that. As a transport, the kernel sends it owner-channel's messages one at a
# time (transport: below), with this module's own token.
privileged: [ speaks-as-owner ]
requires: [ board ] # its setup flow on the board
roles:
  requests: [ kernel.flow-read ] # /status and /waiting read each task's one state (GET /v1/tasks/state)
# Set up on the board (#/setup/channel-telegram, and onboarding's reach screen): paste the bot token, then tap a one-time link to
# pair the chat. Only the board can mint a code (it sends channel_telegram_pair_token); the paired chat is this service's own
# state (its data dir), so pairing needs no apply.
contributes:
  board.setup_flows:
    - order: 20
      title: Aiden on your phone
      why: "Chat with Aiden and approve its requests from Telegram, wherever you are."
      effort: about 2 minutes, needs the Telegram app
      secrets: [ telegram_notify_bot_token ]
      pair_url: http://channel-telegram-telegram:8089/pair
      steps: |
        1. In Telegram, open [BotFather](https://t.me/BotFather) (Telegram's official helper for making bots; the link opens it in the app) and tap **Start**.
        2. Send `/newbot`.
        3. Choose a name for your bot, for example *My Aiden*.
        4. Choose a username. It must end in "bot", for example `my_aiden_bot`.
        5. BotFather replies with a token: a long line of numbers, a colon and letters. Copy it, paste it below and press **Save**.
        6. Scan the QR code that appears next with your phone's camera (or tap the link on the phone) and press **Start**. That chat is now yours with Aiden.
providers:
  channel:
    transport: http://telegram:8089/transport/send
connections:
  # No tools (owner messages are owner-channel's notify): the board's Settings reads Telegram's and voice's state from its /healthz.
  telegram:
    setup: "Set up on the board: Settings, Aiden on your phone (#/setup/channel-telegram). Paste the BotFather token, then tap the pairing link in Telegram."
    url: http://telegram:8089/mcp
    auth: telegram_service_key
    tools:
      read: []
      write: []
settings:
  # Which approval cards may be decided in Telegram: all; standard (all but applies, which come as
  # text to decide on the board); or none (every card is text only).
  telegram_decide:
    default: all
    values: [ all, standard, none ]
services:
  data: true
  run:
    telegram:
      build: ./connections/telegram
      tmp: 16m
      egress: true
      data: ["telegram:/data"]
      env:
        TELEGRAM_DB: /data/telegram.sqlite
        OWNER_NAME: "${settings.owner_name}"
        OWNER_TIMEZONE: "${settings.timezone}"
        OWNER_COMPANY: "${settings.company_name}"
        TELEGRAM_DECIDE: "${settings.telegram_decide}"
        # Its own token at the kernel, and the kernel's bearer on /transport/send.
        CHANNEL_TOKEN_FILE: ${secrets.channel_telegram_token}
        TELEGRAM_NOTIFY_BOT_TOKEN_FILE: ${secrets.telegram_notify_bot_token}
        # The board's bearer for minting a pairing code (POST /pair).
        PAIR_TOKEN_FILE: ${secrets.channel_telegram_pair_token}
        # Upgrade only: an owner chat id from the host's .env is stored once when no chat is paired yet. Host-controlled
        # (.env), never instance.yaml: where task links point.
        TELEGRAM_OWNER_CHAT_ID: "${TELEGRAM_OWNER_CHAT_ID:-}"
        TELEGRAM_TASK_URL: "${TELEGRAM_TASK_URL:-}"
        # The board's https address (its setup flow sends the owner here): in-app `#/route` links in a message resolve
        # against it, since Telegram cannot open a bare `#/` route.
        BOARD_LAN_URL: "${BOARD_LAN_URL:-}"
        # Voice notes are transcribed on this host (audio never leaves it) by the optional voice module, whose Whisper joins
        # this module's network under this name; while it is off, a voice note gets "Voice notes are off" and typing works.
        WHISPER_URL: http://whisper:9000
# Telegram is optional: created empty when missing, so compose starts; an empty token means "not configured".
optional_secrets:
  - telegram_notify_bot_token
# Pasted in the board's setup flow (above), which then pairs the chat.
secrets:
  provided:
    - name: telegram_notify_bot_token
      setup:
        label: Telegram bot token
        pattern: '^[0-9]{6,12}:[A-Za-z0-9_-]{30,64}$'
        help: "From BotFather in Telegram: send /newbot, then copy the token it replies with."
# The connection's key (its health only), and this module's own token at the kernel (and the kernel's on its transport):
# compile creates them.
generated_secrets:
  - telegram_service_key
  - channel_telegram_token
  - channel_telegram_pair_token # the board's pairing bearer (compile also adds it for the flow's pair_url)
data_version: 0 # its data dir's format: bumped by each forward-only migration (docs/configuration.md)
