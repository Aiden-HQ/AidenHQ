# meetings module: its compose services. Paths are relative to this module; scripts/compile.mjs makes them absolute.

services:
  ops-mcp:
    extends: { file: ../../compose.base.yaml, service: hardened }
    build: ./connections/ops-mcp
    image: aidenhq/ops-mcp:local
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      OPS_MCP_CONFIG: /config/system.yaml
      OPS_MCP_TOKEN_FILE: /run/secrets/ops_service_key
      # Shared sources (src_meetings): its warehouse login.
      WAREHOUSE_PASSWORD_FILE: /run/secrets/warehouse_src_meetings_password
    volumes:
      - ${AIDENHQ_CONFIG_DIR:-./config}:/config:ro
      - ${AIDENHQ_DATA_DIR:-./data}/ops-mcp:/data/ops-mcp
      # Writable: ops-mcp renames recorder-named transcripts and deletes their audio once published.
      - ${TRANSCRIPTS_DIR:?set TRANSCRIPTS_DIR in .env}:/sources/transcripts
      # Vault folders and reference docs are appended by scripts/compile.mjs from VAULT_DIR, VAULT_FOLDERS and
      # KNOWLEDGE_BASES in the host's .env (validated; only the listed folders).
    secrets:
      - ops_service_key
      - paperclip_ops_key
      - warehouse_src_meetings_password
    # No egress: ops-mcp only talks to Paperclip and the warehouse on internal networks.
    networks:
      - backplane
      - sources # the warehouse (shared sources)
    depends_on:
      paperclip:
        condition: service_started
secrets:
  ops_service_key:
    file: ${AIDENHQ_SECRETS_DIR}/ops_service_key
  paperclip_ops_key:
    file: ${AIDENHQ_SECRETS_DIR}/paperclip_ops_key
  warehouse_src_meetings_password:
    file: ${AIDENHQ_SECRETS_DIR}/warehouse_src_meetings_password
