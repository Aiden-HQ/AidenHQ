# Slack app manifest for the owner channel (slack-live-mcp). Paste it into api.slack.com/apps → your app →
# "App Manifest" (or "Create New App" → "From an app manifest"), save, then reinstall when Slack asks.
#
# Tokens to save afterwards (secrets dir):
#   - App-level token, xapp-, scope connections:write (Basic Information → App-Level Tokens)  → slack_live_app_token
#   - Bot User OAuth Token, xoxb-                                                              → slack_live_bot_token
#   - User OAuth Token, xoxp- (the owner's)                                                    → slack_live_user_token
#
# What each part is for:
#   - Socket Mode: Slack connects out from the host; no public request URL (inbound stays closed).
#   - User events: every message in the owner's channels, private channels, DMs and group DMs, live. Slack Triage
#     reads them, and src_slack stores them (edits and deletes arrive as message subtypes).
#   - User scopes: the src_slack gap sync (conversations.history / replies over the owner's conversations,
#     users.conversations) and user names and emails (users.list).
#   - Bot: DMs the owner (notify_owner, urgent pages) and posts to the allowed channels (slack_post), labelled as a bot.
#   - Slack's MCP server (modules/slack, slack-mcp → mcp.slack.com): the search:read.* user scopes and the localhost
#     callback below are what `node src/auth.ts <client_id> …` signs in with.
#
#   - Channel binding (`/aiden assign-channel <agent-key>` in a channel binds it; `unassign-channel`; `channels` lists them):
#     the /aiden slash command (arrives over the socket, no request URL), the bot's channels:history and groups:history
#     (slack_channel_context reads a bound channel for its agent), and app_mention (already subscribed). Upgrading an app
#     made from an earlier copy of this manifest: add the slash command and the two history scopes, then reinstall;
#     afterwards invite the bot to each channel you assign (/invite @AidenHQ (AI)).
#
# NOT in the manifest (Slack has no manifest key for it): turn on MCP access by hand, once per app:
#   api.slack.com/apps → your app → "Agents" (sidebar) → "Slack Model Context Protocol (MCP) Server" → On.
#   Without it every slack-mcp call fails with "App is not enabled for Slack MCP server access". Only internal or
#   directory-published apps may use MCP. Org-ready (org_deploy_enabled) is not required; a workspace that requires
#   admin approval for apps queues the install for an admin (docs.slack.dev/ai/slack-mcp-server).
display_information:
  name: AidenHQ
  description: The owner's AI chief of staff. Reads the owner's Slack; posts only as this labelled bot.
  background_color: "#1a1a2e"

features:
  bot_user:
    display_name: AidenHQ (AI)
    always_online: true
  slash_commands:
    - command: /aiden
      description: Assign this channel to an agent (owner only)
      usage_hint: assign-channel <agent-key> | unassign-channel | channels
      should_escape: false
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

oauth_config:
  redirect_urls:
    - http://localhost:3118/callback   # slack-mcp's one-time owner sign-in (src/auth.ts)
  scopes:
    bot:
      - chat:write          # DMs to the owner, posts to allowed channels
      - chat:write.public   # post to an allowed public channel without being invited first
      - im:write            # open the DM with the owner
      - app_mentions:read   # the app_mention event
      # Likely later (owner, 2026-11-11: add speculatively; bot-side only, never the owner's own voice):
      - im:history          # the owner DMing the bot as a command channel
      - im:read
      - channels:read       # channel names and membership
      - channels:history    # slack_channel_context: a bound public channel's messages
      - groups:history      # ... and a bound private channel's
      - groups:read
      - mpim:read
      - channels:join       # join an allowed channel before posting
      - users:read          # resolve people
      - users:read.email
      - users.profile:read
      - usergroups:read     # resolve @team mentions
      - reactions:read
      - reactions:write     # acknowledge with an emoji instead of a message
      - files:read
      - files:write         # attach reports and screenshots
      - canvases:read
      - canvases:write      # longer reports as a canvas
      - bookmarks:read
      - pins:read
      - links:read
      - team:read
      - commands            # a slash command later
      - metadata.message:read
    user:
      - channels:history    # public channels the owner is in
      - channels:read
      - groups:history      # private channels
      - groups:read
      - im:history          # DMs
      - im:read
      - mpim:history        # group DMs
      - mpim:read
      - users:read          # names (src_slack.users)
      - users:read.email    # emails, to match people across Slack, GitHub and Jira
      # Likely later (read-only; nothing that writes as the owner):
      - users.profile:read  # titles and timezones
      - usergroups:read     # resolve @team mentions
      - reactions:read      # the owner's reactions as signals (e.g. a task emoji)
      - files:read          # files shared in the owner's conversations
      - search:read         # find a message the feed missed
      # Slack's MCP server (slack-mcp): its search tools need the granular search scopes.
      - search:read.public
      - search:read.private
      - search:read.im
      - search:read.mpim
      - search:read.users
      - pins:read
      - bookmarks:read
      - links:read
      - team:read
      - dnd:read            # don't page the owner during Do Not Disturb
      - emoji:read

settings:
  socket_mode_enabled: true
  token_rotation_enabled: false
  org_deploy_enabled: false
  interactivity:
    is_enabled: true      # buttons in DMs later; delivered over the socket, no request URL
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im          # the owner DMing the bot
      - member_joined_channel
      - channel_left
    user_events:
      - message.channels
      - message.groups
      - message.im
      - message.mpim
      - reaction_added
      - reaction_removed
      - file_shared
