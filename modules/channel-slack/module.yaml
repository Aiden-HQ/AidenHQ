name: channel-slack
description: "The instance's Slack app: the live listener (Socket Mode) that feeds triage and src_slack, the owner's Slack command channel as chat with Aiden, a transport for owner-channel's notify (Slack DMs to the owner), slack_post (the channel-slack.post write kind), and channel binding (/aiden assign-channel: @mentions in a bound channel become the agent's tasks)."
requires:
  - warehouse # its source schema lives in the shared warehouse
  - board # its setup flow
# Its schema and the views agents read with source_new (the warehouse's point, modules/warehouse/schemas/sources.json).
contributes:
  # The guided setup (the board's point, modules/board/schemas/setup_flows.json). The link is slack-app-manifest.yml as compact JSON,
  # URL-encoded (Slack's pre-filled new-app URL); regenerate it when the manifest changes:
  #   ruby -ryaml -rjson -ruri -e 'puts URI.encode_www_form_component(JSON.generate(YAML.load_file("slack-app-manifest.yml")))' | sed 's/+/%20/g'
  board.setup_flows:
    - order: 30
      title: Aiden in Slack
      why: Talk to Aiden and get approvals in Slack, and let the fleet read and post there.
      effort: about 5 minutes; a Slack workspace admin may need to approve the app
      wizard: true
      secrets: [ slack_live_app_token, slack_live_bot_token ]
      pair_url: http://channel-slack-slack:8089/pair
      steps: |
        1. [Create the Slack app](https://api.slack.com/apps?new_app=1&manifest_json=%7B%22display_information%22%3A%7B%22name%22%3A%22AidenHQ%22%2C%22description%22%3A%22The%20owner%27s%20AI%20chief%20of%20staff.%20Reads%20the%20owner%27s%20Slack%3B%20posts%20only%20as%20this%20labelled%20bot.%22%2C%22background_color%22%3A%22%231a1a2e%22%7D%2C%22features%22%3A%7B%22bot_user%22%3A%7B%22display_name%22%3A%22AidenHQ%20%28AI%29%22%2C%22always_online%22%3Atrue%7D%2C%22slash_commands%22%3A%5B%7B%22command%22%3A%22%2Faiden%22%2C%22description%22%3A%22Assign%20this%20channel%20to%20an%20agent%20%28owner%20only%29%22%2C%22usage_hint%22%3A%22assign-channel%20%3Cagent-key%3E%20%7C%20unassign-channel%20%7C%20channels%22%2C%22should_escape%22%3Afalse%7D%5D%2C%22app_home%22%3A%7B%22home_tab_enabled%22%3Afalse%2C%22messages_tab_enabled%22%3Atrue%2C%22messages_tab_read_only_enabled%22%3Afalse%7D%7D%2C%22oauth_config%22%3A%7B%22redirect_urls%22%3A%5B%22http%3A%2F%2Flocalhost%3A3118%2Fcallback%22%5D%2C%22scopes%22%3A%7B%22bot%22%3A%5B%22chat%3Awrite%22%2C%22chat%3Awrite.public%22%2C%22im%3Awrite%22%2C%22app_mentions%3Aread%22%2C%22im%3Ahistory%22%2C%22im%3Aread%22%2C%22channels%3Aread%22%2C%22channels%3Ahistory%22%2C%22groups%3Ahistory%22%2C%22groups%3Aread%22%2C%22mpim%3Aread%22%2C%22channels%3Ajoin%22%2C%22users%3Aread%22%2C%22users%3Aread.email%22%2C%22users.profile%3Aread%22%2C%22usergroups%3Aread%22%2C%22reactions%3Aread%22%2C%22reactions%3Awrite%22%2C%22files%3Aread%22%2C%22files%3Awrite%22%2C%22canvases%3Aread%22%2C%22canvases%3Awrite%22%2C%22bookmarks%3Aread%22%2C%22pins%3Aread%22%2C%22links%3Aread%22%2C%22team%3Aread%22%2C%22commands%22%2C%22metadata.message%3Aread%22%5D%2C%22user%22%3A%5B%22channels%3Ahistory%22%2C%22channels%3Aread%22%2C%22groups%3Ahistory%22%2C%22groups%3Aread%22%2C%22im%3Ahistory%22%2C%22im%3Aread%22%2C%22mpim%3Ahistory%22%2C%22mpim%3Aread%22%2C%22users%3Aread%22%2C%22users%3Aread.email%22%2C%22users.profile%3Aread%22%2C%22usergroups%3Aread%22%2C%22reactions%3Aread%22%2C%22files%3Aread%22%2C%22search%3Aread%22%2C%22search%3Aread.public%22%2C%22search%3Aread.private%22%2C%22search%3Aread.im%22%2C%22search%3Aread.mpim%22%2C%22search%3Aread.users%22%2C%22pins%3Aread%22%2C%22bookmarks%3Aread%22%2C%22links%3Aread%22%2C%22team%3Aread%22%2C%22dnd%3Aread%22%2C%22emoji%3Aread%22%5D%7D%7D%2C%22settings%22%3A%7B%22socket_mode_enabled%22%3Atrue%2C%22token_rotation_enabled%22%3Afalse%2C%22org_deploy_enabled%22%3Afalse%2C%22interactivity%22%3A%7B%22is_enabled%22%3Atrue%7D%2C%22event_subscriptions%22%3A%7B%22bot_events%22%3A%5B%22app_mention%22%2C%22message.im%22%2C%22member_joined_channel%22%2C%22channel_left%22%5D%2C%22user_events%22%3A%5B%22message.channels%22%2C%22message.groups%22%2C%22message.im%22%2C%22message.mpim%22%2C%22reaction_added%22%2C%22reaction_removed%22%2C%22file_shared%22%5D%7D%7D%7D) from the ready-made manifest: pick your workspace and press Create. If your workspace requires approval for new apps, an admin approves it when you install in step 2.
        2. In the app, open **Install App** and press **Install to Workspace**, then **Allow**.
        3. Open **Basic Information**, scroll to **App-Level Tokens**, press **Generate Token and Scopes**, add the scope `connections:write`, press **Generate**, and paste the `xapp-` token below.
        4. Open **OAuth & Permissions**, copy the **Bot User OAuth Token** (`xoxb-`), and paste it below.
        5. Save the tokens and wait a few seconds for Slack to connect. Then ask for a pairing code, find **AidenHQ (AI)** under Apps in Slack, and send it the code as a direct message. A code posted in a channel pairs nobody.
  warehouse.sources:
    - schema: src_slack
      about: "src_slack.messages / threads / changes / users"
      identity: users
      views:
        - { name: messages, time: ingested_at, channel: channel_id, tsv: true }
        - { name: threads, time: ingested_at, channel: channel_id }
        - { name: changes, time: observed_at, channel: channel_id }
# A channel (channel@1): what the owner writes in their command channel is posted as theirs (stamped [slack]). As a transport,
# the kernel sends it owner-channel's messages one at a time (transport: below), with this module's own token.
privileged: [ speaks-as-owner ]
providers:
  channel:
    transport: http://slack:8089/transport/send
  # The kernel calls channel-slack.post's plan, execute and status here, with the connection's key (executor@1).
  executor:
    url: http://slack:8089/aidenhq/v1/executor
    auth: slack_live_service_key
connections:
  slack_live:
    setup: "Set it up on the board (#/setup/channel-slack): paste the two tokens, then DM the bot the pairing code. The app's manifest: slack-app-manifest.yml."
    url: http://slack:8089/mcp
    auth: slack_live_service_key
    tools:
      # slack_channel_context: a bound channel's history and threads, for the agent it is bound to only (bind.ts).
      read: [ slack_pending_events, slack_owner, slack_channel_context ]
      # slack_post: filed as channel-slack.post; granted per agent.
      write: [ slack_post, channel_memory ]
# Every agent post is a kernel record the AI reviewer reads first; a channel outside slack_post_channels is the owner's too.
writes:
  post:
    args: schemas/post.json
    floor: 1
    tools: [ slack_post ]
    card:
      sentence: "Post as {{agent}} (AI agent) in {{where}}."
      changes: "A new Slack message from the instance's bot in {{where}}, which everyone in that channel sees."
      reads: "Nothing new: the message below."
      cost: "No model cost."
      details: "{{text}}"
  # channel_memory: the bound agent's note about its channel (memory.ts). Tier 1: the AI reviewer reads it for private or secret
  # content; the module's plan allows it only from a thread task of that same channel.
  memory:
    args: schemas/memory.json
    floor: 1
    tools: [ channel_memory ]
    card:
      sentence: "Update the note {{agent}} keeps about {{channel}}."
      changes: "Replaces the short note the agent reads whenever it works on that channel."
      reads: "Nothing new: the note below."
      cost: "No model cost."
      details: "{{note}}"
  # /aiden assign-channel and unassign-channel (the owner's own command, checked against OWNER_SLACK_USER_ID): the module files it
  # itself, Tier 0 (a record, nothing to approve); no agent tool maps to it, so no agent can bind a channel.
  bind:
    args: schemas/bind.json
    floor: 0
    tools: []
    card:
      sentence: "{{summary}}."
      changes: "Sets which agent the channel's @mentions wake."
      reads: "Nothing."
      cost: "No model cost."
# One Slack thread is one task for the bound agent; its text is fenced data. Grant the agent `slack_live: [slack_channel_context, slack_post, channel_memory]`.
prompts:
  - { id: slack-threads, file: prompts/slack-threads.md, when: { tools: [ slack_live.slack_channel_context ] } }
settings:
  # Slack channel ids agents may post to at the AI reviewer's word (an agent still needs slack_post granted); any other
  # channel needs the owner's approval too.
  slack_post_channels:
    default: []
services:
  data: true
  run:
    slack:
      build: ./connections/slack
      tmp: 16m
      egress: true
      # src_slack: the warehouse (the shared-sources network); paperclip: the HMAC-signed triage webhook (no key). Until 3g.
      links: [ sources, paperclip ]
      data: ["slack-live:/data"]
      env:
        SLACK_LIVE_DB: /data/slack-live.sqlite
        # Whose Slack words count and who gets paged is the paired owner (state in /data). These two .env values only seed it once
        # on an instance that predates pairing; they leave this block once every instance has run it.
        OWNER_SLACK_USER_ID: "${OWNER_SLACK_USER_ID:-}"
        IGNORE_CHANNELS: "${SLACK_LIVE_IGNORE_CHANNELS:-}"
        OWNER_COMMAND_CHANNEL: "${OWNER_COMMAND_CHANNEL:-}"
        SLACK_POST_CHANNELS: "${settings.slack_post_channels}"
        MCP_BEARER_TOKEN_FILE: ${secrets.slack_live_service_key}
        # The kernel's bearer on /transport/send: this module's own token.
        CHANNEL_TOKEN_FILE: ${secrets.channel_slack_token}
        PAIR_TOKEN_FILE: ${secrets.channel_slack_pair_token}
        SLACK_APP_TOKEN_FILE: ${secrets.slack_live_app_token}
        SLACK_BOT_TOKEN_FILE: ${secrets.slack_live_bot_token}
        TRIAGE_WEBHOOK_URL_FILE: ${secrets.slack_live_triage_webhook_url}
        TRIAGE_WEBHOOK_SECRET_FILE: ${secrets.slack_live_triage_webhook_secret}
        # Shared sources (src_slack): its warehouse login, and the owner's user token (xoxp, history scopes) for the gap sync.
        WAREHOUSE_PASSWORD_FILE: ${secrets.warehouse_src_slack_password}
        SLACK_USER_TOKEN_FILE: ${secrets.slack_live_user_token}
# Asked for on the board's setup page for this module (the flow above).
secrets:
  provided:
    - name: slack_live_app_token
      setup:
        label: Slack app-level token
        pattern: '^xapp-[A-Za-z0-9-]{20,300}$'
        help: "Basic Information, App-Level Tokens, scope connections:write (starts xapp-)."
    - name: slack_live_bot_token
      setup:
        label: Slack bot token
        pattern: '^xoxb-[A-Za-z0-9-]{20,300}$'
        help: "OAuth & Permissions, Bot User OAuth Token (starts xoxb-)."
optional_secrets:
  - slack_live_app_token
  - slack_live_bot_token
  - slack_live_triage_webhook_url
  - slack_live_triage_webhook_secret
  # The owner's user token (xoxp-) of the Slack live app, for the src_slack gap sync: channels:history, groups:history,
  # im:history, mpim:history, channels:read, groups:read, im:read, mpim:read, users:read (users:read.email for emails).
  - slack_live_user_token
generated_secrets:
  - slack_live_service_key
  - channel_slack_token
  # src_slack's warehouse login (ops/warehouse-sources.sh gives the role this password).
  - warehouse_src_slack_password
data_version: 0 # its data dir's format: bumped by each forward-only migration (docs/configuration.md)
