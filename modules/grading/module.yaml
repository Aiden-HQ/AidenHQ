name: grading
description: "Graded done: a delegated task's rubric and grade, the finish check every move to done passes (held for the grader until its rubric is met), and the routes the board reads. In the default bundle."
license: MIT
# A task.finish check (P5, spec §3.5): the kernel asks POST /check/finish on every move to done (kernel/src/checks.ts); a held
# task goes to review with the `grading` label, which this module releases (POST /v1/checks/:task) once a verdict is in. The
# grade loop runs in the service (service/src/kernel-loop.ts, W7): it reads tasks (kernel.cp-read) and the kernel's jobs
# (kernel.work-read), asks it for a grader token (kernel.grader), moves a graded task through the finish check and tells
# parents by wake notice (kernel.wake). It never writes to the control plane itself. A PR's evidence is read from GitHub (below);
# an app's status, deploys and live view are held ("not available"): apps-mcp's internal API has no route this module may reach.
roles:
  requests: [ kernel.cp-read, kernel.work-read, kernel.grader, kernel.wake, apps.read, kernel.facts ] # apps.read: an app deliverable's status, deploys and live view (apps-mcp)
# Flow (docs/design/flow.md): a task's grade attempts and the waits its retry ladder puts on the task, emitted by service/src/loop.ts.
facts:
  grade.requested: { subject: grade }
  grade.verdict: { subject: grade }
  work.waiting: { subject: task, reasons: [grade_retry] }
  work.resumed: { subject: task, reasons: [grade_retry] }
stages:
  - { name: grade, label: Grading, from: grade.requested, to: grade.verdict }
checks:
  - id: finish
    at: task.finish
    post: http://grading:8096/check/finish
    rubric: http://grading:8096/check/rubric # a task a module files with {deliverable, rubric} (POST /v1/tasks) is graded from its filing
    grade: http://grading:8096/check/grade # the latest verdict that sent the task's work back: the AI reviewer reads it (kernel/src/review-loop.ts)
    auth: grading_check_key
    label: grading
# PR and issue evidence: typed reads of the instance's known repositories (agents org, product, github_orgs, maintainer_repos)
# through the kernel's code host (POST /v1/codehost/read, service/src/github.ts): a PR, its checks and its diff, an issue, a job
# and its run, the one map file a command fact's command and directory come from, and whether a suite's directory exists at the
# graded head (a boolean only: no contents).
codehost:
  read:
    repos: [ "@agents/*", "@product", "@orgs", "@maintained" ]
  evidence:
    repos: [ "@agents/*", "@product", "@orgs", "@maintained" ]
    paths: [ ".github/ci/areas.json", ".github/workflows/ci.yml" ]
  exists:
    repos: [ "@agents/*", "@product", "@orgs", "@maintained" ]
labels:
  - { name: grading, color: "#7c3aed" }
# The board's reads (held parts, wake-ups, rollover, Fleet Ops' stale grades), with its own key, until the board is a module.
board_env:
  GRADING_URL: http://grading:8096
  GRADING_BOARD_KEY_FILE: ${secrets.grading_board_key}
services:
  data: true
  run:
    grading:
      build: ./service
      tmp: 16m
      port: 8096
      # The kernel's listener is a host address: reached the way every module with no legacy link reaches it.
      egress: true
      links: [ board, apps-mcp ] # the board's reads (until the board is a module); apps-mcp's grader reads (until 4c moves it into apps-platform)
      data: ["grades:/data"]
      env:
        GRADES_DB: /data/grades.sqlite
        AIDENHQ_KERNEL_URL: http://10.231.0.1:3130
        GRADING_TOKEN_FILE: ${secrets.grading_token}
        GRADING_CHECK_KEY_FILE: ${secrets.grading_check_key}
        GRADING_BOARD_KEY_FILE: ${secrets.grading_board_key}
generated_secrets:
  - grading_token
  - grading_check_key
  - grading_board_key
data_version: 0 # its data dir's format: bumped by each forward-only migration (docs/configuration.md)
