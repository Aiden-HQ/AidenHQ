name: grading
description: "Completion checks as housekeeping: a delegated task's rubric, one check of it after the task closes (read from the agent's own report), and the result on the board. Nothing is held or sent back. In the default bundle."
license: MIT
# The service polls its open rubrics (service/src/check.ts): once a task is done, one model pass reads the rubric and the agent's
# report (kernel.cp-read), with a grader token billed to the task (kernel.grader); an unmet criterion sends the delegating agent one
# wake notice (kernel.wake). It never writes to the control plane itself.
roles:
  requests: [ kernel.cp-read, kernel.grader, kernel.wake ]
# A task a module files with {deliverable, rubric} (POST /v1/tasks): the kernel files its rubric here (kernel/src/modtasks.ts).
checks:
  - id: rubric
    at: task.rubric
    post: http://grading:8096/check/rubric
    auth: grading_check_key
# The board's reads (the drawer's rubric and result), with its own key, until the board is a module.
board_env:
  GRADING_URL: http://grading:8096
  GRADING_BOARD_KEY_FILE: ${secrets.grading_board_key}
services:
  data: true
  run:
    grading:
      build: ./service
      tmp: 16m
      port: 8096
      # The kernel's listener is a host address: reached the way every module with no legacy link reaches it.
      egress: true
      links: [ board ] # the board's reads (until the board is a module)
      data: ["grades:/data"]
      env:
        GRADES_DB: /data/grades.sqlite
        AIDENHQ_KERNEL_URL: http://10.231.0.1:3130
        GRADING_TOKEN_FILE: ${secrets.grading_token}
        GRADING_CHECK_KEY_FILE: ${secrets.grading_check_key}
        GRADING_BOARD_KEY_FILE: ${secrets.grading_board_key}
generated_secrets:
  - grading_token
  - grading_check_key
  - grading_board_key
data_version: 1 # its data dir's format: bumped by each forward-only migration (docs/configuration.md); 1 dropped the grade gate's rows
