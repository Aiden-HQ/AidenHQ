name: models-openrouter
description: "OpenRouter as the model provider: its key, set up on the first run. The gateway prices every call from OpenRouter's own models list, so any model OpenRouter lists works by its id."
# The model key, asked for on the first-run page (/setup) while the vault has none; only the kernel's model gateway reads it.
secrets:
  provided:
    - name: openrouter_key
      setup:
        label: OpenRouter API key
        pattern: '^sk-or-[A-Za-z0-9_-]{16,200}$'
        required: true
        help: "Agents can't run without one. It goes into the vault; only the kernel's model gateway reads it."
