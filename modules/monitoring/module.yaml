name: monitoring
description: "Host and fleet monitoring: Prometheus, node-exporter, cAdvisor, Alertmanager and Grafana. Every alert opens or updates a Fleet Steward task; critical ones also tell the owner in one line."
# docs/design/monitoring.md. Alerts go into the fleet detector (services/board/src/monitoring.ts), so fleet-steward comes along.
requires:
  - fleet-steward
  - grafana # mcp-grafana joins its network (grafana_source: local)
settings:
  # Grafana's https address on the tailnet, e.g. https://host.tailnet.ts.net:8444 (docs/operations.md, Monitoring). Links in
  # Grafana use it; empty = http://localhost:3131.
  grafana_root_url:
    title: Grafana address
    default: ""
    type: url
# Read-only host /, /sys and /proc for node-exporter and cAdvisor (filesystems, CPU, memory, pressure, OOM kills by cgroup).
privileged: [host-metrics]
# Nothing is published beyond loopback; Grafana alone is (127.0.0.1:3131, `tailscale serve` for the tailnet). Each image is
# built from its folder's Dockerfile, pinned by digest (release dates in docs/design/monitoring.md); Prometheus, Alertmanager
# and Grafana have their config baked in.
services:
  data: true
  run:
    prometheus:
      build: ./prometheus
      command:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=30d
        - --web.listen-address=:9090
      data: ["prometheus:/prometheus"]
      secrets: [monitoring_token] # scrapes the board's /internal/metrics
      links: [board] # the board's internal listener (board:3122) only, on a network only it, Alertmanager and the board share
      join: [fleet-steward] # scrapes the fleet-steward service's /metrics (incidents open, alerts firing) with the monitoring token
    # Host metrics: as nobody, the host's / read-only (filesystems), and the textfiles the runner, the kernel and
    # ops/host-metrics.sh write (unit and container states, the runner's queue). Network counters are its own namespace's.
    node-exporter:
      build: ./node-exporter
      user: nobody
      command:
        - --path.rootfs=/host
        - --path.procfs=/host/proc
        - --path.sysfs=/host/sys
        - --collector.textfile.directory=/textfile
        - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+|var/lib/containerd/.+|home/.+/\.config/aidenhq)($|/)
      host_mounts: ["/:/host:ro,rslave"]
      data: ["textfile:/textfile:ro"]
    # CPU, memory and pressure by cgroup (no Docker socket, so no container labels). Container names come from
    # containers.prom (ops/host-metrics.sh), joined on the cgroup id. The raw whitelist adds the host-side sources: dockerd
    # and containerd (Docker builds) and /user.slice (the runner's service cgroup holds the Engineer jobs).
    cadvisor:
      build: ./cadvisor
      user: image
      command:
        - --docker_only=false
        - --raw_cgroup_prefix_whitelist=/system.slice/docker-,/system.slice/docker.service,/system.slice/containerd.service,/user.slice
        - --housekeeping_interval=30s
        - --store_container_labels=false
        - --enable_metrics=cpu,memory,diskIO,pressure
      host_mounts: ["/sys:/sys:ro", "/proc:/rootfs/proc:ro"]
    alertmanager:
      build: ./alertmanager
      command:
        - --config.file=/etc/alertmanager/alertmanager.yml
        - --storage.path=/alertmanager
        - --cluster.listen-address=
      data: ["alertmanager:/alertmanager"]
      secrets: [monitoring_token] # its webhook into the fleet-steward service (/alerts), checked with the kernel as module monitoring
      join: [fleet-steward] # it posts its alerts to the fleet-steward service (/alerts), which reads its alert list; its own API (silences) is reachable only by Prometheus, Grafana and that service
    grafana:
      build: ./grafana
      tmp: 64m
      port: 3000
      ui_port: 3131 # loopback only; the tailnet reaches it through the host's `tailscale serve` (docs/operations.md)
      egress: true # only carries the published port (update checks and plugin installs are off)
      data: ["grafana:/var/lib/grafana"]
      env:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD__FILE: ${secrets.grafana_admin_password}
        GF_SECURITY_DISABLE_GRAVATAR: "true"
        GF_SECURITY_COOKIE_SECURE: "true"
        GF_AUTH_ANONYMOUS_ENABLED: "false"
        GF_AUTH_DISABLE_SIGNOUT_MENU: "false"
        GF_USERS_ALLOW_SIGN_UP: "false"
        GF_SERVER_ROOT_URL: "${settings.grafana_root_url}"
        GF_ANALYTICS_REPORTING_ENABLED: "false"
        GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
        GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
        GF_NEWS_NEWS_FEED_ENABLED: "false"
        GF_PLUGINS_PREINSTALL_DISABLED: "true"
        GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    # Grafana's open-source MCP server against this Grafana, for agents through grafana-mcp (modules/grafana with
    # grafana_source: local): read tools only (--disable-write), the service account token from the vault (a Viewer account;
    # empty until the owner makes one, docs/design/monitoring.md). It takes no auth of its own: the grafana module's network,
    # which only it and grafana-mcp share (join), is the boundary.
    mcp-grafana:
      build: ./mcp-grafana
      entrypoint: [ "/app/mcp-grafana", "--transport", "streamable-http", "--address", "0.0.0.0:8000", "--endpoint-path", "/mcp", "--allowed-hosts", "mcp-grafana:8000", "--disable-write" ]
      join: [grafana]
      env:
        GRAFANA_URL: http://grafana:3000
        GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE: ${secrets.grafana_service_account_token}
board_env:
  MONITORING_TOKEN_FILE: ${secrets.monitoring_token}
# Made by compile: the scrape and webhook token (Prometheus → the board and the gateway, Alertmanager → the board) and
# Grafana's admin password (user admin; read it from the vault to sign in).
generated_secrets:
  - monitoring_token
  - grafana_admin_password
# Created by compile (empty) so compose can mount it: the local Grafana's service account token for agents' Grafana reads
# through grafana-mcp (the token alone, `glsa_...`, of a Viewer service account; docs/design/monitoring.md, Agents).
optional_secrets:
  - grafana_service_account_token
data_version: 0 # its data dir's format: bumped by each forward-only migration (docs/configuration.md)
