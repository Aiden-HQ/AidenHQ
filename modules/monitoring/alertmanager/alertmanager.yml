# Every alert goes to the board (services/board/src/monitoring.ts), which opens or recovers a Fleet Ops incident and tells
# the owner of a critical one. No other receiver: the owner's channel is the board's.
route:
  receiver: board
  group_by: [ alertname, mountpoint, service, unit, job, agent ]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
receivers:
  - name: board
    webhook_configs:
      - url: http://board:3122/internal/alerts
        send_resolved: true
        max_alerts: 100
        http_config:
          authorization:
            credentials_file: /run/secrets/monitoring_token
