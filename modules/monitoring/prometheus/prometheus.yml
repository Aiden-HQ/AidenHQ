# The monitoring module's Prometheus (docs/design/monitoring.md): the compose services by name and the board's internal
# listener. The host processes (the runner, the model gateway, unit and container states) write node-exporter textfiles.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [ "alertmanager:9093" ]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [ "localhost:9090" ]
  - job_name: node
    static_configs:
      - targets: [ "node-exporter:9100" ]
  - job_name: cadvisor
    static_configs:
      - targets: [ "cadvisor:8080" ]
  - job_name: alertmanager
    static_configs:
      - targets: [ "alertmanager:9093" ]
  # Approval cards, open incidents, firing alerts (services/board/src/monitoring.ts): the monitoring token only.
  - job_name: board
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /run/secrets/monitoring_token
    static_configs:
      - targets: [ "board:3122" ]
