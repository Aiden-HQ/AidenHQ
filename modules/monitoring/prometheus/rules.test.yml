# The alert rules' behaviour (docs/design/monitoring.md, "Alerts and routing"), run by promtool in CI's `rules` job:
#   promtool test rules modules/monitoring/prometheus/rules.test.yml
# Prometheus's own rule test: synthetic series in, alerts out at each eval time.
rule_files:
  - rules.yml
evaluation_interval: 1m
tests:
  # Host CPU pressure alone (node-exporter carries no project label) is not app starvation: no alert, hence no
  # "deployed apps are starved of CPU ()" summary. The app container here is busy but its cgroup is not waiting.
  - name: host pressure alone fires nothing
    interval: 1m
    input_series:
      - series: 'node_pressure_cpu_waiting_seconds_total{instance="node-exporter:9100",job="node"}'
        values: '0+60x12'
      - series: 'container_pressure_cpu_waiting_seconds_total{id="/system.slice/docker-aaa.scope",job="cadvisor"}'
        values: '0+2x12'
      - series: 'aidenhq_container_running{id="/system.slice/docker-aaa.scope",project="app-roadmap-keeper",service="app-1"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: AppsCpuStarved
        exp_alerts: []

  # An app container's cgroup waiting while the host is too: one alert, labelled with the project it matched.
  - name: a waiting app container names its project
    interval: 1m
    input_series:
      - series: 'node_pressure_cpu_waiting_seconds_total{instance="node-exporter:9100",job="node"}'
        values: '0+18x12'
      - series: 'container_pressure_cpu_waiting_seconds_total{id="/system.slice/docker-bbb.scope",job="cadvisor"}'
        values: '0+30x12'
      - series: 'aidenhq_container_running{id="/system.slice/docker-bbb.scope",project="app-warehouse",service="app-1"}'
        values: '1x12'
      # A second app whose cgroup waits well under the threshold: it does not join the alert.
      - series: 'container_pressure_cpu_waiting_seconds_total{id="/system.slice/docker-ccc.scope",job="cadvisor"}'
        values: '0+3x12'
      - series: 'aidenhq_container_running{id="/system.slice/docker-ccc.scope",project="app-roadmap-keeper",service="app-1"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: AppsCpuStarved
        exp_alerts:
          - exp_labels:
              severity: warning
              id: /system.slice/docker-bbb.scope
              job: cadvisor
              project: app-warehouse
              service: app-1
            exp_annotations:
              summary: "deployed apps are starved of CPU (app-warehouse): CPU waiting 50% of the time for over 5 minutes (CPU by source dashboard)"

  # An app at its own CPU limit on an idle host is the app's business alone: no alert.
  - name: an app waiting on an idle host fires nothing
    interval: 1m
    input_series:
      - series: 'node_pressure_cpu_waiting_seconds_total{instance="node-exporter:9100",job="node"}'
        values: '0+3x12'
      - series: 'container_pressure_cpu_waiting_seconds_total{id="/system.slice/docker-ddd.scope",job="cadvisor"}'
        values: '0+30x12'
      - series: 'aidenhq_container_running{id="/system.slice/docker-ddd.scope",project="app-roadmap-keeper",service="app-1"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 10m
        alertname: AppsCpuStarved
        exp_alerts: []
