# grafana module: its compose services. Paths are relative to this module; scripts/compile.mjs makes them absolute.

services:
  grafana-mcp:
    extends: { file: ../../compose.base.yaml, service: hardened }
    build: ./connections/grafana-mcp
    image: aidenhq/grafana-mcp:local
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      GRAFANA_URL: "${settings.grafana_url}"
      GRAFANA_MCP_URL: "${settings.grafana_mcp_url}"
      GRAFANA_SOURCE: "${settings.grafana_source}" # local: the monitoring module's mcp-grafana on the backplane
      GRAFANA_STATE_DIR: /state
      # Jobs on loopback present grafana_mcp_token; the kernel presents the service key.
      MCP_TOKEN_FILE: /run/secrets/grafana_mcp_token
      MCP_SERVICE_TOKEN_FILE: /run/secrets/grafana_service_key
      # The board's sign-in endpoints: state, and starting or finishing a sign-in.
      GRAFANA_AUTH_TOKEN_FILE: /run/secrets/grafana_auth_token
    volumes:
      # Read-write: the registered client and the token pair, refreshed here.
      - ${AIDENHQ_SECRETS_DIR}/grafana:/state
    secrets:
      - grafana_mcp_token
      - grafana_service_key
      - grafana_auth_token
    dns: [ 1.1.1.1, 8.8.8.8 ] # see paperclip
    ports:
      # Loopback only, for the runner's Engineer jobs on the host: /mcp, bearer token.
      - "127.0.0.1:3124:8087"
    networks:
      - backplane
      - egress
      - grafana-local # local mode: the monitoring module's mcp-grafana, on a network only the two share
networks:
  # mcp-grafana and grafana-mcp only (modules/monitoring defines it identically).
  grafana-local:
    internal: true
    ipam:
      config:
        - subnet: ${AIDENHQ_GRAFANA_LOCAL_SUBNET:-10.231.8.0/24}
secrets:
  grafana_service_key:
    file: ${AIDENHQ_SECRETS_DIR}/grafana_service_key
  grafana_mcp_token:
    file: ${AIDENHQ_SECRETS_DIR}/grafana_mcp_token
