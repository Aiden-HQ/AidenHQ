# grafana module: its compose services. Paths are relative to this module; scripts/compile.mjs makes them absolute.

services:
  grafana-mcp:
    extends: { file: ../../compose.base.yaml, service: hardened }
    build: ./connections/grafana-mcp
    image: aidenhq/grafana-mcp:local
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      GRAFANA_URL: "${GRAFANA_URL:-}"
      GRAFANA_MCP_URL: "${GRAFANA_MCP_URL:-}"
      GRAFANA_STATE_DIR: /state
      MCP_TOKEN_FILE: /run/secrets/grafana_mcp_token
      # The board's sign-in endpoints: state, and starting or finishing a sign-in.
      GRAFANA_AUTH_TOKEN_FILE: /run/secrets/grafana_auth_token
    volumes:
      # Read-write: the registered client and the token pair, refreshed here.
      - ${AIDENHQ_SECRETS_DIR}/grafana:/state
    secrets:
      - grafana_mcp_token
      - grafana_auth_token
    dns: [ 1.1.1.1, 8.8.8.8 ] # see paperclip
    ports:
      # Loopback only, for the runner's Engineer jobs on the host: /mcp, bearer token.
      - "127.0.0.1:3124:8087"
    networks:
      - backplane
      - egress
secrets:
  grafana_mcp_token:
    file: ${AIDENHQ_SECRETS_DIR}/grafana_mcp_token
