name: grafana
description: Grafana for the runner's Engineer jobs (loopback MCP).
requires:
  - board # its sign-in banner
# Its sign-in on the board (the board's point, modules/board/schemas/signins.json).
contributes:
  board.signins:
    - { id: grafana, label: Grafana, status_url: "http://grafana-mcp:8087/auth/status", connect_url: /grafana/connect, callback: /grafana/callback,
        missing: "The Engineers can't read logs and metrics until it is.", stopped: "The Engineers can't read logs and metrics." }
settings:
  # Your Grafana Cloud stack, e.g. https://acme.grafana.net. Set it on the board (Settings, Connections); empty: Grafana is off.
  grafana_url:
    default: ""
    type: url
    host: "*.grafana.net"
  # Grafana's hosted MCP server, which signs in and reads the stack above.
  grafana_mcp_url:
    default: https://mcp.grafana.com/mcp
    type: url
    host: mcp.grafana.com
  # "cloud": the Grafana Cloud stack above, signed in on the board. "local": the monitoring module's Grafana on this host
  # (modules/monitoring; put a Viewer service account token in the vault's grafana_service_account_token), no sign-in.
  grafana_source:
    default: cloud
    values: [cloud, local]
# Agents granted `grafana: read` (e.g. Fleet Ops, in the instance's agent overrides) query metrics and dashboards.
connections:
  grafana:
    setup: "Cloud: set your stack's URL on the board (Settings, Connections) and press Connect. Local: enable the monitoring module, set grafana_source: local and put a Viewer service account token in the vault (docs/design/monitoring.md)."
    guide: "Metrics and dashboards: the host's disk, memory and containers, and the fleet's queue, spend and approvals (Prometheus through Grafana). `query_prometheus` for a PromQL query, `list_prometheus_metric_names` to find series, `search_dashboards` and `get_dashboard_panel_queries` for the panels' queries."
    url: http://grafana-mcp:8087/mcp
    auth: grafana_service_key
    tools:
      read: [ query_prometheus, query_prometheus_histogram, list_prometheus_metric_names, list_prometheus_label_names, list_prometheus_label_values, list_prometheus_metric_metadata, list_datasources, search_dashboards, get_dashboard_summary, get_dashboard_panel_queries, get_dashboard_by_uid, alerting_rules_read ]
      write: []
# Runner jobs of an Engineer with private reads, through the model gateway with their own token (scripts/modules.mjs jobcapEntries):
# every read tool grafana-mcp serves in cloud mode (its READ_TOOLS; local mode serves the connection's read list, a subset).
jobcaps:
  - id: grafana-read
    connection: grafana
    private: true
    read_url: "http://grafana-mcp:8087/mcp"
    read_secret: grafana_mcp_token
    tools: [ query_loki_logs, query_loki_stats, query_loki_patterns, list_loki_label_names, list_loki_label_values, analyze_loki_labels, query_prometheus, query_prometheus_histogram, list_prometheus_label_names, list_prometheus_label_values, list_prometheus_metric_metadata, list_prometheus_metric_names, search_tempo_traces, get_tempo_trace, diff_tempo_traces, list_tempo_attribute_names, list_tempo_attribute_values, query_tempo_metrics, get_tempo_traceql_docs, query_pyroscope, list_pyroscope_label_names, list_pyroscope_label_values, list_pyroscope_profile_types, query_cloudwatch, list_cloudwatch_namespaces, list_cloudwatch_metrics, list_cloudwatch_dimensions, list_cloudwatch_dimension_values, query_elasticsearch, query_graphite, query_graphite_density, list_graphite_metrics, list_graphite_tags, query_influxdb, query_quickwit, list_datasources, get_datasource, check_datasources_health, get_query_examples, search_dashboards, search_folders, get_dashboard_by_uid, get_dashboard_summary, get_dashboard_property, get_dashboard_panel_queries, list_dashboard_versions, run_panel_query, get_panel_image, alerting_rules_read, alerting_silences_read, list_alert_groups, get_alert_group, list_incidents, get_incident, get_annotations, get_annotation_tags, search_docs, get_doc ]
# How to set it up (the board's Settings, Connections).
setup: "Set your Grafana Cloud stack's URL on the board (Settings, Connections) and approve the change, then press Connect on the board from the host's loopback address (http://127.0.0.1:3121). Used by the runner's Engineer jobs."
secrets:
  state: true # its own vault dir, read-write at /state: the registered client and the token pair, refreshed here
services:
  run:
    grafana-mcp:
      build: ./connections/grafana-mcp
      tmp: 16m
      port: 8087
      egress: true
      links: [board] # the board's sign-in endpoints
      state: /state
      env:
        GRAFANA_URL: "${settings.grafana_url}"
        GRAFANA_MCP_URL: "${settings.grafana_mcp_url}"
        GRAFANA_SOURCE: "${settings.grafana_source}" # local: the monitoring module's mcp-grafana, which joins this module's network
        GRAFANA_STATE_DIR: /state
        # Jobs present grafana_mcp_token (through the kernel); the kernel presents the service key for agents.
        MCP_TOKEN_FILE: ${secrets.grafana_mcp_token}
        MCP_SERVICE_TOKEN_FILE: ${secrets.grafana_service_key}
        # The board's sign-in endpoints: state, and starting or finishing a sign-in.
        GRAFANA_AUTH_TOKEN_FILE: ${secrets.grafana_auth_token}
generated_secrets:
  - grafana_service_key
