name: grafana
description: Grafana for the runner's Engineer jobs (loopback MCP).
# How to set it up (the board's Settings, Connections).
setup: "Set GRAFANA_URL in .env, run `docker compose up -d --force-recreate grafana-mcp`, then press Connect on the board from the host's loopback address (http://127.0.0.1:3120). Used by the runner's Engineer jobs."
compose: compose.yaml
