name: owner-channel
description: "The one way a message reaches the owner: agents' `notify`, and every message the kernel, the board and the runner have for them. Each one lands once: on its chat on the board, and on the first channel that delivers it (slack and channel-telegram are its transports). Duplicates drop, muted and routine messages wait for the board or the digest, and a message waits while every channel is down. Always installed (core requires it)."
# It never speaks as the owner and holds no channel token: it takes the kernel's queued owner messages and has the kernel send
# each one to a channel's transport (kernel.notify), and reads the task a message is about (kernel.cp-read).
roles:
  requests: [ kernel.cp-read, kernel.notify, kernel.work-read, kernel.wake, kernel.tasks ] # work-read: whether an agent is running a job on a task (notify's heading); wake: a decision question's wait on the asker's task (POST /v1/wait); tasks: a question with no task of its own goes to the chief of staff as one (POST /v1/tasks)
connections:
  owner_channel:
    setup: "Nothing to set up: Slack and Telegram are its channels (their own setup flows)."
    url: http://notify:8089/mcp
    auth: owner_channel_service_key
    tools:
      read: [ notify_recent ]
      # notify_recent: what the owner was already told (a ledger, 14 days). Named: granted explicitly, not by `read`.
      named: [ notify_recent ]
      # notify: a message to the owner (decision, done, fyi, alert, digest); with `task`, the agent's reply on that chat.
      write: [ notify ]
prompts:
  # One rule for every message an agent sends the owner on its own (the Steward's daily interruption pass checks it).
  - { id: notify, file: prompts/notify.md, when: { tools: [ owner_channel.notify ] } }
  # Before telling the owner something, the agent glances at what they were already told.
  - { id: told, file: prompts/told.md, when: { tools: [ owner_channel.notify_recent ] } }
settings:
  # The channels a message tries, in order: the first one set up that delivers it gets it (the one the owner last wrote from
  # in a chat goes first). One that isn't installed or set up is skipped.
  notify_transports:
    default: [ slack, channel-telegram ]
  # fyi messages (news to read later): send, or mute (they still show on the board's chat). Decisions, results and alerts
  # are never muted.
  notify_fyi:
    default: send
    values: [ send, mute ]
  # Attention control (decisions and alerts always pass; the chief of staff is never blocked or digested). The block list
  # and the digest always act (owner preferences). This sets the daily cap only: observe logs what it would block and lets
  # everything through (a new gate's first stage); enforce acts.
  notify_attention:
    default: observe
    values: [ observe, enforce ]
  # Agent keys whose routine (done/fyi) messages are dropped. Empty: nobody is blocked.
  notify_blocked:
    default: []
  # Routine messages one agent may send per UTC day (decisions don't count).
  notify_daily_cap:
    default: 40
  # Owner-local hours at which routine done/fyi messages from crew agents go out as one digest (they show on the board's chat at once).
  notify_digest_hours:
    default: [ 9, 13, 18 ]
services:
  data: true
  run:
    notify:
      build: ./connections/notify
      tmp: 16m
      # The kernel's listener is a host address: reached the way every module with no legacy link reaches it.
      egress: true
      data: ["notify:/data"]
      env:
        NOTIFY_DB: /data/notify.sqlite
        AIDENHQ_KERNEL_URL: http://10.231.0.1:3130
        OWNER_TIMEZONE: "${settings.timezone}"
        OWNER_COMPANY: "${settings.company_name}"
        NOTIFY_TRANSPORTS: "${settings.notify_transports}"
        NOTIFY_FYI: "${settings.notify_fyi}"
        NOTIFY_ATTENTION: "${settings.notify_attention}"
        NOTIFY_BLOCKED: "${settings.notify_blocked}"
        NOTIFY_DAILY_CAP: "${settings.notify_daily_cap}"
        NOTIFY_DIGEST_HOURS: "${settings.notify_digest_hours}"
        MCP_BEARER_TOKEN_FILE: ${secrets.owner_channel_service_key}
# The kernel's bearer for this module's connection, and this module's own token at the kernel: compile creates it.
generated_secrets:
  - owner_channel_service_key
data_version: 0 # its data dir's format: bumped by each forward-only migration (docs/configuration.md)
# Every crew agent can reply to and ask the owner (notify, the "Asking the owner" section), except in an untrusted module,
# where write tools stay off.
default_grants:
  - { tools: [ owner_channel.notify ], when: { fields: { profile: crew } }, unless: { fields: { isolation: untrusted } } }
