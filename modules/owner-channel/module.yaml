name: owner-channel
description: "How the owner talks to Aiden and agents reach the owner: Telegram bot, Slack DM and Socket Mode (both optional), voice notes, notify_owner. Always installed (core requires it)."
connections:
  slack_live:
    setup: "Telegram: put the bot token in the vault as telegram_notify_bot_token. Slack: slack_live_app_token and slack_live_bot_token. Then run `docker compose up -d --force-recreate slack-live-mcp`. See SETUP.md step 7."
    url: http://slack-live-mcp:8089/mcp
    auth: slack_live_service_key
    tools:
      # wake_list: your pending wakes, what counts toward wake_at's cap (only wakes on tasks still open).
      read: [ slack_pending_events, wake_list ]
      # slack_post: to channels in the slack_post_channels setting only, as the labelled bot; granted per agent.
      # wake_at: wake yourself later (a reminder or follow-up). chat_send: answer in your own fast-lane chat from a background run.
      write: [ notify_owner, slack_post, wake_at, chat_send ]
settings:
  # Slack channel ids agents may post to with slack_post (an agent still needs the tool granted).
  slack_post_channels:
    default: []
  # notify_owner messages of kind fyi (news to read later) on Telegram: send, or mute (they still show on the board's chat
  # and in Slack). Decisions and results are never muted.
  telegram_fyi:
    default: send
    values: [ send, mute ]
services:
  data: true
  run:
    slack-live-mcp:
      build: ./connections/slack-live-mcp
      tmp: 16m
      egress: true
      links: [board, paperclip, sources] # approvals and the lane (board); the owner chat bridge (Paperclip); src_slack
      data: ["slack-live:/data"]
      env:
        SLACK_LIVE_DB: /data/slack-live.sqlite
        OWNER_NAME: "${settings.owner_name}"
        OWNER_TIMEZONE: "${settings.timezone}"
        OWNER_COMPANY: "${settings.company_name}"
        # Host-controlled (.env), never instance.yaml: this identity decides whose Slack words count and who gets paged.
        OWNER_SLACK_USER_ID: "${OWNER_SLACK_USER_ID:-}"
        IGNORE_CHANNELS: "${SLACK_LIVE_IGNORE_CHANNELS:-}"
        # Channels agents may post to (slack_post), from the instance.
        SLACK_POST_CHANNELS: "${settings.slack_post_channels}"
        # notify_owner kind fyi on Telegram: send, or mute (they still land on the chat).
        TELEGRAM_FYI: "${settings.telegram_fyi}"
        URGENT_COOLDOWN_MIN: "60"
        MCP_BEARER_TOKEN_FILE: ${secrets.slack_live_service_key}
        SLACK_APP_TOKEN_FILE: ${secrets.slack_live_app_token}
        SLACK_BOT_TOKEN_FILE: ${secrets.slack_live_bot_token}
        TRIAGE_WEBHOOK_URL_FILE: ${secrets.slack_live_triage_webhook_url}
        TRIAGE_WEBHOOK_SECRET_FILE: ${secrets.slack_live_triage_webhook_secret}
        TELEGRAM_NOTIFY_BOT_TOKEN_FILE: ${secrets.telegram_notify_bot_token}
        TELEGRAM_OWNER_CHAT_ID: "${TELEGRAM_OWNER_CHAT_ID:-}"
        # Host-controlled link target for task IDs in Telegram messages, e.g. https://<paperclip>/WOR/issues/{id}.
        TELEGRAM_TASK_URL: "${TELEGRAM_TASK_URL:-}"
        # Inbound chat bridge: comments on the daily "Chat with <owner>" issue, authored as the owner (board key).
        PAPERCLIP_URL: http://paperclip:3100
        PAPERCLIP_BOARD_KEY_FILE: ${secrets.paperclip_board_key}
        OWNER_COMMAND_CHANNEL: "${OWNER_COMMAND_CHANNEL:-}"
        # Voice notes are transcribed on this host (audio never leaves it).
        WHISPER_URL: http://whisper:9000
        # Approvals: pending cards from the board's internal API; decisions proven with the decide key.
        BOARD_INTERNAL_URL: http://board:3122
        BOARD_INTERNAL_TOKEN_FILE: ${secrets.board_internal_token}
        OWNER_DECIDE_KEY_FILE: ${secrets.owner_decide_key}
        # Shared sources (src_slack): its warehouse login, and the owner's user token (xoxp, history scopes) for the gap sync.
        WAREHOUSE_PASSWORD_FILE: ${secrets.warehouse_src_slack_password}
        SLACK_USER_TOKEN_FILE: ${secrets.slack_live_user_token}
        # The fast chat lane (src/lane): its config, its model credential's secret (capped agent calls only) and the gateway.
        LANE_CONFIG_FILE: ${secrets.lane_config}
        LANE_DB: /data/lane.sqlite
        GATEWAY_LANE_SECRET_FILE: ${secrets.gateway_lane_secret}
        AIDENHQ_GATEWAY_URL: "${AIDENHQ_GATEWAY_URL:-http://10.231.0.1:8201}"
    # Local speech-to-text for Telegram voice notes (faster-whisper, CPU). The model downloads once into the data dir.
    # Built here from upstream v1.10.0 on patched bases (see whisper/Dockerfile), not pulled from the upstream tag.
    whisper:
      build: ./whisper
      user: image # root in the container owns its model dir, so cap_drop ALL is enough
      read_only: false
      egress: true
      data: ["whisper:/data/whisper"]
      env:
        ASR_ENGINE: faster_whisper
        ASR_MODEL: small
        ASR_MODEL_PATH: /data/whisper
        MODEL_IDLE_TIMEOUT: "300" # unload the model after 5 idle minutes (it holds ~1.5 GB); reloads on the next note
      memory: 2g
      cpus: 2
# Channels the owner may not use: created empty when missing, so compose starts; an empty token means "not configured".
optional_secrets:
  - telegram_notify_bot_token
  - slack_live_app_token
  - slack_live_bot_token
  - slack_live_triage_webhook_url
  - slack_live_triage_webhook_secret
  # The owner's user token (xoxp-) of the Slack live app, for the src_slack gap sync: channels:history, groups:history,
  # im:history, mpim:history, channels:read, groups:read, im:read, mpim:read, users:read (users:read.email for emails).
  - slack_live_user_token
  # The fast chat lane's config (scripts/paperclip-setup.mjs writes it: agents with a `chat:` block, their keys and tools).
  - lane_config
# Generated once by compile (random): the key the owner channel proves an approval decision with (Telegram taps and exact
# replies). Mounted only into slack-live-mcp and the board; agents never hold it.
generated_secrets:
  - slack_live_service_key
  - owner_decide_key
  # Signs the fast chat lane's per-turn model tokens (agent kind only; the gateway refuses any other kind signed with it).
  - gateway_lane_secret
  # src_slack's warehouse login (ops/warehouse-sources.sh gives the role this password).
  - warehouse_src_slack_password
data_version: 0 # its data dir's format: bumped by each forward-only migration (docs/configuration.md)
