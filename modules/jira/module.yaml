name: jira
description: "Jira and Confluence through Atlassian's remote MCP server, passed through whole, signed in as the owner on the board with the scopes the owner picks."
requires:
  - warehouse # its source schema lives in the shared warehouse
  - board # its sign-in banner
# Its sign-in on the board (modules/board/schemas/signins.json), and its schema and the views agents read with source_new
# (modules/warehouse/schemas/sources.json).
contributes:
  board.signins:
    - { id: jira, label: Jira, status_url: "http://jira-mcp:8091/auth/status", connect_url: /jira/connect, callback: /jira/callback,
        missing: "The agents can't read it until it is.", stopped: "The agents can't read it.",
        secrets: [jira_url] }
  warehouse.sources:
    - schema: src_jira
      about: "src_jira.issues / sprints / confluence_pages (Confluence page metadata + a cheap summary: a pointer, never evidence; read the page live) / changes / users"
      identity: users
      views:
        - { name: issues, time: ingested_at, project: project, tsv: true }
        - { name: sprints, time: ingested_at }
        - { name: confluence_pages, time: ingested_at, project: space, tsv: true }
        - { name: changes, time: observed_at, project: scope }
settings:
  # Atlassian's remote MCP server; v2 with ?tools=all lists every tool flat, so per-tool grants hold (no discover/execute*).
  atlassian_mcp_url:
    title: Atlassian MCP address
    default: https://mcp.atlassian.com/v2/mcp?tools=all
    type: url
    host: mcp.atlassian.com
  # Quiet projects' history: the live sync starts 30 days back site-wide, so a project with little recent activity would be
  # nearly empty. Each listed project is read once (baseline rows), back history_days, then left alone.
  history_projects:
    title: Jira projects to backfill
    default: []  # e.g. [ AGR, TRM ]: Jira project keys
connections:
  jira:
    setup: "Press Connect on the board (Settings, Connections), give your Atlassian site's address and allow access."
    guide: "Jira and Confluence directly: exact issue fields, change history (when a status or date changed), comments, versions and JQL queries. Use it for precise dates and history; use Glean to find the issue or page first."
    url: http://jira-mcp:8091/mcp
    auth: jira_service_key
    # Every tool Atlassian's server lists (probed 2026-11-18: 64 for the read scopes, 120 once the owner granted write:jira and
    # write:confluence). Reads added since the first thirteen are `named`: only a grant naming them reaches them. Every write
    # tool is `destructive`: a plain `write` tool runs at Tier 0 unreviewed (kernel/src/writes.ts), and Jira/Confluence edits
    # can change visibility (issue security level, moving or copying pages) or publish data across spaces, so each needs an
    # explicit grant naming it and every call goes to the AI reviewer first (Tier 1).
    tools:
      read: [ searchJiraIssuesUsingJql, getJiraIssue, listJiraIssueChangelogs, listJiraIssueComments, listJiraProjects, getJiraProjectVersions, getJiraProjectVersionRelatedWork, listJiraBoards, getJiraBoardConfig, listJiraBoardSprints, lookupJiraAccountId, searchConfluence, getConfluenceContent,
              atlassianUserInfo, diffConfluenceContentVersions, downloadConfluenceAttachment, downloadJiraIssueAttachment, exportConfluenceContent, getAccessibleAtlassianResources, getConfluenceApproval, getConfluenceAttachment, getConfluenceComment, getConfluenceContentAnalytics, getConfluenceContentAncestors, getConfluenceContentDescendants, getConfluenceContentPermissions, getConfluenceContentRestrictionState, getConfluenceContentStatus, getConfluenceContentSuggestions, getConfluenceContentVersion, getConfluenceMauiApp, getConfluencePersonalSpace, getConfluencePublicLinkStatus, getConfluenceReactions, getConfluenceSpace, getConfluenceSpaceInstructions, getConfluenceTask, getConfluenceTemplate, getContentFormatGuide, getJiraBoardIssueData, getJiraBoardSprintData, getJiraCurrentUser, getJiraEntityProperty, getJiraIssueTypeMetaWithFields, getJiraUser, listConfluenceAttachments, listConfluenceComments, listConfluenceContent, listConfluenceContentVersions, listConfluenceSpaces, listConfluenceTasks, listConfluenceTemplates, listJiraDashboards, listJiraFilters, listJiraIssueAssignableUsers, listJiraIssueLinkTypes, listJiraIssueRemoteIssueLinks, listJiraIssueTransitions, listJiraIssueWorklogs, listJiraProjectComponents, listJiraProjectIssueTypesMetadata, listJiraStatuses, resolveConfluenceContentMacros, showConfluenceEditor ]
      named: [ atlassianUserInfo, diffConfluenceContentVersions, downloadConfluenceAttachment, downloadJiraIssueAttachment, exportConfluenceContent, getAccessibleAtlassianResources, getConfluenceApproval, getConfluenceAttachment, getConfluenceComment, getConfluenceContentAnalytics, getConfluenceContentAncestors, getConfluenceContentDescendants, getConfluenceContentPermissions, getConfluenceContentRestrictionState, getConfluenceContentStatus, getConfluenceContentSuggestions, getConfluenceContentVersion, getConfluenceMauiApp, getConfluencePersonalSpace, getConfluencePublicLinkStatus, getConfluenceReactions, getConfluenceSpace, getConfluenceSpaceInstructions, getConfluenceTask, getConfluenceTemplate, getContentFormatGuide, getJiraBoardIssueData, getJiraBoardSprintData, getJiraCurrentUser, getJiraEntityProperty, getJiraIssueTypeMetaWithFields, getJiraUser, listConfluenceAttachments, listConfluenceComments, listConfluenceContent, listConfluenceContentVersions, listConfluenceSpaces, listConfluenceTasks, listConfluenceTemplates, listJiraDashboards, listJiraFilters, listJiraIssueAssignableUsers, listJiraIssueLinkTypes, listJiraIssueRemoteIssueLinks, listJiraIssueTransitions, listJiraIssueWorklogs, listJiraProjectComponents, listJiraProjectIssueTypesMetadata, listJiraStatuses, resolveConfluenceContentMacros, showConfluenceEditor ]
      write: []
      destructive: [ addOrEditJiraIssueComment, addOrEditJiraIssueWorklog, createJiraIssue, editJiraIssue, transitionJiraIssue, createJiraIssueLink, createJiraIssueRemoteIssueLink, uploadAttachmentToJiraIssue, watchJiraIssue, createConfluenceComment, updateConfluenceComment, updateConfluenceCommentResolution, createConfluenceContent, updateConfluenceContent, copyConfluenceContent, moveConfluenceContent, convertConfluenceContentMode, setConfluenceContentStatus, addConfluenceContentSuggestions, addLabelsToConfluenceContent, addConfluenceReaction, createConfluenceAttachment, completeConfluenceTask, reopenConfluenceTask, createConfluenceInfographicForPage, editConfluenceInfographicForPage, starConfluenceContent, unstarConfluenceContent, starConfluenceSpace, unstarConfluenceSpace, watchConfluenceContent, unwatchConfluenceContent, watchConfluenceLabel, unwatchConfluenceLabel, watchConfluenceSpace, unwatchConfluenceSpace, addConfluenceContentPermissions, removeConfluenceContentPermissions, replaceConfluenceContentPermissions, setConfluenceContentRestrictionState, enableConfluencePublicLink, disableConfluencePublicLink, archiveConfluenceContent, unarchiveConfluenceContent, restoreConfluenceContentVersion, createConfluenceSpace, setConfluenceSpaceInstructions, createConfluenceMauiApp, editConfluenceMauiApp, manageConfluenceApproval, createJiraBoard, manageJiraSprint, manageJiraProjectVersion, manageJiraProjectVersionRelatedWork, convertJiraIssueHierarchy, editJiraEntityProperty ]
secrets:
  state: true # its own vault dir, read-write at /state: the registered client and the token pair, refreshed here
  provided:
    # The Atlassian site every call is pinned to (its cloudId is looked up from the signed-in account's sites), asked for on
    # Connect; empty: Jira is off.
    - name: jira_url
      setup:
        label: Atlassian site address
        pattern: '^https://[a-z0-9-]+\.atlassian\.net/?$'
        help: "Your Atlassian site, as in the browser, for example https://your-company.atlassian.net"
optional_secrets:
  - jira_url
services:
  run:
    jira-mcp:
      build: ./connections/jira-mcp
      tmp: 16m
      egress: true
      links: [board, sources] # the board's sign-in endpoints; the warehouse (shared sources)
      state: /state
      env:
        JIRA_URL_FILE: ${secrets.jira_url}
        ATLASSIAN_MCP_URL: "${settings.atlassian_mcp_url}"
        JIRA_STATE_DIR: /state
        # The board's https address: Connect's one-click link returns there (the default is loopback).
        BOARD_URL: "${BOARD_LAN_URL:-}"
        HISTORY_PROJECTS: "${settings.history_projects}"
        MCP_TOKEN_FILE: ${secrets.jira_service_key}
        # The board's sign-in endpoints: state, and starting or finishing a sign-in.
        JIRA_AUTH_TOKEN_FILE: ${secrets.jira_auth_token}
        # Shared sources (src_jira): its warehouse login.
        WAREHOUSE_PASSWORD_FILE: ${secrets.warehouse_src_jira_password}
        # Confluence page summaries (src_jira.confluence_pages) through the model gateway with the source writers' key.
        OPENROUTER_KEY_FILE: ${secrets.gateway_source_key}
        OPENROUTER_BASE_URL: "${AIDENHQ_GATEWAY_URL:-http://10.231.0.1:8201}/api/v1"
# The board's Connect/Reconnect for Jira: its sign-in token, only while this module is on.
board_env:
  JIRA_AUTH_TOKEN_FILE: ${secrets.jira_auth_token}
# The kernel's bearer for jira-mcp, and the board's for its sign-in endpoints: compile creates them (random) when missing.
generated_secrets:
  - jira_service_key
  - jira_auth_token
  # src_jira's warehouse login (ops/warehouse-sources.sh gives the role this password).
  - warehouse_src_jira_password
