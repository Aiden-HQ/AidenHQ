name: jira
description: "Jira (and Confluence reads) through Atlassian's remote MCP server, signed in as the owner on the board."
settings:
  # The Atlassian site every call is pinned to (its cloudId is looked up from the signed-in account's sites).
  jira_url:
    required: true  # e.g. https://your-company.atlassian.net
    type: url
    host: "*.atlassian.net"
  # Atlassian's remote MCP server; v2 with ?tools=all lists every tool flat, so per-tool grants hold (no discover/execute*).
  atlassian_mcp_url:
    default: https://mcp.atlassian.com/v2/mcp?tools=all
    type: url
    host: mcp.atlassian.com
  # Quiet projects' history: the live sync starts 30 days back site-wide, so a project with little recent activity would be
  # nearly empty. Each listed project is read once, back history_days (baseline rows), then left alone.
  history_projects:
    default: []  # e.g. [ AGR, TRM ]: Jira project keys
  history_days:
    default: 365
connections:
  jira:
    setup: "Set your Atlassian site's URL on the board (Settings, Connections) and approve the change, then press Connect on the board from the host's loopback address (http://127.0.0.1:3120)."
    guide: "Jira and Confluence directly: exact issue fields, change history (when a status or date changed), comments, versions and JQL queries. Use it for precise dates and history; use Glean to find the issue or page first."
    url: http://jira-mcp:8091/mcp
    auth: jira_service_key
    tools:
      read: [ searchJiraIssuesUsingJql, getJiraIssue, listJiraIssueChangelogs, listJiraIssueComments, listJiraProjects, getJiraProjectVersions, getJiraProjectVersionRelatedWork, listJiraBoards, getJiraBoardConfig, listJiraBoardSprints, lookupJiraAccountId, searchConfluence, getConfluenceContent ]
      # Defined for later; nobody is granted them by default.
      write: [ addOrEditJiraIssueComment, createJiraIssue ]
secrets:
  state: true # its own vault dir, read-write at /state: the registered client and the token pair, refreshed here
services:
  run:
    jira-mcp:
      build: ./connections/jira-mcp
      tmp: 16m
      egress: true
      links: [board, sources] # the board's sign-in endpoints; the warehouse (shared sources)
      state: /state
      env:
        JIRA_URL: "${settings.jira_url}"
        ATLASSIAN_MCP_URL: "${settings.atlassian_mcp_url}"
        JIRA_STATE_DIR: /state
        HISTORY_PROJECTS: "${settings.history_projects}"
        HISTORY_DAYS: "${settings.history_days}"
        MCP_TOKEN_FILE: ${secrets.jira_service_key}
        # The board's sign-in endpoints: state, and starting or finishing a sign-in.
        JIRA_AUTH_TOKEN_FILE: ${secrets.jira_auth_token}
        # Shared sources (src_jira): its warehouse login.
        WAREHOUSE_PASSWORD_FILE: ${secrets.warehouse_src_jira_password}
        # Confluence page summaries (src_jira.confluence_pages) through the model gateway with the source writers' key.
        OPENROUTER_KEY_FILE: ${secrets.gateway_source_key}
        OPENROUTER_BASE_URL: "${AIDENHQ_GATEWAY_URL:-http://10.231.0.1:8201}/api/v1"
# The board's Connect/Reconnect for Jira: its sign-in token, only while this module is on.
board_env:
  JIRA_AUTH_TOKEN_FILE: ${secrets.jira_auth_token}
# The kernel's bearer for jira-mcp, and the board's for its sign-in endpoints: compile creates them (random) when missing.
generated_secrets:
  - jira_service_key
  - jira_auth_token
  # src_jira's warehouse login (ops/warehouse-sources.sh gives the role this password).
  - warehouse_src_jira_password
