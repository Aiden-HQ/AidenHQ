# jira module: its compose services. Paths are relative to this module; scripts/compile.mjs makes them absolute.

services:
  jira-mcp:
    extends: { file: ../../compose.base.yaml, service: hardened }
    build: ./connections/jira-mcp
    image: aidenhq/jira-mcp:local
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      JIRA_URL: "${settings.jira_url}"
      ATLASSIAN_MCP_URL: "${settings.atlassian_mcp_url}"
      JIRA_STATE_DIR: /state
      HISTORY_PROJECTS: "${settings.history_projects}"
      HISTORY_DAYS: "${settings.history_days}"
      MCP_TOKEN_FILE: /run/secrets/jira_mcp_token
      # The board's sign-in endpoints: state, and starting or finishing a sign-in.
      JIRA_AUTH_TOKEN_FILE: /run/secrets/jira_auth_token
      # Shared sources (src_jira): its warehouse login.
      WAREHOUSE_PASSWORD_FILE: /run/secrets/warehouse_src_jira_password
      # Confluence page summaries (src_jira.confluence_pages); without the key file, metadata only.
      # Summaries go through the model gateway (services/gateway) with the source writers' key, never OpenRouter's.
      OPENROUTER_KEY_FILE: /run/secrets/gateway_source_key
      OPENROUTER_BASE_URL: "${AIDENHQ_GATEWAY_URL:-http://10.231.0.1:8201}/api/v1"
    volumes:
      # Read-write: the registered client and the token pair, refreshed here.
      - ${AIDENHQ_SECRETS_DIR}/jira:/state
    secrets:
      - jira_mcp_token
      - jira_auth_token
      - warehouse_src_jira_password
      - gateway_source_key
    dns: [ 1.1.1.1, 8.8.8.8 ] # see paperclip
    networks:
      - backplane
      - egress
      - sources # the warehouse (shared sources)
  # The board's Connect/Reconnect for Jira: its sign-in token, only while this module is on (merged into the root board).
  board:
    secrets:
      - jira_auth_token
secrets:
  jira_mcp_token:
    file: ${AIDENHQ_SECRETS_DIR}/jira_mcp_token
  jira_auth_token:
    file: ${AIDENHQ_SECRETS_DIR}/jira_auth_token
  warehouse_src_jira_password:
    file: ${AIDENHQ_SECRETS_DIR}/warehouse_src_jira_password
