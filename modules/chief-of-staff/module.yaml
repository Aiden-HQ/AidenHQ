name: chief-of-staff
description: "Aiden (the chief of staff the owner talks to, who delegates and follows up), the Researcher (long research, drafts, task replies and recurring reports) and the daily brief."
# The chief of staff and the Researcher hand code work to the Engineers (the "Handing work to an Engineer" section).
requires: [ engineering, owner-channel ]
roles:
  declares:
    - { id: fleet-admin, description: "The board's fleet tools and relaying the owner's words; the chief of staff: never paused, never passed to by an agent." }
    - { id: board-writer, description: "Board moves and recurring tasks." }
    # Declared here (every instance has the chief of staff) so the upstream tools have a holder even without the Maintainer;
    # the Maintainer requests it (it files the Fleet Steward's product-bug reports).
    - { id: product-issues, description: "Product bugs as issues on the product repo, as the owner (github-mcp github_product_issue)." }
  requests: [ ship-admin? ]
agents:
  chief-of-staff:
    skills: [ chief-of-staff.ideas, tasks.delegate-work ]
    department: leadership
    # The owner's message must not queue behind a long wake on another task: on 2026-11-14 a Telegram question waited
    # 5m48s for two runs on the chief of staff's notice chat (WOR-2275). Paperclip still runs one at a time per task.
    max_parallel: 2
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: high
    timeout_sec: 1200
    # Grants: `connection: read | write | [tools]`; `name?` = only when that module is installed.
    connections:
      google_workspace?: [ calendar_list_events, calendar_get_event ]
      # A quick lookup answered in the owner's chat, not delegated (reads only): Drive, Confluence, Jira and Slack in one search.
      glean?: [ search, read_document ]
      # The CRM (hubspot module): reads, plus manage_crm_objects (a note, a task, a deal update): a kernel record the AI
      # reviewer decides first, and the owner when it touches more than 5 records.
      hubspot?: [ get_user_details, get_organization_details, discover_hubspot_schema, search_crm_objects, get_crm_objects, query_crm_data, search_properties, get_properties, search_owners, tool_guidance, manage_crm_objects ]
      owner_channel: [ notify, notify_recent ]
      # Product bugs as issues on the product repo, as the owner labelled as AidenHQ, with the github module:
      # report one (deduped by fingerprint) and read their state. No other GitHub reads, and no repo input.
      github?: [ github_product_issue, github_product_issue_status, github_issue_link ]
      apps: [ app_list, app_status, app_view, web_view, warehouse_query, source_new, source_ack ]
      # The host's live series (disk, memory, containers), read at brief time rather than copied from a note: reads only.
      grafana?: read
      # ship's per-repo PR settings (role ship-admin), when the ship module is on: read them, change one repo's entry.
      ship?: [ ship_config, ship_configure ]
      # The live product pin and the last applies, and the owner's stale todos for the brief (the fleet-steward module's connection, when it is on).
      fleet_steward?: [ fleet_generation_status, fleet_stale_followups, fleet_followup_snooze, flow_report ]
      paperclip_tasks: [ task_current, task_get, task_comments, task_search, task_list, task_approvals, task_create, task_update, task_comment, task_handoff, task_block, task_cancel, task_finish, task_team, task_delegate, task_amend_rubric, fleet_status, fleet_costs, fleet_control, fleet_catalog, task_relay_owner_words, chat_open, app_request_from_owner ]
    # Woken every heartbeat_hours to check the work it waits on (modules/chief-of-staff/heartbeat.md); events wake it sooner (board wake.ts).
    heartbeat: true
    # fleet-admin: the board's fleet tools and relaying the owner's words (services/board/src/fleet.ts).
    # product-issues: product bugs upstream as the owner (github-mcp).
    roles: [ fleet-admin, product-issues, ship-admin? ]
  assistant:
    skills: [ chief-of-staff.recurring-reports, chief-of-staff.research-tasks, chief-of-staff.research-tools, chief-of-staff.task-replies, google.calendar-changes, google.gmail-writes, primer.primer-docs, tasks.delegate-work ]
    department: leadership
    max_parallel: 3 # research asks are independent
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: high
    # Recurring runs read many channels, docs and notes.
    timeout_sec: 3600
    connections:
      # Public web pages, and the apps' live pages (reads only).
      apps: [ app_list, web_view, app_view ]
      # knowledge_*: reference docs mounted from the meetings knowledge_mounts setting.
      # The notes vault: reads, a correction to a meeting note the owner asks for (skill task-replies) and voice notes.
      ops_mcp?: [ obsidian_search, obsidian_read, obsidian_read_document_map, meeting_note_correct, voice_note_read, voice_note_add, knowledge_list, knowledge_index, knowledge_search, knowledge_read ]
      glean?: read
      # HubSpot (hubspot module): reads only; changing the CRM is the chief of staff's.
      hubspot?: [ get_user_details, get_organization_details, discover_hubspot_schema, search_crm_objects, get_crm_objects, query_crm_data, search_properties, get_properties, search_owners, tool_guidance ]
      # Jira through Atlassian's MCP server, signed in as the owner (jira module): reads only.
      # Not granted: getJiraBoardConfig, getJiraProjectVersionRelatedWork (tool-budget slimming, 2026-11-13).
      jira?: [ searchJiraIssuesUsingJql, getJiraIssue, listJiraIssueChangelogs, listJiraIssueComments, listJiraProjects, getJiraProjectVersions, listJiraBoards, listJiraBoardSprints, lookupJiraAccountId, searchConfluence, getConfluenceContent ]
      # Reads, plus slack_send_message_draft: a draft for the user to send, only when asked.
      slack?: write
      # Writes only when the user asks; each is a write record the AI reviewer decides.
      github?: [ github_whoami, github_project_read, github_issue_read, github_search_issues, github_issue_comment, github_issue_create, github_issue_update, github_pr_review, github_rerun_failed ]
      # Reads, plus the owner's asked-for calendar changes and email (skills google.calendar-changes, google.gmail-writes):
      # each a write record the AI reviewer decides first.
      google_workspace?: [ docs_read, drive_search_files, drive_read_file, drive_list_recent_files, drive_list_meeting_documents, calendar_list_events, calendar_search_events, calendar_get_event, gmail_search, gmail_read_thread,
                           calendar_create_event, calendar_update_event, calendar_delete_event, calendar_respond, gmail_draft, gmail_send ]
      primer?: [ primer_whoami, primer_resolve_url, primer_get_document, primer_get_version_content, primer_list_versions, primer_get_comments, primer_get_document_comments, primer_list_documents, primer_find_document, primer_get_all_comments, primer_get_events, primer_get_doc, primer_list_collaborators, primer_list_decisions, primer_list_runs, primer_list_suggestions, primer_list_tasks, primer_lookup_user, primer_read_records, primer_record_changes, primer_widget_get, primer_create_document, primer_add_version, primer_reply_to_thread, primer_resolve_thread, primer_send_events, primer_apply_ops, primer_create_thread, primer_reanchor_thread, primer_update_run, primer_withdraw_suggestion, primer_propose_pick, primer_fork_document, primer_promote_conversation, primer_widget_draft, primer_widget_publish, primer_write_records, primer_revert_record_change, primer_add_collaborator ]
      # task_team, task_delegate: code work goes to an Engineer the way everyone hands it on (skill tasks.delegate-work).
      # task_schedule, task_recurring: board moves on a date and recurring tasks. task_merge: merging tasks.
      paperclip_tasks: [ task_current, task_get, task_comments, task_files, task_file_read, task_search, task_list, task_create, task_update, task_comment, task_handoff, task_block, task_wait, task_cancel, task_team, task_delegate, task_amend_rubric, fleet_catalog, task_schedule, task_recurring, task_pass_on, task_merge, task_finish, fanout_map ]
    # board-writer: board moves and recurring tasks (paperclip-tasks-mcp).
    roles: [ board-writer ]
routines:
  daily-brief:
    title: Prepare daily brief
    agent: chief-of-staff
    description: |
      Today is {{date}}. Prepare today's daily brief following your instructions: gather open tasks and
      today's calendar, create or update today's "Daily Brief" task, close yesterday's,
      then follow your ideas skill, then close this task with a one-line summary.
    concurrency: skip_if_active
    schedules:
      - { cron: "30 8 * * 1-5", timezone: "${settings.timezone}", label: "weekday morning" }
  task-replies:
    title: Process task replies
    agent: assistant
    # Started by the kernel when you comment on your tasks (no schedule).
    description: |
      Today is {{date}}. Process replies on: {{tasks}}
      Follow "B. Processing the user's replies" in your instructions: act on clear intent only, with task_update, task_schedule,
      task_recurring, task_merge, task_cancel and task_comment, and the GitHub, Primer and meeting-note writes that section names.
      Then close this task with one line saying what you did.
    concurrency: always_enqueue
# How every crew agent works with the owner and the fleet (spec §2.1: workflow prose, not the kernel's); of these, only the
# Replying rule reaches an Engineer too (the run's final message is its one task comment).
prompts:
  - { id: how-we-work, file: prompts/how-we-work.md, order: first, when: { fields: { profile: crew } } }
  - { id: progress, file: prompts/progress.md, order: first, when: { fields: { profile: crew } } }
  - { id: replying, file: prompts/replying.md, order: first }
  - { id: asking, file: prompts/asking.md, order: first, when: { tools: [ owner_channel.notify ] } }
  # The chief of staff settles the other agents' questions for the owner (kernel escalate.ts files one task per ask).
  - { id: deciding, file: prompts/deciding.md, when: { roles: [ fleet-admin ] } }
  - { id: privacy, file: prompts/privacy.md, when: { fields: { profile: crew } } }
  # {{fleet_issues}}: the "Fleet issues" task where heartbeat runs note missed wake-ups (setup finds or creates it).
  - { id: heartbeat, file: prompts/heartbeat.md, order: last, when: { fields: { heartbeat: true } } }
settings:
  # Heartbeats: hours between an agent's scheduled "Heartbeat: <key>" runs (1, 2, 3, 4, 6, 8, 12 or 24); an agent's
  # `heartbeat: <hours>` (or overrides.agents.<key>.heartbeat) sets its own.
  heartbeat_hours:
    default: 4
    values: [1, 2, 3, 4, 6, 8, 12, 24]
# The "Fleet issues" task heartbeat runs note missed wake-ups on.
labels:
  - { name: system-error, color: "#dc2626" }
  # One next step offered to the owner at a time (skill ideas): Home shows the open one with its two answers.
  - { name: idea, color: "#0891b2" }
