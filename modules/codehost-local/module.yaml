name: codehost-local
description: "Repositories on this server as the code host: bare repos under the data dir, change requests as git refs, the checks receipt, and an atomic squash merge. No GitHub needed."
license: MIT
# The code host role (docs/design/codehost-local.md): it owns the org `local` (setup's local/aidenhq-instance included);
# codehost-github owns every other org. The kernel runs it in process, with no service and no GitHub App: src/kinds.ts declares
# the `codehost-local.{push,pr,merge,close,create_repo}` write kinds (args, floor, card; their executor is this module's own, in
# process, with no URL and no key), and src/host.ts executes them against the bare repos, plus clone and snapshot; src/refuse.ts
# is a merge's three refusals (head-moved, checks-not-green, conflict); src/apply.ts is the instance land. A green change asks for its merge itself (kernel/src/localmerge.ts, as the
# task's own agent): Tier 1 `local-merge`, the AI reviewer's, so no Engineer runs `aidenhq merge` either.
provides: [ codehost ]
# A change request's checks (host.ts merges only on a passing receipt for its exact head): the same tests a GitHub change runs
# (the secret scan, supply chain, lint, tests and build; checks/ is a copy of codehost-github's, scripts/sync-shared.ts), in a
# credential-free box on the change's snapshot. The kernel asks for them when a change is opened, and again when a base moved
# under an open one, so no Engineer runs a check by hand either.
check_jobs:
  change:
    dir: checks
    argv: [ bash, /aidenhq-out/recipe/tests.sh ]
    timeout_min: 30
    title: "the secret scan, supply-chain checks, lint, tests and build"
    spec: { base: sha }
# Flow (docs/design/flow.md): the kernel records these itself (kernel/src/codehost.ts localFacts, as module:codehost-local), the same
# facts codehost-github emits. Every change here is an agent's (author_kind agent); pr.pushed is a head moving on an open change.
roles:
  requests: [ kernel.facts ] # the compiler's price of declaring facts: this module has no token, the kernel writes them itself
facts:
  pr.opened: { subject: pr }
  pr.pushed: { subject: pr }
  pr.closed: { subject: pr }
  pr.checks_started: { subject: pr }
  pr.checks_completed: { subject: pr }
  pr.merged: { subject: pr }
  work.waiting: { subject: pr, reasons: [ checks ] }
  work.resumed: { subject: pr, reasons: [ checks ] }
  code.added: { subject: pr }
  code.rewritten: { subject: pr }
# The PR's journey, as codehost-github declares it (a local change has no issue: it starts at its task).
# One declaration, identical in every code host (the compiler checks): a phase a host never records is simply absent.
journeys:
  - name: pr
    label: Pull requests
    subject: pr
    phases:
      - { name: triage, label: Triage, from: [ issue.opened ] }
      - { name: pickup, label: Pickup, from: [ issue.labeled, task.created ] }
      - { name: coding, label: Coding, from: [ job.started ] }
      - { name: review, label: AI review, from: [ record.filed ], where: { kind: [ github.pr, github.push, codehost-local.pr, codehost-local.push ] } }
      - { name: open, label: PR open, from: [ pr.opened ] }
      - { name: ci, label: CI, from: [ pr.checks_started, pr.pushed ] }
      - { name: merge, label: Merge review, from: [ record.filed ], where: { kind: [ github.merge, codehost-local.merge ] } }
      - { name: deploy, label: Deploy, from: [ pr.merged ] }
    end: [ pr.deployed, pr.closed ]
# Its check jobs and an Engineer's repo-checkout read the repos it hosts, through the kernel's broker.
codehost:
  snapshot: { repos: [ "local/*" ] }
