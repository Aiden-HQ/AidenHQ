name: ship
description: "Ship: owns every pull request's lifecycle on the repos it covers (the fleet's own, and the ones you list in maintainer_repos): per-repo settings and presets (cautious, full), one round engine for every PR, a task's own and a member's hand-off alike (repair, update-branch, wakes for red checks and code review's findings, holds that tell their owner, the merge on code review's pass, App approval), CI re-runs, Dependabot tasks and quiet contributor PRs."
license: MIT
# Design: docs/superpowers/specs/2026-11-24-ship-design.md. The service (service/) holds the per-repo settings (`ship`), the
# adoption records (data/ship/state.json, holds only: the rest is derived from the PR) and the watch loop (service/src/loop.ts, moved
# from github's pr-watch.ts; its own table in data/ship/loop.json), which reaches GitHub, code review's verdict and
# pr-tasks.json through github's /internal/ship/* routes with this module's token. Its tools
# (ship_config, ship_configure) read and change the setting like code-review's config tool: validated whole,
# one typed settings change filed as the calling job; a change that loosens anything is the owner's, made from the Fleet page
# (the Fleet page).
requires:
  - github # the covered repos' reads (/internal/ship/*) and the effects ship files (github.merge, approve, enqueue, repair, retarget)
  - code-review # a new repo is added to settings.code_review with the others (the Fleet page's Add repo)
  - board # contributes.board.pages
contributes:
  # The Fleet page: a module view served by the connection below, on the owner's own calls (docs/design/board-ui.md "Modules").
  board.pages:
    - { id: ship, title: Ship, icon: rocket, order: 10, connection: ship, view: "ui://ship/page", tools: [ ship_config, ship_configure, ship_status ], settings: [ ship, ship_paused, code_review, maintainer_repos ] }
roles:
  # kernel.settings: the config tool's settings changes (writers below). kernel.tasks and kernel.wake: a hand-off's one Engineer
  # task (module-task source ship:<repo>/<n>:<generation>) and its wakes (handoff.ts, rounds.ts); the watch loop's Dependabot
  # tasks, the Maintainer's contributor-PR tasks and the wakes of a fleet PR's task (loop.ts). kernel.work-read: a fleet PR's
  # task's status and records (a cancelled task's PR is left open for a successor; a merge already open isn't filed twice).
  requests: [ kernel.settings, kernel.tasks, kernel.wake, kernel.work-read ]
  declares:
    - { id: ship-admin, description: "Reads ship's settings and changes one repo's entry (ship_config, ship_configure) when the owner asks in words; a change that loosens anything is the owner's." }
# The change feed's events on every repo the code host manages (service/src/loop.ts followFeed; kernel events.ts log, read with the
# service's own cursor): a repo an event names gets its one list read, so nothing polls GitHub on a timer. "*": ship works the
# product repo and the fleet's repos as well as maintainer_repos, and reads only the ones it watches.
subscribes:
  github:
    kinds: [ pull_request.opened, pull_request.synchronize, pull_request.ready_for_review, pull_request.converted_to_draft, pull_request.edited, pull_request.closed, pull_request.reopened, pull_request.labeled, pull_request.unlabeled, pull_request_review.submitted, issue_comment.created, check_run.completed, status, push, github.resync ]
    resources: "*"
# The deterministic repair (recipe/repair.ts), no model and no credential: the PR's head merged with its base, generated paths
# and conflicted lockfiles regenerated; it keeps the files that change, which github's `repair` effect (filed by ship) asks for
# and writes as the App. base: the base branch's tip; merge_base: the head's merge base with it; base_ref: its name; plan:
# { globs, commands } (rounds.ts repairPlan); attempt: 1, or 2 for the one retry of a run that didn't finish (a new check).
check_jobs:
  ship-repair:
    dir: recipe
    argv: [ node, /aidenhq-out/recipe/repair.ts ]
    timeout_min: 30
    title: ship's repair
    spec: { base: sha, merge_base: sha, base_ref: text, plan: json, attempt: int }
    result: true
    keep: true
# The report: one comment per adopted PR, edited in place (report.ts), on the repos ship covers.
codehost:
  comment: { repos: [ "@agents/*", "@product", "@maintained" ] }
settings:
  # The per-repo ship settings: { defaults: cautious | full | { preset, …fields }, repos: { owner/name: cautious | full | { preset?,
  # handoff: none|label|all, rebase: conflict|behind, generated: { globs, command },
  # fix: [conflicts, ci, review], protected: [globs], caps: { wakes_per_head, ci_rounds, same_check_heads,
  # rounds, usd, requeue_on_timeout: a number, or null for unlimited },
  # by_tier: { skip|trivial|standard|sensitive: { approve: off|observe|on (not skip), merge: off|ready } } (the risk tier code review gives
  # each PR head; a tier or field omitted takes the preset's), unwatched: { merge: off|ready } (a repo code review doesn't watch has no
  # tier), enabled: true|false, stop_label,
  # actions: { conflict|behind|before_merge: [ { comment: "/cmd" } | { workflow: "file.yml", inputs? } ] } (the repo's own commands
  # and workflows, run before ship's own step; before_merge takes workflows only; service/src/actions.ts) } } }. Ship works the fleet org's repos and the product repo; a maintainer_repos repo is worked only once it has an entry here (quiet until enabled). The Fleet page
  # edits it; this is the advanced form. Read by the service (service/src/settings.ts).
  ship:
    type: object
    writers: [ ship-admin ]
    default:
      defaults: cautious
      repos: {}
  # The kill switch: true stops every adoption, push, approval and merge; PRs resume where they were. Its own setting, so a repo
  # change saved from an older proposal can never put it back (resuming is the owner's).
  ship_paused:
    default: false
    writers: [ ship-admin ]
# The Fleet page (contributes.board.pages above) calls only this module's own tools: ship_config and ship_configure
# for settings and presets, ship_status for status.
connections:
  ship:
    setup: "Built in: nothing to connect."
    url: http://ship:8101/mcp
    auth: ship_service_key
    returns: untrusted
    tools:
      read: [ ship_config, ship_status ]
      write: [ ship_configure ]
services:
  data: true
  run:
    ship:
      build: ./service
      tmp: 16m
      port: 8101
      egress: true # the kernel's listener is a host address
      # github's network: its reads and effects.
      join: [github]
      data: ["ship:/data"]
      env:
        SHIP_STATE_FILE: /data/state.json
        SHIP_SETTINGS: "${settings.ship}"
        SHIP_PAUSED: "${settings.ship_paused}"
        SHIP_FLEET_ORG: "${settings.github_fleet_org}"
        SHIP_PRODUCT_REPO: "${settings.product_repo}"
        SHIP_MAINTAINER_REPOS: "${settings.maintainer_repos}"
        # github's routes for ship (service/src/ship-routes.ts) and github-mcp's contributor-PR read.
        SHIP_GITHUB_URL: http://github:8100
        SHIP_CONTRIBUTOR_PRS_URL: http://github:8086/internal/ship/contributor-prs
        SHIP_CODE_REVIEW: "${settings.code_review}"
        SHIP_TOKEN_FILE: ${secrets.ship_token}
        SHIP_SERVICE_KEY_FILE: ${secrets.ship_service_key}
        AIDENHQ_KERNEL_URL: http://10.231.0.1:3130
generated_secrets:
  - ship_token
  - ship_service_key
data_version: 0 # its data dir's format: bumped by each forward-only migration (docs/configuration.md)
