<!doctype html>
<!-- Ship's Fleet page: an MCP Apps view (text/html;profile=mcp-app) the ship connection serves as ui://ship/page. One file, inline
     script and style only (the frame loads and sends nothing), themed by the host's style variables, calling only ship_config,
     ship_status and ship_configure through the host. As the owner, ship_configure only proposes: the board shows the change and
     files it on his Save. docs/design/board-ui.md "Modules". -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; font-family: var(--font-sans, system-ui, sans-serif); font-size: 13.5px; line-height: 1.45; color: var(--color-text-primary, CanvasText); background: transparent;
    --line: var(--color-border-primary, GrayText); --soft: var(--color-text-secondary, GrayText); --accent: var(--color-ring-primary, Highlight); --r: var(--border-radius-md, 8px); }
  * { box-sizing: border-box; }
  body { margin: 0; display: grid; gap: 14px; }
  .card { border: 1px solid var(--line); border-radius: calc(var(--r) + 2px); background: var(--color-background-secondary, Canvas); overflow: hidden; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .head b { font-size: 13.5px; font-weight: 600; }
  .head small, .soft { color: var(--soft); }
  .row { display: grid; grid-template-columns: minmax(150px, 1.6fr) 64px repeat(4, minmax(104px, 1fr)) 72px; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); }
  .row.cols { border-top: 0; padding-top: 7px; padding-bottom: 7px; color: var(--soft); font-size: 12px; background: color-mix(in srgb, var(--line) 12%, transparent); }
  .row:not(.cols):hover { background: color-mix(in srgb, var(--line) 10%, transparent); }
  .row.unsaved { box-shadow: inset 2px 0 0 var(--accent); }
  .repo { font-weight: 560; overflow-wrap: anywhere; }
  .repo i { font-style: normal; font-weight: 400; color: var(--soft); margin-left: 6px; }
  select, input[type=text] { font: inherit; width: 100%; min-width: 0; padding: 4px 8px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--color-background-primary, Canvas); color: inherit; }
  select:focus-visible, input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  select:disabled { opacity: .45; }
  button { font: inherit; height: 28px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--color-background-primary, Canvas); color: inherit; cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--color-text-inverse, HighlightText); }
  button:disabled { opacity: .5; cursor: default; }
  .sw { position: relative; width: 34px; height: 20px; padding: 0; border-radius: 10px; background: color-mix(in srgb, var(--line) 55%, transparent); border: 0; transition: background .16s; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--color-background-primary, Canvas); box-shadow: 0 1px 2px rgb(0 0 0 / .3); transition: transform .16s; }
  .sw[aria-checked=true] { background: var(--accent); }
  .sw[aria-checked=true]::after { transform: translateX(14px); }
  .pause { display: flex; align-items: center; gap: 8px; }
  .pause.on { color: var(--color-text-danger, red); }
  .add { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line); }
  .add input { max-width: 320px; }
  .hold { display: grid; grid-template-columns: minmax(150px, 1fr) 110px 2fr; gap: 10px; padding: 7px 14px; border-top: 1px solid var(--line); }
  .hold:first-of-type { border-top: 0; }
  .empty { padding: 14px; color: var(--soft); }
  .tag { display: inline-block; justify-self: start; padding: 0 6px; border-radius: 5px; border: 1px solid var(--line); font-size: 12px; color: var(--soft); }
  .note { padding: 8px 14px; border-top: 1px solid var(--line); color: var(--soft); }
  .note:empty { display: none; }
  .note.err { color: var(--color-text-danger, red); }
  .lab { display: none; color: var(--soft); font-size: 12px; }
  @media (max-width: 760px) {
    .row.cols { display: none; }
    .row { grid-template-columns: 1fr 1fr; gap: 8px 10px; padding: 10px 14px; }
    .row .repo { grid-column: 1; } .row .onoff { grid-column: 2; justify-self: end; }
    .lab { display: block; margin-bottom: 2px; }
    .hold { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="head"><div><b>Repos</b> <small id="count"></small></div><label class="pause" id="pausebox"><span id="pausetxt">Running</span><button class="sw" id="pause" role="switch" aria-checked="true" aria-label="Ship is running"></button></label></div>
  <div id="rows"></div>
  <form class="add" id="add"><input type="text" id="newrepo" placeholder="owner/name" aria-label="Repo to add" autocomplete="off" spellcheck="false"><button class="primary" type="submit">Add repo</button><button type="button" id="refresh">Refresh</button></form>
  <div class="note" id="note" role="status"></div>
</div>
<div class="card">
  <div class="head"><b>On hold</b><small>PRs ship stopped on, with why</small></div>
  <div id="holds"></div>
</div>
<script>
  // The view's half of the MCP Apps bridge: JSON-RPC 2.0 over postMessage to the host (window.parent).
  let next = 1;
  const waiting = new Map();
  const send = (method, params) => new Promise((ok, ko) => { const id = next++; waiting.set(id, { ok, ko }); parent.postMessage({ jsonrpc: "2.0", id, method, params }, "*"); });
  const notify = (method, params) => parent.postMessage({ jsonrpc: "2.0", method, params }, "*");
  const theme = (ctx) => { for (const [k, v] of Object.entries(ctx?.styles?.variables ?? {})) if (v) document.documentElement.style.setProperty(k, v); if (ctx?.theme) document.documentElement.style.colorScheme = ctx.theme; };
  addEventListener("message", (e) => {
    if (e.source !== parent) return;
    const w = waiting.get(e.data?.id);
    if (!w) return;
    waiting.delete(e.data.id);
    e.data.error ? w.ko(new Error(e.data.error.message)) : w.ok(e.data.result);
  });
  // In the owner's Claude the host fences every string the tool answers as untrusted data: read the value out of the fence (it still only ever reaches the page as text).
  const unfence = (v) => typeof v === "string" ? (v.match(/^<untrusted-data[^>]*>([\s\S]*)<\/untrusted-data>$/)?.[1] ?? v).replace(/&lt;(\/?untrusted-data)/gi, "<$1") : Array.isArray(v) ? v.map(unfence) : v && typeof v === "object" ? Object.fromEntries(Object.entries(v).map(([k, x]) => [k, unfence(x)])) : v;
  const tool = async (name, args) => { const r = await send("tools/call", { name, arguments: args }); if (r?.isError) throw new Error(r.content?.[0]?.text ?? "failed"); return unfence(r.structuredContent ?? {}); };
  new ResizeObserver(() => { const r = document.body.getBoundingClientRect(); notify("ui/notifications/size-changed", { width: Math.ceil(r.width), height: Math.ceil(r.height) }); }).observe(document.body);

  const $ = (id) => document.getElementById(id);
  const h = (tag, props, ...kids) => { const el = Object.assign(document.createElement(tag), props); el.append(...kids.filter((k) => k !== null)); return el; };
  const say = (t, err) => { $("note").textContent = t; $("note").className = err ? "note err" : "note"; };
  let controls = {}, status = { paused: false, repos: [], held: [] };
  // The one edit the owner hasn't saved yet: the board holds a single proposal, so each edit replaces the last (and a Discard there leaves no draft here).
  let pending = null;
  const shown = (r) => (pending && pending.repo === r.repo ? { ...r, ...pending.fields } : r);

  async function propose(repo, fields) {
    try {
      const r = await tool("ship_configure", { repo, change: fields });
      pending = { repo, fields };
      say(`Proposed: ${(r.changes ?? []).join("; ")}. Save it in the bar above.`);
    } catch (e) { say(e.message, true); }
    render();
  }

  function choice(r, key) {
    const c = controls[key];
    const sel = h("select", { ariaLabel: `${c.label} for ${r.repo}` });
    for (const v of c.values) sel.append(h("option", { value: v, textContent: v, selected: shown(r)[key] === v }));
    sel.addEventListener("change", () => propose(r.repo, { [key]: sel.value }));
    return h("div", {}, h("span", { className: "lab", textContent: c.label }), sel);
  }

  function render() {
    $("count").textContent = status.repos.length ? `${status.repos.length}` : "";
    const paused = status.paused;
    $("pause").setAttribute("aria-checked", String(!paused));
    $("pause").setAttribute("aria-label", paused ? "Ship is paused" : "Ship is running");
    $("pausetxt").textContent = paused ? "Paused: nothing is adopted, pushed, approved or merged" : "Running";
    $("pausebox").className = paused ? "pause on" : "pause";
    const rows = status.repos.map((raw) => {
      const r = shown(raw);
      const sw = h("button", { className: "sw", role: "switch", ariaChecked: String(!!r.enabled), ariaLabel: `Ship on ${r.repo}` });
      sw.setAttribute("aria-checked", String(!!r.enabled));
      sw.addEventListener("click", () => propose(r.repo, { enabled: !r.enabled }));
      const rm = h("button", { type: "button", textContent: "Remove", ariaLabel: `Remove ${r.repo}` });
      rm.addEventListener("click", async () => { try { const x = await tool("ship_configure", { repo: r.repo, remove: true }); pending = null; say(`Proposed: ${(x.changes ?? []).join("; ")}. Save it in the bar above.`); } catch (e) { say(e.message, true); } });
      return h("div", { className: pending && pending.repo === r.repo ? "row unsaved" : "row" },
        h("div", { className: "repo", textContent: r.repo }), h("div", { className: "onoff" }, h("span", { className: "lab", textContent: controls.enabled.label }), sw),
        choice(raw, "preset"), choice(raw, "handoff"), choice(raw, "approve"), choice(raw, "merge"), rm);
    });
    const cols = h("div", { className: "row cols" }, ...["Repo", "On", "Preset", "Adopt PRs", "Approve", "Merge", ""].map((t) => h("span", { textContent: t })));
    $("rows").replaceChildren(...(rows.length ? [cols, ...rows] : [h("div", { className: "empty", textContent: "No repo is on yet. Ship stays quiet until you add one: it adopts the PRs you hand it and works them to a merge." })]));
    $("holds").replaceChildren(...(status.held.length ? status.held.map((x) => h("div", { className: "hold" }, h("span", { textContent: `${x.repo}#${x.number}` }), h("span", { className: "tag", textContent: String(x.hold?.kind ?? "").replace("_", " ") }), h("span", { className: "soft", textContent: x.hold?.reason ?? "" }))) : [h("div", { className: "empty", textContent: "Nothing is held." })]));
  }

  async function load() {
    try {
      controls = (await tool("ship_config", {})).controls ?? {};
      status = await tool("ship_status", {});
      render();
    } catch (e) { say(e.message, true); }
  }
  $("pause").addEventListener("click", async () => {
    try { const r = await tool("ship_configure", { paused: !status.paused }); say(`Proposed: ${(r.changes ?? []).join("; ")}. Save it in the bar above.`); } catch (e) { say(e.message, true); }
  });
  $("refresh").addEventListener("click", () => { pending = null; say(""); load(); });
  $("add").addEventListener("submit", async (e) => {
    e.preventDefault();
    const repo = $("newrepo").value.trim();
    if (!repo) return;
    try {
      const r = await tool("ship_configure", { repo, change: "cautious" });
      say(`Proposed: ${(r.changes ?? []).join("; ")}. Save it in the bar above: it lists the repo for the Maintainer and code review too.`);
    } catch (err) { say(err.message, true); }
  });

  (async () => {
    const init = await send("ui/initialize", { appInfo: { name: "ship", version: "1" }, appCapabilities: {}, protocolVersion: "2026-01-26" });
    theme(init.hostContext);
    notify("ui/notifications/initialized", {});
    load();
  })();
</script>
</body>
</html>
