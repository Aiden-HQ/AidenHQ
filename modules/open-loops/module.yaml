name: open-loops
description: "Tracks what others owe you: waiting-on loops, live Slack triage, the Slack scout and the Gmail inbox agent."
requires:
  - slack
  - google
settings:
  owner_slack_user_id:
    required: true
  owner_email:
    required: true
agents:
  slack-scout:
    adapter: codex_local
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: medium
    timeout_sec: 1200
    web_search: disabled
    connections:
      # No web: it reads untrusted email/Slack, so no outbound fetch (owner, 2026-11-11). app_view only.
      apps: [ app_view ]
      # Reads only: drafts stay with the Research Assistant.
      slack: read
      paperclip_tasks: [ task_current, task_get, task_search, task_list, task_create, task_update, task_comment, task_set_status, task_finish ]
  inbox-agent:
    adapter: codex_local
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: medium
    timeout_sec: 1200
    web_search: disabled
    connections:
      # No web: it reads untrusted email/Slack, so no outbound fetch (owner, 2026-11-11). app_view only.
      apps: [ app_view ]
      google_workspace: [ gmail_search, gmail_read_thread ]
      paperclip_tasks: [ task_current, task_get, task_search, task_list, task_create, task_update, task_comment, task_set_status, task_finish ]
  open-loops:
    adapter: codex_local
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: medium
    timeout_sec: 1800
    connections:
      # Public web pages (web_view) and the apps' live pages (app_view): reads, like every agent.
      # The shared warehouse's sources (Slack, GitHub, Jira): new rows since its cursor, and ad-hoc reads.
      apps: [ web_view, app_view, warehouse_query, source_new, source_ack ]
      slack: write
      github?: [ github_issue_read, github_search_issues ]
      google_workspace: [ docs_read, drive_search_files, drive_read_file, calendar_list_events, calendar_get_event, gmail_search, gmail_read_thread ]
      slack_live: [ notify_owner ]
      paperclip_tasks: [ task_current, task_get, task_comments, task_list, task_update, task_comment, task_handoff, task_set_status, task_join, task_team, task_delegate, task_finish ]
  slack-triage:
    adapter: codex_local
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: medium
    timeout_sec: 300
    web_search: disabled
    connections:
      # No web: it reads untrusted email/Slack, so no outbound fetch (owner, 2026-11-11). app_view only.
      apps: [ app_view ]
      # The live feed and urgent DMs only (not slack_post); two lookups so tasks carry names, never raw ids.
      slack_live: [ slack_pending_events, notify_owner ]
      slack: [ slack_read_user_profile, slack_search_channels ]
      paperclip_tasks: [ task_finish, task_search, task_create, task_get ]
routines:
  slack-scan:
    title: Slack scan
    agent: slack-scout
    description: |
      Today is {{date}}, now {{timestamp}}. Your Slack user ID is ${settings.owner_slack_user_id}. Your task emoji is :pushpin:. Follow your
      instructions: find Slack messages that need the user and the messages they pinned with
      their task emoji, create or update tasks (deduplicated), close tasks the user has
      answered or unpinned, then close this task with a count summary.
    concurrency: skip_if_active
    schedules:
      - { cron: "*/30 8-20 * * 1-5", timezone: "${settings.timezone}", label: "work hours" }
  open-loops-sweep:
    title: Open loops sweep
    agent: open-loops
    description: |
      Today is {{date}}, now {{timestamp}}. Follow your instructions: join every open waiting-on
      task, close those with evidence of delivery, draft chases for overdue or quiet ones, then close
      this task with a count summary.
    concurrency: skip_if_active
    schedules:
      - { cron: "0 9-19/2 * * 1-5", timezone: "${settings.timezone}", label: "work hours" }
  inbox-scan:
    title: Inbox scan
    agent: inbox-agent
    description: |
      Today is {{date}}. Your user's email address is ${settings.owner_email}. Follow your instructions:
      one task per thread labelled Aiden in Gmail (deduplicated), close tasks whose
      label was removed, then close this task with a count summary.
    concurrency: skip_if_active
    schedules:
      - { cron: "*/30 8-19 * * 1-5", timezone: "${settings.timezone}", label: "work hours" }
  slack-triage:
    title: Slack triage
    agent: slack-triage
    description: |
      New Slack events arrived. Today is {{date}}. The user's Slack user ID is ${settings.owner_slack_user_id}.
      Follow your handbook. Then close this task with one line saying what you did.
    concurrency: coalesce_if_active
    webhook: true # fired by slack-live-mcp (TRIAGE_WEBHOOK_URL/SECRET)
    webhook_base: http://paperclip:3100 # slack-live-mcp calls it from inside the compose network
    secrets_prefix: slack_live_triage_webhook # setup saves <prefix>_url / _secret for slack-live-mcp
labels:
  - { name: waiting-on, color: "#7c3aed" }
  - { name: email, color: "#ea580c" }
  - { name: chase-draft, color: "#be185d" }
