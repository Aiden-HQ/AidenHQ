name: open-loops
description: "Tracks what others owe you (waiting-on loops) and turns Slack, labelled email, Primer comments and meeting action items into your tasks (Intake)."
requires:
  - slack
  - google
agents:
  inbox-agent:
    skills: [ meetings.meeting-actions, open-loops.triage-email, open-loops.triage-slack, primer.primer-digest, tasks.delegate-work ]
    # Intake: everything that comes in for the owner (live Slack, labelled email, the Primer digest, meeting action items), one routine and one skill each (design §4.5).
    department: intake
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: high
    timeout_sec: 1200
    # A live triage batch never waits behind an inbox scan.
    max_parallel: 3
    web_search: disabled
    connections:
      # No web: it reads untrusted email/Slack, so no outbound fetch (owner, 2026-11-11). app_view only.
      apps: [ app_view, source_new, source_ack ]
      # The digest of what others did on the owner's Primer documents (the primer-digest routine).
      primer?: [ primer_get_digest ]
      # Reads only.
      slack: read
      # The owner's Slack user id, for the live events it triages (the slack-triage routine) and the Slack DM page for an urgent one (slack, when installed).
      slack_live?: [ slack_owner ]
      google_workspace: [ gmail_search, gmail_read_thread ]
      owner_channel: [ notify ]
      paperclip_tasks: [ task_current, task_get, task_search, task_list, task_comments, task_create, task_update, task_comment, task_block, task_cancel, task_finish ]
  open-loops:
    skills: [ tasks.delegate-work ]
    department: outreach
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: high
    timeout_sec: 1800
    connections:
      # Public web pages (web_view) and the apps' live pages (app_view): reads, like every agent.
      # The shared warehouse's sources (Slack, GitHub, Jira): new rows since its cursor, and ad-hoc reads.
      apps: [ web_view, app_view, warehouse_query, source_new, source_ack ]
      slack: write
      github?: [ github_issue_read, github_search_issues ]
      google_workspace: [ docs_read, drive_search_files, drive_read_file, calendar_list_events, calendar_get_event, gmail_search, gmail_read_thread ]
      owner_channel: [ notify ]
      paperclip_tasks: [ task_current, task_get, task_comments, task_list, task_update, task_comment, task_handoff, task_block, task_cancel, task_join, task_team, task_delegate, task_amend_rubric, task_finish ]
routines:
  open-loops-sweep:
    title: Open loops sweep
    agent: open-loops
    description: |
      Today is {{date}}, now {{timestamp}}. Follow your instructions: join every open waiting-on
      task, mark those with evidence of delivery as delivered for the owner to close, draft chases for overdue or quiet ones, then close
      this task with a count summary.
    concurrency: skip_if_active
    schedules:
      - { cron: "0 9-19/2 * * 1-5", timezone: "${settings.timezone}", label: "work hours" }
  inbox-scan:
    title: Inbox scan
    agent: inbox-agent
    description: |
      Today is {{date}}. Your user's email address is ${settings.owner_email}. Follow your triage-email skill:
      one task per thread labelled Aiden in Gmail (deduplicated), mark tasks whose
      label was removed as answered (a comment, left open for them), then finish this task with a count summary.
    concurrency: skip_if_active
    schedules:
      - { cron: "*/30 8-19 * * 1-5", timezone: "${settings.timezone}", label: "work hours" }
  slack-triage:
    title: Slack triage
    agent: inbox-agent
    description: |
      Today is {{date}}. The user's Slack user ID is what slack_owner returns. Your task emoji is :pushpin:.
      Follow your triage-slack skill: triage each event into nothing, a task (task_create) or, rarely, an alert (notify, kind alert); you never post
      to Slack. Then close this task with one line saying what you did.
    event: { connection: slack, resource: "*", filter: { kind: [message, app_mention, reaction_added, reaction_removed], bot: false } } # the kernel's event router fires it once a minute at most
  # Intake's routines for the source modules it consumes: each exists only while its module is enabled.
  primer-digest:
    title: Primer digest
    agent: inbox-agent
    description: |
      Today is {{date}}. Follow your primer-digest skill: read Primer's digest of the last day and, when there is
      something in it, send the owner one notify (kind digest). Then close this task with one line.
    concurrency: skip_if_active
    when: { module: primer }
    schedules:
      - { cron: "0 8 * * *", timezone: "${settings.timezone}", label: "every morning" }
  meeting-actions:
    title: Meeting action items
    agent: inbox-agent
    description: |
      Today is {{date}}. The owner is ${settings.owner_name}. Follow your meeting-actions skill: file the owner's action items from newly published
      meetings, then close this task with a count summary.
    concurrency: skip_if_active
    when: { module: meetings }
    schedules:
      - { cron: "*/30 8-20 * * *", timezone: "${settings.timezone}", label: "every day" }
labels:
  - { name: waiting-on, color: "#7c3aed" }
  - { name: email, color: "#ea580c" }
  - { name: chase-draft, color: "#be185d" }
