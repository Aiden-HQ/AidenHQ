name: clickhouse
description: ClickHouse for the runner's Engineer jobs (loopback MCP).
requires:
  - board # its sign-in banner
# Its sign-in on the board (the board's point, modules/board/schemas/signins.json).
contributes:
  board.signins:
    - { id: clickhouse, label: ClickHouse, status_url: "http://clickhouse-mcp:8088/auth/status", connect_url: /clickhouse/connect, callback: /clickhouse/callback,
        missing: "The Engineers can't query it until it is.", stopped: "The Engineers can't query it." }
settings:
  # ClickHouse Cloud's hosted MCP server: the same for every organization. Override only for a non-standard host.
  clickhouse_mcp_url:
    default: https://mcp.clickhouse.cloud/mcp
    type: url
    host: "*.clickhouse.cloud"
setup: "Press Connect on the board (Settings, Connections) and allow access. Used by the runner's Engineer jobs."
secrets:
  state: true # its own vault dir, read-write at /state: the registered client and the token pair, refreshed here
services:
  run:
    clickhouse-mcp:
      build: ./connections/clickhouse-mcp
      tmp: 16m
      port: 8088
      egress: true
      links: [board] # the board's sign-in endpoints
      state: /state
      env:
        CLICKHOUSE_MCP_URL: "${settings.clickhouse_mcp_url}"
        CLICKHOUSE_STATE_DIR: /state
        # The board's https address: Connect's one-click link returns there (the default is loopback).
        BOARD_URL: "${BOARD_LAN_URL:-}"
        MCP_TOKEN_FILE: ${secrets.clickhouse_mcp_token}
        # The board's sign-in endpoints: state, and starting or finishing a sign-in.
        CLICKHOUSE_AUTH_TOKEN_FILE: ${secrets.clickhouse_auth_token}
# Runner jobs of an Engineer with private reads, through the model gateway with their own token (scripts/modules.mjs jobcapEntries).
# Queries run up to two minutes (clickhouse-mcp caps them), past Codex's 60-second tool timeout.
jobcaps:
  - id: clickhouse-read
    connection: clickhouse
    private: true
    read_url: "http://clickhouse-mcp:8088/mcp"
    read_secret: clickhouse_mcp_token
    tool_timeout_s: 180
    tools: [ get_organizations, get_services_list, get_service_details, list_databases, list_tables, run_select_query ]
