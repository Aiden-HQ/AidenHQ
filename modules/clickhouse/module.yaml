name: clickhouse
description: ClickHouse for the runner's Engineer jobs (loopback MCP).
requires:
  - board # its sign-in banner
# Its sign-in on the board (the board's point, modules/board/schemas/signins.json).
contributes:
  board.signins:
    - { id: clickhouse, label: ClickHouse, status_url: "http://clickhouse-mcp:8088/auth/status", connect_url: /clickhouse/connect, callback: /clickhouse/callback,
        missing: "The Engineers can't query it until it is.", stopped: "The Engineers can't query it." }
  board.setup_flows:
    - order: 150
      title: ClickHouse Cloud
      why: Engineers can run read-only queries on your ClickHouse Cloud data.
      effort: about 3 minutes, needs your ClickHouse Cloud login
      secrets: [clickhouse_mcp_url]
      signin: clickhouse
      steps: |
        1. Open [ClickHouse Cloud](https://console.clickhouse.cloud) and sign in.
        2. Paste the remote MCP address below: `https://mcp.clickhouse.cloud/mcp`. If your organization has not enabled the remote MCP server, an organization admin turns it on in the service's **Connect** menu.
        3. Press **Connect ClickHouse**, sign in in the tab that opens and allow access.

        Engineers can only read: queries run read-only.
settings:
  # Superseded by the clickhouse_mcp_url secret the setup flow saves; a value here is read only while that secret is empty.
  clickhouse_mcp_url:
    default: ""
    type: url
    host: "*.clickhouse.cloud"
# How to set it up: the board's setup flow (#/setup/clickhouse).
setup: "Open its setup on the board (#/setup/clickhouse), paste ClickHouse Cloud's MCP address and press Connect. Used by the runner's Engineer jobs."
secrets:
  state: true # its own vault dir, read-write at /state: the registered client and the token pair, refreshed here
  provided:
    # ClickHouse Cloud's hosted MCP server, e.g. https://mcp.clickhouse.cloud/mcp, saved by the setup flow; empty: ClickHouse is
    # off. The pattern is the host rule the clickhouse_mcp_url setting had (*.clickhouse.cloud).
    - name: clickhouse_mcp_url
      setup:
        label: ClickHouse MCP address
        pattern: '^https://([a-z0-9-]+\.)+clickhouse\.cloud(/[A-Za-z0-9._/-]*)?$'
        help: "Usually https://mcp.clickhouse.cloud/mcp"
optional_secrets:
  - clickhouse_mcp_url
services:
  run:
    clickhouse-mcp:
      build: ./connections/clickhouse-mcp
      tmp: 16m
      port: 8088
      egress: true
      links: [board] # the board's sign-in endpoints
      state: /state
      env:
        CLICKHOUSE_MCP_URL_FILE: ${secrets.clickhouse_mcp_url}
        CLICKHOUSE_MCP_URL: "${settings.clickhouse_mcp_url}"
        CLICKHOUSE_STATE_DIR: /state
        # The board's https address: its Connect returns there (besides loopback).
        BOARD_URL: "${BOARD_LAN_URL:-}"
        MCP_TOKEN_FILE: ${secrets.clickhouse_mcp_token}
        # The board's sign-in endpoints: state, and starting or finishing a sign-in.
        CLICKHOUSE_AUTH_TOKEN_FILE: ${secrets.clickhouse_auth_token}
# Runner jobs of an Engineer with private reads, through the model gateway with their own token (scripts/modules.mjs jobcapEntries).
# Queries run up to two minutes (clickhouse-mcp caps them), past Codex's 60-second tool timeout.
jobcaps:
  - id: clickhouse-read
    connection: clickhouse
    private: true
    read_url: "http://clickhouse-mcp:8088/mcp"
    read_secret: clickhouse_mcp_token
    tool_timeout_s: 180
    tools: [ get_organizations, get_services_list, get_service_details, list_databases, list_tables, run_select_query ]
