name: maintainer
description: "Watches, triages and fixes the GitHub repos you list (setting maintainer_repos): validates each issue labelled for a fix, hands the fix to an engineer, and sees it through to a merged PR that closes the issue. Per repo you can also have it label feature requests and build the ones you mark agent-build, and nudge then close quiet contributor PRs (filed by the ship module)."
# The repo list is the github module's setting maintainer_repos (github-mcp reads it), so the Maintainer's tools need it.
requires:
  - github
  - board # contributes.board.pages
contributes:
  # The Fleet page: a module view served by the connection below, on the owner's own calls (docs/design/board-ui.md "Modules").
  board.pages:
    - { id: maintainer, title: Maintainer, icon: shield, order: 20, connection: maintainer, view: "ui://maintainer/page", tools: [ maintainer_config, maintainer_configure ], settings: [ maintainer_repos ] }
roles:
  # product-issues (the chief of staff's): the Fleet Steward's product-bug reports, filed upstream as the owner.
  requests: [ product-issues, ship-admin?, kernel.tasks, kernel.facts ] # kernel.tasks: the issue watcher files a task per labelled or new issue; kernel.facts: its issue.triaged fact
  declares:
    - { id: maintainer, description: "Issues as the owner, labelled as AidenHQ, on the repos in settings.maintainer_repos only (github-mcp github_issue_*, github_label_events, github_pr_list, github_repo_* tools)." }
# The change feed's issue events on the repos maintainer_repos lists (service/src/watcher.ts; kernel events.ts log, read with the
# module's own committed cursor). The declaration is the grant: the log answers only these kinds and repos.
subscribes:
  github:
    kinds: [ issues.opened, issues.labeled, issues.unlabeled, issues.closed, issues.reopened, github.resync ]
    resources: { setting: maintainer_repos, path: "[].repo" }
# Flow (docs/design/flow.md): an issue is triaged when its fix label lands; the stage runs from the issue's creation.
facts:
  issue.triaged: { subject: issue }
stages:
  - { name: triage, label: Triage, from: issue.triaged, to: issue.triaged, start: issue_created_at }
agents:
  maintainer:
    skills: [ maintainer.report-product-bug, maintainer.triage, maintainer.resolved-check, tasks.delegate-work ]
    department: platform
    model: ~deepseek/deepseek-flash-latest
    reasoning_effort: high
    timeout_sec: 1800
    # One run per labelled issue, several at once: each issue is its own validation and hand-off.
    max_parallel: 10
    # Woken by the module's watcher (a task per issue); the 4-hour heartbeat is the backstop.
    heartbeat: 4
    connections:
      # The Maintainer's reads are tagged `named` in the github module, so naming them is the only way to hold them:
      # `github: read` would hand every reader the product repo's issues.
      # github_product_issue: the Fleet Steward's product-bug reports on the product repo (skill report-product-bug).
      github?: [ github_issue_read, github_search_issues, github_product_issue, github_product_issue_status,
                 github_issue_list, github_label_events, github_pr_list,
                 github_issue_comment, github_issue_label, github_issue_state,
                 github_repo_tree, github_repo_file, github_release_graduate ]
      apps: [ app_status, app_logs, app_view, web_view ]
      # ship's settings (role ship-admin), when the ship module is on: read them, change one repo's entry.
      ship?: [ ship_config, ship_configure ]
      grafana?: read
      # fleet_generation_status: the host's apply generations, from the fleet-steward module's connection (named: only agents that name it hold it).
      fleet_steward?: [ fleet_generation_status ]
      paperclip_tasks: [ task_current, task_get, task_comments, task_search, task_list,
                         task_approvals, task_team, fleet_catalog,
                         task_comment, task_handoff, task_file_upload, task_finish, task_block, task_cancel,
                         task_delegate, task_amend_rubric, task_create ]
    roles: [ maintainer, product-issues, ship-admin? ]
routines:
  maintainer-triage:
    title: "Maintainer: external triage"
    agent: maintainer
    description: |
      Today is {{date}}. Work each maintained repo by its own settings (the `settings` of `github_issue_list`), as "Each run — the daily run"
      in your instructions says: the open labelled issues that have no open labelled-issue task; where `triage` is `new+backlog`, the open issues
      that carry no fix label yet, judged by the skill `triage`; the open ones checked by the skill `resolved-check`; where `no_reply_days`
      or `inactive_issue_days` is set, the issues waiting on their reporter or gone quiet. One verdict per issue, each write its own tool call.
      Close this task with one verdict line per issue you considered.
    concurrency: skip_if_active
    schedules:
      - { cron: "30 7 * * *", timezone: "${settings.timezone}", label: "daily" }
  maintainer-improve:
    title: "Improve Maintainer"
    agent: maintainer
    description: |
      Today is {{date}}. Follow "Getting better" in your instructions: read your own recent runs and file at most one task proposing a change to
      this handbook or its checks (task_create; you edit nothing yourself). Then close this task with one line.
    concurrency: skip_if_active
    schedules:
      - { cron: "0 8 * * 1", timezone: "${settings.timezone}", label: "Monday morning" }
# The Fleet page's connection: the owner's reads and proposed changes to maintainer_repos (each repo's duties and rules)
# (service/src/config-tool.ts). No agent holds it; the board's save files the change.
connections:
  maintainer:
    setup: "Built in: nothing to connect."
    url: http://maintainer-watcher:8102/mcp
    auth: maintainer_service_key
    returns: untrusted
    tools:
      read: [ maintainer_config ]
      write: [ maintainer_configure ]
# The issue watcher (service/src/watcher.ts): every few seconds it reads the kernel's log of the github change feed's issue events on
# the maintained repos (`subscribes:`) and files one task per issue for the Maintainer (kernel.tasks: fixed text naming the repo
# and number, never the issue's own words; filing the same issue twice is one task). A label's trust is github-mcp's one read of
# that issue, and at a first start, a feed gap or a resync its bootstrap read of every open labelled issue. github-mcp knows the
# watcher by its module token (kernel whoami), so no secret is shared with the github module.
services:
  data: true
  run:
    maintainer-watcher:
      build: ./service
      tmp: 16m
      port: 8102 # the Fleet page's MCP connection
      egress: true # the kernel's listener is a host address
      join: [github] # github-mcp's issue read
      data: ["maintainer:/data"]
      env:
        MAINTAINER_STATE_FILE: /data/state.json
        MAINTAINER_TOKEN_FILE: ${secrets.maintainer_token}
        MAINTAINER_SERVICE_KEY_FILE: ${secrets.maintainer_service_key}
        MAINTAINER_REPOS: "${settings.maintainer_repos}"
        MAINTAINER_SHIP: "${settings.ship_enabled}" # set when Ship is on: it owns a listed repo's removal (its page clears all three entries)
        AIDENHQ_KERNEL_URL: http://10.231.0.1:3130
generated_secrets:
  - maintainer_token
  - maintainer_service_key
data_version: 0 # its data dir's format: bumped by each forward-only migration (docs/configuration.md)
