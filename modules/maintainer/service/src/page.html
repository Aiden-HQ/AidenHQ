<!doctype html>
<!-- The Maintainer's Fleet page: an MCP Apps view (text/html;profile=mcp-app) the maintainer connection serves as ui://maintainer/page.
     Its own parts only: the shared kit (services/shared/page-kit.css and .js) is inlined where the markers sit (mcp.ts pageHtml).
     Calls only maintainer_config and maintainer_configure; maintainer_configure only proposes (the board files it on the owner's Save).
     Layout rules: modules/AGENTS.md "Settings pages". -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/*kit:css*/
  .wrap { width: 100%; max-width: 1360px; display: grid; gap: 14px; }
  .mc { --ctl: 340px; }
  .mc .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px 14px; padding: 14px 20px; background: var(--color-background-secondary, transparent); }
  .mc.open .top { border-bottom: 1px solid var(--line); }
  .mc .who { display: grid; gap: 3px; min-width: 0; }
  .mc .name { font-weight: 600; font-size: 14.5px; overflow-wrap: anywhere; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mc .sum { color: var(--soft); font-size: 13px; }
  .mc .acts { display: flex; gap: 8px; }
  .sec { padding: 0 20px; }
  .sec + .sec { border-top: 1px solid var(--line); }
  .sech { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 14px 0 4px; }
  .sech h3 { margin: 0; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); }
  .sech small { color: var(--soft); font-size: 12px; }
  .srow { display: grid; grid-template-columns: 200px minmax(0, 1fr) var(--ctl); gap: 6px 24px; align-items: center; padding: 10px 0; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  .sech + .srow { border-top: 0; }
  .st { font-weight: 560; font-size: 13.5px; }
  .sd { display: grid; gap: 6px; min-width: 0; color: var(--soft); font-size: 13px; line-height: 1.45; }
  .sd code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; padding: 0 4px; border-radius: 4px; background: color-mix(in srgb, var(--line) 22%, transparent); color: var(--color-text-primary, CanvasText); }
  .days { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .days input { width: 64px; text-align: right; }
  .days input[aria-invalid=true] { border-color: var(--color-text-danger, red); }
  .ctl { width: var(--ctl); min-width: 0; }
  .ctl .seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); width: 100%; padding: 3px; gap: 3px; border-radius: 8px; }
  .ctl .seg button { height: 30px; padding: 0 6px; font-size: 13px; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; }
  .ctl .seg button[aria-checked=true] { --tone: var(--accent); }
  .ctl input[type=text] { height: 32px; }
  .ctl .checks { height: 32px; }
  .adv { width: 100%; height: 48px; padding: 0; display: flex; justify-content: space-between; align-items: center; border: 0; border-radius: 0; background: none; box-shadow: none; font-weight: 560; }
  .adv:not(:disabled):hover { background: none; box-shadow: none; }
  .adv span { color: var(--soft); font-weight: 400; font-size: 12.5px; white-space: normal; text-align: right; }
  .sec.last { padding-bottom: 8px; }
  .mc.seen { animation: none; }
  .tag.edit { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, transparent); }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; }
  .adder.card { max-width: 1360px; }
  .adder .add { border-top: 0; padding: 14px 20px 6px; }
  .adder .add input { max-width: 360px; }
  .adder .msg { margin: 0; padding: 0 20px 14px; min-height: 20px; color: var(--soft); font-size: 13px; }
  .adder .msg.err { color: var(--color-text-danger, #b00020); }
  @media (max-width: 1000px) { .mc { --ctl: 100%; } .srow { grid-template-columns: minmax(0, 1fr); gap: 4px; } .ctl { margin-top: 6px; } }
  @media (max-width: 520px) { .mc .top { grid-template-columns: minmax(0, 1fr); } .mc .acts { align-items: center; }
  .sec, .mc .top { padding-left: 14px; padding-right: 14px; } .sech small { display: none; } .adv span { display: none; } }
</style>
</head>
<body>
<div class="wrap">
<div class="bar"><p class="intro">What the Maintainer does on each repo you list. Everything it does on GitHub comes with a comment saying why.</p>
  <button type="button" class="primary" id="addbtn" aria-expanded="false" aria-controls="adder" disabled>+ Add repo</button></div>
<div class="card adder" id="adder" hidden></div>
<div id="rows"><div class="card"><div class="empty">Loading the repos…</div></div></div>
<div class="note" id="note" role="status"></div>
</div>
<script>
/*kit:js*/
  const eq = (a, b) => JSON.stringify(a) === JSON.stringify(b);
  let cfg = { repos: [], defaults: null };
  // One local draft per repo (its whole effective settings); the page proposes every repo's draft at once, and the board's bar saves it.
  // `added` are repos listed on this page and not saved yet: the proposal carries them, and each is drawn from the Maintainer's defaults.
  let added = [], drafts = {}, lastGood = { drafts: {}, removing: null, added: [] }, sentRev = 0, removing = null, openRepo = null, drawn = false;
  const advOpen = new Set();
  const repos = () => [...cfg.repos, ...added.map((repo) => ({ repo, effective: { repo, ...cfg.defaults.base } }))];
  const saved = (repo) => repos().find((r) => r.repo === repo).effective;
  const draft = (repo) => (drafts[repo] ??= structuredClone(saved(repo)));
  const dirty = (repo) => repo in drafts && !eq(drafts[repo], saved(repo));
  // What a Close needs a number for, and the number it starts from.
  const SUGGEST = { no_reply_days: 14, inactive_issue_days: 60, quiet_pr_days: 7 };

  // The proposal: each changed field (a field back at its default is null, so the entry stays as short as it can).
  function edits() {
    const base = cfg.defaults.base, out = {};
    for (const r of repos()) {
      if (r.repo === removing || !dirty(r.repo)) continue;
      const d = drafts[r.repo], s = saved(r.repo), e = {};
      for (const k of Object.keys(d)) if (k !== "repo" && !eq(d[k], s[k])) e[k] = eq(d[k], base[k]) ? null : d[k];
      out[r.repo] = e;
    }
    return out;
  }
  // `live` is a control proposing as the owner types: it updates the draft and the proposal without a redraw, so the caret
  // and a half-typed entry stay put (the kit's chips and text editors pass it on their input handlers).
  function propose(live) {
    const repos = edits();
    // Always propose, an unchanged draft included, so the board's bar holds exactly what the page shows; a refused draft goes back to the last one proposed.
    const sent = { drafts: structuredClone(drafts), removing, added: [...added] }, rev = ++sentRev;
    inOrder(async () => {
      try { await tool("maintainer_configure", { edits: { repos }, ...(sent.added.length ? { add: sent.added } : {}), ...(sent.removing ? { remove: sent.removing } : {}) }); lastGood = sent; say(Object.keys(repos).length || sent.removing || sent.added.length ? "Changes are proposed: Save in the bar above applies them." : ""); }
      catch (e) { if (rev === sentRev) { drafts = structuredClone(lastGood.drafts); removing = lastGood.removing; added = [...lastGood.added]; redraw(); } say(e.message, true); }
    });
  }
  const change = (repo, patch, live) => { Object.assign(draft(repo), patch); if (!live) soon(redraw); propose(live); };

  // A row: name | one-line description (and the day field when it applies) | the control, flush right at one width.
  const srow = (title, desc, ctl, extra) => h("div", { className: "srow" }, h("div", { className: "st", textContent: title }), h("div", { className: "sd" }, h("span", {}, ...desc), extra ?? null), h("div", { className: "ctl" }, ctl));
  const code = (t) => h("code", { textContent: t });
  const seg = (repo, key, opts, value, set) => {
    const titles = Object.fromEntries(opts), byLabel = Object.fromEntries(opts.map(([v, l]) => [l, v]));
    const el = editor({ kind: "seg", label: key, f: `${repo}|${key}`, value: titles[String(value)], values: opts.map(([, l]) => l), set: (l) => set(byLabel[l]) });
    return el;
  };
  const daysField = (repo, key, label) => {
    const v = draft(repo)[key];
    const inp = h("input", { type: "text", inputMode: "numeric", value: String(v ?? ""), ariaLabel: `${label} days (${repo})`, autocomplete: "off" });
    inp.dataset.f = `${repo}|${key}:days`;
    // Propose as the owner types (the board's Save submits the latest proposal), not only on blur: a number typed and then saved
    // without leaving the field must be the one saved. An invalid value changes nothing until the field is left.
    let typing;
    // A live edit updates the draft and the proposal without a redraw, so the caret stays where the owner is typing.
    inp.addEventListener("input", () => { clearTimeout(typing); typing = setTimeout(() => { const n = Number(inp.value.trim()); if (Number.isInteger(n) && n >= 1) change(repo, { [key]: n }, true); }, 200); });
    inp.addEventListener("change", () => { clearTimeout(typing); const n = Number(inp.value.trim()); if (Number.isInteger(n) && n >= 1) return change(repo, { [key]: n }); inp.value = String(draft(repo)[key] ?? ""); say("Days are a whole number, 1 or more.", true); });
    return h("label", { className: "days" }, label, inp, "days");
  };
  const closeRow = (repo, key, title, desc, dayLabel) => {
    const on = draft(repo)[key] !== null;
    return srow(title, desc, seg(repo, key, [["off", "Leave open"], ["close", "Close"]], on ? "close" : "off", (v) => change(repo, { [key]: v === "close" ? (saved(repo)[key] ?? SUGGEST[key]) : null })), on ? daysField(repo, key, dayLabel) : null);
  };

  function summary(d) {
    const bits = [];
    if (d.fixes) bits.push("fixes labelled issues");
    if (d.triage !== "off") bits.push(d.triage === "new" ? "triages new issues" : "triages new and existing issues");
    if (d.features) bits.push("builds approved features");
    const names = { duplicate: "duplicates", invalid: "invalid issues", fixed: "already fixed" };
    for (const [act, verb] of [["close", "closes"], ["label", "labels"]]) { const l = Object.keys(names).filter((k) => d.actions[k] === act).map((k) => names[k]); if (l.length) bits.push(`${verb} ${l.join(", ")}`); }
    if (d.no_reply_days) bits.push(`closes unanswered issues after ${d.no_reply_days} days`);
    if (d.inactive_issue_days) bits.push(`closes inactive issues`);
    if (d.quiet_pr_days) bits.push("closes quiet contributor PRs");
    if (d.dependabot !== "off") bits.push(d.dependabot === "all" ? "takes every Dependabot update" : "fixes failing Dependabot updates");
    const s = bits.join(" · ") || "lists the repo; nothing automatic";
    return s[0].toUpperCase() + s.slice(1);
  }

  function body(repo) {
    const d = draft(repo), D = cfg.defaults;
    const act = (k, title, desc) => srow(title, desc, seg(repo, `actions.${k}`, [["comment", "Comment"], ["label", "Label"], ["close", "Close"]], d.actions[k], (v) => change(repo, { actions: { ...d.actions, [k]: v } })));
    const onoff = [["false", "Off"], ["true", "On"]];
    const fixLabel = h("input", { type: "text", value: d.fix_label, ariaLabel: `Fix label (${repo})`, autocomplete: "off", spellcheck: false });
    fixLabel.dataset.f = `${repo}|fix_label`;
    fixLabel.addEventListener("change", () => change(repo, { fix_label: fixLabel.value.trim() || D.base.fix_label }));
    // One chip per label, so a label whose own name holds a comma (GitHub allows `release, planned`) stays one value.
    const prot = editor({ kind: "chips", label: `Never close issues labelled (${repo})`, f: `${repo}|protected_labels`, value: d.protected_labels, placeholder: "Add a label, press Enter", set: (v, live) => change(repo, { protected_labels: v }, live) });
    const roles = editor({ kind: "checks", label: `Who may approve (${repo})`, f: `${repo}|trusted`, value: d.trusted, values: D.roles, set: (v) => v.length ? change(repo, { trusted: v }) : say("Keep at least one role.", true) });
    const adv = advOpen.has(repo);
    const advBtn = h("button", { type: "button", className: "adv" }, h("b", { textContent: "Advanced" }), h("span", { textContent: adv ? "Hide" : "Fix label · who may approve · never-close labels" }));
    advBtn.setAttribute("aria-expanded", String(adv));
    advBtn.addEventListener("click", () => { adv ? advOpen.delete(repo) : advOpen.add(repo); redraw(); });
    const sec = (title, hint, ...rows) => h("div", { className: "sec" }, h("div", { className: "sech" }, h("h3", { textContent: title }), hint ? h("small", { textContent: hint }) : null), ...rows);
    return [
      sec("Issues", null,
        srow("Fix labelled issues", ["Issues a trusted collaborator labels ", code(d.fix_label), " are checked, fixed, and closed by the merged PR."], seg(repo, "fixes", onoff, d.fixes, (v) => change(repo, { fixes: v === "true" }))),
        srow("Triage unlabelled issues", ["Reads each issue and gives one verdict: label it for a fix (where Fix labelled issues is on), ask for details, or one of the outcomes below."], seg(repo, "triage", [["off", "Off"], ["new", "New"], ["new+backlog", "New + existing"]], d.triage, (v) => change(repo, { triage: v }))),
        srow("Feature requests", ["Labels requests ", code("feature-request"), " and builds the ones you approve with ", code("agent-build"), "."], seg(repo, "features", onoff, d.features, (v) => change(repo, { features: v === "true" })))),
      sec("When triage finds", "Label adds a GitHub label and leaves it open",
        act("duplicate", "A duplicate", ["The same problem or request as another issue. Label adds ", code("duplicate"), "."]),
        act("invalid", "Not a bug or request", ["A question, a usage problem, or a claim the code disproves. Label adds ", code("invalid"), ". Another project's own bug stays open."]),
        act("fixed", "Already fixed", ["Merged work already fixes it; the comment cites the commit. Label adds ", code("fixed"), "."])),
      sec("Cleanup", null,
        closeRow(repo, "no_reply_days", "No reply to a question", ["Asked the reporter for details and heard nothing. Covers empty reports too."], "Close after"),
        closeRow(repo, "inactive_issue_days", "Inactive issues", [`One notice first, then closed ${D.inactive_grace_days} days later if still quiet.`], "Notice after"),
        closeRow(repo, "quiet_pr_days", "Inactive contributor PRs", ["A nudge, then closed after the same wait again. Drafts wait twice as long."], "Nudge after")),
      sec("Pull requests", null,
        srow("Dependabot updates", ["Which dependency bumps an engineer takes through to a merge."], seg(repo, "dependabot", [["off", "Off"], ["failing", "Failing checks"], ["all", "All"]], d.dependabot, (v) => change(repo, { dependabot: v })))),
      h("div", { className: "sec last" }, advBtn, ...(adv ? [
        srow("Fix label", ["The label that asks for a fix."], fixLabel),
        srow("Who may approve with a label", ["A label from anyone else is ignored."], roles),
        srow("Never close issues labelled", ["Skipped by every automatic close. Add one label at a time."], prot),
      ] : [])),
    ];
  }

  function card(r) {
    const repo = r.repo, open = openRepo === repo, d = draft(repo), gone = removing === repo;
    const fresh = added.includes(repo);
    const tags = [fresh ? h("span", { className: "tag edit", textContent: "Added on Save" }) : dirty(repo) ? h("span", { className: "tag edit", textContent: "Edited" }) : null, gone ? h("span", { className: "tag failed", textContent: "Removed on Save" }) : null];
    const btn = (text, fn, cls = "") => { const b = h("button", { type: "button", textContent: text, className: cls }); b.addEventListener("click", fn); return b; };
    const acts = gone ? [btn("Keep", () => { removing = null; redraw(); propose(); })]
      : open && fresh ? [btn("Discard", () => { added = added.filter((x) => x !== repo); delete drafts[repo]; redraw(); propose(); })]
      : open && r.ship ? [h("span", { className: "sum", textContent: "Remove it on the Ship page" })]
      : open ? [btn("Remove", () => { removing = repo; redraw(); propose(); })]
      : [btn("Edit", () => { openRepo = repo; redraw(); })];
    const top = h("div", { className: "top" }, h("div", { className: "who" }, h("div", { className: "name" }, h("span", { textContent: repo }), ...tags.filter(Boolean)), h("div", { className: "sum", textContent: summary(d) })), h("div", { className: "acts" }, ...acts));
    return h("div", { className: `card mc${open && !gone ? " open" : ""}${drawn ? " seen" : ""}` }, top, ...(open && !gone ? body(repo) : []));
  }

  // ---- Add repo: a name field under the page's header. Adding lists the repo with the Maintainer's defaults and opens it to adjust; Save applies it.
  const NAME = /^[\w.-]{1,100}\/[\w.-]{1,100}$/;
  const nameError = (v) => !v ? "" : !NAME.test(v) ? "Use owner/name, for example acme/api." : repos().some((r) => r.repo.toLowerCase() === v.toLowerCase()) ? `${v} is already listed: change it below.` : "";
  function closeAdder() { $("adder").hidden = true; $("adder").replaceChildren(); $("addbtn").setAttribute("aria-expanded", "false"); }
  function openAdder() {
    if (!$("adder").hidden) return $("adder").querySelector("input").focus();
    const input = h("input", { type: "text", placeholder: "owner/name", ariaLabel: "Repo to add", autocomplete: "off", spellcheck: false });
    const msg = h("p", { className: "msg", role: "status" }), go = h("button", { type: "button", className: "primary", textContent: "Add" }), cancel = h("button", { type: "button", textContent: "Cancel" });
    const check = (typed) => { const v = input.value.trim(), bad = nameError(v); msg.textContent = bad && (typed || v) ? bad : "Lists it with the Maintainer's defaults: fixes labelled issues, triages new ones. Save in the bar above applies it."; msg.className = bad ? "msg err" : "msg"; return !bad && !!v; };
    const submit = () => {
      const v = input.value.trim();
      if (!v) { msg.textContent = "Type the repo as owner/name, for example acme/api."; msg.className = "msg err"; return input.focus(); }
      if (!check()) return input.focus();
      const slug = v; added = [...added, slug]; openRepo = slug; closeAdder(); redraw(); propose();
    };
    input.addEventListener("input", () => check(true));
    input.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); else if (e.key === "Escape") closeAdder(); });
    go.addEventListener("click", submit); cancel.addEventListener("click", closeAdder);
    $("adder").replaceChildren(h("div", { className: "add" }, input, go, cancel), msg);
    $("adder").hidden = false; $("addbtn").setAttribute("aria-expanded", "true"); check(); input.focus();
  }
  $("addbtn").addEventListener("click", openAdder);

  const redraw = () => keepFocus(draw);
  function draw() {
    closeHelp();
    const all = repos();
    if (!all.length) return $("rows").replaceChildren(h("div", { className: "card" }, h("div", { className: "empty" }, h("b", { textContent: "No repos yet. " }), "Choose + Add repo above, then pick what the Maintainer does on it here.")));
    if (!all.some((r) => r.repo === openRepo)) openRepo = all[0].repo;
    $("rows").replaceChildren(h("div", { className: "wrap" }, ...all.map(card)));
    drawn = true;
  }

  async function load() {
    try { cfg = await tool("maintainer_config", {}); $("addbtn").disabled = false; drafts = {}; added = []; lastGood = { drafts: {}, removing: null, added: [] }; removing = null; draw(); } catch (e) { say(e.message, true); }
  }
  start("maintainer", load);
</script>
</body>
</html>
