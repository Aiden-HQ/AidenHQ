# Security-fix exceptions to the 7-day rule (CONTRIBUTING.md, "Supply chain"): a version under 7 days old that fixes a
# vulnerability. The owner's review of a change to this file is the approval; Security Watch adds entries (through its
# normal PR and approval path) when an advisory needs a fresh version, and the CI checks read this file from the PR's head,
# so an entry and the change that uses it land in one PR.
#
# One entry per line, in this flow style (other YAML shapes are not read):
#   - { ecosystem: npm, package: fast-uri, version: 3.1.1, advisory: GHSA-xxxx-xxxx-xxxx, reason: "why it cannot wait" }
# An owner-approved entry has no advisory (npm; with #593, any pin by its exact digest or sha): { ecosystem: npm, package: X, version: Y, owner: approved, expires: YYYY-MM-DD,
# reason: "..." }. It clears only that exact version, only while today < expires and expires is at most 14 days away.
# Use it only when waiting would block a release of code already running elsewhere in the product.
# ecosystem: npm (lockfiles and global installs), pypi, docker (package = the image without its tag, version = the
# tag), github-action, github-release or apt. npm entries are checked against the GitHub Advisory Database
# (scripts/supply-chain/npm-age.ts); the others rest on review. scripts/supply-chain/best-version.ts returns a listed
# version for its package.
