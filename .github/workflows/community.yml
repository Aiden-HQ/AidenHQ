# Community pull requests: a CLA check and a triage label and comment (CONTRIBUTING.md, "For agent contributors";
# scripts/community.ts). pull_request_target so a fork's PR gets a token that can label and comment; that is safe only
# because nothing from the PR is checked out or run: the script comes from the base commit and reads the PR's text as
# data. Always a GitHub-hosted runner, never ours. Triage never approves a merge.
name: community

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: community-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cla:
    # Only community PRs (from forks, by people, not bots): our own PRs skip both jobs, so they never wait on a hosted runner.
    if: github.event.pull_request.head.repo.full_name != github.repository && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - run: node scripts/community.ts cla

  triage:
    # Only community PRs (from forks, by people, not bots): our own PRs skip both jobs, so they never wait on a hosted runner.
    if: github.event.pull_request.head.repo.full_name != github.repository && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - run: node scripts/community.ts triage
        env:
          GITHUB_TOKEN: ${{ github.token }}
