# Tests and typechecks for every package, on pull requests and pushes to main. The test jobs run their suites side by side,
# one per CPU (.github/ci/run-suites.sh), each with a timeout from its measured time (`secs` in .github/ci/areas.json), in
# at most 3 shards (.github/ci/select.ts). Nothing is ever re-run: a flaky test is removed (owner, 2026-11-20). Offline: no
# secrets are used, except the reviewer eval's model key (the `reviewer-eval` job, in its one step). A pull request runs the
# suites its change touches (the map is read from the tested tree: agents are trusted); the slow end-to-end ones (areas.json
# `main: true`: the SDK twin) run only on pushes to main.
# Jobs run on GitHub-hosted runners (this repository is public, so it costs nothing, but the free plan runs ~20 jobs at
# once). The heavy jobs (packages, board) overflow to our self-hosted runners (modules/ci, labels self-hosted +
# aidenhq) only when hosted capacity is saturated (checks' `runner` step), the repository variable CI_SELF_HOSTED is
# 'true' (docs/operations.md) and the run is a push to main or a same-repo pull request. Fork PRs stay hosted, and the
# runners' job-started hook refuses any job that is not a push or same-repo PR of a repo they serve.
# The AI reviewer's exit test (modules/ai-reviewer/scripts/reviewer-eval.ts) runs here, in the `reviewer-eval` job, on a
# same-repo PR or a push to main that touches REVIEWER_CODE (modules/github/service/src/evalgate.ts); nobody runs it by hand.
name: ci

on:
  pull_request:
  push:
    # merge-train/<n>: the merge queue's trains (modules/github merge-gate.ts), main plus the PRs it tests together,
    # made in one push at the finished commit (they are built on merge-build/<n>, which runs nothing).
    branches: [main, "merge-train/**"]

permissions:
  contents: read

# A newer push to a PR cancels its older run. Every push to main and every merge train runs to the end (its own group:
# GitHub drops a pending run when a newer one joins the group): the merge queue reads main's result, and a cancelled run
# says nothing about it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The suites this change needs tested that have no job of their own (checks' `tests` step; all of them on a push
  # to main), in the shards checks' `shards` step plans; skipped when there are none.
  packages:
    name: packages (${{ matrix.shard }})
    needs: checks
    if: needs.checks.outputs.packages != '[]'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON(needs.checks.outputs.runner) }}
    timeout-minutes: 6
    # This job runs the suites, so it runs PR code (`npm ci` and its lifecycle scripts included): read-only, no secret, and
    # no `checks: write`. `post-checks` below is the only job that may write a check.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.checks.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Git identity (the tests make commits)
        run: git config --global user.name ci && git config --global user.email ci@example.com
      # kernel/contract.lock.json against the PR's base lock (scripts/lean/contract-lock.ts): a stable entry is never
      # removed or reshaped. The scripts suite checks the lock against the code on every run.
      # The base checkout and the checker are separate steps: only the fetch holds the token, and its step has ended before
      # any PR code (the checker, which reads `contract-lock.ts` from this checkout) runs. `env -u` would not be enough: a
      # child can still read its parent's environment through `/proc`.
      - name: Fetch the PR's base for the contract lock
        if: github.event_name == 'pull_request' && matrix.shard == 1
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # The checkout keeps no credentials: pass the read-only token for this one fetch.
          git -c "http.extraheader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch --no-tags --depth=1 origin "$PR_BASE"
      - name: Contract lock
        if: github.event_name == 'pull_request' && matrix.shard == 1
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          (cd scripts && npm ci --ignore-scripts)
          node --disable-warning=ExperimentalWarning scripts/lean/contract-lock.ts --check --base "$PR_BASE"
      - name: Test
        # Runs PR code (`npm ci` and the suites). This workflow passes no token or secret to this step: no `${{ secrets.* }}`,
        # no `GITHUB_TOKEN`, no `token:` input. The job's `permissions` are `contents: read`, so it cannot write a check; the
        # read-only token the fetch step above uses is passed to that step alone, and it ends before any PR code runs.
        env:
          ENTRIES: ${{ toJSON(matrix.entries) }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          list="$RUNNER_TEMP/suites"
          jq -r '.[] | [.name, .dir, .run, .secs] | @tsv' <<< "$ENTRIES" > "$list"
          echo "Shard ${{ matrix.shard }}: $(cut -f1 "$list" | tr '\n' ' ')"
          # The packages these suites share, installed once, here, side by side; no suite's run installs them, since two
          # `npm ci` in one directory delete each other's files under the suites reading them: scripts/node_modules (the
          # scripts suites, the kernel's authority CLI, the twin), the kernel's (its suite, the scripts suites import kernel
          # sources, kernel/sdk's tests) and kernel/sdk's (its suite, the twin's pack).
          dirs=$(cut -f2 "$list"); pids=()
          grep -qxE 'scripts|kernel|fixtures/twin' <<< "$dirs" && { (cd scripts && npm ci --silent) & pids+=($!); }
          grep -qxE 'scripts|kernel|kernel/sdk' <<< "$dirs" && { (cd kernel && npm ci --silent) & pids+=($!); }
          grep -qxE 'kernel/sdk|fixtures/twin' <<< "$dirs" && { (cd kernel/sdk && npm ci --silent) & pids+=($!); }
          for p in "${pids[@]}"; do wait "$p" || exit 1; done
          # run-suites.sh reports a plan entry whose directory is missing as `gone:` and exits 0, so a shard can be green with a
          # suite that never ran. A directory the tested commit (`TESTED_SHA`, the immutable commit the checkout came from) still
          # has as a tree but the workspace does not is exactly that: fail the shard. `HEAD` would not do — the suites make
          # commits, so PR code can commit a deletion and move `HEAD` off the tested tree. Checked before the run too, so a
          # lifecycle script that deletes one fails here rather than passing as `gone:`, and after it, so a deletion during the
          # run is caught.
          vanished() {
            while IFS=$'\t' read -r name dir _; do
              if [ -n "$dir" ] && [ "$(git cat-file -t "$TESTED_SHA:$dir" 2>/dev/null)" = tree ] && [ ! -d "$dir" ]; then
                echo "::error::$name: $dir is in the tested commit but not on disk ($1)"
                return 1
              fi
            done < "$list"
          }
          vanished before || exit 1
          bash .github/ci/run-suites.sh "$list"
          vanished after

  # The official modules' own suites (areas.json entries with job "modules": each module's packages, plus the module suites
  # whose paths a change touches, e.g. the kernel for the modules that import it), in the shards checks' `shards` step plans.
  # Each shard installs the kernel's and the compiler's packages once (module tests import them).
  modules:
    name: modules (${{ matrix.shard }})
    needs: checks
    if: needs.checks.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    # Suites only, so PR code runs here: read-only, no secret, no `checks: write`.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.checks.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Git identity (the tests make commits)
        run: git config --global user.name ci && git config --global user.email ci@example.com
      - name: Test
        # Runs PR code (`npm ci` and the suites). This workflow passes no token or secret to this step: no `${{ secrets.* }}`,
        # no `GITHUB_TOKEN`, no `token:` input. The job's `permissions` are `contents: read`, so it cannot write a check.
        env:
          ENTRIES: ${{ toJSON(matrix.entries) }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          (cd kernel && npm ci --silent) & k=$!
          (cd scripts && npm ci --silent) & c=$!
          wait $k && wait $c || exit 1
          list="$RUNNER_TEMP/suites"
          jq -r '.[] | [.name, .dir, .run, .secs] | @tsv' <<< "$ENTRIES" > "$list"
          echo "Shard ${{ matrix.shard }}: $(cut -f1 "$list" | tr '\n' ' ')"
          # run-suites.sh reports a plan entry whose directory is missing as `gone:` and exits 0, so a shard can be green with a
          # suite that never ran. A directory the tested commit (`TESTED_SHA`, the immutable commit the checkout came from) still
          # has as a tree but the workspace does not is exactly that: fail the shard. `HEAD` would not do — the suites make
          # commits, so PR code can commit a deletion and move `HEAD` off the tested tree. Checked before the run too, so a
          # lifecycle script that deletes one fails here rather than passing as `gone:`, and after it, so a deletion during the
          # run is caught.
          vanished() {
            while IFS=$'\t' read -r name dir _; do
              if [ -n "$dir" ] && [ "$(git cat-file -t "$TESTED_SHA:$dir" 2>/dev/null)" = tree ] && [ ! -d "$dir" ]; then
                echo "::error::$name: $dir is in the tested commit but not on disk ($1)"
                return 1
              fi
            done < "$list"
          }
          vanished before || exit 1
          bash .github/ci/run-suites.sh "$list"
          vanished after

  # One GitHub check per suite a shard's plan ran, on the PR head: the `checks` job's plan says which suites (its map comes
  # from the tested tree, `.github/ci/select.ts`), and the shard's own Actions job conclusion says they passed. Nothing here reads a log or the Test step's output: the shard jobs run `npm ci`
  # (PR lifecycle scripts) and print their results into the log, so log text is not evidence. This job runs only the posting
  # script and checks out no PR code. A fork PR or a push posts nothing. A posting failure (logged, `continue-on-error`) leaves the suites without a check
  # (fail closed) and stays out of `ci-required`'s gate, so it cannot make `ci-required` red.
  post-checks:
    needs: [checks, packages, modules]
    if: ${{ always() && needs.checks.result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the run's job instances and the head tree's directories
      checks: write # the one check per suite, on the PR head
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Post a check run for each suite a shard ran
        # Publishing is best effort: a failure here is logged (the ::warning below) and never turns the PR red or blocks a merge.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TESTED_SHA: ${{ github.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PACKAGES: ${{ needs.checks.outputs.packages }}
          MODULES: ${{ needs.checks.outputs.modules }}
        run: |
          node --input-type=module <<'EOF'
          const { REPO, RUN_ID, HEAD_SHA, TESTED_SHA, HEAD_REPO, PACKAGES, MODULES } = process.env;
          // Same-repository pull requests only: a fork PR's head repo differs, and a push has no pull_request head at all, so
          // this exits before posting anything. The job's `if:` says the same; this is the script's own guard, not a comment.
          if (!HEAD_SHA || HEAD_REPO !== REPO) { console.log(`not a same-repo pull request (head ${HEAD_REPO ?? "<none>"}): posting no checks`); process.exit(0); }
          // The plan is the `checks` job's own output and nothing else: the shards' `matrix.entries` are that output, never a
          // log, the Test step's output or a job summary. Empty means no packages/modules shard ran at all, so nothing posts.
          // Each prefix parses on its own, so a malformed one is reported without discarding the other's valid checks.
          const plan = [];
          for (const [prefix, raw] of [["packages", PACKAGES], ["modules", MODULES]]) {
            let shards;
            try { shards = JSON.parse(raw || "[]"); } catch (err) { console.log(`::warning::needs.checks.outputs.${prefix} is not JSON (${err.message}): no ${prefix} checks`); continue; }
            if (!Array.isArray(shards)) { console.log(`::warning::needs.checks.outputs.${prefix} is not a JSON array: no ${prefix} checks`); continue; }
            // The shard and its entries are validated here too: `[null]` or an entry without a `dir` would otherwise throw in the
            // shared posting loop and take the other prefix's checks with it. A bad shard is skipped on its own, never fatal.
            const ok = shards.filter((s) => s && Number.isInteger(s.shard) && Array.isArray(s.entries)
              && s.entries.every((e) => e && typeof e.name === "string" && typeof e.dir === "string"));
            if (ok.length !== shards.length) console.log(`::warning::needs.checks.outputs.${prefix}: ${shards.length - ok.length} malformed shard(s) skipped`);
            if (ok.length) plan.push([prefix, ok]);
          }
          const base = "https://api.github.com";
          const headers = { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: "application/vnd.github+json", "content-type": "application/json" };
          const get = async (path) => {
            const res = await fetch(`${base}${path}`, { headers });
            if (!res.ok) throw new Error(`GET ${path} failed: ${res.status}`);
            return res.json();
          };
          // Every job instance this run has, across pages (`filter=latest` keeps the latest instance of each job name, so a shard that passed in an earlier attempt
          // and was not re-run still appears, with that attempt's `run_attempt`).
          const jobs = [];
          for (let page = 1; ; page++) {
            const data = await get(`/repos/${REPO}/actions/runs/${RUN_ID}/jobs?filter=latest&per_page=100&page=${page}`);
            jobs.push(...(data.jobs ?? []));
            if (jobs.length >= (data.total_count ?? 0) || (data.jobs ?? []).length === 0) break;
          }
          // A suite's directory must be a directory at the PR head, where the check is posted, and in the tree the shards tested
          // (`github.sha`, the PR's merge commit): the contents API answers 404 for a missing one, and lists a file as an object
          // (run-suites.sh tests -d, writes `gone: <dir>` and exits 0, so it did not run). Both must hold, so neither a directory
          // only the merge brought in nor one only the head carries earns a check for a suite that did not run.
          const dirs = new Map();
          const isDir = async (dir, ref) => {
            const key = `${dir}\t${ref}`;
            if (dirs.has(key)) return dirs.get(key);
            const path = dir.split("/").map(encodeURIComponent).join("/");
            const res = await fetch(`${base}/repos/${REPO}/contents/${path}?ref=${encodeURIComponent(ref)}`, { headers });
            if (res.status === 404) dirs.set(key, false);
            else if (!res.ok) throw new Error(`GET contents/${dir} failed: ${res.status}`);
            else dirs.set(key, Array.isArray(await res.json())); // a directory lists as an array, a file as an object
            return dirs.get(key);
          };
          const exists = async (dir) => (await isDir(dir, HEAD_SHA)) && (await isDir(dir, TESTED_SHA));
          const post = async (body) => {
            const res = await fetch(`${base}/repos/${REPO}/check-runs`, { method: "POST", headers, body: JSON.stringify(body) });
            if (!res.ok) throw new Error(`POST check-runs failed: ${res.status} ${await res.text()}`);
          };
          // Check runs already on the head, so a failed-job re-run (which sees the same passing shard jobs again) posts nothing twice.
          const have = new Set();
          for (let page = 1; ; page++) {
            const data = await get(`/repos/${REPO}/commits/${HEAD_SHA}/check-runs?filter=all&per_page=100&page=${page}`);
            for (const c of data.check_runs ?? []) have.add(`${c.name}\t${c.external_id}`);
            if (have.size >= (data.total_count ?? 0) || (data.check_runs ?? []).length === 0) break;
          }
          let posted = 0;
          try {
          for (const [prefix, shards] of plan) {
            for (const shard of shards) {
              const name = `${prefix} (${shard.shard})`;
              const matches = jobs.filter((j) => j.name === name);
              if (matches.length !== 1) { console.log(`no single ${name} job instance in this run: posting nothing for this shard`); continue; }
              const job = matches[0];
              if (job.conclusion !== "success" || job.head_sha !== HEAD_SHA) { console.log(`${name} did not conclude success on the head: posting nothing for this shard`); continue; }
              for (const entry of shard.entries) {
                if (have.has(`${entry.name}\t${RUN_ID}/${job.id}/${shard.shard}`)) continue;
                if (!(await exists(entry.dir))) { console.log(`${entry.name}: ${entry.dir} is not a directory at the head or in the tested tree: posting no check`); continue; }
                await post({
                  name: entry.name,
                  head_sha: HEAD_SHA,
                  status: "completed",
                  conclusion: "success",
                  external_id: `${RUN_ID}/${job.id}/${shard.shard}`,
                  output: { title: `${entry.name} passed`, summary: `Suite ${entry.name} ran in ${name} and passed.` },
                });
                posted++;
              }
            }
          }
          } catch (err) {
            console.log(`::warning::could not post every check run (${posted} posted): ${err.message}`);
            process.exitCode = 1;
          }
          console.log(`Posted ${posted} check run(s).`);
          EOF

  board:
    needs: checks
    if: contains(fromJSON(needs.checks.outputs.tests).*.name, 'services/board')
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON(needs.checks.outputs.runner) }}
    timeout-minutes: 3
    # The board suite is PR code: read-only, no secret, no `checks: write` (only `post-checks` has it).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Git identity (the tests make commits)
        run: git config --global user.name ci && git config --global user.email ci@example.com
      - name: Test
        # Runs PR code (the board suite). This workflow passes no token or secret to this step: no `${{ secrets.* }}`, no
        # `GITHUB_TOKEN`, no `token:` input. The job's `permissions` are `contents: read`, so it cannot write a check.
        working-directory: services/board
        # The command is the suite's `run` in .github/ci/areas.json (scripts/ci-local.ts runs the same one).
        run: bash -eo pipefail -c "$(jq -r '.suites[] | select(.name == "services/board") | .run' ../../.github/ci/areas.json)"

  # The plan the jobs below wait for, kept to fast steps (~10-15 s): the suites to test, the images to scan and where the
  # heavy jobs run. Which images this change could alter: each Dockerfile it changes, or whose directory gets a changed
  # dependency manifest or lockfile. Every one is listed, whatever its FROM: a FROM that can't be resolved fails the
  # scan, never skips it.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # how busy hosted runners are
    outputs:
      dockerfiles: ${{ steps.find.outputs.dockerfiles }}
      tests: ${{ steps.tests.outputs.tests }}
      packages: ${{ steps.tests.outputs.packages }}
      modules: ${{ steps.tests.outputs.modules }}
      runner: ${{ steps.runner.outputs.runner }}
      eval: ${{ steps.eval.outputs.eval }}
      eval_key: ${{ steps.eval.outputs.eval_key }}
    env:
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE: ${{ github.event.before }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      # The monitoring rules, checked with the image modules/monitoring/prometheus/Dockerfile pins. The checker comes from the
      # commit the change is based on -- the PR's base, main for a merge train, or main's own tree on a push to main -- never
      # the head, like the suite map and the eval gate below: this step runs code from the image, so a PR able to choose the
      # image could point it at a promtool that exits 0 and skip the rules. Only the rules under test come from the head; a
      # change to the Dockerfile still runs on main's push with its own image. `test rules` also runs `check rules`
      # internally; both are run so a malformed rule file fails with promtool's own message before a test does.
      - name: promtool image
        id: promtool
        run: |
          # a merge train is a push of main plus the PRs: its base is main, never an earlier train commit
          [ "$GITHUB_EVENT_NAME" = pull_request ] && PR_BASE=$(git rev-parse HEAD^1)
          case "$GITHUB_REF" in refs/heads/merge-train/*) PR_BASE=$(git rev-parse origin/main) ;; refs/heads/main) PR_BASE= ;; esac
          if [ -n "${PR_BASE:-}" ]; then
            image=$(git show "$PR_BASE:modules/monitoring/prometheus/Dockerfile" | sed -n 's/^FROM \([^ ]*\).*/\1/p' | head -n 1)
          else
            image=$(sed -n 's/^FROM \([^ ]*\).*/\1/p' modules/monitoring/prometheus/Dockerfile | head -n 1)
          fi
          # A digest is what makes the image immutable: the base's Dockerfile is pinned (the policy job dates a change to it),
          # and an unpinned one must fail here rather than resolve a mutable tag.
          case "$image" in
            *@sha256:*) ;;
            *) echo "::error::promtool image ${image:-<none>} is not digest-pinned"; exit 1 ;;
          esac
          echo "promtool from ${image}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
      - name: promtool check rules
        env:
          IMAGE: ${{ steps.promtool.outputs.image }}
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/modules/monitoring/prometheus:/rules:ro" -w /rules "$IMAGE" check rules rules.yml
      - name: promtool test rules
        env:
          IMAGE: ${{ steps.promtool.outputs.image }}
        run: docker run --rm --entrypoint /bin/promtool -v "$PWD/modules/monitoring/prometheus:/rules:ro" -w /rules "$IMAGE" test rules rules.test.yml
      # The suites to test (.github/ci/select.ts over .github/ci/areas.json, both from the tested tree): on a pull request,
      # those its changed files touch; every suite on a push to main or a merge train.
      - id: tests
        run: |
          # a push to main or a merge train tests every suite; a pull request, those its changes touch
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then export ALL="a push to main or a merge train"; fi
          base=$(git rev-parse HEAD^1) # the PR merge commit's first parent: main now
          export BASE="$base" HEAD="$HEAD_SHA"
          # the slow suites (areas.json `main: true`) run only on a push to main
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then export MAIN=1; fi
          out=$(node .github/ci/select.ts)
          tests=$(jq -c .tests <<< "$out")
          echo "Suites to test: $(jq -r 'map(.name) | join(" ")' <<< "$tests")"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          # The test jobs' shards, by the suites' measured times (select.ts shard).
          echo "packages=$(jq -c .shards.packages <<< "$out")" >> "$GITHUB_OUTPUT"
          echo "modules=$(jq -c .shards.modules <<< "$out")" >> "$GITHUB_OUTPUT"
          echo "heavy=$(jq -r .shards.heavy <<< "$out")" >> "$GITHUB_OUTPUT"

      # Where the heavy jobs (the packages shards and board) run: GitHub-hosted, unless CI_SELF_HOSTED is 'true', the run is
      # a push to main or a same-repo PR, this repo's other runs already hold BUSY+ hosted jobs (queued or running), and our
      # self-hosted runners (CI_SELF_HOSTED_RUNNERS, default 1) have a free one for each heavy job: a job queued behind a
      # busy self-hosted runner waits longer than one in GitHub's queue (2026-11-20: 10+ minutes behind the only runner).
      # Any API error keeps them hosted. Fork PRs and merge trains never route there; the runners' job-started hook
      # (modules/ci/runner) refuses them anyway.
      - id: runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ENABLED: ${{ vars.CI_SELF_HOSTED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.pull_request.head.repo.full_name == github.repository) }}
          RUNNERS: ${{ vars.CI_SELF_HOSTED_RUNNERS || '1' }}
          HEAVY: ${{ steps.tests.outputs.heavy }}
        run: |
          BUSY=12 # of the free plan's ~20 concurrent hosted jobs, leaving room for this run's own
          runner='"ubuntu-latest"'
          if [ "$ENABLED" = true ] && [ "${HEAVY:-0}" -gt 0 ] && counts=$(set -o pipefail; for status in queued in_progress; do
              gh api "repos/$REPO/actions/runs?status=$status&per_page=100" --jq ".workflow_runs[] | select(.id != $RUN_ID) | .id" || exit 1
            done | while read -r id; do
              gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select(.status == "queued" or .status == "in_progress") | (.labels | index("self-hosted") != null)] | "\(map(select(. | not)) | length) \(map(select(.)) | length)"' || exit 1
            done | awk '{h += $1; s += $2} END {print h + 0, s + 0}'); then
            read -r hosted self <<< "$counts"
            echo "other runs hold $hosted hosted and $self self-hosted jobs; this run has $HEAVY heavy jobs, $RUNNERS self-hosted runner(s)"
            [ "$hosted" -ge "$BUSY" ] && [ $(( RUNNERS - self )) -ge "$HEAVY" ] && runner='["self-hosted","aidenhq"]'
          fi
          echo "heavy jobs run on $runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"

      # Whether the change touches the AI reviewer's code (REVIEWER_CODE in evalgate.ts, the one list), read from the PR's
      # base (main for a merge train) so a PR can't take itself off it; a push to main reads its own.
      - id: eval
        run: |
          [ "$GITHUB_EVENT_NAME" = pull_request ] && PR_BASE=$(git rev-parse HEAD^1) # the payload's base.sha goes stale as main moves; the merge commit's first parent is main now
          case "$GITHUB_REF" in refs/heads/merge-train/*) PUSH_BEFORE= ;; esac
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null || git rev-parse "$HEAD_SHA~1")
          fi
          src="$PR_BASE"
          case "$GITHUB_REF" in refs/heads/merge-train/*) src=$(git rev-parse origin/main) ;; refs/heads/main) src="" ;; esac
          gate="$RUNNER_TEMP/evalgate.ts"
          # a base without it takes main's, never the head's
          if [ -z "$src" ]; then cp modules/github/service/src/evalgate.ts "$gate"
          elif ! git show "$src:modules/github/service/src/evalgate.ts" > "$gate" 2>/dev/null; then git show "origin/main:modules/github/service/src/evalgate.ts" > "$gate" || exit 1; fi
          # The eval's cache key (the reviewer-eval job): every file of the one list (REVIEWER_CODE) by object id, at the head
          # (the reviewer judged) and at the judging commit (the harness and cases the job takes from it), as evalgate.ts's reviewerAt.
          # NUL-separated and unquoted, so a path with an odd character can't drop out of either.
          git -c core.quotePath=false diff --name-only -z "$base" "$HEAD_SHA" > "$RUNNER_TEMP/changed"
          git -c core.quotePath=false ls-tree -r -z --full-tree "$HEAD_SHA" > "$RUNNER_TEMP/head.tree"
          git -c core.quotePath=false ls-tree -r -z --full-tree "${src:-$HEAD_SHA}" > "$RUNNER_TEMP/judge.tree"
          node --input-type=module -e '
            const { readFileSync, appendFileSync } = await import("node:fs"), { createHash } = await import("node:crypto");
            const { touchesReviewer } = await import(process.argv[1]), t = process.env.RUNNER_TEMP;
            const hit = touchesReviewer(readFileSync(`${t}/changed`, "utf8").split("\0").filter(Boolean));
            // an entry it cannot parse counts (fail closed)
            const key = (f) => createHash("sha256").update(readFileSync(`${t}/${f}`, "utf8").split("\0").filter((e) => { const tab = e.indexOf("\t"); return tab < 0 ? e.trim() !== "" : touchesReviewer([e.slice(tab + 1)]); }).join("\0")).digest("hex").slice(0, 32);
            console.log(`Touches the AI reviewer: ${hit}`);
            appendFileSync(process.env.GITHUB_OUTPUT, `eval=${hit}\neval_key=${key("head.tree")}-${key("judge.tree")}\n`);' "$gate"
      - id: find
        run: |
          set -f # DOCKERFILES is split on spaces below, never globbed
          # a merge train is a push of main plus the PRs: its base is main, never an earlier train commit
          [ "$GITHUB_EVENT_NAME" = pull_request ] && PR_BASE=$(git rev-parse HEAD^1) # the payload's base.sha goes stale as main moves; the merge commit's first parent is main now
          case "$GITHUB_REF" in refs/heads/merge-train/*) PUSH_BEFORE= ;; esac
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null || git rev-parse "$HEAD_SHA~1")
          fi
          changed=$(git diff --name-only "$base" "$HEAD_SHA")
          found=""
          while IFS= read -r -d '' df; do
            # A path with whitespace would split in DOCKERFILES, one starting with - could pass for an option: refuse both.
            case "$df" in *[[:space:]]*|-*) echo "::error::Dockerfile path $(printf '%q' "$df") has whitespace or starts with -"; exit 1 ;; esac
            d=$(dirname "$df"); prefix=""; [ "$d" = . ] || prefix="$d/"
            while IFS= read -r f; do
              case "$f" in "$prefix"*) ;; *) continue ;; esac
              case "${f##*/}" in
                [Dd]ockerfile*|[Cc]ontainerfile*|*.dockerfile|.dockerignore|package.json|package-lock.json|npm-shrinkwrap.json|yarn.lock|pnpm-lock.yaml|requirements*.txt|poetry.lock|Pipfile.lock|uv.lock|go.mod|go.sum|Cargo.lock|Gemfile.lock)
                  found="$found $df"; break ;;
              esac
            done <<< "$changed"
          done < <(git ls-files -z | grep -izE '(^|/)(Dockerfile|Containerfile)[^/]*$|\.dockerfile$' | grep -zvE '\.(m?[jt]s|json|md|ya?ml|sh)$')
          echo "Images to scan:${found:- none}"
          echo "dockerfiles=${found# }" >> "$GITHUB_OUTPUT"

  # The 7-day rule (lockfile entries, images, actions, apt packages and global installs this change adds or alters must be
  # 7+ days old, unless an owner-approved security exception in .github/supply-chain-exceptions.yaml (read from the head)
  # covers them, and every one is pinned: scripts/supply-chain/pins.ts) and the PR title. Beside the plan, never before
  # the tests: only ci-required waits for it.
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read # ghcr.io images are dated by the GitHub Packages API
      pull-requests: read # the PR title
    env:
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE: ${{ github.event.before }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      # Both checks have no dependencies: nothing is installed before the lockfiles are vetted.
      - name: Age check (lockfiles) and pins (images, actions, apt, global installs)
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # read:packages, for other orgs' ghcr images (GITHUB_TOKEN can't read them); sent to the Packages API only
          PACKAGES_READ_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
        run: |
          # a merge train is a push of main plus the PRs: its base is main, never an earlier train commit
          [ "$GITHUB_EVENT_NAME" = pull_request ] && PR_BASE=$(git rev-parse HEAD^1) # the payload's base.sha goes stale as main moves; the merge commit's first parent is main now
          case "$GITHUB_REF" in refs/heads/merge-train/*) PUSH_BEFORE= ;; esac
          base="${PR_BASE:-$PUSH_BEFORE}"
          # a new branch or a force push has no usable before: compare with the default branch
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null || git rev-parse "$HEAD_SHA~1")
          fi
          status=0
          node scripts/supply-chain/npm-age.ts "$base" "$HEAD_SHA" || status=1
          node scripts/supply-chain/pins.ts "$base" "$HEAD_SHA" || status=1
          exit $status
      - name: Conventional Commit title
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
        run: |
          node --input-type=module -e '
            const res = await fetch(process.env.PR_URL, { headers: { authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: "application/vnd.github+json" } });
            if (!res.ok) throw new Error(`reading the PR failed: ${res.status}`);
            const { title } = await res.json();
            const ok = /^(feat|fix|docs|chore|test|refactor|perf|ci|build|style|revert)(\([a-z0-9][a-z0-9._\/-]*\))?!?: \S/.test(title);
            console.log(`Title: ${JSON.stringify(title)}`);
            if (!ok) {
              console.log("::error::The PR title must be a Conventional Commit, e.g. \"fix(board): keep the drawer open\" or \"docs: explain pins\". Types: feat, fix, docs, chore, test, refactor, perf, ci, build, style, revert. Edit the title, then re-run the failed jobs.");
              process.exit(1);
            }
          '

  # The `image-scan` check: for each image this change could alter, grype scans its directory (lock files, manifests) and
  # every base image its FROM and COPY --from lines name, pulled from the registry, and fails on a high or critical
  # vulnerability that has a fix. Nothing is built and no PR code runs (a build would run the PR's RUN steps on our
  # runner): scripts/supply-chain/image-scan.ts reads each Dockerfile as text and passes grype only digest-pinned
  # references. Not covered: packages RUN steps install, so only base-image and lock-file changes are proven here. It is
  # the evidence for image and CVE work (Engineers have no Docker); skipped when no image could change. grype is
  # installed below, at the version the security module pins. Advisory (owner, 2026-11-22): the scan step continues on
  # error, so the job (and every reader of check and workflow results) stays green; what it found are the step's error
  # annotations on the check. Secrets (secrets.yml, gitleaks) and the 7-day rule (policy) stay blocking.
  image-scan:
    needs: checks
    if: needs.checks.outputs.dockerfiles != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERFILES: ${{ needs.checks.outputs.dockerfiles }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Install grype
        env:
          GRYPE_VERSION: 0.121.3 # released 2026-11-09
          GRYPE_SHA256: e9da18cc1429e786722e32161288103600efffd8e483c90761f90485bd1bec85 # grype_0.121.3_linux_amd64.tar.gz
        run: |
          curl -sSfL -o "$RUNNER_TEMP/grype.tgz" "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  $RUNNER_TEMP/grype.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/grype.tgz" -C "$RUNNER_TEMP" grype
          sudo install -m 0755 "$RUNNER_TEMP/grype" /usr/local/bin/grype
      - name: Scan (no build)
        continue-on-error: true
        run: |
          # On a pull request the scanner and its exceptions come from the base commit, on a merge train from main (its tree holds
          # the PRs' own edits), so no PR can run its own code here or loosen its own scan; a base without the scanner fails
          # closed (image-scan.mjs: a base from before the scripts moved to TypeScript). A push to main runs main's own.
          [ "$GITHUB_EVENT_NAME" = pull_request ] && PR_BASE=$(git rev-parse HEAD^1) # the payload's base.sha goes stale as main moves; the merge commit's first parent is main now
          src="$PR_BASE"
          case "$GITHUB_REF" in refs/heads/merge-train/*) src=$(git rev-parse origin/main) ;; refs/heads/main) src="" ;; esac
          if [ -n "$src" ]; then
            { git show "$src:scripts/supply-chain/image-scan.ts" || git show "$src:scripts/supply-chain/image-scan.mjs"; } > "$RUNNER_TEMP/image-scan.ts" \
              || { echo "::error::the base commit has no scripts/supply-chain/image-scan.ts: the PR that adds the scanner can't run it"; exit 1; }
            git show "$src:.github/image-scan-exceptions.yaml" > "$RUNNER_TEMP/exceptions.yaml" 2>/dev/null || : > "$RUNNER_TEMP/exceptions.yaml"
            git show "$src:.github/image-scan-accepted.yaml" > "$RUNNER_TEMP/accepted.yaml" 2>/dev/null || : > "$RUNNER_TEMP/accepted.yaml"
          else
            cp scripts/supply-chain/image-scan.ts "$RUNNER_TEMP/image-scan.ts"
            cp .github/image-scan-exceptions.yaml "$RUNNER_TEMP/exceptions.yaml"
            cp .github/image-scan-accepted.yaml "$RUNNER_TEMP/accepted.yaml"
          fi
          # A base whose scanner predates --accepted gets no list (its scan is unchanged).
          grep -q -- '--accepted' "$RUNNER_TEMP/image-scan.ts" && accepted=(--accepted "$RUNNER_TEMP/accepted.yaml") || accepted=()
          mkdir -p "$RUNNER_TEMP/grype-db"
          # The computer images build FROM each other (an ARG default: engineer on agent-base, agent-base on the browser
          # image): each scanned through its own Dockerfile, never pulled from a registry image of the same name. DOCKERFILES is split on spaces, never globbed (set -f); the
          # find step refused any path with whitespace or a leading -, and -- ends the options.
          set -f
          GRYPE_DB_CACHE_DIR="$RUNNER_TEMP/grype-db" node "$RUNNER_TEMP/image-scan.ts" --exceptions "$RUNNER_TEMP/exceptions.yaml" "${accepted[@]}" \
            --local aidenhq/computer-agent-base=services/computer/images/agent-base/Dockerfile \
            --local aidenhq/computer-browser=services/computer/images/browser/Dockerfile -- $DOCKERFILES

  # The AI reviewer's exit test, for a change to its code (checks' `eval` step). Only a push to main or a same-repo PR: a
  # fork's run never gets the key. The key is in the eval step's env alone, in a job of its own on a fresh hosted runner,
  # and the checkout keeps no credentials. It is judged as the kernel's check job judges it (module.yaml `judged:`): the
  # harness (the eval script, its case padding and the pass rule: `judged.files`) and every existing case with its
  # expectations come from the PR's base (main for a merge train), the reviewer's code, policy and added cases from the
  # head, so a PR can't loosen its own test; a push to main runs its own tree. A passing run is cached by checks'
  # `eval_key`: every REVIEWER_CODE file at the head and at the judging commit, the one list that also triggers the eval, so
  # a change to any of them (the tiers too) runs it again. The script's receipt restored for that key prints "already
  # covered" and spends nothing. GitHub scopes a cache entry to the ref that wrote it (a PR's is read by
  # that PR only, main's by every run), so a PR can skip only its own re-runs, never main's or another PR's.
  reviewer-eval:
    needs: checks
    if: needs.checks.outputs.eval == 'true' && (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: The harness and existing cases from the base
        run: |
          [ "$GITHUB_EVENT_NAME" = pull_request ] && PR_BASE=$(git rev-parse HEAD^1) # the payload's base.sha goes stale as main moves; the merge commit's first parent is main now
          src="$PR_BASE"
          case "$GITHUB_REF" in refs/heads/merge-train/*) src=$(git rev-parse origin/main) ;; refs/heads/main) src="" ;; esac
          [ -n "$src" ] || { echo "a push to main: its own harness"; exit 0; }
          m=modules/ai-reviewer
          files=$(git show "$src:$m/module.yaml" | node -e '
            const y = require("fs").readFileSync(0, "utf8"), f = /\bjudged:[\s\S]*?\bfiles:\s*\[([^\]]*)\]/.exec(y);
            if (!f) process.exit(1);
            console.log(f[1].split(",").map((x) => x.trim()).filter(Boolean).join("\n"));') \
            || { echo "::error::the base's modules/ai-reviewer/module.yaml names no judged files"; exit 1; }
          while IFS= read -r f; do
            case "$f" in ""|/*|*..*) echo "::error::bad judged file: $f"; exit 1 ;; esac
            git show "$src:$m/$f" > "$m/$f" && echo "from the base: $m/$f"
          done <<< "$files"
          git ls-tree --name-only "$src" -- "$m/test/reviewer-cases/" | while IFS= read -r c; do git show "$src:$c" > "$c"; done
          echo "existing cases from the base: $(git ls-tree --name-only "$src" -- "$m/test/reviewer-cases/" | wc -l)"
      # Cache scope is the branch, not the job: a test step in this PR holds the same runtime token and can save a receipt under
      # this key on this branch, which a receipt-reusing eval would read as "already covered" and skip. So the eval below never
      # reuses one (`--force`): it always runs here, whatever the cache holds. The cache is kept as the record of the last run.
      - id: receipt
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eval-state
          key: reviewer-eval-${{ needs.checks.outputs.eval_key }}
      - name: Reviewer eval
        working-directory: modules/ai-reviewer
        env:
          OPENROUTER_API_KEY: ${{ secrets.GRADUATE_OPENROUTER_KEY }}
          XDG_STATE_HOME: ${{ github.workspace }}/.eval-state
        run: node --disable-warning=ExperimentalWarning scripts/reviewer-eval.ts --force
      # Only a script that records receipts leaves one (an older base's doesn't).
      - if: steps.receipt.outputs.cache-hit != 'true' && hashFiles('.eval-state/**') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eval-state
          key: reviewer-eval-${{ needs.checks.outputs.eval_key }}

  # The one result a merge waits for: every job above passed (packages, modules, board and reviewer-eval may be skipped:
  # the change doesn't touch them). image-scan is advisory, so it is not here. Jobs that
  # need another appear only once it finishes, so without this a PR can look all green for a moment before its tests
  # exist; the code host treats this check as required once the base branch has it (modules/github/service/src/merge-gate.ts withGate).
  ci-required:
    if: always()
    needs: [checks, policy, packages, modules, board, reviewer-eval]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '(.checks.result == "success") and (.policy.result == "success") and ([.packages, .modules, .board, .["reviewer-eval"]] | all(.result | IN("success", "skipped")))' >/dev/null
      # A fork's PR gets no eval key, so its reviewer-eval is skipped: one that changes the reviewer's code fails here until
      # the maintainer pushes its branch to this repo, where the eval runs.
      - if: needs.checks.outputs.eval == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "::error::this fork PR changes the AI reviewer's code (REVIEWER_CODE): push its branch to this repo so reviewer-eval runs"
          exit 1
