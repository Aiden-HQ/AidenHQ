# Tests and typechecks for every package, on pull requests and pushes to main. Offline: no secrets are used.
# Every job runs on our self-hosted runners (modules/ci; docs/operations.md, "CI runners"): one fresh container per job,
# no Docker (image-scan scans without building). A PR from a fork goes to a GitHub-hosted runner instead, never ours (the
# runner group, which allows private repositories only, is the real boundary: a PR can edit this file).
# The AI reviewer's exit test (services/runner/scripts/reviewer-eval.mjs) needs a paid OpenRouter key, so the
# maintainer runs it by hand for changes to the reviewer, its policy or its cases.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The 7-day rule: lockfile entries, images, actions, apt packages and global installs this change adds or alters must
  # be 7+ days old, unless an owner-approved security exception in .github/supply-chain-exceptions.yaml (read from the
  # base) covers them; and every one of them is pinned (scripts/supply-chain/pins.mjs).
  supply-chain:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "aidenhq"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read # ghcr.io images are dated by the GitHub Packages API
    env:
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE: ${{ github.event.before }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      # Both checks have no dependencies: nothing is installed before the lockfiles are vetted.
      - name: Age check (lockfiles) and pins (images, actions, apt, global installs)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          # a new branch or a force push has no usable before: compare with the default branch
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null || git rev-parse "$HEAD_SHA~1")
          fi
          status=0
          node scripts/supply-chain/npm-age.mjs "$base" "$HEAD_SHA" || status=1
          node scripts/supply-chain/pins.mjs "$base" "$HEAD_SHA" || status=1
          exit $status

  # The PR title becomes the squash commit on main, so it must be a Conventional Commit (CONTRIBUTING.md, "Pull requests
  # and commits"). It reads the title live from the API, so after fixing a title, re-run the failed jobs. The title is never
  # interpolated into the script: it is untrusted text.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "aidenhq"]') }}
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Conventional Commit title
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
        run: |
          node --input-type=module -e '
            const res = await fetch(process.env.PR_URL, { headers: { authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: "application/vnd.github+json" } });
            if (!res.ok) throw new Error(`reading the PR failed: ${res.status}`);
            const { title } = await res.json();
            const ok = /^(feat|fix|docs|chore|test|refactor|perf|ci|build|style|revert)(\([a-z0-9][a-z0-9._\/-]*\))?!?: \S/.test(title);
            console.log(`Title: ${JSON.stringify(title)}`);
            if (!ok) {
              console.log("::error::The PR title must be a Conventional Commit, e.g. \"fix(board): keep the drawer open\" or \"docs: explain pins\". Types: feat, fix, docs, chore, test, refactor, perf, ci, build, style, revert. Edit the title, then re-run the failed jobs.");
              process.exit(1);
            }
          '

  # The packages this change needs tested (image-changes' `tests` step; all of them on a push to main). The small ones
  # share one job, four at a time: alone, each spent ~14 s of setup and about a minute of queue on 1-9 s of tests.
  packages:
    needs: image-changes
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "aidenhq"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 is in our runner image's tool cache (modules/ci/runner): found there, nothing is downloaded.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Git identity (the tests make commits)
        run: git config --global user.name ci && git config --global user.email ci@example.com
      - name: Test
        env:
          TESTS: ${{ needs.image-changes.outputs.tests }}
        run: |
          logs="$RUNNER_TEMP/packages"; mkdir -p "$logs"
          jq -r '.[] | select(.name | IN("services/runner", "services/runner#flows", "services/board") | not) | "\(.dir)\t\(.run)"' <<< "$TESTS" > "$logs/list"
          # One line per package, run in its directory: its output goes to <log>, its exit code to <log>.rc.
          one() { dir="${1%%$'\t'*}"; cmd="${1#*$'\t'}"; log="$logs/$(tr / _ <<< "$dir")"; (cd "$dir" && bash -eo pipefail -c "$cmd") > "$log" 2>&1; echo $? > "$log.rc"; }
          export -f one; export logs
          tr '\n' '\0' < "$logs/list" | xargs -0 -r -P 4 -I{} bash -c 'one "$1"' _ {}
          status=0
          while IFS=$'\t' read -r dir cmd; do
            log="$logs/$(tr / _ <<< "$dir")"; rc=$(cat "$log.rc")
            echo "::group::$dir (exit $rc)"; cat "$log"; echo "::endgroup::"
            [ "$rc" = 0 ] || { echo "::error::$dir failed"; status=1; }
          done < "$logs/list"
          exit $status

  # The runner's unit tests, and its end-to-end flows in two shards side by side (each only when selected).
  runner-unit:
    needs: image-changes
    if: contains(fromJSON(needs.image-changes.outputs.tests).*.name, 'services/runner')
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "aidenhq"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 is in our runner image's tool cache (modules/ci/runner): found there, nothing is downloaded.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Git identity (the tests make commits)
        run: git config --global user.name ci && git config --global user.email ci@example.com
      - name: Test
        working-directory: services/runner
        run: npm ci && npm run test:unit

  runner-flows:
    name: runner-flows (${{ matrix.shard }}/2)
    needs: image-changes
    if: contains(fromJSON(needs.image-changes.outputs.tests).*.name, 'services/runner#flows')
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "aidenhq"]') }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 is in our runner image's tool cache (modules/ci/runner): found there, nothing is downloaded.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Git identity (the tests make commits)
        run: git config --global user.name ci && git config --global user.email ci@example.com
      - name: Test
        working-directory: services/runner
        env:
          SHARD: ${{ matrix.shard }}
          # Seconds each file took alone (14-core dedicated host, 2026-11-14), for balancing; a file not listed counts 30.
          WEIGHTS: '{"test/flow-merge-path.test.mjs": 43, "test/flow-approvals.test.mjs": 38, "test/flow-autonomy.test.mjs": 30, "test/flow-graded.test.mjs": 25, "test/flow-product.test.mjs": 23, "test/flow-running.test.mjs": 21, "test/flow-design-review.test.mjs": 18, "test/box.test.mjs": 14, "test/flow-conversation.test.mjs": 14, "test/flow-workspace.test.mjs": 8, "test/flow-delegated.test.mjs": 6, "test/adopt.test.mjs": 3}'
        run: |
          # The files test:flows runs, split greedily by weight, heaviest first, into the lighter shard.
          files=$(node -e '
            const w = JSON.parse(process.env.WEIGHTS), shard = Number(process.env.SHARD) - 1;
            const files = require("fs").readdirSync("test").filter((f) => /^(flow-.*|box|adopt)\.test\.mjs$/.test(f)).map((f) => `test/${f}`);
            const load = [0, 0], out = [[], []];
            for (const f of files.sort((a, b) => (w[b] ?? 30) - (w[a] ?? 30) || a.localeCompare(b))) { const i = load[0] <= load[1] ? 0 : 1; load[i] += w[f] ?? 30; out[i].push(f); }
            console.log(out[shard].join(" "));')
          echo "Shard $SHARD: $files"
          # As many files at once as the job has CPUs (cpus: 4 in modules/ci/compose.yaml; ubuntu-latest has 4 too): node
          # counts the host's CPUs, not the container's, and runs the whole shard at once, starving every flow's turns.
          npm ci && node --disable-warning=ExperimentalWarning --test --test-concurrency=4 $files

  board:
    needs: image-changes
    if: contains(fromJSON(needs.image-changes.outputs.tests).*.name, 'services/board')
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "aidenhq"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 24 is in our runner image's tool cache (modules/ci/runner): found there, nothing is downloaded.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Git identity (the tests make commits)
        run: git config --global user.name ci && git config --global user.email ci@example.com
      - name: Test
        working-directory: services/board
        # build runs `tsc -p tsconfig.build.json` (src alone, stricter than the full project) and then Vite; typecheck
        # checks the full project and web. A separate `tsc -p tsconfig.build.json --noEmit` only repeated build's.
        run: npm ci && npx vitest run && npm run typecheck && npm run build

  # Which images this change could alter: each Dockerfile it changes, or whose directory gets a changed dependency manifest
  # or lockfile. Every one is listed, whatever its FROM: a FROM that can't be resolved fails the scan, never skips it.
  image-changes:
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "aidenhq"]') }}
    timeout-minutes: 5
    outputs:
      dockerfiles: ${{ steps.find.outputs.dockerfiles }}
      tests: ${{ steps.tests.outputs.tests }}
    env:
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE: ${{ github.event.before }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The packages to test: on a pull request, each whose directory or a path it reads changed; every one on a push to
      # main or when CI itself, shared code or a root manifest changed. `scripts` always runs (fast; it checks the lot).
      # --ignore-scripts: better-sqlite3 ships a linux prebuild, which it loads, but npm's implicit node-gyp step for it
      # still needs make, which the runner image hasn't (no package here needs an install script).
      - id: tests
        run: |
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null || git rev-parse "$HEAD_SHA~1")
          fi
          changed=$(git diff --name-only "$base" "$HEAD_SHA")
          all=""
          [ "$GITHUB_EVENT_NAME" = pull_request ] || all=1
          grep -qE '^(\.github/|services/shared/)' <<< "$changed" && all=1
          packages=$(cat <<'PACKAGES'
          scripts|npm ci && npm test|*
          services/runner|(its own job)|services/runner services/computer kernel services/shared modules scripts kernel/sdk fixtures services/board/src/approvals.ts services/board/src/app.ts services/board/src/fleet.ts services/board/src/accounts.ts services/board/src/session.ts
          services/runner#flows|(its own jobs)|services/runner services/shared modules/engine-codex modules/engine-claude modules/engine-opencode kernel/sdk fixtures/engine-echo|services/runner/src/prompt.ts modules/engine-codex/codex-home/AGENTS.md
          kernel/sdk|(cd ../../services/runner && npm ci) && npm test|kernel/sdk fixtures/engine-echo modules/engine-codex modules/engine-claude modules/engine-opencode
          services/computer|node --test test/*.test.mjs|services/computer services/runner/src services/runner/bin modules/core/design-system modules/design
          kernel|npm ci && npm test && npm run typecheck|kernel services/computer modules/tasks
          modules/core/templates/app|npm ci && npm test && npm run build|modules/core/templates/app modules/core/design-system
          services/gate|npm ci && npm test && npm run typecheck|services/gate services/shared scripts/identity.mjs
          services/board|(its own job)|services/board services/gate services/runner/src services/shared scripts/identity.mjs modules/core/design-system modules/tasks
          services/apps-mcp|npm ci --ignore-scripts && npm test && npm run typecheck|services/apps-mcp services/shared modules/core/templates/app modules/core/design-system scripts/identity.mjs
          modules/clickhouse/connections/clickhouse-mcp|npm ci && npm test && npm run typecheck|modules/clickhouse
          modules/github/connections/github-mcp|npm ci && npm test && npm run typecheck|modules/github
          modules/glean/connections/glean-mcp|npm ci && npm test && npm run typecheck|modules/glean
          modules/google/connections/google-workspace-mcp|npm ci && npm test && npm run typecheck|modules/google
          modules/grafana/connections/grafana-mcp|npm ci && npm test && npm run typecheck|modules/grafana
          modules/jira/connections/jira-mcp|npm ci && npm test && npm run typecheck|modules/jira
          modules/meetings/connections/ops-mcp|npm ci && npm test && npm run typecheck|modules/meetings
          modules/owner-channel/connections/slack-live-mcp|npm ci --ignore-scripts && npm test && npm run typecheck|modules/owner-channel
          modules/primer/connections/primer-mcp|npm ci && npm test && npm run typecheck|modules/primer
          modules/slack/connections/slack-mcp|npm ci && npm test && npm run typecheck|modules/slack
          modules/tasks/connections/tasks-mcp|npm ci && npm test|modules/tasks kernel/sdk
          modules/security/scanner|npm ci && npm test && npm run typecheck|modules/security
          PACKAGES
          )
          # A changed file under no package's paths (ops/, compose files, root files, a new directory…) runs them all:
          # the filter never fails open. Docs and Markdown alone change no test. The runner's end-to-end flows (`#flows`: the
          # flow-*, box and adopt files) run for anything under services/runner or services/shared except the prompt text and
          # the handbook (a row's fourth field lists files that don't count for it; Markdown never counts): a change to only
          # those runs the runner's unit tests alone.
          known=$(cut -d'|' -f3 <<< "$packages" | tr ' ' '\n' | grep -v '^\*$' | sort -u)
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in docs/*|*.md) continue ;; esac
            hit=""
            while IFS= read -r p; do case "$f" in "$p"|"$p"/*) hit=1; break ;; esac; done <<< "$known"
            [ -n "$hit" ] || { echo "Not under any package: $f (testing everything)"; all=1; break; }
          done <<< "$changed"
          picked=""
          while IFS='|' read -r key run paths ignore; do
            [ -n "$key" ] || continue
            want="$all"
            [ "$paths" = "*" ] && want=1
            counted="$changed"
            [ -n "$ignore" ] && counted=$(grep -v '\.md$' <<< "$changed" || true)
            for i in $ignore; do counted=$(grep -vxF "$i" <<< "$counted" || true); done
            for p in $paths; do grep -q "^$p\(/\|$\)" <<< "$counted" && want=1; done
            [ -n "$want" ] && picked="$picked$(jq -nc --arg key "$key" --arg run "$run" '{name: $key, dir: ($key | split("#")[0]), run: $run}')"$'\n'
          done <<< "$packages"
          tests=$(printf '%s' "$picked" | jq -sc .)
          echo "Packages to test: $(jq -r 'map(.dir) | join(" ")' <<< "$tests")"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

      - id: find
        run: |
          set -f # DOCKERFILES is split on spaces below, never globbed
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null || git rev-parse "$HEAD_SHA~1")
          fi
          changed=$(git diff --name-only "$base" "$HEAD_SHA")
          found=""
          while IFS= read -r -d '' df; do
            # A path with whitespace would split in DOCKERFILES, one starting with - could pass for an option: refuse both.
            case "$df" in *[[:space:]]*|-*) echo "::error::Dockerfile path $(printf '%q' "$df") has whitespace or starts with -"; exit 1 ;; esac
            d=$(dirname "$df"); prefix=""; [ "$d" = . ] || prefix="$d/"
            while IFS= read -r f; do
              case "$f" in "$prefix"*) ;; *) continue ;; esac
              case "${f##*/}" in
                [Dd]ockerfile*|[Cc]ontainerfile*|*.dockerfile|.dockerignore|package.json|package-lock.json|npm-shrinkwrap.json|yarn.lock|pnpm-lock.yaml|requirements*.txt|poetry.lock|Pipfile.lock|uv.lock|go.mod|go.sum|Cargo.lock|Gemfile.lock)
                  found="$found $df"; break ;;
              esac
            done <<< "$changed"
          done < <(git ls-files -z | grep -izE '(^|/)(Dockerfile|Containerfile)[^/]*$|\.dockerfile$')
          echo "Images to scan:${found:- none}"
          echo "dockerfiles=${found# }" >> "$GITHUB_OUTPUT"

  # The `image-scan` check: for each image this change could alter, grype scans its directory (lock files, manifests) and
  # every base image its FROM and COPY --from lines name, pulled from the registry, and fails on a high or critical
  # vulnerability that has a fix. Nothing is built and no PR code runs (a build would run the PR's RUN steps on our
  # runner): scripts/supply-chain/image-scan.mjs reads each Dockerfile as text and passes grype only digest-pinned
  # references. Not covered: packages RUN steps install, so only base-image and lock-file changes are proven here. It is
  # the evidence for image and CVE work (Engineers have no Docker); skipped when no image could change. grype is baked
  # into the runner image (modules/ci/runner), the security module's pin.
  image-scan:
    needs: image-changes
    if: needs.image-changes.outputs.dockerfiles != ''
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "aidenhq"]') }}
    timeout-minutes: 30
    env:
      DOCKERFILES: ${{ needs.image-changes.outputs.dockerfiles }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Node 24 is in our runner image's tool cache (modules/ci/runner): found there, nothing is downloaded.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Scan (no build)
        run: |
          # On a pull request the scanner and its exceptions come from the base commit, so a PR can't run its own code here
          # or loosen its own scan; a base without the scanner fails closed. A push to main runs main's own.
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git show "$PR_BASE:scripts/supply-chain/image-scan.mjs" > "$RUNNER_TEMP/image-scan.mjs" \
              || { echo "::error::the base commit has no scripts/supply-chain/image-scan.mjs: the PR that adds the scanner can't run it"; exit 1; }
            git show "$PR_BASE:.github/image-scan-exceptions.yaml" > "$RUNNER_TEMP/exceptions.yaml" 2>/dev/null || : > "$RUNNER_TEMP/exceptions.yaml"
          else
            cp scripts/supply-chain/image-scan.mjs "$RUNNER_TEMP/image-scan.mjs"
            cp .github/image-scan-exceptions.yaml "$RUNNER_TEMP/exceptions.yaml"
          fi
          mkdir -p "$RUNNER_TEMP/grype-db"
          # The computer images build FROM each other (an ARG default: engineer on agent-base, agent-base on the browser
          # image): each scanned through its own Dockerfile, never pulled from a registry image of the same name. DOCKERFILES is split on spaces, never globbed (set -f); the
          # find step refused any path with whitespace or a leading -, and -- ends the options.
          set -f
          GRYPE_DB_CACHE_DIR="$RUNNER_TEMP/grype-db" node "$RUNNER_TEMP/image-scan.mjs" --exceptions "$RUNNER_TEMP/exceptions.yaml" \
            --local aidenhq/computer-agent-base=services/computer/images/agent-base/Dockerfile \
            --local aidenhq/computer-browser=services/computer/images/browser/Dockerfile -- $DOCKERFILES

  # The one result a merge waits for: every job above passed (pr-title, the runner, board and image-scan jobs may be
  # skipped: not a pull request, or the change doesn't touch them). Jobs that
  # need another appear only once it finishes, so without this a PR can look all green for a moment before its tests
  # exist; the runner treats this check as required once the base branch has it (services/runner/src/merges.mjs withGate).
  ci-required:
    if: always()
    needs: [supply-chain, pr-title, image-changes, packages, runner-unit, runner-flows, board, image-scan]
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted", "aidenhq"]') }}
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '(.["supply-chain"].result == "success") and (.["image-changes"].result == "success") and (.packages.result == "success") and ([.["pr-title"], .["runner-unit"], .["runner-flows"], .board, .["image-scan"]] | all(.result | IN("success", "skipped")))' >/dev/null
