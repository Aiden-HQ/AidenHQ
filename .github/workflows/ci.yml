# Job budgets (timeout-minutes): a floor set from only a few hosted runs on 2026-11-17. A failed job is never re-run, but a
# failed suite re-runs its failed tests once in the same job (.github/ci/run-suite.sh; the board's vitest --retry=1).
# Tests and typechecks for every package, on pull requests and pushes to main. Offline: no secrets are used.
# A pull request runs the fast suites its change touches; the slow end-to-end ones (areas.json `main: true`: the runner's
# flows, the SDK twin) run only on pushes to main, so a flake there never holds a PR (the merge queue counts every check).
# Jobs run on GitHub-hosted runners (this repository is public, so it costs nothing, but the free plan runs ~20 jobs at
# once). The heavy jobs (packages, runner, board) overflow to our self-hosted runners (modules/ci, labels self-hosted +
# aidenhq) only when hosted capacity is saturated (checks' `runner` step), the repository variable CI_SELF_HOSTED is
# 'true' (docs/operations.md) and the run is a push to main or a same-repo pull request. Fork PRs stay hosted, and the
# runners' job-started hook refuses any job that is not a push or same-repo PR of a repo they serve.
# The AI reviewer's exit test (modules/ai-reviewer/scripts/reviewer-eval.mjs) needs a paid OpenRouter key, so the
# maintainer runs it by hand for changes to the reviewer, its policy or its cases.
name: ci

on:
  pull_request:
  push:
    # merge-train/<n>: the merge queue's trains (modules/codehost-github merge-gate.mjs), main plus the PRs it tests together,
    # made in one push at the finished commit (they are built on merge-build/<n>, which runs nothing).
    branches: [main, "merge-train/**"]

permissions:
  contents: read

# A newer push to a PR cancels its older run. Every push to main and every merge train runs to the end (its own group:
# GitHub drops a pending run when a newer one joins the group): the merge queue reads main's result, and a cancelled run
# says nothing about it.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The suites this change needs tested that have no job of their own (checks' `tests` step; all of them on a push
  # to main), skipped when there are none. They share two jobs, split by weight (below), four suites at a time in each: alone, each spent ~14 s of setup and about
  # a minute of queue on 1-9 s of tests.
  packages:
    name: packages (${{ matrix.shard }}/2)
    needs: checks
    if: needs.checks.outputs.packages == 'true'
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON(needs.checks.outputs.runner) }}
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Git identity (the tests make commits)
        run: git config --global user.name ci && git config --global user.email ci@example.com
      # kernel/contract.lock.json against the PR's base lock (scripts/lean/contract-lock.mjs): a stable entry is never
      # removed or reshaped. The scripts suite checks the lock against the code on every run.
      - name: Contract lock
        if: github.event_name == 'pull_request' && matrix.shard == 1
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd scripts && npm ci --ignore-scripts)
          # The checkout keeps no credentials: pass the read-only token for this one fetch.
          git -c "http.extraheader=Authorization: Basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" fetch --no-tags --depth=1 origin "$PR_BASE"
          node --disable-warning=ExperimentalWarning scripts/lean/contract-lock.mjs --check --base "$PR_BASE"
      - name: Test
        env:
          TESTS: ${{ needs.checks.outputs.tests }}
          SHARD: ${{ matrix.shard }}
          # Seconds each suite took (GitHub-hosted, 2026-11-17), for balancing; a suite not listed counts 30. The selected
          # suites go heaviest first into the lighter shard.
          WEIGHTS: '{"scripts": 66, "services/computer": 36, "kernel": 30, "kernel/sdk": 8, "fixtures/twin": 6}'
        run: |
          logs="$RUNNER_TEMP/packages"; mkdir -p "$logs"
          node -e '
            const w = JSON.parse(process.env.WEIGHTS), shard = Number(process.env.SHARD) - 1, load = [0, 0], out = [[], []];
            const suites = JSON.parse(process.env.TESTS).filter((t) => t.job == null).sort((a, b) => (w[b.name] ?? 30) - (w[a.name] ?? 30) || a.name.localeCompare(b.name));
            for (const t of suites) { const i = load[0] <= load[1] ? 0 : 1; load[i] += w[t.name] ?? 30; out[i].push(`${t.dir}\t${t.run}`); }
            console.log(out[shard].join("\n"));' > "$logs/list"
          sed -i "/^\$/d" "$logs/list"
          echo "Shard $SHARD: $(cut -f1 "$logs/list" | tr '\n' ' ')"
          # One line per package, run in its directory: its output goes to <log>, its exit code to <log>.rc.
          one() { dir="${1%%$'\t'*}"; cmd="${1#*$'\t'}"; log="$logs/$(tr / _ <<< "$dir")"; (cd "$dir" && "$retry" "$cmd") > "$log" 2>&1; echo $? > "$log.rc"; }
          retry="$PWD/.github/ci/run-suite.sh"
          export -f one; export logs retry
          # scripts/node_modules is read by the scripts suite and the kernel's authority CLI: install it once, here, since two
          # parallel `npm ci` in one directory delete each other's files (ENOTEMPTY, then "Cannot find module yaml").
          grep -qE '^(scripts|kernel|fixtures/twin)[[:space:]]' "$logs/list" && (cd scripts && npm ci)
          # The scripts suite's forks test runs the runner's tier function (services/runner/src/tiers.mjs), which reads its own
          # node_modules and, for the apply rules, the kernel's (kernel/src/apply-tier.ts): install them too (no services/runner
          # package runs in this job; the kernel's own suite, which installs its packages itself, is weighted onto the other shard).
          grep -qE '^scripts[[:space:]]' "$logs/list" && (cd services/runner && npm ci) && { grep -qE '^kernel[[:space:]]' "$logs/list" || (cd kernel && npm ci); }
          tr '\n' '\0' < "$logs/list" | xargs -0 -r -P 4 -I{} bash -c 'one "$1"' _ {}
          status=0
          while IFS=$'\t' read -r dir cmd; do
            log="$logs/$(tr / _ <<< "$dir")"; rc=$(cat "$log.rc")
            echo "::group::$dir (exit $rc)"; cat "$log"; echo "::endgroup::"
            [ "$rc" = 0 ] || { echo "::error::$dir failed"; status=1; }
          done < "$logs/list"
          exit $status

  # The official modules' own suites (areas.json entries with job "modules": each module's packages, plus the module suites
  # whose paths a change touches, e.g. the kernel for the modules that import it), up to three shards. Each shard installs the
  # kernel's and the compiler's packages once (module tests import them), then runs its entries one after another.
  modules:
    name: modules (${{ matrix.shard }})
    needs: checks
    if: needs.checks.outputs.modules != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.checks.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Git identity (the tests make commits)
        run: git config --global user.name ci && git config --global user.email ci@example.com
      - name: Test
        env:
          ENTRIES: ${{ toJSON(matrix.entries) }}
        run: |
          (cd kernel && npm ci --silent) && (cd scripts && npm ci --silent)
          status=0
          while IFS=$'\t' read -r dir run; do
            echo "::group::$dir"
            (cd "$dir" && bash "$GITHUB_WORKSPACE/.github/ci/run-suite.sh" "$run") && echo "ok: $dir" || { echo "::error::$dir failed"; status=1; }
            echo "::endgroup::"
          done < <(jq -r '.[] | [.dir, .run] | @tsv' <<< "$ENTRIES")
          exit $status

  # The runner's unit tests, and its end-to-end flows in three shards side by side (each only when selected; the flows only
  # on a push to main).
  runner-unit:
    needs: checks
    if: contains(fromJSON(needs.checks.outputs.tests).*.name, 'services/runner')
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON(needs.checks.outputs.runner) }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Git identity (the tests make commits)
        run: git config --global user.name ci && git config --global user.email ci@example.com
      - name: Test
        working-directory: services/runner
        # The command is the suite's `run` in .github/ci/areas.json (scripts/ci-local.mjs runs the same one).
        run: ../../.github/ci/run-suite.sh "$(jq -r '.suites[] | select(.name == "services/runner") | .run' ../../.github/ci/areas.json)"

  runner-flows:
    name: runner-flows (${{ matrix.shard }}/3)
    needs: checks
    if: contains(fromJSON(needs.checks.outputs.tests).*.name, 'services/runner#flows')
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON(needs.checks.outputs.runner) }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Git identity (the tests make commits)
        run: git config --global user.name ci && git config --global user.email ci@example.com
      - name: Test
        working-directory: services/runner
        env:
          SHARD: ${{ matrix.shard }}
          # Seconds each file took on a hosted runner (2026-11-18), for balancing; a file not listed counts 30.
          WEIGHTS: '{"test/flow-merge-path.test.mjs": 36, "test/flow-local-codehost.test.mjs": 36, "test/flow-autonomy.test.mjs": 31, "test/flow-approvals.test.mjs": 28, "test/flow-running.test.mjs": 14, "test/box.test.mjs": 13, "test/adopt.test.mjs": 11}'
        run: |
          # The files test:flows runs, split greedily by weight, heaviest first, into the lightest of the three shards.
          files=$(node -e '
            const w = JSON.parse(process.env.WEIGHTS), shard = Number(process.env.SHARD) - 1;
            const files = require("fs").readdirSync("test").filter((f) => /^(flow-.*|box|adopt)\.test\.mjs$/.test(f)).map((f) => `test/${f}`);
            const load = [0, 0, 0], out = [[], [], []];
            for (const f of files.sort((a, b) => (w[b] ?? 30) - (w[a] ?? 30) || a.localeCompare(b))) { const i = load.indexOf(Math.min(...load)); load[i] += w[f] ?? 30; out[i].push(f); }
            console.log(out[shard].join(" "));')
          echo "Shard $SHARD: $files"
          # As many files at once as the job has CPUs (cpus: 4 in modules/ci/compose.yaml; ubuntu-latest has 4 too): node
          # counts the host's CPUs, not the container's, and runs the whole shard at once, starving every flow's turns.
          # The kernel's packages too: the flows run the kernel's job half (kernel/test/fixtures/jobs-host.mjs).
          (cd ../../kernel && npm ci) && npm ci && ../../.github/ci/run-suite.sh "node --disable-warning=ExperimentalWarning --test --test-concurrency=4 $files"

  board:
    needs: checks
    if: contains(fromJSON(needs.checks.outputs.tests).*.name, 'services/board')
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON(needs.checks.outputs.runner) }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - name: Git identity (the tests make commits)
        run: git config --global user.name ci && git config --global user.email ci@example.com
      - name: Test
        working-directory: services/board
        # The command is the suite's `run` in .github/ci/areas.json (scripts/ci-local.mjs runs the same one).
        run: bash -eo pipefail -c "$(jq -r '.suites[] | select(.name == "services/board") | .run' ../../.github/ci/areas.json)"

  # The plan the jobs below wait for, kept to fast steps (~10-15 s): the suites to test, the images to scan and where the
  # heavy jobs run. Which images this change could alter: each Dockerfile it changes, or whose directory gets a changed
  # dependency manifest or lockfile. Every one is listed, whatever its FROM: a FROM that can't be resolved fails the
  # scan, never skips it.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # the earlier green runs of a rebased PR (.github/ci/select.mjs) and how busy hosted runners are
    outputs:
      dockerfiles: ${{ steps.find.outputs.dockerfiles }}
      tests: ${{ steps.tests.outputs.tests }}
      packages: ${{ steps.tests.outputs.packages }}
      modules: ${{ steps.tests.outputs.modules }}
      runner: ${{ steps.runner.outputs.runner }}
    env:
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE: ${{ github.event.before }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      # Where the heavy jobs run: GitHub-hosted, unless CI_SELF_HOSTED is 'true', the run is a push to main or a same-repo
      # PR, and this repo's other runs already hold BUSY+ hosted jobs (queued or running). Any API error keeps them hosted.
      # Fork PRs and merge trains (main plus PRs that may come from forks) never route there; the runners' job-started hook
      # (modules/ci/runner) refuses them anyway.
      - id: runner
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ENABLED: ${{ vars.CI_SELF_HOSTED == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: |
          BUSY=12 # of the free plan's ~20 concurrent hosted jobs, leaving room for this run's ~9
          runner='"ubuntu-latest"'
          if [ "$ENABLED" = true ] && busy=$(set -o pipefail; for status in queued in_progress; do
              gh api "repos/$REPO/actions/runs?status=$status&per_page=100" --jq ".workflow_runs[] | select(.id != $RUN_ID) | .id" || exit 1
            done | while read -r id; do
              gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" --jq '[.jobs[] | select((.status == "queued" or .status == "in_progress") and ((.labels | index("self-hosted")) | not))] | length' || exit 1
            done | awk '{n += $1} END {print n + 0}') && [ "$busy" -ge "$BUSY" ]; then
            runner='["self-hosted","aidenhq"]'
          fi
          echo "hosted jobs busy in other runs: ${busy:-not counted}; heavy jobs run on $runner"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      # The suites to test (.github/ci/select.mjs, map in .github/ci/areas.json): on a pull request, those its changed
      # files touch, both files read from the base so a PR can't shrink its own set (a base without them runs every suite);
      # on a rebased head with an unchanged patch, only those main's new commits also touch. Every suite on a push to main.
      - id: tests
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          # a merge train is a push of main plus the PRs: its base is main, never an earlier train commit
          case "$GITHUB_REF" in refs/heads/merge-train/*) PUSH_BEFORE= ;; esac
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null || git rev-parse "$HEAD_SHA~1")
          fi
          d="$RUNNER_TEMP/ci"; mkdir -p "$d"
          export BASE="$base" HEAD="$HEAD_SHA" HEAD_MAP=.github/ci/areas.json MAP="$d/areas.json"
          # the suite map and selector come from the PR's base, or from main for a merge train (its tree holds the PRs' own edits);
          # only a push to main uses its own tree
          src="$PR_BASE"
          case "$GITHUB_REF" in refs/heads/merge-train/*) src=$(git rev-parse origin/main) ;; refs/heads/main) src="" ;; esac
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then export ALL="a push to main or a merge train"; fi
          # the slow suites (areas.json `main: true`) run only on a push to main
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then export MAIN=1; fi
          if [ -z "$src" ] || ! { git show "$src:.github/ci/select.mjs" > "$d/select.mjs" && git show "$src:.github/ci/areas.json" > "$d/areas.json"; } 2>/dev/null; then
            export ALL="${ALL:-the base has no suite map}"; cp .github/ci/select.mjs .github/ci/areas.json "$d/"
          fi
          out=$(node "$d/select.mjs")
          tests=$(jq -c .tests <<< "$out")
          echo "Suites to test: $(jq -r 'map(.name) | join(" ")' <<< "$tests")"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "packages=$(jq -r .packages <<< "$out")" >> "$GITHUB_OUTPUT"
          echo "modules=$(jq -c '.modules // []' <<< "$out")" >> "$GITHUB_OUTPUT"

      - id: find
        run: |
          set -f # DOCKERFILES is split on spaces below, never globbed
          # a merge train is a push of main plus the PRs: its base is main, never an earlier train commit
          case "$GITHUB_REF" in refs/heads/merge-train/*) PUSH_BEFORE= ;; esac
          base="${PR_BASE:-$PUSH_BEFORE}"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null || git rev-parse "$HEAD_SHA~1")
          fi
          changed=$(git diff --name-only "$base" "$HEAD_SHA")
          found=""
          while IFS= read -r -d '' df; do
            # A path with whitespace would split in DOCKERFILES, one starting with - could pass for an option: refuse both.
            case "$df" in *[[:space:]]*|-*) echo "::error::Dockerfile path $(printf '%q' "$df") has whitespace or starts with -"; exit 1 ;; esac
            d=$(dirname "$df"); prefix=""; [ "$d" = . ] || prefix="$d/"
            while IFS= read -r f; do
              case "$f" in "$prefix"*) ;; *) continue ;; esac
              case "${f##*/}" in
                [Dd]ockerfile*|[Cc]ontainerfile*|*.dockerfile|.dockerignore|package.json|package-lock.json|npm-shrinkwrap.json|yarn.lock|pnpm-lock.yaml|requirements*.txt|poetry.lock|Pipfile.lock|uv.lock|go.mod|go.sum|Cargo.lock|Gemfile.lock)
                  found="$found $df"; break ;;
              esac
            done <<< "$changed"
          done < <(git ls-files -z | grep -izE '(^|/)(Dockerfile|Containerfile)[^/]*$|\.dockerfile$' | grep -zvE '\.(m?[jt]s|json|md|ya?ml|sh)$')
          echo "Images to scan:${found:- none}"
          echo "dockerfiles=${found# }" >> "$GITHUB_OUTPUT"

  # The 7-day rule (lockfile entries, images, actions, apt packages and global installs this change adds or alters must be
  # 7+ days old, unless an owner-approved security exception in .github/supply-chain-exceptions.yaml (read from the base)
  # covers them, and every one is pinned: scripts/supply-chain/pins.mjs) and the PR title. Beside the plan, never before
  # the tests: only ci-required waits for it.
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read # ghcr.io images are dated by the GitHub Packages API
      pull-requests: read # the PR title
    env:
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE: ${{ github.event.before }}
      HEAD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      # Both checks have no dependencies: nothing is installed before the lockfiles are vetted.
      - name: Age check (lockfiles) and pins (images, actions, apt, global installs)
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # a merge train is a push of main plus the PRs: its base is main, never an earlier train commit
          case "$GITHUB_REF" in refs/heads/merge-train/*) PUSH_BEFORE= ;; esac
          base="${PR_BASE:-$PUSH_BEFORE}"
          # a new branch or a force push has no usable before: compare with the default branch
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git merge-base origin/main "$HEAD_SHA" 2>/dev/null || git rev-parse "$HEAD_SHA~1")
          fi
          status=0
          node scripts/supply-chain/npm-age.mjs "$base" "$HEAD_SHA" || status=1
          node scripts/supply-chain/pins.mjs "$base" "$HEAD_SHA" || status=1
          exit $status
      - name: Conventional Commit title
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.url }}
        run: |
          node --input-type=module -e '
            const res = await fetch(process.env.PR_URL, { headers: { authorization: `Bearer ${process.env.GITHUB_TOKEN}`, accept: "application/vnd.github+json" } });
            if (!res.ok) throw new Error(`reading the PR failed: ${res.status}`);
            const { title } = await res.json();
            const ok = /^(feat|fix|docs|chore|test|refactor|perf|ci|build|style|revert)(\([a-z0-9][a-z0-9._\/-]*\))?!?: \S/.test(title);
            console.log(`Title: ${JSON.stringify(title)}`);
            if (!ok) {
              console.log("::error::The PR title must be a Conventional Commit, e.g. \"fix(board): keep the drawer open\" or \"docs: explain pins\". Types: feat, fix, docs, chore, test, refactor, perf, ci, build, style, revert. Edit the title, then re-run the failed jobs.");
              process.exit(1);
            }
          '

  # The `image-scan` check: for each image this change could alter, grype scans its directory (lock files, manifests) and
  # every base image its FROM and COPY --from lines name, pulled from the registry, and fails on a high or critical
  # vulnerability that has a fix. Nothing is built and no PR code runs (a build would run the PR's RUN steps on our
  # runner): scripts/supply-chain/image-scan.mjs reads each Dockerfile as text and passes grype only digest-pinned
  # references. Not covered: packages RUN steps install, so only base-image and lock-file changes are proven here. It is
  # the evidence for image and CVE work (Engineers have no Docker); skipped when no image could change. grype is
  # installed below, at the version the security module pins.
  image-scan:
    needs: checks
    if: needs.checks.outputs.dockerfiles != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DOCKERFILES: ${{ needs.checks.outputs.dockerfiles }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
      PUSH_BEFORE: ${{ github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - name: Install grype
        env:
          GRYPE_VERSION: 0.121.3 # released 2026-11-09
          GRYPE_SHA256: e9da18cc1429e786722e32161288103600efffd8e483c90761f90485bd1bec85 # grype_0.121.3_linux_amd64.tar.gz
        run: |
          curl -sSfL -o "$RUNNER_TEMP/grype.tgz" "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  $RUNNER_TEMP/grype.tgz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/grype.tgz" -C "$RUNNER_TEMP" grype
          sudo install -m 0755 "$RUNNER_TEMP/grype" /usr/local/bin/grype
      - name: Scan (no build)
        run: |
          # On a pull request the scanner and its exceptions come from the base commit, on a merge train from main (its tree holds
          # the PRs' own edits), so no PR can run its own code here or loosen its own scan; a base without the scanner fails
          # closed. A push to main runs main's own.
          src="$PR_BASE"
          case "$GITHUB_REF" in refs/heads/merge-train/*) src=$(git rev-parse origin/main) ;; refs/heads/main) src="" ;; esac
          if [ -n "$src" ]; then
            git show "$src:scripts/supply-chain/image-scan.mjs" > "$RUNNER_TEMP/image-scan.mjs" \
              || { echo "::error::the base commit has no scripts/supply-chain/image-scan.mjs: the PR that adds the scanner can't run it"; exit 1; }
            git show "$src:.github/image-scan-exceptions.yaml" > "$RUNNER_TEMP/exceptions.yaml" 2>/dev/null || : > "$RUNNER_TEMP/exceptions.yaml"
            git show "$src:.github/image-scan-accepted.yaml" > "$RUNNER_TEMP/accepted.yaml" 2>/dev/null || : > "$RUNNER_TEMP/accepted.yaml"
          else
            cp scripts/supply-chain/image-scan.mjs "$RUNNER_TEMP/image-scan.mjs"
            cp .github/image-scan-exceptions.yaml "$RUNNER_TEMP/exceptions.yaml"
            cp .github/image-scan-accepted.yaml "$RUNNER_TEMP/accepted.yaml"
          fi
          # A base whose scanner predates --accepted gets no list (its scan is unchanged).
          grep -q -- '--accepted' "$RUNNER_TEMP/image-scan.mjs" && accepted=(--accepted "$RUNNER_TEMP/accepted.yaml") || accepted=()
          mkdir -p "$RUNNER_TEMP/grype-db"
          # The computer images build FROM each other (an ARG default: engineer on agent-base, agent-base on the browser
          # image): each scanned through its own Dockerfile, never pulled from a registry image of the same name. DOCKERFILES is split on spaces, never globbed (set -f); the
          # find step refused any path with whitespace or a leading -, and -- ends the options.
          set -f
          GRYPE_DB_CACHE_DIR="$RUNNER_TEMP/grype-db" node "$RUNNER_TEMP/image-scan.mjs" --exceptions "$RUNNER_TEMP/exceptions.yaml" "${accepted[@]}" \
            --local aidenhq/computer-agent-base=services/computer/images/agent-base/Dockerfile \
            --local aidenhq/computer-browser=services/computer/images/browser/Dockerfile -- $DOCKERFILES

  # The one result a merge waits for: every job above passed (packages, the runner, board and image-scan jobs may
  # be skipped: not a pull request, or the change doesn't touch them). Jobs that
  # need another appear only once it finishes, so without this a PR can look all green for a moment before its tests
  # exist; the runner treats this check as required once the base branch has it (modules/codehost-github/src/merge-gate.mjs withGate).
  ci-required:
    if: always()
    needs: [checks, policy, packages, modules, runner-unit, runner-flows, board, image-scan]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '(.checks.result == "success") and (.policy.result == "success") and ([.packages, .modules, .["runner-unit"], .["runner-flows"], .board, .["image-scan"]] | all(.result | IN("success", "skipped")))' >/dev/null
