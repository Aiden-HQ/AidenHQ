<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent face</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: {{px}}; height: {{px}}; display: inline-block; line-height: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #12151c;">
<svg viewBox="0 0 100 100" width="100%" height="100%" role="img" aria-label="{{label}}">
  <circle cx="50" cy="50" r="48" fill="{{c.bg}}"></circle>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#e8a400" stroke-width="3" stroke-opacity="0">
    <animate attributeName="stroke-opacity" values="{{ringVals}}" dur="1.4s" repeatCount="indefinite"></animate>
  </circle>
  <g>
    <animateTransform attributeName="transform" type="translate" values="{{bobVals}}" dur="1.1s" repeatCount="indefinite"></animateTransform>
    <path d="M17 104 C17 80 33 71 50 71 C67 71 83 80 83 104 Z" fill="{{c.shirt}}"></path>
    <path d="{{c.body}}" fill="{{c.bodyFill}}" stroke="{{c.bodyStroke}}" stroke-width="2"></path>
    <rect x="44" y="64" width="12" height="10" rx="4" fill="{{c.skin}}"></rect>
    <path d="{{c.back}}" fill="{{c.hair}}"></path>
    <ellipse cx="50" cy="46" rx="24" ry="25" fill="{{c.skin}}"></ellipse>
    <ellipse cx="26.5" cy="49" rx="3.5" ry="5" fill="{{c.skin}}"></ellipse>
    <ellipse cx="73.5" cy="49" rx="3.5" ry="5" fill="{{c.skin}}"></ellipse>
    <path d="{{c.hairTop}}" fill="{{c.hair}}"></path>
    <circle cx="35" cy="56" r="4" fill="#ff6b6b" fill-opacity="0.22"></circle>
    <circle cx="65" cy="56" r="4" fill="#ff6b6b" fill-opacity="0.22"></circle>
    <path d="{{browL}}" fill="none" stroke="{{c.brow}}" stroke-width="2.4" stroke-linecap="round"></path>
    <path d="{{browR}}" fill="none" stroke="{{c.brow}}" stroke-width="2.4" stroke-linecap="round"></path>
    <g>
      <ellipse cx="41" cy="48" rx="5.6" ry="6.2" fill="#ffffff"></ellipse>
      <ellipse cx="59" cy="48" rx="5.6" ry="6.2" fill="#ffffff"></ellipse>
      <g>
        <animateTransform attributeName="transform" type="translate" values="{{lookVals}}" dur="2.6s" repeatCount="indefinite"></animateTransform>
        <circle cx="41.5" cy="49" r="3.2" fill="#1a1c24"></circle>
        <circle cx="59.5" cy="49" r="3.2" fill="#1a1c24"></circle>
        <circle cx="42.6" cy="47.6" r="1.1" fill="#ffffff"></circle>
        <circle cx="60.6" cy="47.6" r="1.1" fill="#ffffff"></circle>
      </g>
      <rect x="34" y="41.5" width="32" height="0" fill="{{c.skin}}">
        <animate attributeName="height" values="0;0;13;0;0" keyTimes="0;0.9;0.94;0.98;1" dur="{{blinkDur}}" repeatCount="indefinite"></animate>
      </rect>
    </g>
    <path d="{{mouth}}" fill="{{mouthFill}}" stroke="#7a3b2a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>
    <path d="{{c.acc}}" fill="{{c.accFill}}" stroke="{{c.accStroke}}" stroke-width="{{c.accWidth}}" stroke-linecap="round" stroke-linejoin="round"></path>
  </g>
  <circle cx="84" cy="84" r="9" fill="#ffffff" fill-opacity="{{dotRing}}"></circle>
  <circle cx="84" cy="84" r="6.5" fill="{{dot}}" fill-opacity="{{dotRing}}"></circle>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"who":{"editor":"enum","options":["aiden","tess","nora","max","sam","mia","iris","archie","vik","rhea"],"default":"max"},"state":{"editor":"enum","options":["idle","working","needs"],"default":"working"},"size":{"editor":"int","min":16,"max":400,"default":160},"$preview":{"width":160,"height":160}}'>

        body: NONE, bodyFill: 'none', bodyStroke: 'none',

      nora: { bg: '#d3f3ee', skin: '#f3d2b6', hair: '#b5533c', brow: '#8a3a26', shirt: '#0c8599', hairTop: LONG_TOP, back: LONG_BACK,

      archie: { bg: '#fff3bf', skin: '#f0c8a8', hair: '#6b6b6b', brow: '#4a4a4a', shirt: '#5c6773', hairTop: SHORT_TOP, back: NONE,

        body: 'M50 78 L59 81 L59 88 C59 93 55 96 50 97 C45 96 41 93 41 88 L41 81 Z', bodyFill: '#adb5bd', bodyStroke: '#f1f3f5',
        acc: 'M22 30 C30 12 70 12 78 30', accFill: 'none', accStroke: '#495057', accWidth: 4, label: 'Vik' },
      rhea: { bg: '#d0ebff', skin: '#f7dcc6', hair: '#5f3dc4', brow: '#3b2591', shirt: '#1c7ed6', hairTop: LONG_TOP, back: LONG_BACK,
        body: NONE, bodyFill: 'none', bodyStroke: 'none',
        acc: 'M33 48 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0 M51 48 a8 8 0 1 0 16 0 a8 8 0 1 0 -16 0 M49 48 L51 48', accFill: 'none', accStroke: '#1864ab', accWidth: 2.4, label: 'Rhea' }
    };
    var who = this.props.who || 'max';
    var c = C[who] || C.max;
    var state = this.props.state || 'working';
    var size = this.props.size || 160;
    var working = state === 'working';
    var needs = state === 'needs';
    var names = { idle: 'idle', working: 'working', needs: 'needs you' };
    return {
      c: c,
      px: size + 'px',
      label: c.label + ', ' + names[state],
      ringVals: needs ? '0.95;0.25;0.95' : '0;0;0',
      bobVals: working ? '0 0;0 -1.8;0 0' : '0 0;0 0;0 0',

}
</script>
</body>
</html>
