# The product repo's path inventory (spec §4.4): how carefully a change to each path is read, and which role owns it.
# scripts/paths.ts compiles it with each official module's `paths:` (and every privileged module's folder, at least the
# reviewer's) into config/kernel/paths.json, which the kernel's tier function reads (kernel/src/paths.ts). Sensitivity:
# 0 runs at once, 1 the AI reviewer, panel the reviewer and a second one on another model family, 2 the owner. It only
# raises: the highest entry a path matches wins. owner_role routes work to the role holding the path; it grants nothing.
# Patterns: `**` any run, `*` one segment, `{a,b}` either, a trailing `/` the whole folder. `repo`: product (default),
# modules (the official modules repo) or any.
#
# The gate's own core and anything that can bypass or widen it (owner, 2026-11-14) is the panel's: the approval path, the
# state it trusts and the code host's GitHub writes, the job jail, who an agent is and what it may call, the board's approval
# records, decision routes and sign-in, the sandboxes, the kernel, host privileges, the security checks and the product's CI.
paths:
  - sensitivity: panel
    owner_role: platform-engineer
    patterns:
      - scripts/{computers,modules,paperclip-setup}.ts
      - kernel/
      - scripts/compiler/
      - services/shared/review-files.ts
      - "**/aidenhq-sdk/caller.ts"
      - services/board/src/{app,fleet,kernel-auth,session}.ts
      - services/computer/
      - ops/
      - scripts/verify-security.sh
      - scripts/supply-chain/
      - .gitleaks.toml
      # The lean counters and the tests that hold the gate's lists: loosening either would hide an ungated file.
      - scripts/lean/
      - scripts/test/lean.test.ts
      # This inventory, its compiler and the test that holds it to the gate's lists.
      - paths.yaml
      - scripts/paths.ts
      - .github/
      - "**/.github/"
      # Compose files: what runs on the host, with which mounts, privileges, networks and env. Any change, an image bump
      # included, is the panel's.
      - "{,docker-}compose*.{yaml,yml}"
      - "**/{,docker-}compose*.{yaml,yml}"
  # The official modules' half of the gate's core: the engines a job runs, the channels, the AI reviewer, the code hosts (the
  # App's tokens, the merge gate, the git rules, the eval gate), the platform check, graded done, dispatch (which runs every
  # agent's job), and the apps platform's and Primer's write kinds and executors. kernel/test/paths.test.ts holds every file
  # in these folders to a panel entry.
  - sensitivity: panel
    owner_role: platform-engineer
    patterns:
      - modules/engine-*/
      - modules/dispatch/
      - modules/channel-*/
      # Slack's channel part (was channel-slack): its manifest and its listener.
      - modules/slack/module.yaml
      - modules/slack/connections/slack-live/
      - modules/ai-reviewer/
      - modules/github/
      - modules/codehost-local/
      - modules/platform/
      - modules/grading/
      # The platform-engineer role's declaration and holder (the Engineer's manifest and handbook), and what it is told to do to the
      # fleet and the product.
      - modules/engineering/module.yaml
      - modules/engineering/agents/engineer/
      - modules/engineering/skills/{fleet-change,dependabot,forks}/
      - "**/aidenhq-sdk/executor.ts"
      - modules/apps-platform/module.yaml
      - modules/apps-platform/schemas/
      - modules/apps-platform/apps-mcp/src/executor.ts
      - modules/primer/module.yaml
      - modules/primer/connections/primer-mcp/src/publish.ts
      # Module code the kernel runs in its own process, with the vault and the accounts DB: the kernel's floor.
      - modules/models-openrouter/src/
      - modules/apps-platform/src/
  # The owner-approved source exceptions (review-request.mjs reads them): only the owner's own tap makes a record one, in
  # every repository, so no PR records its own approval.
  - sensitivity: 2
    repo: any
    owner_role: platform-engineer
    patterns: [ .github/supply-chain-source-exceptions.yaml ]
  # The board's screens: a change here gets a design review (no tier of its own).
  - sensitivity: 0
    owner_role: platform-engineer
    ui: true
    patterns: [ services/board/web/ ]
