# Extends the default rules. Only exact values are allowlisted, each a planted fake or a name, never a real secret
# (found by a scan of every snapshot); never allowlist a whole path.
[extend]
useDefault = true

[[allowlists]]
description = "Fake secrets planted in tests and docs, and an env var name the generic rule mistakes for a key"
regexes = [
  '''^s3cret-roadmap$''',
  '''^ghp_abcdefghij1234$''',
  '''^mgmt-SECRET-123$''',
  '''^0123456789abcdef0123456789abcdef$''',
  '''^abcdef0123456789$''',
  '''^AIDENHQ_MCP_B64$''',
]

[[allowlists]]
description = "Public OpenPGP key fingerprints we pin (vendor apt keys in ops/vm/pins.json, GitHub's gh keyring); the generic rule reads 40 hex digits beside \"key\" as a secret"
regexes = [
  '''^9DC858229FC7DD38854AE2D88D81803C0EBFCD88$''',
  '''^6F71F525282841EEDAF851B42F59B5F99B1BE0B4$''',
  '''^2596A99EAAB33821893C0A79458CA832957F5868$''',
  '''^6F1DF85E3A71C24918E727D56FC6D554E32BD943$''',
  '''^7F38BBB59D064DBCB3D84D725612B36462313325$''',
  '''^2C6106201985B60E6C7AC87323F3D4EA75716059$''',
]

[[allowlists]]
# Polygon Labs' Google Desktop (installed-app) OAuth client secret in modules/marketplace.json `organisations`. Not a
# real secret: Google documents a Desktop client's secret as not confidential
# (https://developers.google.com/identity/protocols/oauth2/native-app); the client is Internal to Polygon Labs'
# Workspace (only polygon.technology accounts can sign in) and redirects only to loopback. The owner approved publishing
# it (2026-11-19). The [2] keeps this line from looking like the secret to gitleaks and verify-security; it matches only the exact value.
description = "Polygon Labs' public Google Desktop client secret (organisation catalog)"
regexes = [
  '''^GOCSPX-tSg9RUL_Os[2]PQKpnhBf-5m1YCCAK$''',
]
