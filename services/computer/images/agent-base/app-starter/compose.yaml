# The app as the apps platform runs it. Health: GET /api/health answers {"ok": true, "checks": []}.
services:
  app:
    build: .
    restart: unless-stopped
    # On deploy the platform sets the host port (left of the colon, on loopback) to the app's `port:` in apps.yaml, so
    # leave it as is; the app listens on 8080 inside its container. Open and the tailnet route use the registry port.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
