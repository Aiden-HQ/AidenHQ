# The app as the apps platform runs it. Health: GET /api/health answers {"ok": true, "checks": []}.
services:
  app:
    build: .
    restart: unless-stopped
    # The host port (left of the colon, on loopback) is the app's `port:` in apps.yaml: keep the two equal, and pick
    # a free one (app_create refuses a taken port). The platform shows Open at that port and serves it on the tailnet.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
