<!doctype html>
<!-- An example module view (MCP Apps, text/html;profile=mcp-app), the shape a module's Fleet page takes: one self-contained file,
     inline script and style only (the frame loads and sends nothing), themed by the host's style variables, calling only its
     page's tools through the host. The mock API serves it as the "Notes" page (web/dev/mock-api.ts); a module serves its own
     from its MCP connection as ui://<module>/<path>. docs/design/board-ui.md "Modules". -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The shared kit (services/shared/page-kit.css and .js), inlined at the markers as a module's mcp.ts pageHtml does. -->
<style>/*kit:css*/</style>
<style>#notes .row { grid-template-columns: 1fr auto auto; }</style>
</head>
<body>
<section class="card">
  <div class="head"><b>Recent notes</b><small id="state">Loading…</small></div>
  <div id="notes"></div>
</section>
<section class="card">
  <div class="head"><b>Settings</b><span class="tag ok">Saved</span></div>
  <form id="configure" class="add">
    <label>Notes to keep <input id="limit" type="text" inputmode="numeric" value="20" required></label>
    <button type="submit" class="primary">Propose</button>
  </form>
  <p id="note" class="note"></p>
</section>
<script>/*kit:js*/
  async function load() {
    try {
      const r = await tool("example_notes", {});
      const notes = r.notes ?? [];
      $("state").textContent = notes.length ? `${notes.length} notes` : "No notes yet.";
      $("notes").replaceChildren(...notes.map((n, i) => h("div", { className: "row" }, h("span", { textContent: n.text }), h("span", { className: `tag ${i ? "ok" : "needs"}`, textContent: i ? "Done" : "New" }), h("small", { className: "soft", textContent: n.at }))));
    } catch (e) { say(e.message, true); }
  }
  $("configure").addEventListener("submit", async (e) => {
    e.preventDefault();
    try { await tool("example_configure", { limit: Number($("limit").value) }); say("Proposed."); } catch (err) { say(err.message, true); }
  });
  (async () => {
    const init = await send("ui/initialize", { appInfo: { name: "example", version: "1" }, appCapabilities: {}, protocolVersion: "2026-01-26" });
    theme(init.hostContext);
    notify("ui/notifications/initialized", {});
    await load();
  })();
</script>
</body>
</html>
