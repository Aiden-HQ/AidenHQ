name: core
description: Core
roles:
  declares: [ { id: fleet-admin, description: declared here, so another module may not grant it } ]
settings:
  # The owner's timezone.
  timezone: { required: true }
  # The company's name.
  company_name: { default: work }
company: { name: "${settings.company_name}", description: Core company }
requires: [eng]
labels: [ { name: todo, color: "#000" } ]
connections:
  tasks: { url: "http://tasks-mcp:8080/mcp", auth: tasks_service_key, tools: { read: [t], write: [t2] } }
agents:
  boss: { connections: { tasks: [t] } }
routines:
  daily: { title: Daily, agent: boss, description: "Today is {{date}}", schedules: [ { cron: "0 9 * * *", timezone: "${settings.timezone}", label: m } ] }
