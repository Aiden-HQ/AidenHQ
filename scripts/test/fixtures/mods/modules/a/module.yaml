name: a
description: Module A
requires: [b]
settings:
  # The owner's email.
  owner_email: { required: true }
connections:
  aconn: { url: "http://a-mcp:1/mcp", auth: a_service_key, tools: { read: [a_get], write: [a_set] } }
agents:
  x: { model: m1, connections: { tasks: [t], "glean?": [search], bconn: read, aconn: write } }
routines:
  r: { title: R, agent: x, description: "Today is {{date}}; mail ${settings.owner_email}", schedules: [{ cron: "0 9 * * *", timezone: "${settings.timezone}" }] }
generated_secrets: [a_mcp_token]
services:
  data: true
  run:
    a-mcp:
      image: example.com/acme/a-mcp:1.0@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      data: ["a:/data"]
      secrets: [a_mcp_token]
