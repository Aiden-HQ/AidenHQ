name: up
description: A connection whose files go upstream, with a default grant that names one
settings:
  # Where grants file upstream (`off` withholds every tool the connection tags `upstream`, a default grant included).
  upstream: { default: issues, values: ["off", "issues"] }
connections:
  upconn:
    url: "http://up:1/mcp"
    auth: upconn_service_key
    tools:
      read: [ up_get, up_status ]
      write: [ up_note ]
      destructive: [ up_file ]
    upstream: [ up_status, up_file ]
agents:
  user: { model: m1, connections: { upconn: [ up_get ] } }
  status: { model: m1, connections: { upconn: [ up_get, up_status ] } }
default_grants:
  - { tools: [ upconn.up_file ], when: { fields: { profile: crew } } }
