# AidenHQ core stack. Start with: docker compose up -d (ops/apply-config.sh does this).
# Configuration comes from .env (see .env.example); secrets from $AIDENHQ_SECRETS_DIR.
# Module services (connections) live in modules/<name>/compose.yaml; scripts/compile.ts merges the enabled ones into
# compose.modules.yaml, which COMPOSE_FILE in .env adds after this file.

name: aidenhq

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: unless-stopped
  # Docker's json-file driver never rotates by default: Paperclip alone wrote 390 MB a day.
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "3"

services:
  paperclip:
    <<: *hardening
    # Pinned upstream release (2026.1106.0, commit d69631b0) by digest.
    image: ghcr.io/paperclipai/paperclip:2026.1106.0@sha256:d6584f05cf57a4b26c117eb083725f18c1fe69ddafa7d16c9f8cce83f6fa17da
    user: "${PUID:-1000}:${PGID:-100}"
    # Docker's default 10s kills the embedded Postgres mid-shutdown, leaving postmaster.pid and a crash-looping next start
    # (2026-11-14). tini forwards SIGTERM to the server, which stops Postgres first.
    stop_grace_period: 60s
    # Read the auth secrets from files instead of putting their values in this file. A secret file that is missing or empty
    # stops the start: an empty secret would sign sessions and agent tokens with an empty key.
    entrypoint:
      - /bin/sh
      - -c
      # No connection token or internal token lives here: agents' tool calls go to the kernel's proxy with the run's own
      # credential (scripts/paperclip-setup.ts ensureCodexConfig). $$ escapes compose interpolation.
      - >-
        for s in paperclip_auth_secret paperclip_agent_jwt_secret; do
        test -f "/run/secrets/$$s" && test -s "/run/secrets/$$s" || { echo "paperclip: the secret $$s is missing or empty" >&2; exit 1; };
        done;
        case "$${PAPERCLIP_AUTH_DISABLE_SIGN_UP:-}" in false) ;; *) export PAPERCLIP_AUTH_DISABLE_SIGN_UP=true ;; esac;
        export BETTER_AUTH_SECRET="$$(cat /run/secrets/paperclip_auth_secret)"
        PAPERCLIP_AGENT_JWT_SECRET="$$(cat /run/secrets/paperclip_agent_jwt_secret)";
        exec /usr/bin/tini -- docker-entrypoint.sh "$$@"
      - paperclip
    # The image CMD (overriding entrypoint drops it); 2026.1106 boots from the precompiled runtime bundle.
    command: [ "node", "server/dist-runtime/index.mjs" ]
    environment:
      HOST: 0.0.0.0
      PORT: "3100"
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_PUBLIC_URL: http://localhost:3100
      # Agents reach the API here even when PAPERCLIP_PUBLIC_URL is a tailnet/LAN name the container can't resolve.
      PAPERCLIP_API_URL: http://localhost:3100
      # "paperclip" lets ops-mcp and the watcher reach the API by service name.
      PAPERCLIP_ALLOWED_HOSTNAMES: paperclip,localhost
      # Closed unless .env opens it with exactly `false` (the entrypoint closes any other value): .env.example opens it for the
      # owner's first account and ops/setup.sh closes it after.
      PAPERCLIP_AUTH_DISABLE_SIGN_UP: "${PAPERCLIP_DISABLE_SIGN_UP:-true}"
      USER_UID: "${PUID:-1000}"
      USER_GID: "${PGID:-100}"
      # No usage telemetry to Paperclip's servers.
      # One database dump every 6 hours (the default is hourly: 73 dumps of 780 MB filled 50 GB); how many are kept is the
      # instance setting scripts/modules.ts ensureBackupRetention writes.
      PAPERCLIP_DB_BACKUP_INTERVAL_MINUTES: "360"
      PAPERCLIP_TELEMETRY_DISABLED: "1"
      # Paperclip logs every request with full headers at its default level (~370 MB a day).
      PAPERCLIP_LOG_LEVEL: warn
      DO_NOT_TRACK: "1"
      # Agents use the ChatGPT login in /paperclip/.codex, never an API key from here.
      OPENAI_API_KEY: ""
      # Paperclip's secret-store key, from the secret vault (ops/vault) instead of its data dir.
      PAPERCLIP_SECRETS_MASTER_KEY_FILE: /run/secrets/paperclip_master_key
      # OpenRouter as an extra Codex provider (no model_provider here: agents opt in, so ChatGPT-login agents are unaffected),
      # through the model gateway on the host (kernel/src/gateway): the key is the run's own Paperclip credential, never
      # OpenRouter's (only the gateway holds that).
      PAPERCLIP_CODEX_PROVIDERS: '{"providers":{"or":{"name":"OpenRouter","base_url":"http://10.231.0.1:8201/api/v1","env_key":"PAPERCLIP_API_KEY","wire_api":"responses"}}}'
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ${AIDENHQ_DATA_DIR:-./data}/paperclip:/paperclip
      # The wake events plugin (services/paperclip-events): task events to the kernel's wake inbox.
      - ./services/paperclip-events:/opt/aidenhq-events:ro
    secrets:
      - paperclip_auth_secret
      - paperclip_agent_jwt_secret
      - paperclip_master_key
      - paperclip_events_key # the events plugin's key to the kernel's wake inbox
      - paperclip_post_key # the key the kernel signs the plugin's post action with (outcomes.ts)
    pids_limit: 2048
    # Fixed public resolvers: containers keep the host's DNS servers from when they started, and
    # a network or WARP change left every agent run failing at startup (2026-10-07).
    dns: [ 1.1.1.1, 8.8.8.8 ]
    networks:
      egress:
        gw_priority: 1 # published port and outbound traffic go through egress
      backplane: {}
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://localhost:3100/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # The task board: Today/Tomorrow/Later over your Paperclip tasks. Acts as you through the
  # board key, kept server-side; loopback only (put `tailscale serve` in front for the phone).
  # App platform: deploys the apps in the registry (instance apps.yaml + config/apps.modules.yaml; sandboxed compose projects) and exposes app_* tools to agents,
  # identified by their Paperclip key. Holds the host Docker socket (root-equivalent), so it takes no inbound traffic
  # beyond the compose network, and every compose file is resolved and sandboxed in code before it runs.
  apps-mcp:
    <<: *hardening
    build: ./modules/apps-platform/apps-mcp
    image: aidenhq/apps-mcp:local
    # A recreate (apply) sends SIGTERM and waits this long: apps-mcp finishes the app deploys in flight first
    # (modules/apps-platform/apps-mcp/src/main.ts DRAIN_MS, a little shorter).
    stop_grace_period: 11m
    # node runs as PID 1 here and reaps nothing: its git children piled up as zombies toward pids_limit.
    init: true
    user: "${PUID:-1000}:${DOCKER_GID:?set DOCKER_GID in .env (getent group docker | cut -d: -f3)}"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    environment:
      # App secrets: files in the vault, mounted into apps by the Docker daemon from this host path.
      APPS_HOST_SECRETS_DIR: "${AIDENHQ_SECRETS_DIR}/apps"
      # App identity (docs/design/app-identity.md): the public keys every app mounts (a host path), and its own signing key.
      IDENTITY_KEYS_HOST_FILE: "${AIDENHQ_SECRETS_DIR}/identity/keys.json"
      IDENTITY_KEY_FILE: /secrets/identity_key
      REPO_DIR: "${PWD}"
      INSTANCE_DIR: "${AIDENHQ_INSTANCE_DIR:?set AIDENHQ_INSTANCE_DIR in .env}"
      # Default: https://github.com/<fleet org>/aidenhq-instance.git when github_fleet_org is set, else the instance checkout's origin remote.
      REGISTRY_PUSH_URL: "${AIDENHQ_INSTANCE_PUSH_URL:-}"
      APPS_DATA: "${PWD}/data/apps"
      APPS_DB: /data/apps-mcp.sqlite
      # https://<apps-edge's hostname>.<tailnet>.ts.net: apps are served at <base>:<port> by their own tailnet node.
      APPS_URL_BASE: "${APPS_URL_BASE:-}"
      APPS_EDGE_DIR: /edge
      APPS_INTERNAL_TOKEN_FILE: /run/secrets/apps_internal_token
      PAPERCLIP_URL: http://paperclip:3100
      # Agents' calls arrive only through the kernel's proxy (its service key); the caller is the kernel's signed assertion
      # for the apps-platform module, as compile wires every module connection.
      APPS_SERVICE_KEY_FILE: /run/secrets/apps_service_key
      AIDENHQ_MODULE: apps-platform
      AIDENHQ_KERNEL_URL: "${AIDENHQ_KERNEL_URL:-http://10.231.0.1:3130}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The apps node's serve config (apps-edge reads it); never the host's tailscaled.
      - ${AIDENHQ_DATA_DIR:-./data}/apps-edge/serve:/edge
      # Which shared apps' PR previews run, for the gate (modules/apps-platform/apps-mcp/src/previews.ts; scripts/edge.ts).
      - ${AIDENHQ_DATA_DIR:-./data}/previews:/previews
      # The repo at its own path: Docker resolves bind mounts on the host, so paths must match. Holds each app's checkout and
      # data under data/apps, and module apps' source (its origin/main, at the pin). The instance checkout is read-only (instance.yaml, its origin URL): the apply owns it; the apps.yaml registry lives in apps-mcp's own clone under /data.
      - ${PWD}:${PWD}
      - ${AIDENHQ_INSTANCE_DIR}:${AIDENHQ_INSTANCE_DIR}:ro
      # A local instance repo (ops/setup.sh): the bare repo the checkout pushes to, at the same path. Unused otherwise.
      - ${AIDENHQ_INSTANCE_REMOTE:-/dev/null}:${AIDENHQ_INSTANCE_REMOTE:-/aidenhq-no-local-remote}
      - ${AIDENHQ_DATA_DIR:-./data}/apps-mcp:/data
      # This server's repos (codehost-local: bare repos only the code host writes), read-only: local/* apps build and preview from them.
      - ${AIDENHQ_DATA_DIR:-./data}/codehost:/codehost:ro
      # The warehouse's point (compile): each source module's schema and the views source_new serves.
      - ${AIDENHQ_CONFIG_DIR:-./config}/points/warehouse.json:/config/points/warehouse.json:ro
      # Read-write, and only this vault dir: apps-mcp writes the DATABASE_URL of `database: warehouse` apps here.
      - ${AIDENHQ_SECRETS_DIR}/apps:/secrets/apps
      # Its agent-signing key (compile creates it), never the gate's: agents' identity at apps (app_api, app_view).
      - ${AIDENHQ_SECRETS_DIR}/identity/apps.pem:/secrets/identity_key:ro
      - ${HOME}/.ssh/aidenhq_instance_deploy:/secrets/deploy_key:ro
    secrets:
      - apps_internal_token
      - apps_service_key # the kernel proxy's key: agents' calls reach /mcp only through it
      - apps_incident_webhook_url
      - apps_incident_webhook_secret
    dns: [ 1.1.1.1, 8.8.8.8 ] # see paperclip
    networks:
      - backplane
      - egress
      - sources # warehouse_query / source_new as the readonly login

  # The apps' own tailnet node (https://${APPS_TS_HOSTNAME}.<tailnet>.ts.net:<port>). The board and Paperclip keep the
  # host's name: a browser sends a host's cookies to every port of it, so an app on that name could read the board's
  # session. apps-mcp writes this node's serve config (modules/apps-platform/apps-mcp/src/tailnet.ts) and joins it to each exposed
  # app's own network; it is on no AidenHQ network. Userspace networking: it serves, it never routes. Its key (vault
  # tailscale_apps_authkey: reusable, tagged, pre-authorized; docs/setup.md) is used once, then /state keeps the node.
  apps-edge:
    <<: *hardening
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: aidenhq-apps-edge # apps-mcp connects it by name (tailnet.ts EDGE_CONTAINER)
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      TS_HOSTNAME: "${APPS_TS_HOSTNAME:-aidenhq-apps}"
      TS_AUTHKEY: file:/run/secrets/tailscale_apps_authkey # read by `tailscale up`, never an env value
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_STATE_DIR: /state
      TS_SOCKET: /tmp/tailscaled.sock
      TS_SERVE_CONFIG: /serve/serve.json
      HOME: /tmp
    volumes:
      - ${AIDENHQ_DATA_DIR:-./data}/apps-edge/state:/state
      - ${AIDENHQ_DATA_DIR:-./data}/apps-edge/serve:/serve:ro
    secrets:
      - tailscale_apps_authkey
    networks:
      - apps-edge

  board:
    <<: *hardening
    build: ./services/board
    image: aidenhq/board:local
    init: true
    user: "${PUID:-1000}:${PGID:-100}"
    read_only: true
    tmpfs:
      - /tmp:size=16m
    environment:
      BOARD_SYSTEM_CONFIG: /config/system.yaml
      BOARD_DB: /data/board/board.sqlite
      # The board's listener (3121): its https address (the front door) and phones on the home network, signed-in admins only,
      # at BOARD_LAN_HOSTS (aidenhq.local is published by mDNS). Admins sign in on the kernel's admin listener (3120).
      BOARD_LAN_HOSTS: "${BOARD_LAN_HOSTS:-aidenhq.local}"
      # The board's https address (default http://<first LAN host>), e.g. the tailnet name.
      BOARD_LAN_URL: "${BOARD_LAN_URL:-}"
      # The kernel's admin listener at its front door: sign-in, admin links and the approval page every card is decided on.
      AIDENHQ_ADMIN_URL: "${AIDENHQ_ADMIN_URL:-http://localhost:3120}"
      # apps-mcp's internal API: the Apps tab, and stateful deploys approved in chat (needs the token).
      APPS_INTERNAL_TOKEN_FILE: /run/secrets/apps_internal_token
      # Roles of the calling agent (fleet tools): the grants table setup writes; the agent is the kernel's caller assertion.
      AIDENHQ_GRANTS_FILE: /grants/grants.json
      AIDENHQ_KERNEL_URL: "${AIDENHQ_KERNEL_URL:-http://10.231.0.1:3130}"
      # Live view of what an agent is doing: Codex session logs under Paperclip's data (below), and for agents in their own
      # computers the launcher's /progress (the board is on the backplane, which the launcher's address belongs to).
      PAPERCLIP_COMPANIES_DIR: /paperclip-companies
      AIDENHQ_LAUNCHER_URL: "${AIDENHQ_LAUNCHER_URL:-http://10.231.0.1:8199}"
      # The Costs tab: OpenRouter's own spend for the key (GET /api/v1/key), next to the board's token estimate.
      OPENROUTER_KEY_FILE: /run/secrets/openrouter_key
      # The model gateway (kernel/src/gateway, on the host's backplane address): the board pulls its billed ledger and the
      # spend summary here, each with gateway_board_key.
      AIDENHQ_GATEWAY_URL: "${AIDENHQ_GATEWAY_URL:-http://10.231.0.1:8201}"
      # The Handbook tab reads module handbooks and the instance's own files (read-only mounts below).
      BOARD_MODULES_DIR: /handbooks/modules
      BOARD_INSTANCE_DIR: /handbooks/instance
      # The host's apply generations (ops/lib/generations.sh): the current product pin and the last 20 applies.
      AIDENHQ_GENERATIONS_FILE: /generations/generations.jsonl
    volumes:
      - ./modules:/handbooks/modules:ro
      - ${AIDENHQ_INSTANCE_DIR:?set AIDENHQ_INSTANCE_DIR in .env}:/handbooks/instance:ro
      - ${AIDENHQ_CONFIG_DIR:-./config}/system.yaml:/config/system.yaml:ro
      - ${AIDENHQ_CONFIG_DIR:-./config}/modules.json:/config/modules.json:ro # Settings: Modules, setting defaults and docs
      - ${AIDENHQ_CONFIG_DIR:-./config}/paperclip.yaml:/config/paperclip.yaml:ro # Settings: settings, agents, connections (no secrets)
      - ${AIDENHQ_DATA_DIR:-./data}/paperclip/instances/default/companies:/paperclip-companies:ro
      - ${AIDENHQ_CONFIG_DIR:-./config}/grants:/grants:ro
      # The board's points (compile): the modules' sign-ins (board.signins).
      - ${AIDENHQ_CONFIG_DIR:-./config}/points/board.json:/config/points/board.json:ro
      - ${AIDENHQ_DATA_DIR:-./data}/board:/data/board
      # The board's copy of the apply generations (ops/lib/generations.sh), read-only: fleet_generation_status. Its own
      # directory, which holds that one file: the apply replaces the file by rename, so a bind mount of the file itself
      # would keep the old inode.
      - ${AIDENHQ_STATE_DIR:-./data/state}/board:/generations:ro
      # No accounts file: admins sign in on the kernel, which hands the board its own session (lean 3g).
    secrets:
      - board_internal_token
      - apps_internal_token
      - google_auth_token # Google sign-in state and reconnect only; not the MCP token
      - openrouter_key # read only for the key's spend totals (the Costs tab)
      - glean_auth_token # Glean sign-in state and sign-in only; not the MCP token
      - grafana_auth_token # Grafana sign-in state and sign-in only; not the MCP token
      - clickhouse_auth_token # ClickHouse sign-in state and sign-in only; not the MCP token
      - computer_progress_token # the launcher's /progress only: an agent computer's session log for the live view
      - gateway_board_key # the board's key on the kernel: Paperclip (/v1/cp/read, /v1/cp/owner: it holds no Paperclip key), the model gateway's /usage and caps, record lists, and its sign-in (/v1/auth)
    ports:
      # LAN listener; loopback-only unless .env sets BOARD_LAN_BIND=0.0.0.0 (e.g. with BOARD_LAN_PORT=80).
      - "${BOARD_LAN_BIND:-127.0.0.1}:${BOARD_LAN_PORT:-3121}:3121"
      # Internal API: bearer token, /internal/ only. The tasks bridge in paperclip reaches it as board:3122 on the
      # backplane.
      - "127.0.0.1:3122:3122"
    # backplane reaches the kernel (Paperclip only through it); egress only carries the published port (the board makes no outbound calls).
    networks:
      - backplane
      - egress
    depends_on:
      paperclip:
        condition: service_started

networks:
  # Explicit 10.x subnets: some host firewalls (here: NordVPN's) drop traffic to Docker's
  # default 172.16.0.0/12 pools, which breaks the published 127.0.0.1:3100 port.
  # Service-to-service traffic only, no route to the Internet. ops-mcp lives only here.
  backplane:
    internal: true
    ipam:
      config:
        - subnet: ${AIDENHQ_BACKPLANE_SUBNET:-10.231.0.0/24}
  # Outbound access (Paperclip → OpenAI, Google sidecar → Google APIs) and the published port.
  egress:
    ipam:
      config:
        - subnet: ${AIDENHQ_EGRESS_SUBNET:-10.231.1.0/24}
  # Shared sources: the source writers and apps-mcp's warehouse tools reach app-warehouse-postgres-1 here. The warehouse
  # app joins it (`connects: [sources]`); no other app can, so apps never reach these services.
  sources:
    internal: true
    ipam:
      config:
        - subnet: ${AIDENHQ_SOURCES_SUBNET:-10.231.3.0/24}
  # The apps node's own way out (Tailscale's control plane and relays); nothing else is on it. It reaches apps only
  # through their own networks, which apps-mcp joins it to.
  apps-edge:
    ipam:
      config:
        - subnet: ${AIDENHQ_APPS_EDGE_SUBNET:-10.231.5.0/24}

secrets:
  paperclip_auth_secret:
    file: ${AIDENHQ_SECRETS_DIR:?set AIDENHQ_SECRETS_DIR in .env}/paperclip_auth_secret
  paperclip_agent_jwt_secret:
    file: ${AIDENHQ_SECRETS_DIR}/paperclip_agent_jwt_secret
  google_auth_token:
    file: ${AIDENHQ_SECRETS_DIR}/google_auth_token
  glean_auth_token:
    file: ${AIDENHQ_SECRETS_DIR}/glean_auth_token
  grafana_auth_token:
    file: ${AIDENHQ_SECRETS_DIR}/grafana_auth_token
  clickhouse_auth_token:
    file: ${AIDENHQ_SECRETS_DIR}/clickhouse_auth_token
  board_internal_token:
    file: ${AIDENHQ_SECRETS_DIR}/board_internal_token
  apps_service_key:
    file: ${AIDENHQ_SECRETS_DIR}/apps_service_key
  openrouter_key:
    file: ${AIDENHQ_SECRETS_DIR}/openrouter_key
  gateway_board_key:
    file: ${AIDENHQ_SECRETS_DIR}/gateway_board_key
  gateway_source_key:
    file: ${AIDENHQ_SECRETS_DIR}/gateway_source_key
  paperclip_master_key:
    file: ${AIDENHQ_SECRETS_DIR}/paperclip_master_key
  paperclip_events_key:
    file: ${AIDENHQ_SECRETS_DIR}/paperclip_events_key
  paperclip_post_key:
    file: ${AIDENHQ_SECRETS_DIR}/paperclip_post_key
  computer_progress_token:
    file: ${AIDENHQ_SECRETS_DIR}/computer_progress_token
  apps_internal_token:
    file: ${AIDENHQ_SECRETS_DIR}/apps_internal_token
  edge_board_secret:
    file: ${AIDENHQ_SECRETS_DIR}/edge_board_secret
  apps_incident_webhook_url:
    file: ${AIDENHQ_SECRETS_DIR}/apps_incident_webhook_url
  apps_incident_webhook_secret:
    file: ${AIDENHQ_SECRETS_DIR}/apps_incident_webhook_secret
  # The apps node's join key (optional: compile creates it empty; until it's filled the node waits, unjoined).
  tailscale_apps_authkey:
    file: ${AIDENHQ_SECRETS_DIR}/tailscale_apps_authkey
